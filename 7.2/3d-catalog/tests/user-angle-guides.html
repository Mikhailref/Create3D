const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200000);
camera.up.set(0, 0, 1);

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

scene.add(new THREE.HemisphereLight(0xdbeafe, 0xfef3c7, 0.65));
const d1 = new THREE.DirectionalLight(0xffffff, 0.75); d1.position.set(200, -180, 260); scene.add(d1);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const modelGroup = new THREE.Group();
scene.add(modelGroup);

(DATA.parts || []).forEach(p => {
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(p.positions), 3));
  geo.computeVertexNormals();
  const mat = new THREE.MeshStandardMaterial({
    color: p.color || '#adb5bd', metalness: 0.22, roughness: 0.48, side: THREE.DoubleSide,
    transparent: (p.opacity ?? 1) < 1, opacity: p.opacity ?? 1
  });
  modelGroup.add(new THREE.Mesh(geo, mat));
});

(DATA.wires || []).forEach(w => {

  for (let i = 0; i <= w.length - 3; i += 3) pts.push(new THREE.Vector3(w[i], w[i+1], w[i+2]));

  const dMat = new THREE.MeshBasicMaterial({ color, depthTest: false });
  const pts = a.points.map(arr => new THREE.Vector3().fromArray(arr));

    dimGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([pts[0], p1O]), eMat));

    const rad = Math.max(4, Math.abs(a.offset) + 4);
    const arcPts = [];
    for (let i = 0; i <= 24; i++) arcPts.push(pts[0].clone().add(new THREE.Vector3().lerpVectors(vA, vB, i / 24).normalize().multiplyScalar(rad)));
    dimGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(arcPts), lMat));
    labelPos.copy(arcPts[12]);
  } else {
    const dir = normal.clone().add(new THREE.Vector3(0.3, -0.3, 0.8)).normalize();
    const pEnd = pts[0].clone().add(dir.multiplyScalar(a.offset));
    dimGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([pts[0], pEnd]), lMat));
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.75, 10, 10), dMat); m.position.copy(pts[0]); dimGroup.add(m);
    labelPos.copy(pEnd);
  }

  const el = document.createElement('div');
  el.className = 'badge';
  el.style.borderColor = a.color;
  el.textContent = a.text;
  overlay.appendChild(el);
  labels.push({ el, pos: labelPos });

  const row = document.createElement('div');
  row.className = 'dim-row';
  row.innerHTML = '<span style="width:10px;height:10px;border-radius:50%;background:' + a.color + ';display:inline-block;flex-shrink:0;"></span><span>#' + (idx + 1) + ': ' + a.text + '</span>';
  rowsEl.appendChild(row);
});

window.setView = (v) => {
  const d = maxDim * 2.1;
  controls.target.copy(center);
  if (v === 'front') camera.position.set(center.x, center.y - d, center.z);
  else if (v === 'top') camera.position.set(center.x, center.y - 0.01, center.z + d);
  else if (v === 'right') camera.position.set(center.x + d, center.y, center.z);
  else camera.position.set(center.x + d * 0.72, center.y - d * 0.78, center.z + d * 0.65);
  controls.update();
};
window.toggleDims = () => {
  dimsVisible = !dimsVisible;
  dimGroup.visible = dimsVisible;
  overlay.style.display = dimsVisible ? 'block' : 'none';
};
window.toggleTable = () => {
  const t = document.getElementById('dim-table');
  t.style.display = t.style.display === 'none' ? 'block' : 'none';
};

window.setView('iso');
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
  if (dimsVisible) {
    labels.forEach(l => {
      const p = l.pos.clone().project(camera);
      if (p.z > 1) l.el.style.display = 'none';
      else {
        l.el.style.display = 'block';
        l.el.style.left = (p.x * 0.5 + 0.5) * window.innerWidth + 'px';
        l.el.style.top = (-p.y * 0.5 + 0.5) * window.innerHeight + 'px';
      }
    });
  }
}
animate();
</script>
</body>
