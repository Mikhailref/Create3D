<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>3D CAD Конфигуратор — Экспорт параметров (JSON)</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #121a2f;
      --panel-elevated: #18223d;
      --panel-border: rgba(148, 163, 184, 0.16);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-strong: #0284c7;
      --accent-hover: #0ea5e9;
      --accent-light: #7dd3fc;
      --success: #34d399;
      --warn: #fbbf24;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    #viewport-wrap {
      position: relative;
      width: 100%;
      height: 46%;
      height: 46vh;
      height: 46dvh;
      min-height: 220px;
      background: radial-gradient(circle at 50% 35%, #192847 0%, #0d1526 58%, #070b14 100%);
      transition: height 0.28s ease;
      overflow: hidden;
      flex-shrink: 0;
    }

    #viewport-wrap.expanded {
      height: calc(100% - 76px);
      height: calc(100vh - 76px);
      height: calc(100dvh - 76px);
    }

    #canvas-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    .hud-top {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      gap: 8px;
      z-index: 10;
    }

    .badge-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .badge {
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(148, 163, 184, 0.2);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      color: #e2e8f0;
    }

    .hud-actions {
      display: flex;
      gap: 6px;
      pointer-events: auto;
    }

    .icon-btn {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(148, 163, 184, 0.25);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .icon-btn:hover {
      background: rgba(30, 41, 59, 0.95);
    }

    .icon-btn.active {
      border-color: var(--accent);
      color: #93c5fd;
    }

    #controls-panel {
      width: 100%;
      flex: 1 1 auto;
      height: 54%;
      height: 54vh;
      height: 54dvh;
      background: var(--panel);
      border-top: 1px solid var(--panel-border);
      display: flex;
      flex-direction: column;
      transition: height 0.28s ease;
      overflow: hidden;
    }

    #controls-panel.collapsed {
      flex: 0 0 76px;
      height: 76px;
    }

    .controls-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 6px;
    }

    .control-group {
      background: rgba(10, 16, 32, 0.58);
      border: 1px solid rgba(51, 65, 85, 0.8);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .slider-row {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .slider-header label {
      color: #e2e8f0;
      font-weight: 500;
    }

    .num-input-wrap {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 2px 6px;
    }

    .num-input-wrap input {
      width: 52px;
      background: transparent;
      border: none;
      color: var(--accent-light);
      font-weight: 700;
      font-size: 13px;
      text-align: right;
      outline: none;
    }

    .num-input-wrap span {
      font-size: 11px;
      color: var(--text-muted);
    }

    input[type="range"] {
      width: 100%;
      height: 6px;
      background: #334155;
      border-radius: 4px;
      outline: none;
      -webkit-appearance: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: 2px solid #fff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
    }

    .segmented {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background: #0f172a;
      padding: 4px;
      border-radius: 8px;
      border: 1px solid #334155;
    }

    .segmented.two-cols {
      grid-template-columns: repeat(2, 1fr);
    }

    .seg-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 7px 6px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .seg-btn.active {
      background: var(--accent);
      color: #fff;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .stat-card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px;
      text-align: center;
    }

    .stat-val {
      font-size: 13px;
      font-weight: 700;
      color: #f8fafc;
    }

    .stat-lbl {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .wall-ok { color: var(--success); }
    .wall-warn { color: var(--warn); }

    .panel-footer {
      padding: 12px 16px;
      background: #0e1526;
      border-top: 1px solid var(--panel-border);
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-primary {
      flex: 1;
      background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 13px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 18px rgba(14, 165, 233, 0.28);
    }

    .btn-primary:active {
      transform: scale(0.99);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.72);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 420px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
    }

    .modal-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }

    .modal-desc {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.45;
    }

    .modal-input {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 9px 11px;
      color: var(--text);
      font-size: 13px;
      outline: none;
    }

    .modal-input:focus {
      border-color: var(--accent);
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 4px;
      flex-wrap: wrap;
    }

    .btn-secondary {
      background: #1e293b;
      color: var(--text);
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-secondary:hover {
      background: #273549;
    }

    .modal-status {
      font-size: 12px;
      color: var(--success);
      min-height: 16px;
    }

    @media (min-width: 768px) {
      body {
        flex-direction: row;
      }
      #viewport-wrap {
        flex: 1 1 auto;
        width: auto;
        min-width: 0;
        height: 100%;
        height: 100vh;
        height: 100dvh;
      }
      #viewport-wrap.expanded {
        height: 100%;
        height: 100vh;
        height: 100dvh;
      }
      #controls-panel {
        flex: 0 0 400px;
        width: 400px;
        max-width: 38vw;
        height: 100%;
        height: 100vh;
        height: 100dvh;
        border-top: none;
        border-left: 1px solid var(--panel-border);
      }
      #controls-panel.collapsed {
        flex: 0 0 400px;
        height: 100%;
        height: 100vh;
        height: 100dvh;
      }
      #toggle-panel-btn {
        display: none;
      }
      .controls-scroll {
        padding: 18px 20px;
        gap: 16px;
      }
      .hud-top {
        top: 16px;
        left: 16px;
        right: 16px;
      }
      .badge, .icon-btn {
        font-size: 13px;
        padding: 7px 12px;
      }
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="viewport-wrap">
    <div id="canvas-container"></div>

    <div class="hud-top">
      <div class="badge-group">
        <div class="badge" id="dim-badge">80 × 80 × 80 мм</div>
        <div class="badge">Z-up · 1:1 мм</div>
      </div>

      <div class="hud-actions">
        <button class="icon-btn" id="wireframe-btn" title="Каркас">Сетка</button>
        <button class="icon-btn" id="autorotate-btn" title="Вращение">Вращать</button>
        <button class="icon-btn" id="toggle-panel-btn">Во весь экран</button>
      </div>
    </div>
  </div>

  <div id="controls-panel">
    <div class="controls-scroll">

      <div>
        <div class="section-title">Габариты и форма детали (мм)</div>
        <div class="control-group">
          <div class="slider-row">
            <div class="slider-header">
              <label for="len-range">Длина (X)</label>
              <div class="num-input-wrap">
                <input type="number" id="len-num" min="20" max="200" value="80" />
                <span>мм</span>
              </div>
            </div>
            <input type="range" id="len-range" min="20" max="200" value="80" />
          </div>

          <div class="slider-row">
            <div class="slider-header">
              <label for="wid-range">Ширина (Y)</label>
              <div class="num-input-wrap">
                <input type="number" id="wid-num" min="20" max="200" value="80" />
                <span>мм</span>
              </div>
            </div>
            <input type="range" id="wid-range" min="20" max="200" value="80" />
          </div>

          <div class="slider-row">
            <div class="slider-header">
              <label for="hei-range">Высота (Z)</label>
              <div class="num-input-wrap">
                <input type="number" id="hei-num" min="10" max="200" value="80" />
                <span>мм</span>
              </div>
            </div>
            <input type="range" id="hei-range" min="10" max="200" value="80" />
          </div>

          <div class="slider-row" style="margin-top: 4px;">
            <div class="slider-header">
              <label for="fillet-range">Скругление углов (XY)</label>
              <div class="num-input-wrap">
                <input type="number" id="fillet-num" min="0" max="38" value="12" />
                <span>мм</span>
              </div>
            </div>
            <input type="range" id="fillet-range" min="0" max="38" value="12" />
          </div>

          <div class="slider-row" style="margin-top: 4px;">
            <div class="slider-header">
              <label for="slope-range">Уклон верхней плоскости</label>
              <div class="num-input-wrap">
                <input type="number" id="slope-num" min="-45" max="45" value="0" />
                <span>°</span>
              </div>
            </div>
            <input type="range" id="slope-range" min="-45" max="45" value="0" />
          </div>

          <div class="slider-header" style="margin-top: 2px;">
            <label>Направление уклона</label>
          </div>
          <div class="segmented two-cols" id="slope-axis-seg">
            <button class="seg-btn active" data-val="x">По длине (X)</button>
            <button class="seg-btn" data-val="y">По ширине (Y)</button>
          </div>

          <div class="slider-row" style="margin-top: 4px;">
            <div class="slider-header">
              <label for="model-color-picker">Цвет модели</label>
              <div class="num-input-wrap" style="padding: 2px 8px; gap: 6px;">
                <input type="color" id="model-color-picker" value="#2563eb" style="width: 24px; height: 20px; border: none; background: transparent; cursor: pointer; padding: 0;" />
                <span id="model-color-hex" style="font-size: 12px; color: var(--accent-light); font-weight: 700;">#2563EB</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div>
        <div class="section-title">Отверстия и пазы</div>
        <div class="control-group">
          <div class="slider-header">
            <label>Форма отверстия</label>
          </div>
          <div class="segmented two-cols" id="hole-shape-seg">
            <button class="seg-btn active" data-val="round">Круглое</button>
            <button class="seg-btn" data-val="rect">Прямоугольное</button>
          </div>

          <div class="slider-header" style="margin-top: 4px;">
            <label>Раскладка отверстий</label>
          </div>
          <div class="segmented" id="hole-layout-seg" style="grid-template-columns: repeat(3, 1fr);">
            <button class="seg-btn active" data-val="center">1 центр</button>
            <button class="seg-btn" data-val="line-x">Ряд X</button>
            <button class="seg-btn" data-val="line-y">Ряд Y</button>
            <button class="seg-btn" data-val="grid-2x2">2×2</button>
            <button class="seg-btn" data-val="grid-2x3">2×3</button>
            <button class="seg-btn" data-val="grid-3x2">3×2</button>
            <button class="seg-btn" data-val="grid-3x3">3×3</button>
            <button class="seg-btn" data-val="grid-4x4" style="grid-column: span 2;">Сетка 4×4</button>
          </div>

          <div class="slider-row" id="line-count-row" style="display: none; margin-top: 4px;">
            <div class="slider-header">
              <label for="line-count-range">Кол-во отверстий в ряду</label>
              <div class="num-input-wrap">
                <input type="number" id="line-count-num" min="2" max="10" value="3" />
                <span>шт</span>
              </div>
            </div>
            <input type="range" id="line-count-range" min="2" max="10" value="3" />
          </div>

          <div class="slider-row" id="spread-row" style="display: none; margin-top: 4px;">
            <div class="slider-header">
              <label for="spread-range">Раздвижение / Сближение</label>
              <div class="num-input-wrap">
                <input type="number" id="spread-num" min="10" max="90" value="50" />
                <span>%</span>
              </div>
            </div>
            <input type="range" id="spread-range" min="10" max="90" value="50" />
          </div>

          <div class="slider-header" style="margin-top: 4px;">
            <label>Тип глубины</label>
          </div>
          <div class="segmented two-cols" id="hole-depth-type-seg">
            <button class="seg-btn active" data-val="through">Сквозное</button>
            <button class="seg-btn" data-val="blind">Глухое</button>
          </div>

          <div class="slider-row" style="margin-top: 4px;">
            <div class="slider-header">
              <label for="size-x-range" id="size-x-label">Диаметр отверстия</label>
              <div class="num-input-wrap">
                <input type="number" id="size-x-num" min="2" max="150" value="15" />
                <span>мм</span>
              </div>
            </div>
            <input type="range" id="size-x-range" min="2" max="150" value="15" />
          </div>

          <div class="slider-row" id="size-y-row" style="display: none;">
            <div class="slider-header">
              <label for="size-y-range">Ширина Y (прямоугольника)</label>
              <div class="num-input-wrap">
                <input type="number" id="size-y-num" min="2" max="150" value="15" />
                <span>мм</span>
              </div>
            </div>
            <input type="range" id="size-y-range" min="2" max="150" value="15" />
          </div>

          <div class="slider-row" id="depth-row" style="display: none;">
            <div class="slider-header">
              <label for="depth-range">Глубина отверстия</label>
              <div class="num-input-wrap">
                <input type="number" id="depth-num" min="2" max="190" value="20" />
                <span>мм</span>
              </div>
            </div>
            <input type="range" id="depth-range" min="2" max="190" value="20" />
          </div>
        </div>
      </div>

      <div>
        <div class="section-title">3D-текст и подложка</div>
        <div class="control-group">
          <div class="slider-row">
            <div class="slider-header">
              <label for="text-input">Текст (латиница / кириллица)</label>
            </div>
            <input type="text" id="text-input" placeholder="Например: 3D" maxlength="24" value="3D"
              style="width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 8px 10px; color: #f8fafc; font-size: 13px; outline: none;" />
          </div>

          <div class="slider-header" style="margin-top: 2px;">
            <label>Сторона модели</label>
          </div>
          <div class="segmented" id="text-side-seg" style="grid-template-columns: repeat(3, 1fr);">
            <button class="seg-btn active" data-val="top">Верх</button>
            <button class="seg-btn" data-val="bottom">Низ</button>
            <button class="seg-btn" data-val="front">Перед</button>
            <button class="seg-btn" data-val="back">Зад</button>
            <button class="seg-btn" data-val="right">Право</button>
            <button class="seg-btn" data-val="left">Лево</button>
          </div>

          <div class="slider-row" style="margin-top: 2px;">
            <div class="slider-header">
              <label for="text-size-range">Размер текста (высота)</label>
              <div class="num-input-wrap">
                <input type="number" id="text-size-num" min="6" max="60" value="18" />
                <span>мм</span>
              </div>
            </div>
            <input type="range" id="text-size-range" min="6" max="60" value="18" />
          </div>

          <div class="slider-header" style="margin-top: 2px;">
            <label>Режим векторного текста</label>
          </div>
          <div class="segmented two-cols" id="text-mode-seg">
            <button class="seg-btn active" data-val="out">Выдавливать (+)</button>
            <button class="seg-btn" data-val="in">Вычитать (−)</button>
          </div>

          <div class="slider-row">
            <div class="slider-header">
              <label for="text-depth-range">Выдавливание текста (+ / −)</label>
              <div class="num-input-wrap">
                <input type="number" id="text-depth-num" min="-10" max="10" step="0.5" value="2" />
                <span>мм</span>
              </div>
            </div>
            <input type="range" id="text-depth-range" min="-10" max="10" step="0.5" value="2" />
          </div>

          <div class="slider-row">
            <div class="slider-header">
              <label for="text-posx-range">Смещение по горизонтали</label>
              <div class="num-input-wrap">
                <input type="number" id="text-posx-num" min="-100" max="100" value="0" />
                <span>%</span>
              </div>
            </div>
            <input type="range" id="text-posx-range" min="-100" max="100" value="0" />
          </div>

          <div class="slider-row">
            <div class="slider-header">
              <label for="text-posy-range">Смещение по вертикали</label>
              <div class="num-input-wrap">
                <input type="number" id="text-posy-num" min="-100" max="100" value="0" />
                <span>%</span>
              </div>
            </div>
            <input type="range" id="text-posy-range" min="-100" max="100" value="0" />
          </div>

          <div style="border-top: 1px solid rgba(51, 65, 85, 0.8); padding-top: 10px; margin-top: 2px; display: flex; flex-direction: column; gap: 10px;">
            <div class="slider-header">
              <label>Подложка под текст</label>
              <button type="button" class="icon-btn" id="pad-toggle-btn">Выключена</button>
            </div>

            <div id="pad-controls-wrap" style="display: none; flex-direction: column; gap: 10px;">
              <div class="slider-row">
                <div class="slider-header">
                  <label for="pad-len-range">Длина подложки</label>
                  <div class="num-input-wrap">

            <div class="stat-val" id="stat-vol">185.2 см³</div>
            <div class="stat-lbl">Объем модели</div>

      <button class="btn-primary" id="export-json-only-btn">

          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>

          <line x1="12" y1="15" x2="12" y2="3"/>

    <div id="json-download-toast" style="padding: 0 16px 10px; font-size: 12px; color: var(--success); min-height: 0;"></div>
  </div>


  <script>
    const state = {
      length: 80,
      width: 80,
      height: 80,
      fillet: 12,
      topSlope: 0,
      slopeAxis: 'x',
      text: '3D',
      textSide: 'top',
      textMode: 'out',
      textSize: 18,
      textDepth: 2,
      textMode: 'out',
      textPosX: 0,
      textPosY: 0,
      padEnabled: false,
      padLength: 44,
      padWidth: 26,
      padHeight: 6,
      padSlope: 0,
      padSlopeV: 0,
      holeShape: 'round',
      holeLayout: 'center',
      lineCount: 3,
      holeSpread: 50,
      depthType: 'through',
      sizeX: 15,
      sizeY: 15,
      depth: 20,
      wireframe: false,
      autoRotate: false
    };

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const initW = container.clientWidth || window.innerWidth;
    const initH = container.clientHeight || Math.round(window.innerHeight * 0.46);
    const camera = new THREE.PerspectiveCamera(42, initW / initH, 1, 2000);
    camera.position.set(160, 140, 170);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(initW, initH);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.minDistance = 30;
    controls.maxDistance = 600;

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.72);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(120, 180, 100);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(1024, 1024);
    scene.add(dirLight);

    const fillLight = new THREE.DirectionalLight(0xdbeafe, 0.55);
    fillLight.position.set(-100, 60, -100);
    scene.add(fillLight);

    const gridHelper = new THREE.GridHelper(220, 22, 0x38bdf8, 0x1a2642);
    scene.add(gridHelper);

    const material = new THREE.MeshStandardMaterial({
      color: 0x2563eb,
      roughness: 0.3,
      metalness: 0.12,
      wireframe: false
    });

    const textOutMaterial = new THREE.MeshStandardMaterial({
      color: 0x7dd3fc,
      roughness: 0.25,
      metalness: 0.15,
      wireframe: false
    });

    const textInMaterial = new THREE.MeshStandardMaterial({
      color: 0x090d16,
      roughness: 0.6,
      metalness: 0.05,
      wireframe: false
    });

    let currentMesh = null;
    let textMesh = null;
    let padMesh = null;

    function pushQuad(arr, a, b, c, d) {
      arr.push(
        a[0], a[1], a[2],
        b[0], b[1], b[2],
        c[0], c[1], c[2],
        a[0], a[1], a[2],
        c[0], c[1], c[2],
        d[0], d[1], d[2]
      );
    }

    function getFaceBasisAndCenter() {
      const L = state.length;
      const W = state.width;
      const H = state.height;

      switch (state.textSide) {
        case 'bottom':
          return {
            uAxis: [1, 0, 0],
            vAxis: [0, 0, -1],
            nAxis: [0, -1, 0],
            faceCenter: [0, 0, 0],
            spanU: L,
            spanV: W
          };
        case 'front':
          return {
            uAxis: [1, 0, 0],
            vAxis: [0, 1, 0],
            nAxis: [0, 0, 1],
            faceCenter: [0, H * 0.5, W * 0.5],
            spanU: L,
            spanV: H
          };
        case 'back':
          return {
            uAxis: [-1, 0, 0],
            vAxis: [0, 1, 0],
            nAxis: [0, 0, -1],
            faceCenter: [0, H * 0.5, -W * 0.5],
            spanU: L,
            spanV: H
          };
        case 'right':
          return {
            uAxis: [0, 0, -1],
            vAxis: [0, 1, 0],
            nAxis: [1, 0, 0],
            faceCenter: [L * 0.5, H * 0.5, 0],
            spanU: W,
            spanV: H
          };
        case 'left':
          return {
            uAxis: [0, 0, 1],
            vAxis: [0, 1, 0],
            nAxis: [-1, 0, 0],
            faceCenter: [-L * 0.5, H * 0.5, 0],
            spanU: W,
            spanV: H
          };
        case 'top':
        default:
          return {
            uAxis: [1, 0, 0],
            vAxis: [0, 0, -1],
            nAxis: [0, 1, 0],
            faceCenter: [0, H, 0],
            spanU: L,
            spanV: W
          };
      }
    }

    function getTextOffsets(basis, textW, textH) {
      const maxOffsetU = Math.max(0, (basis.spanU - textW) * 0.5);
      const maxOffsetV = Math.max(0, (basis.spanV - textH) * 0.5);
      const offsetU = (state.textPosX / 100) * Math.max(maxOffsetU, basis.spanU * 0.35);
      const offsetV = (state.textPosY / 100) * Math.max(maxOffsetV, basis.spanV * 0.35);
      return { offsetU, offsetV };
    }

    function applyModelSlopeToPoint(px, py, pz, slopeInfo) {
      if (!slopeInfo || Math.abs(slopeInfo.tanVal) < 1e-6) return py;
      const coord = slopeInfo.axis === 'x' ? px : pz;
      const slopedTop = Math.max(2, state.height + coord * slopeInfo.tanVal);
      if (state.textSide === 'top') {
        const localOffsetY = py - state.height;
        return slopedTop + localOffsetY;
      }
      return py > slopedTop ? slopedTop : py;
    }

    function traceSmoothTextShapes() {
      const rawText = (state.text || '').trim();
      if (!rawText) return null;

      const offCanvas = document.createElement('canvas');
      const ctx = offCanvas.getContext('2d');
      const fontPx = 220;
      const fontStr = `700 ${fontPx}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif`;
      ctx.font = fontStr;

      const measured = Math.max(80, Math.ceil(ctx.measureText(rawText).width));
      const padX = 56;
      const cw = Math.min(1800, measured + padX * 2);
      const ch = 300;

      offCanvas.width = cw;
      offCanvas.height = ch;

      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, cw, ch);

      ctx.fillStyle = '#ffffff';
      ctx.font = fontStr;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(rawText, cw * 0.5, ch * 0.52, cw - padX);

      const imgData = ctx.getImageData(0, 0, cw, ch).data;
      const aspect = cw / ch;
      const textH = state.textSize;
      const textW = textH * aspect;

      const cols = Math.min(360, Math.floor(cw * 0.5));
      const rows = Math.min(150, Math.floor(ch * 0.5));
      if (cols < 8 || rows < 8) return null;

      const field = Array.from({ length: rows + 1 }, () => new Float32Array(cols + 1));
      for (let r = 0; r <= rows; r++) {
        const py = Math.min(ch - 1, Math.round((r / rows) * (ch - 1)));
        for (let c = 0; c <= cols; c++) {
          const px = Math.min(cw - 1, Math.round((c / cols) * (cw - 1)));
          let sum = 0;
          let cnt = 0;
          for (let dy = -1; dy <= 1; dy++) {
            const ny = py + dy;
            if (ny < 0 || ny >= ch) continue;
            for (let dx = -1; dx <= 1; dx++) {
              const nx = px + dx;
              if (nx < 0 || nx >= cw) continue;
              sum += imgData[(ny * cw + nx) * 4];
              cnt++;
            }
          }
          field[r][c] = (cnt > 0 ? sum / cnt : 0) / 255;
        }
      }

      const iso = 0.45;
      const interp = (v1, v2) => {
        const d = v2 - v1;
        if (Math.abs(d) < 1e-6) return 0.5;
        return Math.max(0, Math.min(1, (iso - v1) / d));
      };

      const segments = [];
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const a = field[r][c];
          const b = field[r][c + 1];
          const d = field[r + 1][c];
          const e = field[r + 1][c + 1];

          let mask = 0;
          if (a >= iso) mask |= 1;
          if (b >= iso) mask |= 2;
          if (e >= iso) mask |= 4;
          if (d >= iso) mask |= 8;

          if (mask === 0 || mask === 15) continue;

          const topX = c + interp(a, b);
          const topY = r;
          const rightX = c + 1;
          const rightY = r + interp(b, e);
          const botX = c + interp(d, e);
          const botY = r + 1;
          const leftX = c;
          const leftY = r + interp(a, d);

          const toUV = (gx, gy) => {
            const u = (gx / cols - 0.5) * textW;
            const v = (0.5 - gy / rows) * textH;
            return [u, v];
          };

          const addSeg = (p1, p2) => {
            const [u1, v1] = toUV(p1[0], p1[1]);
            const [u2, v2] = toUV(p2[0], p2[1]);
            if (Math.hypot(u2 - u1, v2 - v1) > 1e-5) {
              segments.push([[u1, v1], [u2, v2]]);
            }
          };

          switch (mask) {
            case 1: case 14: addSeg([leftX, leftY], [topX, topY]); break;
            case 2: case 13: addSeg([topX, topY], [rightX, rightY]); break;
            case 3: case 12: addSeg([leftX, leftY], [rightX, rightY]); break;
            case 4: case 11: addSeg([rightX, rightY], [botX, botY]); break;
            case 6: case 9:  addSeg([topX, topY], [botX, botY]); break;
            case 7: case 8:  addSeg([leftX, leftY], [botX, botY]); break;
            case 5:
              addSeg([leftX, leftY], [topX, topY]);
              addSeg([rightX, rightY], [botX, botY]);
              break;
            case 10:
              addSeg([topX, topY], [rightX, rightY]);
              addSeg([leftX, leftY], [botX, botY]);
              break;
          }
        }
      }

      if (segments.length === 0) return null;

      const loops = [];
      const used = new Array(segments.length).fill(false);
      const eps = Math.max(textW / cols, textH / rows) * 0.35;

      const samePt = (p1, p2) => Math.hypot(p1[0] - p2[0], p1[1] - p2[1]) <= eps;

      for (let i = 0; i < segments.length; i++) {
        if (used[i]) continue;
        used[i] = true;
        const loop = [segments[i][0], segments[i][1]];
        let extended = true;
        while (extended) {
          extended = false;
          const tail = loop[loop.length - 1];
          for (let j = 0; j < segments.length; j++) {
            if (used[j]) continue;
            if (samePt(tail, segments[j][0])) {
              loop.push(segments[j][1]);
              used[j] = true;
              extended = true;
              break;
            } else if (samePt(tail, segments[j][1])) {
              loop.push(segments[j][0]);
              used[j] = true;
              extended = true;
              break;
            }
          }
        }
        if (loop.length >= 4) {
          if (samePt(loop[0], loop[loop.length - 1])) {
            loop.pop();
          }
          if (loop.length >= 3) {
            loops.push(loop);
          }
        }
      }

      if (loops.length === 0) return null;

      const smoothLoop = (pts, iterations = 2) => {
        let cur = pts;
        for (let it = 0; it < iterations; it++) {
          const next = [];
          const n = cur.length;
          for (let i = 0; i < n; i++) {
            const p0 = cur[i];
            const p1 = cur[(i + 1) % n];
            const qx = 0.75 * p0[0] + 0.25 * p1[0];
            const qy = 0.75 * p0[1] + 0.25 * p1[1];
            const rx = 0.25 * p0[0] + 0.75 * p1[0];
            const ry = 0.25 * p0[1] + 0.75 * p1[1];
            next.push([qx, qy], [rx, ry]);
          }
          cur = next;
        }
        return cur;
      };

      const signedArea = (pts) => {
        let a = 0;
        for (let i = 0; i < pts.length; i++) {
          const p0 = pts[i];
          const p1 = pts[(i + 1) % pts.length];
          a += p0[0] * p1[1] - p1[0] * p0[1];
        }
        return a * 0.5;
      };

      const pointInLoop = (pt, pts) => {
        let inside = false;
        for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
          const xi = pts[i][0], yi = pts[i][1];
          const xj = pts[j][0], yj = pts[j][1];
          const intersect = ((yi > pt[1]) !== (yj > pt[1])) &&
            (pt[0] < ((xj - xi) * (pt[1] - yi)) / ((yj - yi) || 1e-9) + xi);
          if (intersect) inside = !inside;
        }
        return inside;
      };

      const processed = loops.map(raw => {
        const s = smoothLoop(raw, 2);
        const area = signedArea(s);
        return { pts: s, area, absArea: Math.abs(area) };
      }).filter(item => item.absArea > 0.02);

      processed.sort((a, b) => b.absArea - a.absArea);

      const shapes = [];
      const holeCandidates = [];

      for (const item of processed) {
        let parentShape = null;
        for (const sh of shapes) {
          if (pointInLoop(item.pts[0], sh._outerPts)) {
            parentShape = sh;
            break;
          }
        }
        if (parentShape) {
          holeCandidates.push({ parentShape, pts: item.pts });
        } else {
          const outerPts = item.area < 0 ? [...item.pts].reverse() : item.pts;
          const shape = new THREE.Shape();
          shape.moveTo(outerPts[0][0], outerPts[0][1]);
          for (let i = 1; i < outerPts.length; i++) {
            shape.lineTo(outerPts[i][0], outerPts[i][1]);
          }
          shape.closePath();
          shape._outerPts = outerPts;
          shapes.push(shape);
        }
      }

      for (const hc of holeCandidates) {
        let hPts = hc.pts;
        if (signedArea(hPts) > 0) hPts = [...hPts].reverse();
        const path = new THREE.Path();
        path.moveTo(hPts[0][0], hPts[0][1]);
        for (let i = 1; i < hPts.length; i++) {
          path.lineTo(hPts[i][0], hPts[i][1]);
        }
        path.closePath();
        hc.parentShape.holes.push(path);
      }

      if (shapes.length === 0) return null;
      return { shapes, textW, textH };
    }

    function getPadOuterHeightAtUV(localUFromPadCenter, localVFromPadCenter) {
      if (!state.padEnabled) return 0;
      const slopeURad = (state.padSlope * Math.PI) / 180;
      const slopeVRad = (state.padSlopeV * Math.PI) / 180;
      const rawH =
        state.padHeight +
        localUFromPadCenter * Math.tan(slopeURad) +
        localVFromPadCenter * Math.tan(slopeVRad);
      return Math.max(0.05, rawH);
    }

    function evalFacePoint(u, v, nDist, basis, offsetU, offsetV, slopeInfo) {
      const fc = basis.faceCenter;
      const ua = basis.uAxis;
      const va = basis.vAxis;
      const na = basis.nAxis;
      let px = fc[0] + ua[0] * (u + offsetU) + va[0] * (v + offsetV) + na[0] * nDist;
      let py = fc[1] + ua[1] * (u + offsetU) + va[1] * (v + offsetV) + na[1] * nDist;
      let pz = fc[2] + ua[2] * (u + offsetU) + va[2] * (v + offsetV) + na[2] * nDist;
      py = applyModelSlopeToPoint(px, py, pz, slopeInfo);
      return [px, py, pz];
    }

    function compileTextHitPolygons(textData) {
      if (!textData || !textData.shapes) return [];
      const polys = [];
      for (const shape of textData.shapes) {
        const outerVecs = shape.getPoints(28);
        const outerPts = new Float64Array(outerVecs.length * 2);
        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        for (let i = 0; i < outerVecs.length; i++) {
          const x = outerVecs[i].x, y = outerVecs[i].y;
          outerPts[i * 2] = x;
          outerPts[i * 2 + 1] = y;
          if (x < minX) minX = x; if (x > maxX) maxX = x;
          if (y < minY) minY = y; if (y > maxY) maxY = y;
        }
        const holes = [];
        for (const hole of shape.holes) {
          const hVecs = hole.getPoints(18);
          const hPts = new Float64Array(hVecs.length * 2);
          for (let i = 0; i < hVecs.length; i++) {
            hPts[i * 2] = hVecs[i].x;
            hPts[i * 2 + 1] = hVecs[i].y;
          }
          holes.push(hPts);
        }
        polys.push({ outerPts, holes, minX, maxX, minY, maxY });
      }
      return polys;
    }

    function pointInFlatLoop(u, v, pts) {
      let inside = false;
      const n = pts.length >> 1;
      for (let i = 0, j = n - 1; i < n; j = i++) {
        const xi = pts[i * 2], yi = pts[i * 2 + 1];
        const xj = pts[j * 2], yj = pts[j * 2 + 1];
        const hit = ((yi > v) !== (yj > v)) &&
          (u < ((xj - xi) * (v - yi)) / ((yj - yi) || 1e-9) + xi);
        if (hit) inside = !inside;
      }
      return inside;
    }

    function isPointInCompiledPolys(u, v, polys) {
      for (let p = 0; p < polys.length; p++) {
        const poly = polys[p];
        if (u < poly.minX || u > poly.maxX || v < poly.minY || v > poly.maxY) continue;
        if (!pointInFlatLoop(u, v, poly.outerPts)) continue;
        let inHole = false;
        for (let h = 0; h < poly.holes.length; h++) {
          if (pointInFlatLoop(u, v, poly.holes[h])) {
            inHole = true;
            break;
          }
        }
        if (!inHole) return true;
      }
      return false;
    }

    function buildPadGeometry(slopeInfo) {
      if (!state.padEnabled) return null;

      const basis = getFaceBasisAndCenter();
      const textData = traceSmoothTextShapes();
      const textW = textData ? textData.textW : state.textSize;
      const textH = textData ? textData.textH : state.textSize;
      const { offsetU, offsetV } = getTextOffsets(basis, textW, textH);

      const padL = state.padLength;
      const padW = state.padWidth;
      const isSubtracted = textData && state.textDepth < -0.01;
      const recessDepth = Math.abs(state.textDepth);
      const isTilted = Math.abs(state.padSlope) > 0.05 || Math.abs(state.padSlopeV) > 0.05;

      const segU = isSubtracted
        ? Math.min(96, Math.max(40, Math.round(padL * 0.9)))
        : (isTilted ? Math.min(64, Math.max(28, Math.round(padL * 0.7))) : 20);
      const segV = isSubtracted
        ? Math.min(72, Math.max(32, Math.round(padW * 0.9)))
        : (isTilted ? Math.min(48, Math.max(20, Math.round(padW * 0.7))) : 16);

      const lenU = padL / segU;
      const lenV = padW / segV;
      const baseN = state.padHeight > 0.05 ? -0.25 : 0;
      const verts = [];

      const topHeights = Array.from({ length: segU + 1 }, () => new Float32Array(segV + 1));
      for (let iu = 0; iu <= segU; iu++) {
        const uCorner = -padL * 0.5 + iu * lenU;
        for (let iv = 0; iv <= segV; iv++) {
          const vCorner = -padW * 0.5 + iv * lenV;
          const hVal = getPadOuterHeightAtUV(uCorner, vCorner);
          topHeights[iu][iv] = Math.max(baseN + 0.05, hVal);
        }
      }

      const hitGrid = Array.from({ length: segU }, () => new Uint8Array(segV));
      if (isSubtracted) {
        const polys = compileTextHitPolygons(textData);
        for (let iu = 0; iu < segU; iu++) {
          const u0 = -padL * 0.5 + iu * lenU;
          const u1 = u0 + lenU;
          const uMid = (u0 + u1) * 0.5;
          for (let iv = 0; iv < segV; iv++) {
            const v0 = -padW * 0.5 + iv * lenV;
            const v1 = v0 + lenV;
            const vMid = (v0 + v1) * 0.5;
            const hit =
              isPointInCompiledPolys(uMid, vMid, polys) ||
              isPointInCompiledPolys(u0 + lenU * 0.25, v0 + lenV * 0.25, polys) ||
              isPointInCompiledPolys(u1 - lenU * 0.25, v0 + lenV * 0.25, polys) ||
              isPointInCompiledPolys(u1 - lenU * 0.25, v1 - lenV * 0.25, polys) ||
              isPointInCompiledPolys(u0 + lenU * 0.25, v1 - lenV * 0.25, polys);
            hitGrid[iu][iv] = hit ? 1 : 0;
          }
        }
      }

      for (let iu = 0; iu < segU; iu++) {
        const u0 = -padL * 0.5 + iu * lenU;
        const u1 = u0 + lenU;
        const uMid = (u0 + u1) * 0.5;

        for (let iv = 0; iv < segV; iv++) {
          const v0 = -padW * 0.5 + iv * lenV;
          const v1 = v0 + lenV;
          const vMid = (v0 + v1) * 0.5;

          const h00 = topHeights[iu][iv];
          const h10 = topHeights[iu + 1][iv];
          const h11 = topHeights[iu + 1][iv + 1];
          const h01 = topHeights[iu][iv + 1];

          const b00 = evalFacePoint(u0, v0, baseN, basis, offsetU, offsetV, slopeInfo);
          const b10 = evalFacePoint(u1, v0, baseN, basis, offsetU, offsetV, slopeInfo);
          const b11 = evalFacePoint(u1, v1, baseN, basis, offsetU, offsetV, slopeInfo);
          const b01 = evalFacePoint(u0, v1, baseN, basis, offsetU, offsetV, slopeInfo);
          pushQuad(verts, b01, b11, b10, b00);

          const cellHit = hitGrid[iu][iv] === 1;
          const cellOuter = getPadOuterHeightAtUV(uMid, vMid);
          const floorN = Math.max(baseN + 0.15, cellOuter - recessDepth);

          if (!cellHit) {
            const t00 = evalFacePoint(u0, v0, h00, basis, offsetU, offsetV, slopeInfo);
            const t10 = evalFacePoint(u1, v0, h10, basis, offsetU, offsetV, slopeInfo);
            const t11 = evalFacePoint(u1, v1, h11, basis, offsetU, offsetV, slopeInfo);
            const t01 = evalFacePoint(u0, v1, h01, basis, offsetU, offsetV, slopeInfo);
            pushQuad(verts, t00, t10, t11, t01);

            if (iv === 0) pushQuad(verts, b00, b10, t10, t00);
            if (iv === segV - 1) pushQuad(verts, b11, b01, t01, t11);
            if (iu === 0) pushQuad(verts, b01, b00, t00, t01);
            if (iu === segU - 1) pushQuad(verts, b10, b11, t11, t10);

            if (isSubtracted) {
              const w00 = evalFacePoint(u0, v0, floorN, basis, offsetU, offsetV, slopeInfo);
              const w10 = evalFacePoint(u1, v0, floorN, basis, offsetU, offsetV, slopeInfo);
              const w11 = evalFacePoint(u1, v1, floorN, basis, offsetU, offsetV, slopeInfo);
              const w01 = evalFacePoint(u0, v1, floorN, basis, offsetU, offsetV, slopeInfo);

              if (iv > 0 && hitGrid[iu][iv - 1] === 1) pushQuad(verts, w00, w10, t10, t00);
              if (iv < segV - 1 && hitGrid[iu][iv + 1] === 1) pushQuad(verts, w11, w01, t01, t11);
              if (iu > 0 && hitGrid[iu - 1][iv] === 1) pushQuad(verts, w01, w00, t00, t01);
              if (iu < segU - 1 && hitGrid[iu + 1][iv] === 1) pushQuad(verts, w10, w11, t11, t10);
            }
          } else {
            const f00 = evalFacePoint(u0, v0, floorN, basis, offsetU, offsetV, slopeInfo);
            const f10 = evalFacePoint(u1, v0, floorN, basis, offsetU, offsetV, slopeInfo);
            const f11 = evalFacePoint(u1, v1, floorN, basis, offsetU, offsetV, slopeInfo);
            const f01 = evalFacePoint(u0, v1, floorN, basis, offsetU, offsetV, slopeInfo);
            pushQuad(verts, f00, f10, f11, f01);
          }
        }
      }

      if (verts.length === 0) return null;
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
      geo.computeVertexNormals();
      return geo;
    }

    function getInwardPocketDepth(basis) {
      const depthAbs = Math.max(0.2, Math.abs(state.textDepth));
      const maxSafe = Math.max(0.5, Math.min(basis.spanU, basis.spanV, state.height) * 0.45);
      return Math.min(depthAbs, maxSafe);
    }

    function buildTextGeometry(slopeInfo) {
      const textData = traceSmoothTextShapes();
      if (!textData) return null;

      const basis = getFaceBasisAndCenter();
      const { offsetU, offsetV } = getTextOffsets(basis, textData.textW, textData.textH);
      const extrudeVal = state.textDepth;
      if (Math.abs(extrudeVal) < 0.01) return null;

      const hasPad = state.padEnabled;
      if (hasPad && extrudeVal < 0) return null;

      const depthAbs = Math.max(0.2, Math.abs(extrudeVal));
      const extrudeGeo = new THREE.ExtrudeGeometry(textData.shapes, {
        depth: depthAbs,
        bevelEnabled: false,
        curveSegments: 36
      });

      const nonIdx = extrudeGeo.index ? extrudeGeo.toNonIndexed() : extrudeGeo;
      if (nonIdx !== extrudeGeo) extrudeGeo.dispose();

      const pos = nonIdx.attributes.position;
      const outVerts = new Float32Array(pos.count * 3);

      for (let i = 0; i < pos.count; i++) {
        const localU = pos.getX(i);
        const localV = pos.getY(i);
        const zRaw = pos.getZ(i);
        const tNorm = Math.max(0, Math.min(1, zRaw / depthAbs));

        let nDist;
        if (extrudeVal > 0) {
          const surfaceN = hasPad ? getPadOuterHeightAtUV(localU, localV) : 0;
          const nStart = hasPad ? surfaceN - 0.08 : -0.15;
          const nEnd = surfaceN + extrudeVal;
          nDist = nStart + tNorm * (nEnd - nStart);
        } else {
          // For negative textDepth without pad, real subtraction is handled in buildRecessedPocketAndCutoutGeometry
          return null;
        }

        const [px, py, pz] = evalFacePoint(localU, localV, nDist, basis, offsetU, offsetV, slopeInfo);
        outVerts[i * 3] = px;
        outVerts[i * 3 + 1] = py;
        outVerts[i * 3 + 2] = pz;
      }

      nonIdx.dispose();
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(outVerts, 3));
      geo.computeVertexNormals();
      return geo;
    }

    function buildRecessedPocketAndCutoutGeometry(slopeInfo) {
      if (state.padEnabled) return null;
      if (!state.text || !state.text.trim() || state.textDepth >= -0.01) return null;

      const textData = traceSmoothTextShapes();
      if (!textData || !textData.shapes || !textData.shapes.length) return null;

      const basis = getFaceBasisAndCenter();
      const { offsetU, offsetV } = getTextOffsets(basis, textData.textW, textData.textH);
      const pocketDepth = getInwardPocketDepth(basis);
      const halfU = basis.spanU * 0.5;
      const halfV = basis.spanV * 0.5;

      // Clamp text shapes to stay safely inside the face bounds
      const clampedShapes = [];
      for (const sh of textData.shapes) {
        const pts = sh.getPoints(24);
        const clampedPts = pts.map(p => {
          const uWorld = p.x + offsetU;
          const vWorld = p.y + offsetV;
          const cu = Math.max(-halfU + 0.6, Math.min(halfU - 0.6, uWorld)) - offsetU;
          const cv = Math.max(-halfV + 0.6, Math.min(halfV - 0.6, vWorld)) - offsetV;
          return new THREE.Vector2(cu, cv);
        });
        if (clampedPts.length >= 3) {
          const cShape = new THREE.Shape(clampedPts);
          for (const h of sh.holes) {
            const hPts = h.getPoints(16).map(p => {
              const cu = Math.max(-halfU + 0.8, Math.min(halfU - 0.8, p.x + offsetU)) - offsetU;
              const cv = Math.max(-halfV + 0.8, Math.min(halfV - 0.8, p.y + offsetV)) - offsetV;
              return new THREE.Vector2(cu, cv);
            });
            if (hPts.length >= 3) cShape.holes.push(new THREE.Path(hPts));
          }
          clampedShapes.push(cShape);
        }
      }

      if (!clampedShapes.length) return null;

      // Build extruded pocket cavity from z = -pocketDepth to z = +0.02 in local (u, v, n)
      const pocketExtrude = new THREE.ExtrudeGeometry(clampedShapes, {
        depth: pocketDepth + 0.02,
        bevelEnabled: false,
        curveSegments: 24
      });
      // ExtrudeGeometry goes from z=0 to z=depth. Shift so floor is at -pocketDepth and rim is at +0.02
      pocketExtrude.translate(0, 0, -pocketDepth);

      const nonIdx = pocketExtrude.index ? pocketExtrude.toNonIndexed() : pocketExtrude;
      if (nonIdx !== pocketExtrude) pocketExtrude.dispose();

      const pos = nonIdx.attributes.position;
      const outVerts = new Float32Array(pos.count * 3);

      for (let i = 0; i < pos.count; i++) {
        const localU = pos.getX(i);
        const localV = pos.getY(i);
        const nLocal = pos.getZ(i);
        const [px, py, pz] = evalFacePoint(localU, localV, nLocal, basis, offsetU, offsetV, slopeInfo);
        outVerts[i * 3] = px;
        outVerts[i * 3 + 1] = py;
        outVerts[i * 3 + 2] = pz;
      }

      nonIdx.dispose();
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(outVerts, 3));
      geo.computeVertexNormals();
      return geo;
    }

    function carveInwardTextFromBodyGeometry(bodyGeo) {
      if (state.padEnabled) return bodyGeo;
      if (!state.text || !state.text.trim() || state.textDepth >= -0.01) return bodyGeo;

      const textData = traceSmoothTextShapes();
      if (!textData) return bodyGeo;

      const polys = compileTextHitPolygons(textData);
      if (!polys.length) return bodyGeo;

      const basis = getFaceBasisAndCenter();
      const { offsetU, offsetV } = getTextOffsets(basis, textData.textW, textData.textH);
      const slopeInfo = getEffectiveSlopeParams();
      const pocketDepth = getInwardPocketDepth(basis);

      const nonIdx = bodyGeo.index ? bodyGeo.toNonIndexed() : bodyGeo.clone();
      const pos = nonIdx.attributes.position;
      const triCount = Math.floor(pos.count / 3);

      const ua = new THREE.Vector3(...basis.uAxis);
      const va = new THREE.Vector3(...basis.vAxis);
      const na = new THREE.Vector3(...basis.nAxis);
      const fc = new THREE.Vector3(...basis.faceCenter);

      const vA = new THREE.Vector3();
      const vB = new THREE.Vector3();
      const vC = new THREE.Vector3();
      const rel = new THREE.Vector3();
      const kept = [];

      const getFaceNAtUV = (u, v) => {
        const [fx, fy, fz] = evalFacePoint(u, v, 0, basis, offsetU, offsetV, slopeInfo);
        const fPt = new THREE.Vector3(fx, fy, fz);
        return fPt.sub(fc).dot(na);
      };

      const projectToUVN = (pt) => {
        rel.subVectors(pt, fc);
        const u = rel.dot(ua) - offsetU;
        const v = rel.dot(va) - offsetV;
        const n = rel.dot(na);
        const faceN = getFaceNAtUV(u, v);
        return { u, v, dFromFace: n - faceN };
      };

      for (let t = 0; t < triCount; t++) {
        const i0 = t * 3;
        vA.fromBufferAttribute(pos, i0);
        vB.fromBufferAttribute(pos, i0 + 1);
        vC.fromBufferAttribute(pos, i0 + 2);

        const pA = projectToUVN(vA);
        const pB = projectToUVN(vB);
        const pC = projectToUVN(vC);

        const onOuterFace =
          Math.abs(pA.dFromFace) < 0.35 &&
          Math.abs(pB.dFromFace) < 0.35 &&
          Math.abs(pC.dFromFace) < 0.35;

        const insidePocketDepth =
          pA.dFromFace < 0.35 && pA.dFromFace >= -pocketDepth - 0.35 &&
          pB.dFromFace < 0.35 && pB.dFromFace >= -pocketDepth - 0.35 &&
          pC.dFromFace < 0.35 && pC.dFromFace >= -pocketDepth - 0.35;

        const cu = (pA.u + pB.u + pC.u) / 3;
        const cv = (pA.v + pB.v + pC.v) / 3;

        const inText =
          isPointInCompiledPolys(cu, cv, polys) ||
          isPointInCompiledPolys(pA.u, pA.v, polys) ||
          isPointInCompiledPolys(pB.u, pB.v, polys) ||
          isPointInCompiledPolys(pC.u, pC.v, polys);

        if ((onOuterFace && inText) || (insidePocketDepth && inText)) {
          continue;
        }

        kept.push(
          vA.x, vA.y, vA.z,
          vB.x, vB.y, vB.z,
          vC.x, vC.y, vC.z
        );
      }

      nonIdx.dispose();
      if (kept.length === 0) return bodyGeo;

      const carved = new THREE.BufferGeometry();
      carved.setAttribute('position', new THREE.Float32BufferAttribute(kept, 3));
      carved.computeVertexNormals();
      return carved;
    }

    function getHoleCenters() {
      const L = state.length;
      const W = state.width;
      const layout = state.holeLayout;
      const count = state.lineCount;
      const spreadFactor = state.holeSpread / 100;

      if (layout === 'center') {
        return [{ x: 0, y: 0 }];
      } else if (layout === 'line-x') {
        const pts = [];
        const span = Math.max(6, L * 0.75 * spreadFactor);
        const step = count > 1 ? span / (count - 1) : 0;
        const startX = -span / 2;
        for (let i = 0; i < count; i++) {
          pts.push({ x: startX + i * step, y: 0 });
        }
        return pts;
      } else if (layout === 'line-y') {
        const pts = [];
        const span = Math.max(6, W * 0.75 * spreadFactor);
        const step = count > 1 ? span / (count - 1) : 0;
        const startY = -span / 2;
        for (let i = 0; i < count; i++) {
          pts.push({ x: 0, y: startY + i * step });
        }
        return pts;
      } else {
        let rows = 2, cols = 2;
        if (layout === 'grid-2x2') { rows = 2; cols = 2; }
        else if (layout === 'grid-2x3') { rows = 2; cols = 3; }
        else if (layout === 'grid-3x2') { rows = 3; cols = 2; }
        else if (layout === 'grid-3x3') { rows = 3; cols = 3; }
        else if (layout === 'grid-4x4') { rows = 4; cols = 4; }

        const spanX = Math.max(8, L * 0.7 * spreadFactor);
        const spanY = Math.max(8, W * 0.7 * spreadFactor);

        const stepX = cols > 1 ? spanX / (cols - 1) : 0;
        const stepY = rows > 1 ? spanY / (rows - 1) : 0;

        const startX = -spanX / 2;
        const startY = -spanY / 2;

        const pts = [];
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            pts.push({
              x: startX + c * stepX,
              y: startY + r * stepY
            });
          }
        }
        return pts;
      }
    }

    function getEffectiveSlopeParams() {
      const L = state.length;
      const W = state.width;
      const H = state.height;
      const halfSpan = (state.slopeAxis === 'x' ? L : W) / 2;
      const maxTan = Math.max(0, (H - 3) / Math.max(1, halfSpan));
      const maxDeg = Math.min(45, Math.floor((Math.atan(maxTan) * 180) / Math.PI));
      const clampedDeg = Math.max(-maxDeg, Math.min(maxDeg, state.topSlope));
      const rad = (clampedDeg * Math.PI) / 180;
      const tanVal = Math.tan(rad);
      const minTopY = H - halfSpan * Math.abs(tanVal);
      return { clampedDeg, maxDeg, tanVal, minTopY };
    }

    function enforceConstraints() {
      const L = state.length;
      const W = state.width;
      const H = state.height;

      const maxFillet = Math.min(L, W) / 2 - 2;
      const filletRange = document.getElementById('fillet-range');
      const filletNum = document.getElementById('fillet-num');
      const safeMaxF = Math.max(0, Math.floor(maxFillet * 10) / 10);
      filletRange.max = safeMaxF;
      filletNum.max = safeMaxF;
      if (state.fillet > safeMaxF) state.fillet = safeMaxF;
      filletRange.value = state.fillet;
      filletNum.value = state.fillet;

      const slopeInfo = getEffectiveSlopeParams();
      const slopeRange = document.getElementById('slope-range');
      const slopeNum = document.getElementById('slope-num');
      slopeRange.min = -slopeInfo.maxDeg;
      slopeRange.max = slopeInfo.maxDeg;
      slopeNum.min = -slopeInfo.maxDeg;
      slopeNum.max = slopeInfo.maxDeg;
      state.topSlope = slopeInfo.clampedDeg;
      slopeRange.value = state.topSlope;
      slopeNum.value = state.topSlope;

      const minWall = 2.0;
      const maxAllowedX = Math.max(2, Math.floor((L - minWall * 2) * 10) / 10);
      const maxAllowedY = Math.max(2, Math.floor((W - minWall * 2) * 10) / 10);

      const sizeXRange = document.getElementById('size-x-range');
      const sizeXNum = document.getElementById('size-x-num');
      sizeXRange.max = maxAllowedX;
      sizeXNum.max = maxAllowedX;
      if (state.sizeX > maxAllowedX) state.sizeX = maxAllowedX;
      sizeXRange.value = state.sizeX;
      sizeXNum.value = state.sizeX;

      const sizeYRange = document.getElementById('size-y-range');
      const sizeYNum = document.getElementById('size-y-num');
      sizeYRange.max = maxAllowedY;
      sizeYNum.max = maxAllowedY;
      if (state.sizeY > maxAllowedY) state.sizeY = maxAllowedY;
      sizeYRange.value = state.sizeY;
      sizeYNum.value = state.sizeY;

      const maxDepth = Math.max(2, Math.floor((slopeInfo.minTopY - 1.5) * 10) / 10);
      const depthRange = document.getElementById('depth-range');
      const depthNum = document.getElementById('depth-num');
      depthRange.max = maxDepth;
      depthNum.max = maxDepth;
      if (state.depth > maxDepth) state.depth = maxDepth;
      depthRange.value = state.depth;
      depthNum.value = state.depth;
    }

    function createRoundedRectShape(width, height, radius) {
      const shape = new THREE.Shape();
      const hw = width / 2;
      const hh = height / 2;
      const r = Math.min(radius, hw - 1, hh - 1);

      if (r <= 0) {
        shape.moveTo(-hw, -hh);
        shape.lineTo(hw, -hh);
        shape.lineTo(hw, hh);
        shape.lineTo(-hw, hh);
        shape.closePath();
      } else {
        shape.moveTo(-hw + r, -hh);
        shape.lineTo(hw - r, -hh);
        shape.absarc(hw - r, -hh + r, r, -Math.PI / 2, 0, false);
        shape.lineTo(hw, hh - r);
        shape.absarc(hw - r, hh - r, r, 0, Math.PI / 2, false);
        shape.lineTo(-hw + r, hh);
        shape.absarc(-hw + r, hh - r, r, Math.PI / 2, Math.PI, false);
        shape.lineTo(-hw, -hh + r);
        shape.absarc(-hw + r, -hh + r, r, Math.PI, Math.PI * 1.5, false);
      }
      return shape;
    }

    function mergeNonIndexedGeometries(geoList) {
      const nonIndexedList = geoList.map(g => (g.index ? g.toNonIndexed() : g.clone()));
      let totalVerts = 0;
      for (const g of nonIndexedList) {
        totalVerts += g.attributes.position.count;
      }

      const positions = new Float32Array(totalVerts * 3);
      let offset = 0;
      for (const g of nonIndexedList) {
        const posArr = g.attributes.position.array;
        positions.set(posArr, offset);
        offset += posArr.length;
        g.dispose();
      }

      const merged = new THREE.BufferGeometry();
      merged.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      merged.computeVertexNormals();
      return merged;
    }

    function applyTopSlopeToGeometry(geo, H, tanVal, axis) {
      if (Math.abs(tanVal) < 1e-6) return;
      const pos = geo.attributes.position;
      const thresholdY = H - 0.05;
      for (let i = 0; i < pos.count; i++) {
        const vy = pos.getY(i);
        if (vy >= thresholdY) {
          const vx = pos.getX(i);
          const vz = pos.getZ(i);
          const coord = axis === 'x' ? vx : vz;
          const slopedY = Math.max(2, H + coord * tanVal);
          pos.setY(i, slopedY);
        }
      }
      pos.needsUpdate = true;
      geo.computeVertexNormals();
    }

    function rebuildModel() {
      enforceConstraints();

      if (currentMesh) {
        if (currentMesh.userData.extraMeshes) {
          for (const em of currentMesh.userData.extraMeshes) {
            scene.remove(em);
            em.geometry.dispose();
          }
        }
        scene.remove(currentMesh);
        currentMesh.geometry.dispose();
      }

      const L = state.length;
      const W = state.width;
      const H = state.height;
      const f = state.fillet;
      const isRound = state.holeShape === 'round';
      const isThrough = state.depthType === 'through';
      const slopeInfo = getEffectiveSlopeParams();
      const depth = isThrough ? H : Math.min(slopeInfo.minTopY - 1.5, state.depth);

      const shapeSolid = createRoundedRectShape(L, W, f);
      const shapeWithHoles = createRoundedRectShape(L, W, f);
      const centers = getHoleCenters();

      for (const pt of centers) {
        const holePath = new THREE.Path();
        const hx = state.sizeX;
        const hy = isRound ? hx : state.sizeY;

        if (isRound) {
          holePath.absarc(pt.x, pt.y, hx / 2, 0, Math.PI * 2, true);
        } else {
          const hsX = hx / 2;
          const hsY = hy / 2;
          holePath.moveTo(pt.x - hsX, pt.y - hsY);
          holePath.lineTo(pt.x - hsX, pt.y + hsY);
          holePath.lineTo(pt.x + hsX, pt.y + hsY);
          holePath.lineTo(pt.x + hsX, pt.y - hsY);
          holePath.closePath();
        }
        shapeWithHoles.holes.push(holePath);
      }

      let finalGeometry = null;

      if (isThrough || depth >= H - 1) {
        const extrudeSettings = { depth: H, bevelEnabled: false, steps: 1, curveSegments: 36 };
        const geometry = new THREE.ExtrudeGeometry(shapeWithHoles, extrudeSettings);
        geometry.rotateX(-Math.PI / 2);
        geometry.computeBoundingBox();
        geometry.translate(0, -geometry.boundingBox.min.y, 0);
        finalGeometry = geometry.index ? geometry.toNonIndexed() : geometry;
        if (finalGeometry !== geometry) geometry.dispose();
        finalGeometry.computeVertexNormals();
      } else {
        const bottomHeight = Math.max(1.5, H - depth);
        const topHeight = H - bottomHeight;

        const geoBottom = new THREE.ExtrudeGeometry(shapeSolid, {
          depth: bottomHeight,
          bevelEnabled: false,
          steps: 1,
          curveSegments: 36
        });
        geoBottom.rotateX(-Math.PI / 2);
        geoBottom.computeBoundingBox();
        geoBottom.translate(0, -geoBottom.boundingBox.min.y, 0);

        const geoTop = new THREE.ExtrudeGeometry(shapeWithHoles, {
          depth: topHeight,
          bevelEnabled: false,
          steps: 1,
          curveSegments: 36
        });
        geoTop.rotateX(-Math.PI / 2);
        geoTop.computeBoundingBox();
        geoTop.translate(0, bottomHeight - geoTop.boundingBox.min.y, 0);

        finalGeometry = mergeNonIndexedGeometries([geoBottom, geoTop]);
        geoBottom.dispose();
        geoTop.dispose();
      }

      applyTopSlopeToGeometry(finalGeometry, H, slopeInfo.tanVal, state.slopeAxis);

      currentMesh = new THREE.Mesh(finalGeometry, material);
      currentMesh.castShadow = true;
      currentMesh.receiveShadow = true;
      scene.add(currentMesh);

      if (padMesh) {
        scene.remove(padMesh);
        padMesh.geometry.dispose();
        padMesh = null;
      }
      const padGeo = buildPadGeometry(slopeInfo);
      if (padGeo) {
        padMesh = new THREE.Mesh(padGeo, material);
        padMesh.castShadow = true;
        padMesh.receiveShadow = true;
        scene.add(padMesh);
      }

      if (textMesh) {
        scene.remove(textMesh);
        textMesh.geometry.dispose();
        textMesh = null;
      }
      const textGeo = buildTextGeometry(slopeInfo);
      if (textGeo) {
        const activeTextMat = state.textDepth < 0 ? textInMaterial : textOutMaterial;
        textMesh = new THREE.Mesh(textGeo, activeTextMat);
        textMesh.castShadow = true;
        textMesh.receiveShadow = true;
        scene.add(textMesh);
      } else if (!state.padEnabled && state.text && state.text.trim() && state.textDepth < -0.01) {
        const pocketGeo = buildRecessedPocketAndCutoutGeometry(slopeInfo);
        if (pocketGeo) {
          textMesh = new THREE.Mesh(pocketGeo, textInMaterial);
          textMesh.castShadow = true;
          textMesh.receiveShadow = true;
          scene.add(textMesh);
        }
      }

      controls.target.set(0, H / 2, 0);
      updateTelemetry();
    }

    function updateTelemetry() {
      const L = state.length;
      const W = state.width;
      const H = state.height;
      const isRound = state.holeShape === 'round';
      const isThrough = state.depthType === 'through';
      const depth = isThrough ? H : state.depth;
      const centers = getHoleCenters();

      const slopeSuffix = state.topSlope !== 0 ? ` · уклон ${state.topSlope}°` : '';
      document.getElementById('dim-badge').textContent = `${L} × ${W} × ${H} мм${slopeSuffix}`;

      const minWall = Math.min(L - state.sizeX, W - (isRound ? state.sizeX : state.sizeY)) / 2;
      const wallEl = document.getElementById('stat-wall');
      wallEl.textContent = `${Math.max(1, minWall).toFixed(1)} мм`;
      wallEl.className = 'stat-val ' + (minWall >= 3.0 ? 'wall-ok' : 'wall-warn');

      const totalBoxVol = L * W * H * (1 - state.fillet * 0.002);
      let totalHoleVol = 0;
      for (let i = 0; i < centers.length; i++) {
        const area = isRound ? Math.PI * Math.pow(state.sizeX / 2, 2) : state.sizeX * state.sizeY;
        totalHoleVol += area * depth;
      }
      const netVolCm3 = Math.max(0.1, (totalBoxVol - totalHoleVol) / 1000);
      document.getElementById('stat-vol').textContent = `${netVolCm3.toFixed(1)} см³`;

      const estGrams = Math.max(1, Math.round(netVolCm3 * 1.24 * 0.30));
      document.getElementById('stat-weight').textContent = `~${estGrams} г`;
    }

    function exportBinarySTL() {
      if (!currentMesh) return;

      const partsToExport = [currentMesh.geometry];
      if (currentMesh.userData && currentMesh.userData.extraMeshes) {
        for (const em of currentMesh.userData.extraMeshes) {
          if (em.geometry) partsToExport.push(em.geometry);
        }
      }
      if (padMesh && padMesh.geometry) {
        partsToExport.push(padMesh.geometry);
      }
      if (textMesh && textMesh.geometry) {
        partsToExport.push(textMesh.geometry);
      }
      if (currentMesh.geometry && state.textDepth < -0.01 && !state.padEnabled) {
        const carvedBody = carveInwardTextFromBodyGeometry(currentMesh.geometry);
        if (carvedBody !== currentMesh.geometry) {
          partsToExport[0] = carvedBody;
        }
        const slopeInfoExport = getEffectiveSlopeParams();
        const pocketGeoExport = buildRecessedPocketAndCutoutGeometry(slopeInfoExport);
        if (pocketGeoExport) {
          partsToExport.push(pocketGeoExport);
        }
      }
      const geo = mergeNonIndexedGeometries(partsToExport);
      if (partsToExport[0] !== currentMesh.geometry && partsToExport[0]) {
        partsToExport[0].dispose();
      }
      geo.rotateX(Math.PI / 2);
      geo.computeBoundingBox();
      const minZ = geo.boundingBox.min.z;
      geo.translate(0, 0, -minZ);

      const nonIndexed = geo.index ? geo.toNonIndexed() : geo;
      const pos = nonIndexed.attributes.position;
      const triangleCount = pos.count / 3;

      const bufferLength = 84 + triangleCount * 50;
      const buffer = new ArrayBuffer(bufferLength);
      const view = new DataView(buffer);

      const header = 'Binary STL generated by 3D CAD Configurator (units: mm)';
      for (let i = 0; i < 80; i++) {
        view.setUint8(i, i < header.length ? header.charCodeAt(i) : 0);
      }
      view.setUint32(80, triangleCount, true);

      let offset = 84;
      const pA = new THREE.Vector3();
      const pB = new THREE.Vector3();
      const pC = new THREE.Vector3();
      const cb = new THREE.Vector3();
      const ab = new THREE.Vector3();

      for (let i = 0; i < triangleCount; i++) {
        const idx = i * 3;
        pA.fromBufferAttribute(pos, idx);
        pB.fromBufferAttribute(pos, idx + 1);
        pC.fromBufferAttribute(pos, idx + 2);

        cb.subVectors(pC, pB);
        ab.subVectors(pA, pB);
        cb.cross(ab).normalize();

        view.setFloat32(offset, cb.x, true); offset += 4;
        view.setFloat32(offset, cb.y, true); offset += 4;
        view.setFloat32(offset, cb.z, true); offset += 4;

        view.setFloat32(offset, pA.x, true); offset += 4;
        view.setFloat32(offset, pA.y, true); offset += 4;
        view.setFloat32(offset, pA.z, true); offset += 4;

        view.setFloat32(offset, pB.x, true); offset += 4;
        view.setFloat32(offset, pB.y, true); offset += 4;
        view.setFloat32(offset, pB.z, true); offset += 4;

        view.setFloat32(offset, pC.x, true); offset += 4;
        view.setFloat32(offset, pC.y, true); offset += 4;
        view.setFloat32(offset, pC.z, true); offset += 4;

        view.setUint16(offset, 0, true); offset += 2;
      }

      const blob = new Blob([buffer], { type: 'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `block_${state.length}x${state.width}x${state.height}_config.stl`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);

      geo.dispose();
      if (nonIndexed !== geo) nonIndexed.dispose();
    }

    function bindPair(rangeId, numId, key, isFloat = false) {

      rangeEl.addEventListener('input', () => {

        numEl.value = val;

      numEl.addEventListener('change', () => {

        val = Math.max(parseFloat(rangeEl.min), Math.min(parseFloat(rangeEl.max), val));
        state[key] = val;
        rangeEl.value = val;
        numEl.value = val;
        rebuildModel();
      });
