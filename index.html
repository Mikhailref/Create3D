def make_rounded_rect_wire(length, width, radius):
    hw = length / 2.0
    hh = width / 2.0
    r = max(0.0, min(float(radius), hw - 0.5, hh - 0.5))
    if r <= 1e-4:
        pts = [
            App.Vector(-hw, -hh, 0),
            App.Vector(hw, -hh, 0),
            App.Vector(hw, hh, 0),
            App.Vector(-hw, hh, 0),
            App.Vector(-hw, -hh, 0),
        ]
        return Part.makePolygon(pts)

    p0 = App.Vector(-hw + r, -hh, 0)
    p1 = App.Vector(hw - r, -hh, 0)
    c1 = App.Vector(hw - r, -hh + r, 0)
    p2 = App.Vector(hw, -hh + r, 0)
    p3 = App.Vector(hw, hh - r, 0)
    c2 = App.Vector(hw - r, hh - r, 0)
    p4 = App.Vector(hw - r, hh, 0)
    p5 = App.Vector(-hw + r, hh, 0)
    c3 = App.Vector(-hw + r, hh - r, 0)
    p6 = App.Vector(-hw, hh - r, 0)
    p7 = App.Vector(-hw, -hh + r, 0)
    c4 = App.Vector(-hw + r, -hh + r, 0)

    edges = [
        Part.LineSegment(p0, p1).toShape(),
        Part.Arc(p1, App.Vector(hw - r + r * math.cos(-math.pi / 4), -hh + r + r * math.sin(-math.pi / 4), 0), p2).toShape(),
        Part.LineSegment(p2, p3).toShape(),
        Part.Arc(p3, App.Vector(hw - r + r * math.cos(math.pi / 4), hh - r + r * math.sin(math.pi / 4), 0), p4).toShape(),
        Part.LineSegment(p4, p5).toShape(),
        Part.Arc(p5, App.Vector(-hw + r + r * math.cos(3 * math.pi / 4), hh - r + r * math.sin(3 * math.pi / 4), 0), p6).toShape(),
        Part.LineSegment(p6, p7).toShape(),
        Part.Arc(p7, App.Vector(-hw + r + r * math.cos(5 * math.pi / 4), -hh + r + r * math.sin(5 * math.pi / 4), 0), p0).toShape(),
    ]
    return Part.Wire(edges)


def compute_hole_centers(geom, holes):
    centers = holes.get("centers")
    if isinstance(centers, list) and len(centers) > 0:
        return [(float(c.get("x", 0.0)), float(c.get("y", 0.0))) for c in centers]

    L = float(geom.get("length", 80.0))
    W = float(geom.get("width", 80.0))
    layout = holes.get("layout", "center")
    count = int(holes.get("lineCount", 3))
    spread = float(holes.get("spread", 50.0)) / 100.0

    if layout == "line-x":
        span = max(6.0, L * 0.75 * spread)
        step = span / (count - 1) if count > 1 else 0.0
        return [(-span / 2.0 + i * step, 0.0) for i in range(count)]
    if layout == "line-y":
        span = max(6.0, W * 0.75 * spread)
        step = span / (count - 1) if count > 1 else 0.0
        return [(0.0, -span / 2.0 + i * step) for i in range(count)]

    grid_map = {
        "grid-2x2": (2, 2),
        "grid-2x3": (2, 3),
        "grid-3x2": (3, 2),
        "grid-3x3": (3, 3),
        "grid-4x4": (4, 4),
    }
    if layout in grid_map:
        rows, cols = grid_map[layout]
        span_x = max(8.0, L * 0.7 * spread)
        span_y = max(8.0, W * 0.7 * spread)
        step_x = span_x / (cols - 1) if cols > 1 else 0.0
        step_y = span_y / (rows - 1) if rows > 1 else 0.0
        pts = []
        for r in range(rows):
            for c in range(cols):
                pts.append((-span_x / 2.0 + c * step_x, -span_y / 2.0 + r * step_y))
        return pts

    return [(0.0, 0.0)]


def build_base_solid(geom, holes):
    L = float(geom.get("length", 80.0))
    W = float(geom.get("width", 80.0))
    H = float(geom.get("height", 80.0))
    fillet = float(geom.get("fillet", 0.0))
    slope_deg = float(geom.get("topSlope", 0.0))
    slope_axis = geom.get("slopeAxis", "x")

    outer_wire = make_rounded_rect_wire(L, W, fillet)
    solid = Part.Face(outer_wire).extrude(App.Vector(0, 0, H))

    # Apply top slope along X or Y if non-zero
    if abs(slope_deg) > 1e-4:
        tan_val = math.tan(math.radians(slope_deg))
        # Build a large wedge/cutter above or below the sloped plane
        span = max(L, W) * 3.0
        if slope_axis == "x":
            # Plane z = H + x * tan_val
            p1 = App.Vector(-span, -span, H - span * abs(tan_val) - 50.0)
            p2 = App.Vector(span, -span, H - span * abs(tan_val) - 50.0)
            p3 = App.Vector(span, -span, max(1.0, H + span * tan_val))
            p4 = App.Vector(-span, -span, max(1.0, H - span * tan_val))
        else:
            p1 = App.Vector(-span, -span, max(1.0, H - span * tan_val))
            p2 = App.Vector(-span, span, max(1.0, H + span * tan_val))
            p3 = App.Vector(-span, span, H - span * abs(tan_val) - 50.0)
            p4 = App.Vector(-span, -span, H - span * abs(tan_val) - 50.0)
        prism_wire = Part.makePolygon([p1, p2, p3, p4, p1])
        cutter = Part.Face(prism_wire).extrude(App.Vector(0, 0, span * 2.0) if slope_axis == "x" else App.Vector(span * 2.0, 0, 0))
        if slope_axis != "x":
            cutter.translate(App.Vector(-span, 0, 0))
        else:
            cutter.translate(App.Vector(0, -span, 0))
        try:
            solid = solid.common(cutter)
        except Exception as e:
            App.Console.PrintWarning(f"Уклон верха пропущен из-за геометрии: {e}\n")

    # Subtract holes
    h_shape = holes.get("shape", "round")
    depth_type = holes.get("depthType", "through")
    sx = float(holes.get("sizeX", 15.0))
    sy = float(holes.get("sizeY", sx)) if h_shape == "rect" else sx
    blind_depth = float(holes.get("depth", 20.0))
    cut_depth = (H + 20.0) if depth_type == "through" else min(H - 1.0, max(0.5, blind_depth))

    for cx, cy in compute_hole_centers(geom, holes):
        if h_shape == "round":
            radius = max(0.5, sx / 2.0)
            tool = Part.makeCylinder(radius, cut_depth, App.Vector(cx, cy, H - cut_depth + 5.0 if depth_type != "through" else -10.0))
        else:
            hx = max(1.0, sx)
            hy = max(1.0, sy)
            box = Part.makeBox(hx, hy, cut_depth, App.Vector(cx - hx / 2.0, cy - hy / 2.0, H - cut_depth + 5.0 if depth_type != "through" else -10.0))
            tool = box
        try:
            solid = solid.cut(tool)
        except Exception as e:
            App.Console.PrintWarning(f"Отверстие в ({cx}, {cy}) не вычлось: {e}\n")

    return solid


def get_face_frame(geom, side):
    L = float(geom.get("length", 80.0))
    W = float(geom.get("width", 80.0))
    H = float(geom.get("height", 80.0))

    # Map configurator sides to FreeCAD Z-up coordinates
    if side == "bottom":
        return App.Vector(0, 0, 0), App.Vector(1, 0, 0), App.Vector(0, 1, 0), App.Vector(0, 0, -1), L, W
    if side == "front":
        return App.Vector(0, -W / 2.0, H / 2.0), App.Vector(1, 0, 0), App.Vector(0, 0, 1), App.Vector(0, -1, 0), L, H
    if side == "back":
        return App.Vector(0, W / 2.0, H / 2.0), App.Vector(-1, 0, 0), App.Vector(0, 0, 1), App.Vector(0, 1, 0), L, H
    if side == "right":
        return App.Vector(L / 2.0, 0, H / 2.0), App.Vector(0, 1, 0), App.Vector(0, 0, 1), App.Vector(1, 0, 0), W, H
    if side == "left":
        return App.Vector(-L / 2.0, 0, H / 2.0), App.Vector(0, -1, 0), App.Vector(0, 0, 1), App.Vector(-1, 0, 0), W, H
    # Default: top
    return App.Vector(0, 0, H), App.Vector(1, 0, 0), App.Vector(0, 1, 0), App.Vector(0, 0, 1), L, W


def find_font_file():
    candidates = [
        "C:/Windows/Fonts/arial.ttf",
        "C:/Windows/Fonts/DejaVuSans.ttf",
        "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",
        "/System/Library/Fonts/Supplemental/Arial.ttf",
        "/Library/Fonts/Arial.ttf",
    ]
    for p in candidates:
        if os.path.exists(p):
            return p
    return ""


def run():
    params = load_parameters()
    geom = params.get("geometry", {})
    holes = params.get("holes", {})
    text_cfg = params.get("text", {})
    pad_cfg = params.get("pad", {})
    color_hex = params.get("colorHex", "#2563EB")

    doc_name = "ConfiguredModel"
    doc = App.activeDocument()
    if doc is None or doc.Name != doc_name:
        doc = App.newDocument(doc_name)

    model_shape = build_base_solid(geom, holes)

    side = text_cfg.get("side", "top")
    origin, u_vec, v_vec, n_vec, span_u, span_v = get_face_frame(geom, side)

    text_str = str(text_cfg.get("content", "")).strip()
    text_size = float(text_cfg.get("size", 18.0))
    text_depth = float(text_cfg.get("depth", 2.0))
    pos_x = float(text_cfg.get("posX", 0.0))
    pos_y = float(text_cfg.get("posY", 0.0))

    offset_u = (pos_x / 100.0) * (span_u * 0.35)
    offset_v = (pos_y / 100.0) * (span_v * 0.35)

    # Optional pad
    if pad_cfg.get("enabled", False):
        pad_l = float(pad_cfg.get("length", 44.0))
        pad_w = float(pad_cfg.get("width", 26.0))
        pad_h = max(0.5, float(pad_cfg.get("height", 6.0)))
        pad_center = origin + u_vec * offset_u + v_vec * offset_v - n_vec * 0.2
        pad_box = Part.makeBox(pad_l, pad_w, pad_h + 0.2, App.Vector(-pad_l / 2.0, -pad_w / 2.0, 0.0))
        # Align local Z to n_vec and X/Y to u_vec/v_vec
        rot = App.Matrix()
        rot.A = App.Vector(u_vec.x, v_vec.x, n_vec.x, 0)
        rot.B = App.Vector(u_vec.y, v_vec.y, n_vec.y, 0)
        rot.C = App.Vector(u_vec.z, v_vec.z, n_vec.z, 0)
        placement = App.Placement(pad_center, App.Rotation(rot))
        pad_box.transformShape(placement.toMatrix())
        try:
            model_shape = model_shape.fuse(pad_box)
        except Exception as e:
            App.Console.PrintWarning(f"Не удалось объединить подложку: {e}\n")

    # 3D Text via Part.makeWireString
    if text_str and abs(text_depth) >= 0.05:
        font_path = find_font_file()
        try:
            wires_list = Part.makeWireString(text_str, font_path, text_size, 0.0)
            faces = []
            for char_wires in wires_list:
                if not char_wires:
                    continue
                # Center roughly around (0, 0)
                for w in char_wires:
                    try:
                        faces.append(Part.Face(w))
                    except Exception:
                        pass
            if faces:
                comp_face = Part.Compound(faces)
                bb = comp_face.BoundBox
                cx_t = (bb.XMin + bb.XMax) * 0.5
                cy_t = (bb.YMin + bb.YMax) * 0.5
                comp_face.translate(App.Vector(-cx_t, -cy_t, 0.0))

                ext_len = abs(text_depth)
                text_solid = comp_face.extrude(App.Vector(0, 0, ext_len))

                rot = App.Matrix()
                rot.A = App.Vector(u_vec.x, v_vec.x, n_vec.x, 0)
                rot.B = App.Vector(u_vec.y, v_vec.y, n_vec.y, 0)
                rot.C = App.Vector(u_vec.z, v_vec.z, n_vec.z, 0)

                if text_depth > 0:
                    start_pt = origin + u_vec * offset_u + v_vec * offset_v - n_vec * 0.05
                    placement = App.Placement(start_pt, App.Rotation(rot))
                    text_solid.transformShape(placement.toMatrix())
                    model_shape = model_shape.fuse(text_solid)
                else:
                    # Cut inward along -n_vec
                    cut_origin = origin + u_vec * offset_u + v_vec * offset_v - n_vec * ext_len
                    placement = App.Placement(cut_origin, App.Rotation(rot))
                    text_solid.transformShape(placement.toMatrix())
                    model_shape = model_shape.cut(text_solid)
        except Exception as e:
            App.Console.PrintWarning(f"Не удалось построить 3D-текст в FreeCAD: {e}\n")

    obj = doc.addObject("Part::Feature", "ConfiguredPart")
    obj.Label = f"Block_{int(geom.get('length',80))}x{int(geom.get('width',80))}x{int(geom.get('height',80))}"
    obj.Shape = model_shape

    if HAS_GUI:
        try:
            rgb = tuple(int(color_hex.lstrip("#")[i:i+2], 16) / 255.0 for i in (0, 2, 4))
            obj.ViewObject.ShapeColor = (*rgb, 0.0)
        except Exception:
            pass
        Gui.SendMsgToActiveView("ViewFit")

    doc.recompute()
    App.Console.PrintMessage("Модель успешно построена по параметрам конфигуратора.\n")


if __name__ == "__main__":
    run()

    function handleViewportResize() {
      const w = container.clientWidth;
      const h = container.clientHeight;
      if (w > 0 && h > 0) {
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h, false);
      }
    }

    const resizeObserver = new ResizeObserver(handleViewportResize);
    resizeObserver.observe(container);
    window.addEventListener('resize', handleViewportResize);
    requestAnimationFrame(handleViewportResize);

    updateSpreadVisibility();
    rebuildModel();

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
