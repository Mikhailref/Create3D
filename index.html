<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3D CAD Catalog & Configurator</title>
<style>
  :root {
    --bg-app: #e7ecf2;
    --bg-panel: #ffffff;
    --bg-subtle: #f4f7fa;
    --bg-cad: #dce3ec;
    --text-main: #0f172a;
    --text-muted: #475569;
    --border: #cbd5e1;
    --accent: #0284c7;
    --accent-hover: #0369a1;
    --accent-soft: #e0f2fe;
    --lang-bg: #dc2626;
    --lang-hover: #b91c1c;
    --lang-active: #991b1b;
    --lang-border: #fca5a5;
    --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.06);
    --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.12);
    --panel-w: 360px;
    --scene-h-mobile: 46dvh;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg-app);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Heebo", "Arial", sans-serif;
    overflow: hidden;
  }

  .app-shell {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
  }

  /* Top Bar */
  .topbar {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 14px;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    z-index: 30;
    flex-shrink: 0;
    flex-wrap: nowrap;
  }

  .brand-group {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .brand-titles {
    min-width: 0;
  }

  .brand-title {
    font-size: 15px;
    font-weight: 700;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .brand-subtitle {
    font-size: 11.5px;
    color: var(--text-muted);
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .topbar-right-group {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    flex-wrap: nowrap;
    min-width: 0;
  }

  /* High-visibility Red Language Switcher */
  .lang-switcher {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px;
    border-radius: 10px;
    background: #fef2f2;
    border: 2px solid var(--lang-bg);
    box-shadow: 0 0 0 2px rgba(220, 38, 38, 0.16);
  }

  .lang-btn {
    border: 1px solid transparent;
    background: var(--lang-bg);
    color: #ffffff;
    font-weight: 800;
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 7px;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.15s ease, box-shadow 0.15s ease;
    line-height: 1;
  }

  .lang-btn:hover {
    background: var(--lang-hover);
    transform: translateY(-1px);
  }

  .lang-btn.active {
    background: var(--lang-active);
    border-color: var(--lang-border);
    box-shadow: 0 2px 8px rgba(153, 27, 27, 0.45), inset 0 0 0 1px rgba(255, 255, 255, 0.35);
    transform: scale(1.03);
  }

  .menu-anchor {
    position: relative;
    display: inline-flex;
    align-items: center;
    flex-shrink: 0;
  }

  .menu-hamburger-btn {
    width: 36px;
    height: 36px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--bg-subtle);
    color: var(--text-main);
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    cursor: pointer;
    padding: 0;
    flex-shrink: 0;
    transition: all 0.15s ease;
  }

  .menu-hamburger-btn:hover,
  .menu-hamburger-btn.open {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent-hover);
  }

  .menu-hamburger-line {
    width: 17px;
    height: 2px;
    border-radius: 999px;
    background: currentColor;
    display: block;
  }

  .nav-menu-popover {
    position: absolute;
    top: calc(100% + 8px);
    inset-inline-start: 0;
    min-width: 185px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow-md);
    padding: 6px;
    display: none;
    flex-direction: column;
    gap: 4px;
    z-index: 80;
  }

  .nav-menu-popover.open {
    display: flex;
  }

  .nav-menu-item {
    width: 100%;
    border: none;
    background: transparent;
    color: var(--text-main);
    font-size: 13px;
    font-weight: 700;
    padding: 9px 12px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    text-align: inherit;
    transition: background 0.14s ease, color 0.14s ease;
  }

  .nav-menu-item:hover {
    background: var(--accent-soft);
    color: var(--accent-hover);
  }

  .topbar-cart-slot {
    display: inline-flex;
    align-items: center;
    flex-shrink: 0;
  }

  .cart-nav-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--bg-subtle);
    color: var(--text-main);
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .cart-nav-btn:hover {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent-hover);
  }

  .cart-top-corner-btn {
    position: static;
    box-shadow: var(--shadow-sm);
    flex-shrink: 0;
  }

  .cart-badge {
    min-width: 18px;
    height: 18px;
    padding: 0 5px;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    font-size: 11px;
    font-weight: 800;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }

  /* Catalog View */
  #catalog-view {
    flex: 1;
    overflow-y: auto;
    padding: 18px 16px 32px;
  }

  .catalog-inner {
    max-width: 1240px;
    margin: 0 auto;
  }

  .catalog-header {
    margin-bottom: 16px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .catalog-header h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 800;
    color: var(--text-main);
  }

  .catalog-header p {
    margin: 4px 0 0;
    font-size: 13px;
    color: var(--text-muted);
  }

  .catalog-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }

  .model-card {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
    text-align: inherit;
  }

  .model-card:hover {
    transform: translateY(-3px);
    border-color: var(--accent);
    box-shadow: var(--shadow-md);
  }

  .model-thumb {
    width: 100%;
    height: 128px;
    border-radius: 10px;
    background: linear-gradient(180deg, #eef2f7 0%, #dce3ec 100%);
    border: 1px solid #d5dde7;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  .model-thumb svg {
    width: 118px;
    height: 118px;
    filter: drop-shadow(0 6px 10px rgba(15, 23, 42, 0.16));
  }

  .model-card-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-main);
    line-height: 1.3;
  }

  .model-card-tag {
    align-self: flex-start;
    font-size: 11px;
    font-weight: 600;
    color: var(--accent-hover);
    background: var(--accent-soft);
    padding: 3px 8px;
    border-radius: 999px;
  }

  /* Editor View */
  #editor-view {
    flex: 1;
    display: none;
    min-height: 0;
    height: 100%;
    overflow: hidden;
  }

  #editor-view.active {
    display: flex;
    flex-direction: row;
  }

  .viewport-pane {
    position: relative;
    flex: 1;
    min-width: 0;
    min-height: 0;
    background: linear-gradient(180deg, #e9eef4 0%, #d4dce6 100%);
    overflow: hidden;
  }

  #three-canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  .scene-top-bar {
    position: absolute;
    top: 10px;
    inset-inline-end: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
    z-index: 15;
    flex-wrap: wrap;
  }

  .scene-chip-btn {
    border: 1px solid rgba(15, 23, 42, 0.16);
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(8px);
    color: var(--text-main);
    font-size: 12px;
    font-weight: 700;
    padding: 6px 10px;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.1);
    transition: all 0.14s ease;
  }

  .scene-chip-btn:hover,
  .scene-chip-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  /* HUD Overlays */
  .hud-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.18s ease, visibility 0.18s ease;
    z-index: 10;
  }

  .hud-layer.visible {
    opacity: 1;
    visibility: visible;
  }

  .hud-info-card {
    position: absolute;
    top: 10px;
    inset-inline-start: 10px;
    max-width: min(320px, calc(100% - 190px));
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(15, 23, 42, 0.14);
    border-radius: 10px;
    padding: 8px 12px;
    box-shadow: 0 4px 14px rgba(15, 23, 42, 0.1);
    pointer-events: auto;
  }

  .hud-model-name {
    font-size: 13.5px;
    font-weight: 800;
    color: var(--text-main);
    line-height: 1.25;
  }

  .hud-dims {
    margin-top: 3px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--accent-hover);
    direction: ltr;
    text-align: inherit;
  }

  .hud-bottom-bar {
    position: absolute;
    bottom: 10px;
    inset-inline: 10px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }

  .hud-group {
    pointer-events: auto;
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(15, 23, 42, 0.14);
    border-radius: 10px;
    padding: 5px 7px;
    box-shadow: 0 4px 14px rgba(15, 23, 42, 0.1);
  }

  .hud-btn {
    border: 1px solid #cbd5e1;
    background: #fff;
    color: var(--text-main);
    font-size: 11px;
    font-weight: 700;
    padding: 5px 8px;
    border-radius: 7px;
    cursor: pointer;
    transition: all 0.12s ease;
  }

  .hud-btn:hover,
  .hud-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .hud-axes {
    font-size: 11px;
    font-weight: 800;
    padding: 0 4px;
    letter-spacing: 0.5px;
    direction: ltr;
  }

  .axis-x { color: #dc2626; }
  .axis-y { color: #16a34a; }
  .axis-z { color: #2563eb; }

  /* Controls Panel */
  .controls-pane {
    position: relative;
    width: var(--panel-w);
    flex-shrink: 0;
    background: var(--bg-panel);
    border-inline-start: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 0;
    z-index: 20;
    transition: width 0.16s ease;
  }

  .controls-pane.collapsed {
    display: none;
  }

  .top-resize-handle {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    min-height: 54px;
    padding: 8px 14px;
    width: 100%;
    background: var(--bg-subtle);
    border-bottom: 1px solid var(--border);
    cursor: ns-resize;
    touch-action: none;
    user-select: none;
    flex-shrink: 0;
  }

  .top-resize-handle:hover .resize-pill,
  .top-resize-handle.dragging .resize-pill {
    background: var(--accent);
    width: 56px;
  }

  .resize-pill {
    width: 44px;
    height: 4px;
    border-radius: 999px;
    background: #94a3b8;
    transition: width 0.14s ease, background 0.14s ease;
  }

  .panel-header-title {
    font-size: 14px;
    font-weight: 800;
    color: var(--text-main);
  }

  .panel-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .section-box {
    background: var(--bg-subtle);
    border: 1px solid #e2e8f0;
    border-radius: 11px;
    padding: 10px 12px;
  }

  .section-header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
  }

  .section-header-row .section-label {
    margin-bottom: 0;
  }

  .section-label {
    font-size: 11.5px;
    font-weight: 800;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-bottom: 8px;
  }

  .unit-switch-group {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 2px;
    border-radius: 7px;
    background: #e2e8f0;
    border: 1px solid var(--border);
    direction: ltr;
    flex-shrink: 0;
  }

  .unit-switch-btn {
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 800;
    padding: 3px 7px;
    border-radius: 5px;
    cursor: pointer;
    line-height: 1.1;
    transition: all 0.14s ease;
  }

  .unit-switch-btn.active {
    background: var(--accent);
    color: #ffffff;
    box-shadow: 0 1px 4px rgba(2, 132, 199, 0.25);
  }

  .param-item {
    margin-bottom: 10px;
  }

  .param-item:last-child {
    margin-bottom: 0;
  }

  .param-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 4px;
  }

  .param-name {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-main);
  }

  .param-val-group {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    direction: ltr;
    flex-shrink: 0;
  }

  .param-num-input {
    width: 68px;
    padding: 3px 6px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #ffffff;
    color: var(--accent-hover);
    font-size: 12px;
    font-weight: 800;
    text-align: center;
    direction: ltr;
  }

  .param-num-input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-soft);
  }

  .param-unit {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--text-muted);
    min-width: 18px;
  }

  .range-safe-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .range-safe-pad {
    min-width: 34px;
    padding: 0 4px;
    flex-shrink: 0;
    align-self: center;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 800;
    color: var(--text-muted);
    background: #e2e8f0;
    border-radius: 6px;
    user-select: none;
  }

  input[type="range"] {
    flex: 1;
    min-width: 0;
    width: auto;
    accent-color: var(--accent);
    cursor: pointer;
    height: 6px;
    margin: 6px 0;
    touch-action: pan-y;
  }

  .toast-msg {
    font-size: 11.5px;
    font-weight: 700;
    color: #15803d;
    padding: 0 14px 6px;
    min-height: 0;
    background: var(--bg-subtle);
  }

  /* Bottom Bar with Small Circular Palette Popover */
  .panel-footer {
    position: relative;
    padding: 10px 14px;
    border-top: 1px solid var(--border);
    background: var(--bg-subtle);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .palette-anchor {
    position: relative;
    flex-shrink: 0;
  }

  .palette-circle-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 2.5px solid #ffffff;
    box-shadow: 0 0 0 1.5px #64748b, 0 2px 8px rgba(15, 23, 42, 0.16);
    cursor: pointer;
    transition: transform 0.14s ease, box-shadow 0.14s ease;
    background: #94a3b8;
  }

  .palette-circle-btn:hover {
    transform: scale(1.08);
  }

  .palette-circle-btn.open {
    box-shadow: 0 0 0 2.5px var(--accent), 0 4px 12px rgba(2, 132, 199, 0.3);
  }

  .palette-popover {
    position: absolute;
    bottom: calc(100% + 10px);
    inset-inline-start: 0;
    display: none;
    align-items: center;
    gap: 7px;
    padding: 8px 10px;
    border-radius: 999px;
    background: #ffffff;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-md);
    z-index: 40;
    white-space: nowrap;
  }

  .palette-popover.open {
    display: flex;
  }

  .swatch-btn {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid #fff;
    box-shadow: 0 0 0 1.5px #94a3b8;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    flex-shrink: 0;
  }

  .swatch-btn:hover {
    transform: scale(1.14);
  }

  .swatch-btn.active {
    transform: scale(1.18);
    box-shadow: 0 0 0 2.5px var(--accent);
  }

  .btn-secondary,
  .btn-primary {
    border-radius: 9px;
    padding: 9px 10px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.14s ease;
    border: none;
    flex: 1;
  }

  .btn-secondary {
    background: #fff;
    color: var(--text-main);
    border: 1px solid var(--border);
  }

  .btn-secondary:hover {
    background: #f1f5f9;
  }

  .btn-primary {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 3px 10px rgba(2, 132, 199, 0.25);
  }

  .btn-primary:hover {
    background: var(--accent-hover);
  }

  /* Fixed Left-Edge Centered WhatsApp Button on All Screens */
  .wa-edge-btn {
    position: fixed;
    left: 6px;
    top: 50%;
    transform: translateY(-50%);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 2px solid #ffffff;
    background: #22c55e;
    color: #ffffff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(22, 163, 74, 0.38), 0 0 0 1.5px #16a34a;
    transition: transform 0.14s ease, background 0.14s ease, box-shadow 0.14s ease;
    z-index: 65;
    padding: 0;
  }

  .wa-edge-btn:hover {
    background: #16a34a;
    transform: translateY(-50%) scale(1.07);
    box-shadow: 0 6px 18px rgba(22, 163, 74, 0.48), 0 0 0 1.5px #15803d;
  }

  /* Cart Modal */
  .cart-modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.48);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 100;
  }

  .cart-modal-backdrop.open {
    display: flex;
  }

  .cart-modal {
    width: 100%;
    max-width: 520px;
    max-height: 86dvh;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow-md);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .cart-modal-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-subtle);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .cart-modal-title {
    font-size: 15px;
    font-weight: 800;
    color: var(--text-main);
  }

  .cart-close-btn {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text-main);
    width: 30px;
    height: 30px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    display: grid;
    place-items: center;
  }

    background: #f1f5f9;
  }

  .cart-modal-body {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .cart-empty {
    text-align: center;
    padding: 28px 12px;
    color: var(--text-muted);
    font-size: 13.5px;
    font-weight: 600;
  }

  .cart-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    background: var(--bg-subtle);
  }

  .cart-item-thumb {
    width: 66px;
    height: 66px;
    border-radius: 10px;
    border: 1px solid #cbd5e1;
    background: #eef2f7;
    overflow: hidden;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .cart-item-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .cart-item-meta {
    flex: 1;
    min-width: 0;
  }

  .cart-item-name {
    font-size: 13.5px;
    font-weight: 800;
    color: var(--text-main);
    line-height: 1.25;
  }

  .cart-item-file {
    font-size: 11px;
    font-weight: 700;
    color: var(--accent-hover);
    margin-top: 2px;
    direction: ltr;
    text-align: inherit;
    word-break: break-all;
  }

  .cart-item-params {
    font-size: 11.5px;
    color: var(--text-muted);
    margin-top: 4px;
    line-height: 1.35;
  }

  .cart-qty-box {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
    direction: ltr;
  }

  .cart-qty-btn {
    width: 24px;
    height: 24px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #ffffff;
    color: var(--text-main);
    font-size: 13px;
    font-weight: 800;
    line-height: 1;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .cart-qty-btn:hover {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent-hover);

  .cart-qty-num {
    min-width: 20px;

    font-size: 12.5px;
    font-weight: 800;

  }

  .cart-item-actions {
    display: flex;
    flex-direction: column;
    gap: 5px;
    flex-shrink: 0;
  }

  .cart-mini-btn {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text-main);
    font-size: 11px;
    font-weight: 700;
    padding: 4px 8px;
    border-radius: 7px;
    cursor: pointer;

  .cart-mini-btn:hover {
    background: #f1f5f9;
  }

    border-color: #fca5a5;
    color: #b91c1c;

    padding: 12px 16px;
    border-top: 1px solid var(--border);
    background: var(--bg-subtle);

    align-items: center;
    gap: 8px;
    flex-wrap: wrap;

    min-width: 180px;
    border: none;
    border-radius: 10px;
    padding: 10px 14px;

    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    display: inline-flex;
    align-items: center;

    background: #15803d;
    transform: translateY(-1px);
  }

  /* Mobile Split Layout */
  @media (max-width: 820px) {

      width: 100%;

    .model-thumb svg {
      width: 94px;
      height: 94px;
    }

      left: 4px;

      height: 38px;

      padding: 6px 9px;
      font-size: 11.5px;

<script type="module">
window.addEventListener('error', (ev) => {
  const errBox = document.getElementById('viewport-error-banner');
  if (errBox && ev && ev.message) {
    errBox.style.display = 'block';
    errBox.textContent = ev.message;
  }
});

let THREE, OrbitControls;
try {
  THREE = await import('three');
  const controlsMod = await import('three/addons/controls/OrbitControls.js');
  OrbitControls = controlsMod.OrbitControls;
} catch (err) {
  const errBox = document.getElementById('viewport-error-banner');
  if (errBox) {
    errBox.style.display = 'block';
    errBox.textContent = '3D engine load error: ' + (err && err.message ? err.message : String(err));
  }
  throw err;
}

const SWATCH_COLORS = ['#94a3b8', '#38bdf8', '#f59e0b', '#10b981', '#ef4444', '#6366f1', '#334155'];

let currentLang = 'he';
let lengthUnit = 'mm'; // 'mm' | 'cm'
let activeModelId = null;
let currentColor = '#94a3b8';
let modelParamsMap = {};
// Custom transformed slider bounds per [modelId][paramKey] when user enters a manual value
let customSliderBoundsMap = {};

MODEL_DEFS.forEach((m) => {
  modelParamsMap[m.id] = {};
  customSliderBoundsMap[m.id] = {};
  m.schema.forEach((p) => {
    modelParamsMap[m.id][p.key] = p.def;
  });
});

function isLengthParam(item) {
  return item.unit === 'mm';
}

function getUnitLabel(item, lang = currentLang) {
  const t = I18N[lang];
  if (item.unit === 'mm') {
    return lengthUnit === 'cm' ? t.unitCm : t.unitMm;
  }
  if (item.unit === 'deg') {
    return t.unitDeg;
  }
  return '';
}

function roundToTwoDecimals(num) {
  return Math.round(num * 100) / 100;
}

function mmToDisplay(mmVal, item) {
  if (!isLengthParam(item)) return roundToTwoDecimals(mmVal);
  if (lengthUnit === 'cm') {
    return roundToTwoDecimals(mmVal / 10);
  }
  return roundToTwoDecimals(mmVal);
}

function displayToMm(dispVal, item) {
  if (!isLengthParam(item)) return dispVal;
  if (lengthUnit === 'cm') {
    return dispVal * 10;
  }
  return dispVal;
}

function getDefaultDisplayBounds(item) {
  if (!isLengthParam(item)) {
    return { min: item.min, max: item.max, step: item.step };
  }
  if (lengthUnit === 'cm') {
    return {
      min: roundToTwoDecimals(item.min / 10),
      max: roundToTwoDecimals(item.max / 10),
      step: 0.01
    };
  }
  return { min: item.min, max: item.max, step: item.step };
}

function getEffectiveDisplayBounds(modelId, item) {
  const base = getDefaultDisplayBounds(item);
  const custom = customSliderBoundsMap[modelId]?.[item.key];
  if (!custom) return base;
  return {
    min: custom.min,
    max: custom.max,
    step: isLengthParam(item) && lengthUnit === 'cm' ? 0.01 : base.step
  };
}

function transformRangeAroundValue(modelId, item, typedDispVal) {
  const base = getDefaultDisplayBounds(item);
  const halfSpan = Math.max((base.max - base.min) / 2, isLengthParam(item) && lengthUnit === 'cm' ? 1 : 5);
  const minBound = isLengthParam(item) && item.min >= 0 ? 0 : -Infinity;
  const nextMin = roundToTwoDecimals(Math.max(minBound, typedDispVal - halfSpan));
  const nextMax = roundToTwoDecimals(Math.max(nextMin + halfSpan * 2, typedDispVal + halfSpan));
  if (!customSliderBoundsMap[modelId]) customSliderBoundsMap[modelId] = {};
  customSliderBoundsMap[modelId][item.key] = { min: nextMin, max: nextMax };
  return {
    min: nextMin,
    max: nextMax,
    step: isLengthParam(item) && lengthUnit === 'cm' ? 0.01 : base.step
  };
}

function formatDisplayNumber(val, item) {
  if (!isLengthParam(item)) return String(roundToTwoDecimals(val));
  if (lengthUnit === 'cm') {
    return roundToTwoDecimals(val / 10).toFixed(2);
  }
  return String(roundToTwoDecimals(val));
}

function formatManualInputNumber(dispVal, item) {
  if (!isLengthParam(item)) return String(roundToTwoDecimals(dispVal));
  if (lengthUnit === 'cm') {
    return roundToTwoDecimals(dispVal).toFixed(2);
  }
  return String(roundToTwoDecimals(dispVal));
}

let currentMaterial = new THREE.MeshStandardMaterial({
  color: currentColor,
  roughness: 0.34,
  metalness: 0.16,
  side: THREE.DoubleSide,
  clippingPlanes: []
});

const metalAccentMat = new THREE.MeshStandardMaterial({
  color: 0x64748b,
  roughness: 0.28,
  metalness: 0.68,
  side: THREE.DoubleSide,
  clippingPlanes: []
});

const edgeMat = new THREE.LineBasicMaterial({ color: 0x0f172a, transparent: true, opacity: 0.68 });

function clearGroup(grp) {
  while (grp.children.length > 0) {
    const child = grp.children[0];
    if (child.geometry) child.geometry.dispose();
    grp.remove(child);
  }
}

function addPart(geometry, mat = currentMaterial, pos = [0, 0, 0], rot = [0, 0, 0]) {
  const mesh = new THREE.Mesh(geometry, mat);
  mesh.position.set(pos[0], pos[1], pos[2]);
  mesh.rotation.set(rot[0], rot[1], rot[2]);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  modelGroup.add(mesh);

  const edges = new THREE.EdgesGeometry(geometry, 18);
  const line = new THREE.LineSegments(edges, edgeMat);
  line.position.copy(mesh.position);
  line.rotation.copy(mesh.rotation);
  line.visible = showEdges;
  edgesGroup.add(line);
  return mesh;
}

function makeRoundedRectShape(w, h, r) {
  const hw = w / 2;
  const hh = h / 2;
  const rad = Math.max(0.5, Math.min(r, hw * 0.45, hh * 0.45));
  const s = new THREE.Shape();
  s.moveTo(-hw + rad, -hh);
  s.lineTo(hw - rad, -hh);
  s.quadraticCurveTo(hw, -hh, hw, -hh + rad);
  s.lineTo(hw, hh - rad);
  s.quadraticCurveTo(hw, hh, hw - rad, hh);
  s.lineTo(-hw + rad, hh);
  s.quadraticCurveTo(-hw, hh, -hw, hh - rad);
  s.lineTo(-hw, -hh + rad);
  s.quadraticCurveTo(-hw, -hh, -hw + rad, -hh);
  return s;
}

function buildModelGeometry(modelId, p) {
  clearGroup(modelGroup);
  clearGroup(edgesGroup);

  if (modelId === 'vise') {
    const w = p.jawWidth;
    const h = p.jawHeight;
    const open = p.jawOpening;
    const t = p.wallThick;
    const rDia = p.railDia;
    const baseLen = Math.max(78, open + 56);

    addPart(new THREE.BoxGeometry(baseLen, t, w), currentMaterial, [0, t / 2, 0]);
    addPart(new THREE.BoxGeometry(t + 7, h, w), currentMaterial, [-baseLen / 2 + (t + 7) / 2, t + h / 2 - 2, 0]);
    addPart(new THREE.BoxGeometry(10, 4, w + 12), currentMaterial, [-baseLen / 2 + 5, 2, 0]);

    const slideX = -baseLen / 2 + 24 + open;
    addPart(new THREE.BoxGeometry(t + 7, h * 0.86, w * 0.9), currentMaterial, [slideX, t + (h * 0.86) / 2 - 2, 0]);
    addPart(new THREE.BoxGeometry(2.5, h * 0.65, w * 0.78), metalAccentMat, [-baseLen / 2 + t + 7.8, t + h * 0.45, 0]);
    addPart(new THREE.BoxGeometry(2.5, h * 0.6, w * 0.74), metalAccentMat, [slideX - (t + 7) / 2 - 1.2, t + h * 0.42, 0]);

    const rodLen = baseLen + 28;
    const zOff = w * 0.32;
    addPart(new THREE.CylinderGeometry(rDia / 2, rDia / 2, rodLen, 22), metalAccentMat, [8, t + rDia / 2 + 1, -zOff], [0, 0, Math.PI / 2]);
    addPart(new THREE.CylinderGeometry(rDia / 2, rDia / 2, rodLen, 22), metalAccentMat, [8, t + rDia / 2 + 1, zOff], [0, 0, Math.PI / 2]);

    const screwY = t + h * 0.46;
    addPart(new THREE.CylinderGeometry(4.6, 4.6, baseLen * 0.86, 20), metalAccentMat, [slideX + 26, screwY, 0], [0, 0, Math.PI / 2]);
    const handleX = slideX + 26 + baseLen * 0.43;
    addPart(new THREE.CylinderGeometry(3.4, 3.4, w * 0.96, 18), currentMaterial, [handleX, screwY, 0], [Math.PI / 2, 0, 0]);
  } else if (modelId === 'clevis') {
    const len = p.baseLen;
    const wid = p.baseWidth;
    const thk = p.baseThick;
    const earH = p.earHeight;
    const pinR = p.pinDia / 2;

    const baseShape = makeRoundedRectShape(len, wid, wid * 0.42);
    const slotW = Math.min(len * 0.34, 24);
    const slotH = Math.min(wid * 0.36, 10);
    const slotHole = new THREE.Path();
    slotHole.absellipse(len * 0.22, 0, slotW / 2, slotH / 2, 0, Math.PI * 2, true);
    baseShape.holes.push(slotHole);

    const baseGeo = new THREE.ExtrudeGeometry(baseShape, { depth: thk, bevelEnabled: false, curveSegments: 24 });
    baseGeo.rotateX(-Math.PI / 2);
    addPart(baseGeo, currentMaterial, [0, 0, 0]);

    const earThick = Math.max(4, Math.min(thk * 0.85, wid * 0.24));
    const earZ = wid * 0.25;
    [-earZ, earZ].forEach((zPos) => {
      const earShape = new THREE.Shape();
      const hw = Math.max(pinR + 4.5, earThick * 1.45);
      earShape.moveTo(-hw, 0);
      earShape.lineTo(hw, 0);
      earShape.lineTo(hw, earH);
      earShape.absarc(0, earH, hw, 0, Math.PI, false);
      earShape.lineTo(-hw, 0);

      const hole = new THREE.Path();
      hole.absarc(0, earH, pinR, 0, Math.PI * 2, true);
      earShape.holes.push(hole);

      const ext = new THREE.ExtrudeGeometry(earShape, {
        depth: earThick,
        bevelEnabled: false,
        curveSegments: 24
      });
      ext.rotateY(Math.PI / 2);
      addPart(ext, currentMaterial, [-len * 0.24 - earThick / 2, thk, zPos]);
    });
  } else if (modelId === 'angleBracket') {
    const len = p.baseLen;
    const wid = p.baseWidth;
    const thk = p.baseThick;
    const ang = THREE.MathUtils.degToRad(p.slopeAngle);
    const ribT = p.ribThick;

    addPart(new THREE.BoxGeometry(len, thk, wid), currentMaterial, [len * 0.16, thk / 2, 0]);

    const rampLen = wid * 1.15;
    const rampMesh = addPart(new THREE.BoxGeometry(rampLen, thk, wid), currentMaterial, [0, thk / 2, 0]);
    const pivotX = -len * 0.34 + len * 0.16;
    const cx = pivotX - (rampLen / 2) * Math.cos(ang);
    const cy = thk / 2 + (rampLen / 2) * Math.sin(ang);
    rampMesh.position.set(cx, cy, 0);
    rampMesh.rotation.set(0, 0, ang);
    edgesGroup.children[edgesGroup.children.length - 1].position.copy(rampMesh.position);
    edgesGroup.children[edgesGroup.children.length - 1].rotation.copy(rampMesh.rotation);

    [-wid * 0.26, wid * 0.26].forEach((zBoss) => {
      const bx = cx - (rampLen * 0.24) * Math.cos(ang) - (thk * 0.55) * Math.sin(ang);
      const by = cy - (rampLen * 0.24) * Math.sin(ang) + (thk * 0.55) * Math.cos(ang);
      const boss = addPart(new THREE.CylinderGeometry(4.2, 4.2, 2.2, 18), metalAccentMat, [bx, by, zBoss]);
      boss.rotation.set(0, 0, ang);
      edgesGroup.children[edgesGroup.children.length - 1].position.copy(boss.position);
      edgesGroup.children[edgesGroup.children.length - 1].rotation.copy(boss.rotation);
    });

    const ribShape = new THREE.Shape();
    const rSpan = Math.min(len * 0.58, rampLen * 0.85);
    const rTop = Math.min(rampLen * 0.68 * Math.sin(ang) + thk, len * 0.58);
    ribShape.moveTo(0, 0);
    ribShape.lineTo(rSpan, 0);
    ribShape.lineTo(0, Math.max(12, rTop));
    ribShape.closePath();

    const ribGeo = new THREE.ExtrudeGeometry(ribShape, { depth: ribT, bevelEnabled: false });
    addPart(ribGeo, currentMaterial, [pivotX - rSpan * 0.85, thk, -ribT / 2]);
  } else if (modelId === 'flangeHub') {
    const pSize = p.plateSize;
    const pThick = p.plateThick;
    const hRad = p.hubOuterDia / 2;
    const hHeight = p.hubHeight;
    const ribs = Math.max(2, Math.round(p.ribCount));

    const plateShape = makeRoundedRectShape(pSize, pSize, pSize * 0.14);
    const boltOff = pSize * 0.34;
    const boltR = Math.max(2.5, pSize * 0.045);
    [
      [-boltOff, -boltOff],
      [boltOff, -boltOff],
      [-boltOff, boltOff],
      [boltOff, boltOff]
    ].forEach(([bx, by]) => {
      const hole = new THREE.Path();
      hole.absarc(bx, by, boltR, 0, Math.PI * 2, true);
      plateShape.holes.push(hole);
    });

    const plateGeo = new THREE.ExtrudeGeometry(plateShape, { depth: pThick, bevelEnabled: false, curveSegments: 20 });
    plateGeo.rotateX(-Math.PI / 2);
    addPart(plateGeo, currentMaterial, [0, 0, 0]);

    addPart(new THREE.CylinderGeometry(hRad, hRad, hHeight, 36), currentMaterial, [0, pThick + hHeight / 2, 0]);
    addPart(new THREE.CylinderGeometry(hRad * 0.72, hRad * 0.72, hHeight + 0.5, 32), metalAccentMat, [0, pThick + hHeight / 2, 0]);

    const ribThick = Math.max(3, Math.min(8, hRad * 0.24));
    const ribRun = Math.max(8, pSize * 0.44 - hRad);
    const ribH = Math.max(8, hHeight * 0.78);

    const ribShape = new THREE.Shape();
    ribShape.moveTo(0, 0);
    ribShape.lineTo(ribRun, 0);
    ribShape.lineTo(0, ribH);
    ribShape.closePath();
    const ribGeo = new THREE.ExtrudeGeometry(ribShape, { depth: ribThick, bevelEnabled: false });

    for (let i = 0; i < ribs; i++) {
      const angle = (i / ribs) * Math.PI * 2;
      const dist = hRad - 0.6;
      const rx = Math.cos(angle) * dist;
      const rz = Math.sin(angle) * dist;
      const mesh = addPart(ribGeo, currentMaterial, [rx, pThick, rz], [0, -angle, 0]);
      const line = edgesGroup.children[edgesGroup.children.length - 1];
      mesh.translateZ(-ribThick / 2);
      line.position.copy(mesh.position);
      line.rotation.copy(mesh.rotation);
    }
  } else if (modelId.startsWith('duct')) {
    const rw = p.rectWidth;
    const rh = p.rectHeight;
    const rDia = p.roundDia;
    const wt = p.wallThick;
    const bendDeg = modelId === 'duct90' ? 90 : modelId === 'duct45' ? 45 : 0;
    const bendRad = THREE.MathUtils.degToRad(bendDeg);
    const segs = 28;
    const ptsPerRing = 36;

    const totalLen = bendDeg === 0 ? p.length : Math.max(45, (p.bendRadius || 60) * bendRad + 24);
    const radiusArc = bendDeg === 0 ? 0 : (p.bendRadius || 60);

    function sampleSection(t, scaleFactor = 1) {
      const ring = [];
      for (let i = 0; i < ptsPerRing; i++) {
        const theta = (i / ptsPerRing) * Math.PI * 2;
        const cosT = Math.cos(theta);
        const sinT = Math.sin(theta);

        const m = THREE.MathUtils.lerp(18, 2.0, t);
        const rx = (rw / 2) * scaleFactor;
        const ry = (rh / 2) * scaleFactor;
        const sgnX = Math.sign(cosT);
        const sgnY = Math.sign(sinT);
        const rectX = sgnX * Math.pow(Math.abs(cosT), 2 / m) * rx;
        const rectY = sgnY * Math.pow(Math.abs(sinT), 2 / m) * ry;

        const circX = cosT * (rDia / 2) * scaleFactor;
        const circY = sinT * (rDia / 2) * scaleFactor;

        const lx = THREE.MathUtils.lerp(rectX, circX, t);
        const ly = THREE.MathUtils.lerp(rectY, circY, t);

        if (bendDeg === 0) {
          ring.push(new THREE.Vector3(t * totalLen - totalLen / 2, ly + rh * 0.65, lx));
        } else {
          const curAng = t * bendRad;
          const cx = -radiusArc * 0.35 + Math.sin(curAng) * radiusArc;
          const cy = radiusArc * 0.85 - Math.cos(curAng) * radiusArc + rh * 0.45;
          const dirX = Math.cos(curAng);
          const dirY = Math.sin(curAng);
          const px = cx + dirX * ly;
          const py = cy + dirY * ly;
          ring.push(new THREE.Vector3(px, py, lx));
        }
      }
      return ring;
    }

    function buildLoftShell(scaleFn) {
      const positions = [];
      for (let s = 0; s < segs; s++) {
        const t0 = s / segs;
        const t1 = (s + 1) / segs;
        const r0 = sampleSection(t0, scaleFn(t0));
        const r1 = sampleSection(t1, scaleFn(t1));
        for (let i = 0; i < ptsPerRing; i++) {
          const ni = (i + 1) % ptsPerRing;
          const a = r0[i], b = r0[ni], c = r1[ni], d = r1[i];
          positions.push(a.x, a.y, a.z, b.x, b.y, b.z, c.x, c.y, c.z);
          positions.push(a.x, a.y, a.z, c.x, c.y, c.z, d.x, d.y, d.z);
        }
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.computeVertexNormals();
      return geo;
    }

    const outerScale = (t) => 1 + (1 - t) * 0.08;
    const innerScale = (t) => Math.max(0.55, outerScale(t) - (wt * 2) / Math.max(24, (rw + rh + rDia) / 3));

    addPart(buildLoftShell(outerScale), currentMaterial);
    addPart(buildLoftShell(innerScale), currentMaterial);
  } else if (modelId === 'propeller') {
    const nBlades = Math.max(2, Math.round(p.blades));
    const tipR = p.radius;
    const pitch = THREE.MathUtils.degToRad(p.pitchAngle);
    const hubR = p.hubDia / 2;
    const bThick = p.bladeThick;
    const hubH = Math.max(18, hubR * 1.45);

    addPart(new THREE.CylinderGeometry(hubR, hubR, hubH, 36), currentMaterial, [0, hubH / 2, 0]);
    addPart(new THREE.CylinderGeometry(hubR * 0.44, hubR * 0.44, hubH + 0.6, 24), metalAccentMat, [0, hubH / 2, 0]);
    addPart(new THREE.BoxGeometry(hubR * 0.22, hubH + 0.6, hubR * 0.22), metalAccentMat, [0, hubH / 2, hubR * 0.42]);

    for (let i = 0; i < nBlades; i++) {
      const baseAng = (i / nBlades) * Math.PI * 2;
      const bladeLen = Math.max(14, tipR - hubR * 0.7);
      const bladeW = Math.max(12, bladeLen * 0.62);
      const bladeGeo = new THREE.BoxGeometry(bladeLen, bThick, bladeW, 12, 1, 10);
      const posAttr = bladeGeo.attributes.position;

      for (let k = 0; k < posAttr.count; k++) {
        const vx = posAttr.getX(k);
        const vy = posAttr.getY(k);
        const vz = posAttr.getZ(k);
        const u = (vx + bladeLen / 2) / bladeLen;
        const widthScale = Math.sin(Math.min(1, Math.max(0.14, u * 0.92 + 0.08)) * Math.PI);
        const zCurved = vz * (0.42 + 0.8 * widthScale);
        const camber = (1 - Math.pow(vz / (bladeW / 2 || 1), 2)) * bThick * 0.45 * widthScale;
        const twist = pitch * (1.25 - u * 0.65);
        const yBase = vy + camber;
        const yTwisted = yBase * Math.cos(twist) - zCurved * Math.sin(twist) + u * bladeLen * 0.24;
        const zFinal = yBase * Math.sin(twist) + zCurved * Math.cos(twist);
        posAttr.setXYZ(k, vx + bladeLen / 2 + hubR * 0.72, yTwisted, zFinal);
      }
      bladeGeo.computeVertexNormals();
      addPart(bladeGeo, currentMaterial, [0, hubH * 0.45, 0], [0, baseAng, 0]);
    }
  } else if (modelId === 'wallRing') {
    const pH = p.plateHeight;
    const pW = p.plateWidth;
    const pT = 7;
    const rDia = p.ringDia;
    const rH = p.ringHeight;
    const stand = p.standoff;

    const plateShape = makeRoundedRectShape(pW, pH, pW * 0.42);
    const holeR = Math.max(2.2, pW * 0.14);
    const holeY = pH * 0.34;
    [-holeY, holeY].forEach((hy) => {
      const hPath = new THREE.Path();
      hPath.absarc(0, hy, holeR, 0, Math.PI * 2, true);
      plateShape.holes.push(hPath);
    });
    const plateGeo = new THREE.ExtrudeGeometry(plateShape, { depth: pT, bevelEnabled: false, curveSegments: 20 });
    plateGeo.rotateY(Math.PI / 2);
    addPart(plateGeo, currentMaterial, [-stand / 2 - pT / 2, pH / 2, 0]);

    const ringR = rDia / 2;
    const ringWall = Math.max(3.5, ringR * 0.22);
    const ringShape = new THREE.Shape();
    ringShape.absarc(0, 0, ringR, 0, Math.PI * 2, false);
    const hole = new THREE.Path();
    hole.absarc(0, 0, Math.max(6, ringR - ringWall), 0, Math.PI * 2, true);
    ringShape.holes.push(hole);

    const ringGeo = new THREE.ExtrudeGeometry(ringShape, { depth: rH, bevelEnabled: false, curveSegments: 36 });
    ringGeo.rotateX(Math.PI / 2);
    const ringY = pH * 0.56 + rH / 2;
    const ringX = stand / 2 + ringR * 0.45;
    addPart(ringGeo, currentMaterial, [ringX, ringY, 0]);

    const armLen = Math.max(12, ringX - ringR * 0.65 - (-stand / 2));
    const armW = Math.max(6, pW * 0.55);
    const armH = Math.max(6, rH * 0.65);
    const armCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(-stand / 2, pH * 0.64, 0),
      new THREE.Vector3(-stand / 2 + armLen * 0.55, pH * 0.64, 0),
      new THREE.Vector3(ringX - ringR * 0.75, ringY - rH * 0.35, 0)
    ]);
    const armGeo = new THREE.TubeGeometry(armCurve, 18, Math.min(armW, armH) * 0.48, 16, false);
    armGeo.scale(1, armH / Math.min(armW, armH), armW / Math.min(armW, armH));
    addPart(armGeo, currentMaterial, [0, 0, 0]);
  }

  updateHudDimensions();
}

function updateHudDimensions() {
  if (!activeModelId) return;
  const box = new THREE.Box3().setFromObject(modelGroup);
  if (box.isEmpty()) return;
  const size = new THREE.Vector3();
  box.getSize(size);
  const t = I18N[currentLang];
  const isCm = lengthUnit === 'cm';
  const unitStr = isCm ? t.unitCm : t.unitMm;
  const fmt = (v) => (isCm ? (v / 10).toFixed(2) : v.toFixed(1));
  document.getElementById('hud-dims').textContent =
    `X: ${fmt(size.x)} ${unitStr}  |  Y: ${fmt(size.y)} ${unitStr}  |  Z: ${fmt(size.z)} ${unitStr}`;
}

function setCameraPreset(preset) {
  const box = new THREE.Box3().setFromObject(modelGroup);
  const center = new THREE.Vector3();
  const size = new THREE.Vector3();
  box.getCenter(center);
  box.getSize(size);
  const maxDim = Math.max(size.x, size.y, size.z, 50);
  const dist = maxDim * 1.95;

  const dirs = {
    iso: new THREE.Vector3(1, 0.85, 1).normalize(),
    front: new THREE.Vector3(0, 0.15, 1).normalize(),
    top: new THREE.Vector3(0.001, 1, 0.01).normalize(),
    side: new THREE.Vector3(1, 0.15, 0).normalize()
  };
  const d = dirs[preset] || dirs.iso;
  camera.position.copy(center).addScaledVector(d, dist);
  controls.target.copy(center);
  controls.update();
}

function resizeRenderer() {
  if (!editorView.classList.contains('active')) return;
  const rect = viewportPane.getBoundingClientRect();
  if (rect.width > 0 && rect.height > 0) {
    camera.aspect = rect.width / rect.height;
    camera.updateProjectionMatrix();
    renderer.setSize(rect.width, rect.height, false);
  }
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
window.addEventListener('resize', resizeRenderer);

// Top-edge drag to resize controls panel height
let isResizingTop = false;
let resizeStartY = 0;
let resizeStartHeight = 0;

topResizeHandle.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  isResizingTop = true;
  resizeStartY = e.clientY;
  resizeStartHeight = controlsPane.getBoundingClientRect().height;
  topResizeHandle.classList.add('dragging');
  topResizeHandle.setPointerCapture(e.pointerId);
});

topResizeHandle.addEventListener('pointermove', (e) => {
  if (!isResizingTop) return;
  const deltaY = resizeStartY - e.clientY;
  const maxH = Math.max(180, window.innerHeight - 108);
  const nextH = Math.max(120, Math.min(maxH, resizeStartHeight + deltaY));
  controlsPane.style.flex = 'none';
  controlsPane.style.height = `${nextH}px`;
  controlsPane.style.maxHeight = 'none';
  resizeRenderer();
});

function stopTopResize(e) {
  if (!isResizingTop) return;
  isResizingTop = false;
  topResizeHandle.classList.remove('dragging');
  if (e && e.pointerId !== undefined && topResizeHandle.hasPointerCapture(e.pointerId)) {
    topResizeHandle.releasePointerCapture(e.pointerId);
  }
  resizeRenderer();
}

topResizeHandle.addEventListener('pointerup', stopTopResize);
topResizeHandle.addEventListener('pointercancel', stopTopResize);

function renderParamsForModel(modelId) {
  const def = MODEL_DEFS.find((x) => x.id === modelId);
  const t = I18N[currentLang];
  const mInfo = t.models[modelId];
  const vals = modelParamsMap[modelId];

  paramsContainer.innerHTML = '';
  def.schema.forEach((item) => {
    const wrap = document.createElement('div');
    wrap.className = 'param-item';

    const unitLabel = getUnitLabel(item, currentLang);
    const bounds = getEffectiveDisplayBounds(modelId, item);
    const dispVal = mmToDisplay(vals[item.key], item);
    const dispStr = formatDisplayNumber(vals[item.key], item);

    wrap.innerHTML = `
      <div class="param-top">
        <span class="param-name">${mInfo.params[item.key]}</span>
        <div class="param-val-group">
          <input type="number" class="param-num-input" id="num-${item.key}" min="${bounds.min}" max="${bounds.max}" step="${bounds.step}" value="${dispStr}" data-key="${item.key}">
          ${unitLabel ? `<span class="param-unit">${unitLabel}</span>` : ''}
        </div>
      </div>
      <div class="range-safe-row">
        <span class="range-safe-pad" aria-hidden="true">${unitLabel}</span>
        <input type="range" min="${bounds.min}" max="${bounds.max}" step="${bounds.step}" value="${dispVal}" data-key="${item.key}">
        <span class="range-safe-pad" aria-hidden="true">${unitLabel}</span>
      </div>
    `;

    const rangeInput = wrap.querySelector('input[type="range"]');
    const numInput = wrap.querySelector('input[type="number"]');

    rangeInput.addEventListener('input', (e) => {
      const dispNum = parseFloat(e.target.value);
      if (Number.isNaN(dispNum)) return;
      const mmNum = displayToMm(dispNum, item);
      vals[item.key] = mmNum;
      numInput.value = formatManualInputNumber(dispNum, item);
      buildModelGeometry(modelId, vals);
    });

    const applyManualValue = (isFinalCommit) => {
      const rawText = String(numInput.value).replace(',', '.').trim();
      if (rawText === '' || rawText === '-' || rawText === '.') return;
      const parsed = parseFloat(rawText);
      if (Number.isNaN(parsed)) return;

      const roundedDisp = roundToTwoDecimals(parsed);
      const nextMm = displayToMm(roundedDisp, item);
      vals[item.key] = nextMm;

      const newBounds = transformRangeAroundValue(modelId, item, roundedDisp);
      rangeInput.min = String(newBounds.min);
      rangeInput.max = String(newBounds.max);
      rangeInput.step = String(newBounds.step);
      rangeInput.value = String(roundedDisp);

      if (isFinalCommit) {
        numInput.value = formatManualInputNumber(roundedDisp, item);
      }

      buildModelGeometry(modelId, vals);
    };

    numInput.addEventListener('input', () => applyManualValue(false));
    numInput.addEventListener('change', () => applyManualValue(true));
    numInput.addEventListener('blur', () => applyManualValue(true));

    paramsContainer.appendChild(wrap);
  });
}

} catch (_) {}

window.addEventListener('popstate', (event) => {
  const st = event.state;
  const cartOpen = cartModalBackdrop.classList.contains('open');

  if (cartOpen) {
    cartModalBackdrop.classList.remove('open');
    showCatalog(true);
    if (!st || st.view !== 'catalog') {
      try {
        history.replaceState({ view: 'catalog' }, '', window.location.pathname + window.location.search);
      } catch (_) {}
    }
    return;
  }

  if (st && st.view === 'cart') {
    openCartModal(false);
    return;
  }

  if (st && st.view === 'model' && st.modelId) {
    openEditor(st.modelId, false);
    return;
  }

  if (activeModelId) {
    showCatalog(true);
  }

  if (!st || st.view === 'catalog') {
    try {
      history.replaceState({ view: 'catalog' }, '', window.location.pathname + window.location.search);
    } catch (_) {}
  }
});

let cartItems = [];

function renderModelIconDataUrl(modelDef, modelName, colorHex, paramsObj, quantity, lang) {
  const t = I18N[lang];
  const mInfo = t.models[modelDef.id];
  const innerSvg = modelDef.svg.replace(/^<svg[^>]*>|<\/svg>$/g, '');
  const paramLines = modelDef.schema.map((s) => {
    const label = mInfo.params[s.key];
    const unit = getUnitLabel(s, lang);
    const valStr = formatDisplayNumber(paramsObj[s.key], s);
    return `${label}: ${valStr}${unit ? ' ' + unit : ''}`;
  });
  paramLines.push(`${t.qtyLabel}: ${quantity}`);

  const escapeXml = (str) => String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');

  const tspans = paramLines.map((line, idx) =>
    `<tspan x="148" dy="${idx === 0 ? 0 : 16}">${escapeXml(line)}</tspan>`
  ).join('');

  const composedSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="360" height="168" viewBox="0 0 360 168">
    <rect width="360" height="168" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="12" y="18" width="124" height="132" rx="10" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/>
    <svg x="14" y="24" width="120" height="120" viewBox="0 0 120 120">${innerSvg}</svg>
    <text x="148" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">${escapeXml(modelName)}</text>
    <text x="148" y="50" font-family="Arial, sans-serif" font-size="11" fill="#334155">${tspans}</text>
    <circle cx="332" cy="25" r="8" fill="${escapeXml(colorHex)}" stroke="#0f172a" stroke-width="1.5"/>
  </svg>`;

  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(composedSvg);
}

function createCartJsonObject(def, modelName, paramsObj, colorHex, quantity, lang, fileName) {
  const iconDataUrl = renderModelIconDataUrl(def, modelName, colorHex, paramsObj, quantity, lang);
  const t = I18N[lang];
  const mInfo = t.models[def.id];
  const dimensions = {};
  def.schema.forEach((s) => {
    const unit = getUnitLabel(s, lang);
    const valStr = formatDisplayNumber(paramsObj[s.key], s);
    dimensions[mInfo.params[s.key]] = `${valStr}${unit ? ' ' + unit : ''}`;
  });

  const jsonData = {
    parameters: { ...paramsObj },
    color: colorHex
  };

  return {
    fileName,
    jsonData,
    content: JSON.stringify(jsonData, null, 2),
    iconDataUrl,
    formattedParams: dimensions
  };
}

function refreshCartItemJson(item) {
  const def = MODEL_DEFS.find((x) => x.id === item.modelId);
  const rebuilt = createCartJsonObject(
    def,
    item.modelName,
    item.parameters,
    item.colorHex,
    item.quantity,
    item.lang || currentLang,
    item.fileName
  );
  item.jsonData = rebuilt.jsonData;
  item.content = rebuilt.content;
  item.iconDataUrl = rebuilt.iconDataUrl;
  item.formattedParams = rebuilt.formattedParams;
}

function triggerFileDownload(fileName, content) {
  const blob = new Blob([content], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function renderCart() {
  const t = I18N[currentLang];
  const totalQty = cartItems.reduce((sum, it) => sum + (it.quantity || 1), 0);
  cartCountBadge.textContent = String(totalQty);
  const menuBadge = document.getElementById('menu-cart-badge');
  if (menuBadge) menuBadge.textContent = String(totalQty);
  cartItemsContainer.innerHTML = '';

  if (cartItems.length === 0) {
    cartItemsContainer.innerHTML = `<div class="cart-empty">${t.cartEmpty}</div>`;
    return;
  }

  cartItems.forEach((item, idx) => {
    const row = document.createElement('div');
    row.className = 'cart-item';

    const paramsText = Object.entries(item.formattedParams)
      .map(([k, v]) => `${k}: ${v}`)
      .join(' • ');

    row.innerHTML = `
      <div class="cart-item-thumb">
        <img src="${item.iconDataUrl}" alt="${item.modelName}">
      </div>
      <div class="cart-item-meta">
        <div class="cart-item-name">${item.modelName}</div>
        <div class="cart-item-file">${item.fileName} • ${t.qtyLabel}: ${item.quantity}</div>
        <div class="cart-item-params">${paramsText}</div>
        <div class="cart-qty-box">
          <button type="button" class="cart-qty-btn dec" aria-label="Decrease quantity">−</button>
          <span class="cart-qty-num">${item.quantity}</span>
          <button type="button" class="cart-qty-btn inc" aria-label="Increase quantity">+</button>
        </div>
      </div>
      <div class="cart-item-actions">
        <button type="button" class="cart-mini-btn dl" data-idx="${idx}">${t.downloadFileBtn}</button>
        <button type="button" class="cart-mini-btn del" data-idx="${idx}">${t.removeItemBtn}</button>
      </div>
    `;

    row.querySelector('.dec').addEventListener('click', () => {
      if (item.quantity > 1) {
        item.quantity -= 1;
        refreshCartItemJson(item);
      } else {
        cartItems.splice(idx, 1);
      }
      renderCart();
    });
    row.querySelector('.inc').addEventListener('click', () => {
      item.quantity = (item.quantity || 1) + 1;
      refreshCartItemJson(item);
      renderCart();
    });
    row.querySelector('.dl').addEventListener('click', () => {
      triggerFileDownload(item.fileName, item.content);
    });
    row.querySelector('.del').addEventListener('click', () => {
      cartItems.splice(idx, 1);
      renderCart();
    });

    cartItemsContainer.appendChild(row);
  });
}

document.getElementById('add-to-cart-btn').addEventListener('click', () => {
  if (!activeModelId) return;
  const def = MODEL_DEFS.find((x) => x.id === activeModelId);
  const t = I18N[currentLang];
  const modelName = t.models[activeModelId].name;
  const vals = modelParamsMap[activeModelId];

  const existing = cartItems.find(
    (it) =>
      it.modelId === activeModelId &&
      it.colorHex.toLowerCase() === currentColor.toLowerCase() &&
      JSON.stringify(it.parameters) === JSON.stringify(vals)
  );

  if (existing) {
    existing.quantity = (existing.quantity || 1) + 1;
    refreshCartItemJson(existing);
  } else {
    const fileName = `${def.id}-${Date.now().toString().slice(-4)}.json`;
    const fileObj = createCartJsonObject(def, modelName, vals, currentColor, 1, currentLang, fileName);
    cartItems.push({
      id: `${activeModelId}-${Date.now()}`,
      modelId: activeModelId,
      modelName,
      colorHex: currentColor,
      parameters: { ...vals },
      quantity: 1,
      lang: currentLang,
      ...fileObj
    });
  }

  renderCart();
  toastMsgEl.textContent = t.addedToCart(modelName);
});

}

function closeCartModal(fromPopState = false) {

}

function buildWhatsAppOrderText() {
  const t = I18N[currentLang];
  const lines = [];
  cartItems.forEach((item, i) => {
    lines.push(`${i + 1}. ${item.modelName} (${item.fileName}) — ${t.qtyLabel}: ${item.quantity}, ${item.colorHex}`);
    Object.entries(item.formattedParams).forEach(([k, v]) => {
      lines.push(`   - ${k}: ${v}`);
    });
  });
  return lines.join('\n');
}

document.getElementById('topbar-wa-btn').addEventListener('click', () => {
  const text = cartItems.length > 0 ? buildWhatsAppOrderText() : '';

    ? `https://wa.me/?text=${encodeURIComponent(text)}`

  const waUrl = `https://wa.me/?text=${encodeURIComponent(orderText)}`;
  window.open(waUrl, '_blank', 'noopener,noreferrer');
  toastMsgEl.textContent = t.waOrderSent;
});
