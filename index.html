<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3D CAD Catalog & Configurator</title>
<style>
  :root {
    --bg-app: #e7ecf2;
    --bg-panel: #ffffff;
    --bg-subtle: #f4f7fa;
    --bg-cad: #dce3ec;
    --text-main: #0f172a;
    --text-muted: #475569;
    --border: #cbd5e1;
    --accent: #0284c7;
    --accent-hover: #0369a1;
    --accent-soft: #e0f2fe;
    --lang-bg: #dc2626;
    --lang-hover: #b91c1c;
    --lang-active: #991b1b;
    --lang-border: #fca5a5;
    --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.06);
    --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.12);
    --panel-w: 360px;
    --scene-h-mobile: 46dvh;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg-app);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Heebo", "Arial", sans-serif;
    overflow: hidden;
  }

  .app-shell {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
  }

  /* Top Bar */
  .topbar {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 14px;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    z-index: 30;
    flex-shrink: 0;
    flex-wrap: nowrap;
  }

  .brand-group {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .brand-titles {
    min-width: 0;
  }

  .brand-title {
    font-size: 15px;
    font-weight: 700;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .brand-subtitle {
    font-size: 11.5px;
    color: var(--text-muted);
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .topbar-right-group {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    flex-wrap: nowrap;
    min-width: 0;
  }

  /* High-visibility Red Language Switcher */
  .lang-switcher {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px;
    border-radius: 10px;
    background: #fef2f2;
    border: 2px solid var(--lang-bg);
    box-shadow: 0 0 0 2px rgba(220, 38, 38, 0.16);
  }

  .lang-btn {
    border: 1px solid transparent;
    background: var(--lang-bg);
    color: #ffffff;
    font-weight: 800;
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 7px;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.15s ease, box-shadow 0.15s ease;
    line-height: 1;
  }

  .lang-btn:hover {
    background: var(--lang-hover);
    transform: translateY(-1px);
  }

  .lang-btn.active {
    background: var(--lang-active);
    border-color: var(--lang-border);
    box-shadow: 0 2px 8px rgba(153, 27, 27, 0.45), inset 0 0 0 1px rgba(255, 255, 255, 0.35);
    transform: scale(1.03);
  }

  .menu-anchor {
    position: relative;
    display: inline-flex;
    align-items: center;
    flex-shrink: 0;
  }

  .menu-hamburger-btn {
    width: 36px;
    height: 36px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--bg-subtle);
    color: var(--text-main);
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    cursor: pointer;
    padding: 0;
    flex-shrink: 0;
    transition: all 0.15s ease;
  }

  .menu-hamburger-btn:hover,
  .menu-hamburger-btn.open {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent-hover);
  }

  .menu-hamburger-line {
    width: 17px;
    height: 2px;
    border-radius: 999px;
    background: currentColor;
    display: block;
  }

  .nav-menu-popover {
    position: absolute;
    top: calc(100% + 8px);
    inset-inline-start: 0;
    min-width: 185px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow-md);
    padding: 6px;
    display: none;
    flex-direction: column;
    gap: 4px;
    z-index: 80;
  }

  .nav-menu-popover.open {
    display: flex;
  }

  .nav-menu-item {
    width: 100%;
    border: none;
    background: transparent;
    color: var(--text-main);
    font-size: 13px;
    font-weight: 700;
    padding: 9px 12px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    text-align: inherit;
    transition: background 0.14s ease, color 0.14s ease;
  }

  .nav-menu-item:hover {
    background: var(--accent-soft);
    color: var(--accent-hover);
  }

  .topbar-cart-slot {
    display: inline-flex;
    align-items: center;
    flex-shrink: 0;
  }

  .cart-nav-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--bg-subtle);
    color: var(--text-main);
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .cart-nav-btn:hover {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent-hover);
  }

  .cart-top-corner-btn {
    position: static;
    box-shadow: var(--shadow-sm);
    flex-shrink: 0;
  }

  .cart-badge {
    min-width: 18px;
    height: 18px;
    padding: 0 5px;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    font-size: 11px;
    font-weight: 800;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }

  /* Catalog View */
  #catalog-view {
    flex: 1;
    overflow-y: auto;
    padding: 18px 16px 32px;
  }

  .catalog-inner {
    max-width: 1240px;
    margin: 0 auto;
  }

  .catalog-header {
    margin-bottom: 16px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .catalog-header h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 800;
    color: var(--text-main);
  }

  .catalog-header p {
    margin: 4px 0 0;
    font-size: 13px;
    color: var(--text-muted);
  }

  .catalog-empty {
    grid-column: 1 / -1;
    color: var(--text-muted);
    font-size: 14px;
    padding: 24px 0;
  }

  .catalog-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }

  .model-card {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
    text-align: inherit;
  }

  .model-card:hover {
    transform: translateY(-3px);
    border-color: var(--accent);
    box-shadow: var(--shadow-md);
  }

  .model-thumb {
    width: 100%;
    height: 128px;
    border-radius: 10px;
    background: linear-gradient(180deg, #eef2f7 0%, #dce3ec 100%);
    border: 1px solid #d5dde7;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  .model-thumb svg {
    width: 118px;
    height: 118px;
    filter: drop-shadow(0 6px 10px rgba(15, 23, 42, 0.16));
  }

  .model-card-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-main);
    line-height: 1.3;
  }

  .model-card-tag {
    align-self: flex-start;
    font-size: 11px;
    font-weight: 600;
    color: var(--accent-hover);
    background: var(--accent-soft);
    padding: 3px 8px;
    border-radius: 999px;
  }

  /* Editor View */
  #editor-view {
    flex: 1;
    display: none;
    min-height: 0;
    height: 100%;
    overflow: hidden;
  }

  #editor-view.active {
    display: flex;
    flex-direction: row;
  }

  .viewport-pane {
    position: relative;
    flex: 1;
    min-width: 0;
    min-height: 0;
    background: linear-gradient(180deg, #e9eef4 0%, #d4dce6 100%);
    overflow: hidden;
  }

  #three-canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  .scene-top-bar {
    position: absolute;
    top: 10px;
    inset-inline-end: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
    z-index: 15;
    flex-wrap: wrap;
  }

  .scene-chip-btn {
    border: 1px solid rgba(15, 23, 42, 0.16);
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(8px);
    color: var(--text-main);
    font-size: 12px;
    font-weight: 700;
    padding: 6px 10px;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.1);
    transition: all 0.14s ease;
  }

  .scene-chip-btn:hover,
  .scene-chip-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  /* HUD Overlays */
  .hud-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.18s ease, visibility 0.18s ease;
    z-index: 10;
  }

  .hud-layer.visible {
    opacity: 1;
    visibility: visible;
  }

  .hud-info-card {
    position: absolute;
    top: 10px;
    inset-inline-start: 10px;
    max-width: min(320px, calc(100% - 190px));
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(15, 23, 42, 0.14);
    border-radius: 10px;
    padding: 8px 12px;
    box-shadow: 0 4px 14px rgba(15, 23, 42, 0.1);
    pointer-events: auto;
  }

  .hud-model-name {
    font-size: 13.5px;
    font-weight: 800;
    color: var(--text-main);
    line-height: 1.25;
  }

  .hud-dims {
    margin-top: 3px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--accent-hover);
    direction: ltr;
    text-align: inherit;
  }

  .hud-bottom-bar {
    position: absolute;
    bottom: 10px;
    inset-inline: 10px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }

  .hud-group {
    pointer-events: auto;
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(15, 23, 42, 0.14);
    border-radius: 10px;
    padding: 5px 7px;
    box-shadow: 0 4px 14px rgba(15, 23, 42, 0.1);
  }

  .hud-btn {
    border: 1px solid #cbd5e1;
    background: #fff;
    color: var(--text-main);
    font-size: 11px;
    font-weight: 700;
    padding: 5px 8px;
    border-radius: 7px;
    cursor: pointer;
    transition: all 0.12s ease;
  }

  .hud-btn:hover,
  .hud-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .hud-axes {
    font-size: 11px;
    font-weight: 800;
    padding: 0 4px;
    letter-spacing: 0.5px;
    direction: ltr;
  }

  .axis-x { color: #dc2626; }
  .axis-y { color: #16a34a; }
  .axis-z { color: #2563eb; }

  /* Controls Panel */
  .controls-pane {
    position: relative;
    width: var(--panel-w);
    flex-shrink: 0;
    background: var(--bg-panel);
    border-inline-start: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 0;
    z-index: 20;
    transition: width 0.16s ease;
  }

  .controls-pane.collapsed {
    display: none;
  }

  .top-resize-handle {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    min-height: 54px;
    padding: 8px 14px;
    width: 100%;
    background: var(--bg-subtle);
    border-bottom: 1px solid var(--border);
    cursor: ns-resize;
    touch-action: none;
    user-select: none;
    flex-shrink: 0;
  }

  .top-resize-handle:hover .resize-pill,
  .top-resize-handle.dragging .resize-pill {
    background: var(--accent);
    width: 56px;
  }

  .resize-pill {
    width: 44px;
    height: 4px;
    border-radius: 999px;
    background: #94a3b8;
    transition: width 0.14s ease, background 0.14s ease;
  }

  .panel-header-title {
    font-size: 14px;
    font-weight: 800;
    color: var(--text-main);
  }

  .panel-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .section-box {
    background: var(--bg-subtle);
    border: 1px solid #e2e8f0;
    border-radius: 11px;
    padding: 10px 12px;
  }

  .section-header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
  }

  .section-header-row .section-label {
    margin-bottom: 0;
  }

  .section-label {
    font-size: 11.5px;
    font-weight: 800;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-bottom: 8px;
  }

  .unit-switch-group {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 2px;
    border-radius: 7px;
    background: #e2e8f0;
    border: 1px solid var(--border);
    direction: ltr;
    flex-shrink: 0;
  }

  .unit-switch-btn {
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 800;
    padding: 3px 7px;
    border-radius: 5px;
    cursor: pointer;
    line-height: 1.1;
    transition: all 0.14s ease;
  }

  .unit-switch-btn.active {
    background: var(--accent);
    color: #ffffff;
    box-shadow: 0 1px 4px rgba(2, 132, 199, 0.25);
  }

  .param-item {
    margin-bottom: 10px;
  }

  .param-item:last-child {
    margin-bottom: 0;
  }

  .param-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 4px;
  }

  .param-name {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-main);
  }

  .param-val-group {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    direction: ltr;
    flex-shrink: 0;
  }

  .param-num-input {
    width: 68px;
    padding: 3px 6px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #ffffff;
    color: var(--accent-hover);
    font-size: 12px;
    font-weight: 800;
    text-align: center;
    direction: ltr;
  }

  .param-num-input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-soft);
  }

  .param-unit {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--text-muted);
    min-width: 18px;
  }

  .range-safe-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .range-safe-pad {
    min-width: 34px;
    padding: 0 4px;
    flex-shrink: 0;
    align-self: center;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 800;
    color: var(--text-muted);
    background: #e2e8f0;
    border-radius: 6px;
    user-select: none;
  }

  input[type="range"] {
    flex: 1;
    min-width: 0;
    width: auto;
    accent-color: var(--accent);
    cursor: pointer;
    height: 6px;
    margin: 6px 0;
    touch-action: pan-y;
  }

  .toast-msg {
    font-size: 11.5px;
    font-weight: 700;
    color: #15803d;
    padding: 0 14px 6px;
    min-height: 0;
    background: var(--bg-subtle);
  }

  /* Bottom Bar with Small Circular Palette Popover */
  .panel-footer {
    position: relative;
    padding: 10px 14px;
    border-top: 1px solid var(--border);
    background: var(--bg-subtle);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .palette-anchor {
    position: relative;
    flex-shrink: 0;
  }

  .palette-circle-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 2.5px solid #ffffff;
    box-shadow: 0 0 0 1.5px #64748b, 0 2px 8px rgba(15, 23, 42, 0.16);
    cursor: pointer;
    transition: transform 0.14s ease, box-shadow 0.14s ease;
    background: #94a3b8;
  }

  .palette-circle-btn:hover {
    transform: scale(1.08);
  }

  .palette-circle-btn.open {
    box-shadow: 0 0 0 2.5px var(--accent), 0 4px 12px rgba(2, 132, 199, 0.3);
  }

  .palette-popover {
    position: absolute;
    bottom: calc(100% + 10px);
    inset-inline-start: 0;
    display: none;
    align-items: center;
    gap: 7px;
    padding: 8px 10px;
    border-radius: 999px;
    background: #ffffff;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-md);
    z-index: 40;
    white-space: nowrap;
  }

  .palette-popover.open {
    display: flex;
  }

  .swatch-btn {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid #fff;
    box-shadow: 0 0 0 1.5px #94a3b8;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    flex-shrink: 0;
  }

  .swatch-btn:hover {
    transform: scale(1.14);
  }

  .swatch-btn.active {
    transform: scale(1.18);
    box-shadow: 0 0 0 2.5px var(--accent);
  }

  .btn-secondary,
  .btn-primary {
    border-radius: 9px;
    padding: 9px 10px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.14s ease;
    border: none;
    flex: 1;
  }

  .btn-secondary {
    background: #fff;
    color: var(--text-main);
    border: 1px solid var(--border);
  }

  .btn-secondary:hover {
    background: #f1f5f9;
  }

  .btn-primary {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 3px 10px rgba(2, 132, 199, 0.25);
  }

  .btn-primary:hover {
    background: var(--accent-hover);
  }

  /* Fixed Left-Edge Centered WhatsApp Button on All Screens */
  .wa-edge-btn {
    position: fixed;
    left: 6px;
    top: 50%;
    transform: translateY(-50%);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 2px solid #ffffff;
    background: #22c55e;
    color: #ffffff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(22, 163, 74, 0.38), 0 0 0 1.5px #16a34a;
    transition: transform 0.14s ease, background 0.14s ease, box-shadow 0.14s ease;
    z-index: 65;
    padding: 0;
  }

  .wa-edge-btn:hover {
    background: #16a34a;
    transform: translateY(-50%) scale(1.07);
    box-shadow: 0 6px 18px rgba(22, 163, 74, 0.48), 0 0 0 1.5px #15803d;
  }

  /* Cart Modal */
  .cart-modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.48);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 100;
  }

  .cart-modal-backdrop.open {
    display: flex;
  }

  .cart-modal {
    width: 100%;
    max-width: 520px;
    max-height: 86dvh;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow-md);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .cart-modal-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-subtle);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .cart-modal-title {
    font-size: 15px;

function isLengthParam(item) {
  return item.unit === 'mm';
}

function getUnitLabel(item, lang = currentLang) {
  const t = I18N[lang];
  if (item.unit === 'mm') {
    return lengthUnit === 'cm' ? t.unitCm : t.unitMm;
  }
  if (item.unit === 'deg') {
    return t.unitDeg;
  }
  if (item.unit === 'pct') {
    return '%';
  }
  return '';
}

function roundToTwoDecimals(num) {
  return Math.round(num * 100) / 100;
}

function mmToDisplay(mmVal, item) {
  if (!isLengthParam(item)) return roundToTwoDecimals(mmVal);
  if (lengthUnit === 'cm') {
    return roundToTwoDecimals(mmVal / 10);
  }
  return roundToTwoDecimals(mmVal);
}

function displayToMm(dispVal, item) {
  if (!isLengthParam(item)) return dispVal;
  if (lengthUnit === 'cm') {
    return dispVal * 10;
  }
  return dispVal;
}

function getDefaultDisplayBounds(item) {
  if (!isLengthParam(item)) {
    return { min: item.min, max: item.max, step: item.step };
  }
  if (lengthUnit === 'cm') {
    return {
      min: roundToTwoDecimals(item.min / 10),
      max: roundToTwoDecimals(item.max / 10),
      step: 0.01
    };
  }
  return { min: item.min, max: item.max, step: item.step };
}

function getEffectiveDisplayBounds(modelId, item) {
  const base = getDefaultDisplayBounds(item);
  const custom = customSliderBoundsMap[modelId]?.[item.key];
  if (!custom) return base;
  return {
    min: custom.min,
    max: custom.max,
    step: isLengthParam(item) && lengthUnit === 'cm' ? 0.01 : base.step
  };
}

function transformRangeAroundValue(modelId, item, typedDispVal) {
  const base = getDefaultDisplayBounds(item);
  const halfSpan = Math.max((base.max - base.min) / 2, isLengthParam(item) && lengthUnit === 'cm' ? 1 : 5);
  const minBound = isLengthParam(item) && item.min >= 0 ? 0 : -Infinity;
  const nextMin = roundToTwoDecimals(Math.max(minBound, typedDispVal - halfSpan));
  const nextMax = roundToTwoDecimals(Math.max(nextMin + halfSpan * 2, typedDispVal + halfSpan));
  if (!customSliderBoundsMap[modelId]) customSliderBoundsMap[modelId] = {};
  customSliderBoundsMap[modelId][item.key] = { min: nextMin, max: nextMax };
  return {
    min: nextMin,
    max: nextMax,
    step: isLengthParam(item) && lengthUnit === 'cm' ? 0.01 : base.step
  };
}

function formatDisplayNumber(val, item) {
  if (!isLengthParam(item)) return String(roundToTwoDecimals(val));
  if (lengthUnit === 'cm') {
    return roundToTwoDecimals(val / 10).toFixed(2);
  }
  return String(roundToTwoDecimals(val));
}

function formatManualInputNumber(dispVal, item) {
  if (!isLengthParam(item)) return String(roundToTwoDecimals(dispVal));
  if (lengthUnit === 'cm') {
    return roundToTwoDecimals(dispVal).toFixed(2);
  }
  return String(roundToTwoDecimals(dispVal));
}

function makeRoundedRectShape(w, h, r) {
  const hw = w / 2;
  const hh = h / 2;
  const rad = Math.max(0.5, Math.min(r, hw * 0.45, hh * 0.45));
  const s = new THREE.Shape();
  s.moveTo(-hw + rad, -hh);
  s.lineTo(hw - rad, -hh);
  s.quadraticCurveTo(hw, -hh, hw, -hh + rad);
  s.lineTo(hw, hh - rad);
  s.quadraticCurveTo(hw, hh, hw - rad, hh);
  s.lineTo(-hw + rad, hh);
  s.quadraticCurveTo(-hw, hh, -hw, hh - rad);
  s.lineTo(-hw, -hh + rad);
  s.quadraticCurveTo(-hw, -hh, -hw + rad, -hh);
  return s;
}

function renderParamsForModel(modelId) {
  const def = MODEL_DEFS.find((x) => x.id === modelId);
  const t = I18N[currentLang];
  const mInfo = t.models[modelId];
  const vals = modelParamsMap[modelId];

  paramsContainer.innerHTML = '';
  def.schema.forEach((item) => {
    const wrap = document.createElement('div');
    wrap.className = 'param-item';

    const unitLabel = getUnitLabel(item, currentLang);
    const bounds = getEffectiveDisplayBounds(modelId, item);
    const dispVal = mmToDisplay(vals[item.key], item);
    const dispStr = formatDisplayNumber(vals[item.key], item);

    wrap.innerHTML = `
      <div class="param-top">
        <span class="param-name">${mInfo.params[item.key]}</span>
        <div class="param-val-group">
          <input type="number" class="param-num-input" id="num-${item.key}" min="${bounds.min}" max="${bounds.max}" step="${bounds.step}" value="${dispStr}" data-key="${item.key}">
          ${unitLabel ? `<span class="param-unit">${unitLabel}</span>` : ''}
        </div>
      </div>
      <div class="range-safe-row">
        <span class="range-safe-pad" aria-hidden="true">${unitLabel}</span>
        <input type="range" min="${bounds.min}" max="${bounds.max}" step="${bounds.step}" value="${dispVal}" data-key="${item.key}">
        <span class="range-safe-pad" aria-hidden="true">${unitLabel}</span>
      </div>
    `;

    const rangeInput = wrap.querySelector('input[type="range"]');
    const numInput = wrap.querySelector('input[type="number"]');

    rangeInput.addEventListener('input', (e) => {
      const dispNum = parseFloat(e.target.value);
      if (Number.isNaN(dispNum)) return;
      const mmNum = displayToMm(dispNum, item);
      vals[item.key] = mmNum;
      numInput.value = formatManualInputNumber(dispNum, item);
      buildModelGeometry(modelId, vals);
    });

    const applyManualValue = (isFinalCommit) => {
      const rawText = String(numInput.value).replace(',', '.').trim();
      if (rawText === '' || rawText === '-' || rawText === '.') return;
      const parsed = parseFloat(rawText);
      if (Number.isNaN(parsed)) return;

      const roundedDisp = roundToTwoDecimals(parsed);
      const nextMm = displayToMm(roundedDisp, item);
      vals[item.key] = nextMm;

      const newBounds = transformRangeAroundValue(modelId, item, roundedDisp);
      rangeInput.min = String(newBounds.min);
      rangeInput.max = String(newBounds.max);
      rangeInput.step = String(newBounds.step);
      rangeInput.value = String(roundedDisp);

      if (isFinalCommit) {
        numInput.value = formatManualInputNumber(roundedDisp, item);
      }

      buildModelGeometry(modelId, vals);
    };

    numInput.addEventListener('input', () => applyManualValue(false));
    numInput.addEventListener('change', () => applyManualValue(true));
    numInput.addEventListener('blur', () => applyManualValue(true));

    paramsContainer.appendChild(wrap);
  });
  /*OBJRT:DECOR*/ if (typeof OBJRT !== 'undefined' && OBJRT.decorate) OBJRT.decorate(modelId); /*OBJRT:DECOREND*/
}

try {
  history.replaceState({ view: 'catalog' }, '', window.location.pathname + window.location.search);
} catch (_) {}

window.addEventListener('popstate', (event) => {
  const st = event.state;
  const cartOpen = cartModalBackdrop.classList.contains('open');

  if (cartOpen) {
    cartModalBackdrop.classList.remove('open');
    showCatalog(true);
    if (!st || st.view !== 'catalog') {
      try {
        history.replaceState({ view: 'catalog' }, '', window.location.pathname + window.location.search);
      } catch (_) {}
    }
    return;
  }

  if (st && st.view === 'cart') {
    openCartModal(false);
    return;
  }

  if (st && st.view === 'model' && st.modelId) {
    openEditor(st.modelId, false);
    return;
  }

  if (activeModelId) {
    showCatalog(true);
  }

  if (!st || st.view === 'catalog') {
    try {
      history.replaceState({ view: 'catalog' }, '', window.location.pathname + window.location.search);
    } catch (_) {}
  }
});

function renderModelIconDataUrl(modelDef, modelName, colorHex, paramsObj, quantity, lang) {
  const t = I18N[lang];
  const mInfo = t.models[modelDef.id];
  const innerSvg = (typeof modelDef.svgFn === 'function' ? modelDef.svgFn(colorHex) : modelDef.svg).replace(/^<svg[^>]*>|<\/svg>$/g, '');
  const paramLines = modelDef.schema.map((s) => {
    const label = mInfo.params[s.key];
    const unit = getUnitLabel(s, lang);
    const valStr = formatDisplayNumber(paramsObj[s.key], s);
    return `${label}: ${valStr}${unit ? ' ' + unit : ''}`;
  });
  paramLines.push(`${t.qtyLabel}: ${quantity}`);

  const escapeXml = (str) => String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');

  const tspans = paramLines.map((line, idx) =>
    `<tspan x="148" dy="${idx === 0 ? 0 : 16}">${escapeXml(line)}</tspan>`
  ).join('');

  const composedSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="360" height="168" viewBox="0 0 360 168">
    <rect width="360" height="168" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="12" y="18" width="124" height="132" rx="10" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/>
    <svg x="14" y="24" width="120" height="120" viewBox="0 0 120 120">${innerSvg}</svg>
    <text x="148" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">${escapeXml(modelName)}</text>
    <text x="148" y="50" font-family="Arial, sans-serif" font-size="11" fill="#334155">${tspans}</text>
    <circle cx="332" cy="25" r="8" fill="${escapeXml(colorHex)}" stroke="#0f172a" stroke-width="1.5"/>
  </svg>`;

  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(composedSvg);
}

function createCartJsonObject(def, modelName, paramsObj, colorHex, quantity, lang, fileName) {
  const iconDataUrl = renderModelIconDataUrl(def, modelName, colorHex, paramsObj, quantity, lang);
  const t = I18N[lang];
  const mInfo = t.models[def.id];
  const dimensions = {};
  def.schema.forEach((s) => {
    const unit = getUnitLabel(s, lang);
    const valStr = formatDisplayNumber(paramsObj[s.key], s);
    dimensions[mInfo.params[s.key]] = `${valStr}${unit ? ' ' + unit : ''}`;
  });

  const jsonData = {
    parameters: { ...paramsObj },
    color: colorHex
  };

  return {
    fileName,
    jsonData,
    content: JSON.stringify(jsonData, null, 2),
    iconDataUrl,
    formattedParams: dimensions
  };
}

function refreshCartItemJson(item) {
  const def = MODEL_DEFS.find((x) => x.id === item.modelId);
  const rebuilt = createCartJsonObject(
    def,
    item.modelName,
    item.parameters,
    item.colorHex,
    item.quantity,
    item.lang || currentLang,
    item.fileName
  );
  item.jsonData = rebuilt.jsonData;
  item.content = rebuilt.content;
  item.iconDataUrl = rebuilt.iconDataUrl;
  item.formattedParams = rebuilt.formattedParams;
}

function triggerFileDownload(fileName, content) {
  const blob = new Blob([content], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function renderCart() {
  const t = I18N[currentLang];
  const totalQty = cartItems.reduce((sum, it) => sum + (it.quantity || 1), 0);
  cartCountBadge.textContent = String(totalQty);
  const menuBadge = document.getElementById('menu-cart-badge');
  if (menuBadge) menuBadge.textContent = String(totalQty);
  cartItemsContainer.innerHTML = '';

  if (cartItems.length === 0) {
    cartItemsContainer.innerHTML = `<div class="cart-empty">${t.cartEmpty}</div>`;
    return;
  }

  cartItems.forEach((item, idx) => {
    const row = document.createElement('div');
    row.className = 'cart-item';

    const paramsText = Object.entries(item.formattedParams)
      .map(([k, v]) => `${k}: ${v}`)
      .join(' • ');

    row.innerHTML = `
      <div class="cart-item-thumb">
        <img src="${item.iconDataUrl}" alt="${item.modelName}">
      </div>
      <div class="cart-item-meta">
        <div class="cart-item-name">${item.modelName}</div>
        <div class="cart-item-file">${item.fileName} • ${t.qtyLabel}: ${item.quantity}</div>
        <div class="cart-item-params">${paramsText}</div>
        <div class="cart-qty-box">
          <button type="button" class="cart-qty-btn dec" aria-label="Decrease quantity">−</button>
          <span class="cart-qty-num">${item.quantity}</span>
          <button type="button" class="cart-qty-btn inc" aria-label="Increase quantity">+</button>
        </div>
      </div>
      <div class="cart-item-actions">
        <button type="button" class="cart-mini-btn dl" data-idx="${idx}">${t.downloadFileBtn}</button>
        <button type="button" class="cart-mini-btn del" data-idx="${idx}">${t.removeItemBtn}</button>
      </div>
    `;

    row.querySelector('.dec').addEventListener('click', () => {
      if (item.quantity > 1) {
        item.quantity -= 1;
        refreshCartItemJson(item);
      } else {
        cartItems.splice(idx, 1);
      }
      renderCart();
    });
    row.querySelector('.inc').addEventListener('click', () => {
      item.quantity = (item.quantity || 1) + 1;
      refreshCartItemJson(item);
      renderCart();
    });
    row.querySelector('.dl').addEventListener('click', () => {
      triggerFileDownload(item.fileName, item.content);
    });
    row.querySelector('.del').addEventListener('click', () => {
      cartItems.splice(idx, 1);
      renderCart();
    });

    cartItemsContainer.appendChild(row);
  });
}

document.getElementById('add-to-cart-btn').addEventListener('click', () => {
  if (!activeModelId) return;
  const def = MODEL_DEFS.find((x) => x.id === activeModelId);
  const t = I18N[currentLang];
  const modelName = t.models[activeModelId].name;
  const vals = modelParamsMap[activeModelId];

  const existing = cartItems.find(
    (it) =>
      it.modelId === activeModelId &&
      it.colorHex.toLowerCase() === currentColor.toLowerCase() &&
      JSON.stringify(it.parameters) === JSON.stringify(vals)
  );

  if (existing) {
    existing.quantity = (existing.quantity || 1) + 1;
    refreshCartItemJson(existing);
  } else {
    const fileName = `${def.id}-${Date.now().toString().slice(-4)}.json`;
    const fileObj = createCartJsonObject(def, modelName, vals, currentColor, 1, currentLang, fileName);
    cartItems.push({
      id: `${activeModelId}-${Date.now()}`,
      modelId: activeModelId,
      modelName,
      colorHex: currentColor,
      parameters: { ...vals },
      quantity: 1,
      lang: currentLang,
      ...fileObj
    });
  }

  renderCart();
  toastMsgEl.textContent = t.addedToCart(modelName);
});

function buildWhatsAppOrderText() {
  const t = I18N[currentLang];
  const lines = [];
  cartItems.forEach((item, i) => {
    lines.push(`${i + 1}. ${item.modelName} (${item.fileName}) — ${t.qtyLabel}: ${item.quantity}, ${item.colorHex}`);
    Object.entries(item.formattedParams).forEach(([k, v]) => {
      lines.push(`   - ${k}: ${v}`);
    });
  });
  return lines.join('\n');
}

function waBase() {
  const num = String((SITECFG.contacts && SITECFG.contacts.whatsapp) || '').replace(/\D/g, '');
  return num ? `https://wa.me/${num}` : 'https://wa.me/';
}

// главная страница: модели по группам (если категории есть и режим не «плоский»)
function getHomeGroups(list) {
  if (activeCategory) return null;
  if (SITECFG.layout && SITECFG.layout.home === 'flat') return null;
  const cats = (SITECFG.categories || []).filter((c) => c && c.id);
  if (!cats.length) return null;
  const used = new Set(), groups = [];
  cats.forEach((c) => {
    const ids = Array.isArray(c.models) ? c.models : [];
    const ms = list.filter((m) => ids.indexOf(m.id) >= 0);
    if (!ms.length) return;
    ms.forEach((m) => used.add(m.id));
    groups.push({ title: categoryName(c, currentLang), models: ms });
  });
  const rest = list.filter((m) => !used.has(m.id));
  if (!groups.length) return null;
  if (rest.length) groups.push({ title: I18N[currentLang].catalogOther, models: rest });
  return groups;
}
function categoryName(c, lang) {
  const n = c.name || {};
  return n[lang] || n.en || n.ru || n.he || c.id;
}
function getCatalogModels() {
  let list = MODEL_DEFS.slice();
  const ord = SITECFG.modelOrder;
  if (Array.isArray(ord) && ord.length) {
    const idx = (id) => { const i = ord.indexOf(id); return i < 0 ? 1e6 : i; };
    list = list.map((m, i) => ({ m, i })).sort((a, b) => (idx(a.m.id) - idx(b.m.id)) || (a.i - b.i)).map((x) => x.m);
  }
  if (activeCategory) {
    const c = (SITECFG.categories || []).find((x) => x.id === activeCategory);
    const ids = c && Array.isArray(c.models) ? c.models : [];
    list = list.filter((m) => ids.indexOf(m.id) >= 0);
  }
  return list;
}
function renderMenuCategories() {
  const wrap = document.getElementById('menu-group-wrap');
  const listEl = document.getElementById('menu-categories-list');

  const langs = Object.keys(I18N);
  const rows = MODEL_DEFS.map((m) => {
    const cur = ((I18N[currentLang].models || {})[m.id] || {});
    const curName = (cur.name || '').toLowerCase();
    let names = '', descs = '';
    langs.forEach((l) => {
      const i = (I18N[l].models || {})[m.id] || {};
      names += ' ' + (i.name || '') + ' ' + (i.tag || '');
      descs += ' ' + (i.desc || '');
    });
    return { m, curName, names: names.toLowerCase(), descs: descs.toLowerCase() };
  });
  function run(match) {
    const out = [];
    rows.forEach((r) => {
      let score = 0, ok = true;
      toks.forEach((t) => {
        const s = match(r, t);
        if (s) score += s; else ok = false;
      });
      if (ok) out.push({ m: r.m, score });

    return out.sort((a, b) => b.score - a.score);

(function setupWaDrag() {

    y = Math.min(Math.max(4, y), window.innerHeight - h - 4);
    btn.style.left = x + 'px';
    btn.style.top = y + 'px';
    btn.style.right = 'auto';
    btn.style.transform = 'none';
    return { x, y };

  btn.addEventListener('pointercancel', end);

/* ---------- добавление пометок в заказ ---------- */
function cartVisible(){var b=document.getElementById('sx-cart');return !!(b&&b.offsetParent!==null)}
function extras(){var s=[];
 if(noteOn&&note.trim())s.push(tx('ordNote')+'\n'+note.trim());

function setParam(u,key,add){var q=u.indexOf('?'),base=q<0?u:u.slice(0,q),qs=q<0?'':u.slice(q+1),hash='',h=qs.indexOf('#');
 if(h>=0){hash=qs.slice(h);qs=qs.slice(0,h)}
 var parts=qs?qs.split('&'):[],found=false;
 parts=parts.map(function(p){var i=p.indexOf('='),k=i<0?p:p.slice(0,i);
  if(k!==key)return p;found=true;var v=i<0?'':p.slice(i+1),d;try{d=decodeURIComponent(v.replace(/\+/g,' '))}catch(e){d=v}
  return key+'='+encodeURIComponent(d+'\n\n'+add)});
 if(!found)parts.push(key+'='+encodeURIComponent(add));
 return base+'?'+parts.join('&')+hash}
function augment(u){if(typeof u!=='string'||!cartVisible())return u;var ex=extras();if(!ex)return u;
 if(/^https?:\/\/(wa\.me|api\.whatsapp\.com|web\.whatsapp\.com)\b/i.test(u))return setParam(u,'text',ex);

/* ---------- WhatsApp: файлы уходят через меню «Поделиться» ---------- */

 for(var i=0;i<m.length;i++){var p=m[i].split('=');if(p[0]==='text')return decodeURIComponent((p.slice(1).join('=')||'').replace(/\+/g,' '))}}catch(e){}return ''}

var saveStamp=0;
function saveFiles(){if(Date.now()-saveStamp<3000)return;saveStamp=Date.now();
 files.forEach(function(f,i){setTimeout(function(){try{var tmp=f.url?'':URL.createObjectURL(f.file),a=document.createElement('a');

 var d={files:files.map(function(f){return f.file})},t=waText(u);if(t)d.text=t;

 return true}
if(!PV&&(filesOn||noteOn)){
 var ow=window.open;window.__sxOpen=ow;window.open=function(){lastOpen=Date.now();try{if(arguments.length){arguments[0]=augment(arguments[0]);if(waShare(arguments[0]))return null}}catch(e){}return ow.apply(this,arguments)};
 var oc=HTMLAnchorElement.prototype.click;
 HTMLAnchorElement.prototype.click=function(){lastOpen=Date.now();try{var h=this.getAttribute('href');if(h&&h!==this.__sxa){var n=augment(h);if(n!==h){this.__sxa=n;this.setAttribute('href',n)}}if(waShare(this.getAttribute('href')))return}catch(e){}return oc.apply(this,arguments)};
 document.addEventListener('click',function(e){try{var a=e.target&&e.target.closest&&e.target.closest('a[href]');if(!a)return;var h=a.getAttribute('href');var n=(h===a.__sxa)?h:augment(h);if(n!==h){a.__sxa=n;a.setAttribute('href',n)}if(waShare(n)){e.preventDefault();e.stopPropagation()}}catch(x){}},true);
 var OB=window.Blob;
 window.Blob=function(parts,opts){try{
  if(cartVisible()&&opts&&/json/i.test(opts.type||'')&&parts&&parts.length===1&&typeof parts[0]==='string'&&(files.length||note.trim())){
   var o=JSON.parse(parts[0]);

  return new OB(parts,opts)};
 window.Blob.prototype=OB.prototype}
