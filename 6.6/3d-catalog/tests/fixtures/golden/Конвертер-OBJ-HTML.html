<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OBJ → HTML конвертер моделей</title>
<style>
:root{--bg:#f3f4f6;--fg:#1f2937;--mut:#6b7280;--card:rgba(255,255,255,.92);--bd:#d1d5db;--ac:#2563eb;--ok:#059669;--pw:300px;--nm:var(--fg);box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--fg:#e5e7eb;--mut:#9ca3af;--card:rgba(30,34,41,.92);--bd:#374151;--ac:#60a5fa;--ok:#34d399;--nm:#fff}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;backdrop-filter:blur(8px);font-size:calc(13px*var(--fz,1))}
.s{font-size:calc(12px*var(--fz,1));color:var(--mut);line-height:1.5}
#info{position:fixed;left:12px;top:12px;max-width:calc(100vw - var(--pw) - 40px)}
.panel{position:fixed;right:12px;top:12px;bottom:12px;width:var(--pw);overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:8px;scrollbar-width:thin}
.panel>.card{flex-shrink:0}
.panel>.card:last-child{flex-grow:1}
@media (min-width:721px){body.viewer .panel,body.viewer .rz{bottom:62px}}
.ax{border-top:1px solid var(--bd);padding-top:6px;margin-top:2px}
.ax b,.names b{font-size:calc(12px*var(--fz,1));color:var(--ac)}
.row{display:flex;flex-direction:column;gap:2px;margin:4px 0}
.row .h{display:flex;justify-content:space-between;align-items:center;font-size:calc(12px*var(--fz,1));color:var(--mut);gap:6px}
.row .h.t{color:var(--fg);font-weight:600}
.row.off{opacity:.45}
#fnBox{display:flex;flex-direction:column;gap:6px;padding:2px 2px 8px}
#fnBox[hidden],#fnBox .fnsec[hidden]{display:none}
.fnsec{border:1px solid var(--rbd);border-radius:9px;background:var(--rbg);padding:5px 8px}
.fnsec.test{border-style:dashed}
.fnh{font-size:calc(11px*var(--fz,1));font-weight:700;color:var(--mut);margin-bottom:2px}
.fnrow{display:flex;flex-wrap:wrap;align-items:center;gap:3px 8px;padding:3px 0}
.fnlab{display:inline-flex;align-items:center;gap:5px;cursor:pointer;font-size:calc(12px*var(--fz,1))}
.fnck{width:16px;height:16px;margin:0;accent-color:#16a34a}
.fnst{font-size:calc(10.5px*var(--fz,1));color:var(--mut);flex:1 1 120px}
.fnrow.on .fnst{color:#16a34a}
.fnd{flex:1 1 100%;font-size:calc(10.5px*var(--fz,1));color:var(--mut);line-height:1.3}
#fnBox button{font:inherit;font-size:calc(11px*var(--fz,1));font-weight:600;color:var(--ac);background:var(--rbg);border:1px solid var(--rbd);border-radius:7px;padding:2px 8px;cursor:pointer;white-space:nowrap}
:root{--pnl:#e4e8ee;--rbg:#fff;--rbd:#7c8aa0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pnl:#14171c;--rbg:#2c333f;--rbd:#7b879c}}
:root[data-theme="dark"]{--pnl:#14171c;--rbg:#2c333f;--rbd:#7b879c}
.panel>.card:last-child{background:var(--pnl)}
#axes .row{border:2px solid var(--rbd);border-radius:10px;padding:7px 9px;margin:8px 0;background:var(--rbg);box-shadow:0 1px 4px rgba(0,0,0,.18)}
#axes .row.cm{border:2px solid #8b5cf6}
#axes .row .h{flex-wrap:wrap}
#axes .row .h .mvh{order:-3}
#axes .row .h .lt{order:-2;flex:1 1 calc(100% - 30px)}
#axes .row .h input[type=number]{margin-left:auto}
#rs{background:var(--rbg)}
#axes .row.dragging{opacity:.7;outline:2px dashed var(--ac)}
#axes .row .h{gap:4px}
.mvh{cursor:grab;touch-action:none;user-select:none;color:var(--mut);flex-shrink:0;font-size:calc(14px*var(--fz,1));line-height:1}
.rgl{display:flex;align-items:center;gap:4px}
.rgl input[type=range]{flex:1;min-width:0}
.row button.mvb{padding:0;width:20px;height:18px;flex-shrink:0;justify-content:center;border-radius:5px;font-size:9px;line-height:1}
.row button.mvb:disabled{opacity:.3;cursor:default}
.dqp{display:inline-flex;align-items:center;gap:2px;font-size:calc(12px*var(--fz,1));cursor:pointer;user-select:none;flex-shrink:0}
.dqp input{width:15px;height:15px;margin:0;accent-color:var(--ac);flex-shrink:0}
.dqp span{filter:grayscale(1);opacity:.5;line-height:1}
.dqp.on span{filter:none;opacity:1}
#axes .row .h .chk{accent-color:#16a34a}
#thrBox button{font:inherit;font-size:calc(11px*var(--fz,1));font-weight:600;color:var(--ac);background:var(--rbg);border:1px solid var(--rbd);border-radius:7px;padding:2px 8px;cursor:pointer;white-space:nowrap}
#thrBox button:disabled{opacity:.45;cursor:default}
.row .h{align-items:center}
.row .lt{flex:1;min-width:0;font:inherit;font-size:calc(12px*var(--fz,1));color:var(--nm);font-weight:700;background:transparent;border:1px solid transparent;border-radius:5px;padding:1px 3px}
.row input.lt:hover,.row input.lt:focus{border-color:var(--bd);outline:none}
.row .chk{width:15px;height:15px;margin:0;accent-color:var(--ac);flex-shrink:0}
.dqk{display:inline-flex;align-items:center;gap:2px;font-size:calc(12px*var(--fz,1));cursor:pointer;user-select:none;flex-shrink:0}
.dqk input{width:15px;height:15px;margin:0;accent-color:var(--ac);flex-shrink:0}
.dqk span{filter:grayscale(1);opacity:.5;line-height:1}
.dqk.on span{filter:none;opacity:1}
.dqn{font-size:calc(11px*var(--fz,1));color:#d97706}
.lkrow{display:flex;align-items:center;gap:7px;font-size:calc(12px*var(--fz,1));font-weight:700;margin:0;cursor:pointer;color:var(--ac)}
.cmin{font-size:calc(11px*var(--fz,1));font-weight:600;color:#8b5cf6;white-space:pre-line}
.cmls{font-size:calc(11px*var(--fz,1));color:var(--mut)}
.row .gear{padding:0 5px;border-radius:6px;font-size:calc(13px*var(--fz,1));line-height:20px;flex-shrink:0}
.row .gear.on{background:var(--ac);border-color:var(--ac);color:#fff}
.dset{display:flex;flex-direction:column;gap:5px;margin:3px 0 4px;padding:7px 8px;border:1px solid var(--bd);border-radius:8px;background:rgba(127,127,127,.08)}
.dset[data-cm]{border-color:#8b5cf6}
.ck{display:flex;align-items:center;gap:6px;font-size:calc(11px*var(--fz,1));cursor:pointer}
.ck input{width:14px;height:14px;margin:0;accent-color:var(--ac);flex-shrink:0}
.ck span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ck em{margin-left:auto;font-style:normal;color:var(--mut)}
.dqx input.gnm{width:84px}
.dqs{font-size:calc(11px*var(--fz,1));color:var(--mut)}
.cmsum{font-size:calc(11px*var(--fz,1));font-weight:700}
.dset button.cmdel{font-size:calc(11px*var(--fz,1));padding:3px 9px;align-self:flex-start}
.cmbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0 2px;flex-wrap:wrap}
.cmbar>button{border-color:#8b5cf6;color:#8b5cf6;font-weight:700;font-size:calc(12px*var(--fz,1));padding:5px 11px}
.cmbar>button:disabled{opacity:.45;cursor:default}
.row.inc input[type=range],.row.inc input[type=number]{opacity:.4}
#thrBox{display:flex;flex-direction:row;flex-wrap:wrap;gap:7px 14px;padding:2px 2px 8px}
#thrBox .lkrow{flex:0 1 auto;min-width:34px;font-size:calc(11px*var(--fz,1));font-weight:600;gap:4px;white-space:nowrap}
#thrBox .lkrow span{min-width:0;overflow:hidden;text-overflow:ellipsis}
#thrBox .lkrow input{width:13px;height:13px}
#thrBox[hidden],#thrBox .lkrow[hidden],#thrBox button[hidden]{display:none}
.lkrow input{width:15px;height:15px;margin:0;accent-color:var(--ac)}
.dqx{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:calc(11px*var(--fz,1));color:var(--mut)}
.dqx input{width:58px;font:inherit;font-size:calc(11px*var(--fz,1));color:var(--fg);background:transparent;border:1px solid var(--bd);border-radius:6px;padding:1px 4px}
.dqx select{font:inherit;font-size:calc(11px*var(--fz,1));color:var(--fg);background:transparent;border:1px solid var(--bd);border-radius:6px;padding:1px 3px;flex:1;min-width:0}
.dqx option{color:#111}
.tools{display:flex;flex-wrap:nowrap;white-space:nowrap;align-items:center;gap:6px;margin:0 0 8px;overflow-x:auto;scrollbar-width:none}
.tools[hidden]{display:none}
.fzb{margin-left:auto;display:flex;gap:4px;flex-shrink:0}
.fzb button{font-weight:700}
.ax.sec{margin-top:12px;padding-top:10px;border-top:1px solid var(--bd)}
.ax.sec>b{display:block;font-size:12px;margin:0 0 6px;padding:3px 8px;border-left:3px solid var(--bd);border-radius:4px;background:rgba(127,127,127,.12);color:var(--fg)}
#axes>.ax:first-child{border-top:0;padding-top:0;margin-top:0}
.tools button{padding:2px 9px;font-size:calc(11px*var(--fz,1));border-radius:999px}
.tools a{font-size:calc(11px*var(--fz,1));color:var(--ac);cursor:pointer;text-decoration:underline;margin-inline-start:4px}
.row input[type=number]{width:62px;font:inherit;font-size:calc(12px*var(--fz,1));color:var(--fg);background:transparent;border:1px solid var(--bd);border-radius:6px;padding:2px 4px}
input[type=range]{width:100%;margin:0;accent-color:var(--ac)}
.names{display:grid;grid-template-columns:34px 1fr;gap:4px 6px;align-items:center}
.names b{grid-column:1/-1;margin-top:4px}
.names span{font-size:calc(11px*var(--fz,1));color:var(--mut)}
.names input,.names select,.unit select{font:inherit;font-size:calc(12px*var(--fz,1));color:var(--fg);background:transparent;border:1px solid var(--bd);border-radius:6px;padding:3px 6px;min-width:0;width:100%}
.names option,.unit option{color:#111}
.unit{display:flex;align-items:center;gap:8px;font-size:calc(12px*var(--fz,1));color:var(--mut)}
.unit select{width:auto;flex:1}
.bar{position:fixed;left:12px;right:calc(var(--pw) + 24px);bottom:14px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
button,label.btn{font:inherit;font-size:calc(13px*var(--fz,1));color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:7px 13px;cursor:pointer;backdrop-filter:blur(8px);display:inline-flex;align-items:center;gap:6px}
button.on{border-color:var(--ac);color:var(--ac)}
button.dl{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600;border-radius:10px;padding:10px 13px;justify-content:center}
button[hidden]{display:none}
label.primary{background:var(--ac);border-color:var(--ac);color:#fff}
input[type=color]{width:22px;height:22px;border:0;padding:0;background:none;cursor:pointer}
input[type=file]{display:none}
#drop{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;text-align:center;color:var(--mut);font-size:calc(16px*var(--fz,1));padding:24px}
#drop.hide{display:none}
#over{position:fixed;inset:10px;border:3px dashed var(--ac);border-radius:16px;display:none;pointer-events:none}
#over.show{display:block}
/* сворачиваемая карточка */
.chead{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;background:none;border:0;border-radius:0;padding:0;font:inherit;font-size:calc(14px*var(--fz,1));font-weight:700;color:var(--ac);backdrop-filter:none;cursor:pointer}
.chev{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--ac);color:#fff;font-size:calc(20px*var(--fz,1));line-height:1;transition:transform .25s;transform:rotate(180deg);flex-shrink:0}
.chead:hover .chev{filter:brightness(1.12)}
.collapsed .chev{transform:none}
.cbody{display:grid;grid-template-rows:1fr;transition:grid-template-rows .25s ease}
.cin{overflow:hidden;min-height:0;padding-top:8px}
.collapsed .cbody{grid-template-rows:0fr}
.collapsed .cin{padding-top:0;visibility:hidden;transition:visibility 0s .25s}
/* ручка изменения размера панели */
.rz{position:fixed;top:12px;bottom:12px;right:calc(var(--pw) + 12px - 6px);width:12px;cursor:ew-resize;touch-action:none;z-index:5;display:flex;align-items:center;justify-content:center}
.rz::before,.rzm::before{content:"";background:var(--bd);border-radius:3px}
.rz::before{width:3px;height:44px}
.rz:hover::before,.rz.drag::before,.rzm.drag::before{background:var(--ac)}
.rzm{display:none;position:sticky;top:0;z-index:5;flex-shrink:0;height:14px;margin:-4px 0 -4px;cursor:ns-resize;touch-action:none;align-items:center;justify-content:center}
.rzm::before{width:44px;height:4px}
#tip{position:fixed;z-index:50;max-width:240px;background:#111827;color:#fff;font-size:calc(12px*var(--fz,1));line-height:1.4;padding:6px 9px;border-radius:8px;pointer-events:none;display:none;box-shadow:0 4px 14px rgba(0,0,0,.3)}
body.viewer .conv-only{display:none!important}
body.viewer .bar{right:12px}
body.viewer #drop{display:none}
@media (max-width:720px){
  #info{max-width:calc(100vw - 24px);top:8px;left:8px;padding:6px 10px}
  .bar{left:8px;right:8px;top:auto;bottom:auto;position:fixed;top:calc(env(safe-area-inset-top,0px) + 56px);flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;padding-bottom:2px}
  .bar button,.bar label.btn{white-space:nowrap;padding:6px 11px;font-size:calc(12px*var(--fz,1))}
  .panel{left:8px;right:8px;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);width:auto;max-height:var(--ph,46vh)}
  .rz{display:none}
  .rzm{display:flex}
  body.viewer .bar{right:8px}
}
</style></head>
<body>
<canvas id="c"></canvas>
<div id="drop"><div>Перетащите сюда файл .obj или .html (экспорт FreeCAD или проект из редактора размеров)<br>или нажмите «Открыть OBJ / HTML»</div></div>
<div id="over"></div>
<div class="card s" id="info">Файл не загружен</div>
<div class="rz" id="rz" title="Потяните, чтобы изменить ширину (двойной клик — сбросить)"></div>
<div id="tip"></div>
<div class="panel" id="panel">
  <div class="rzm" id="rzm"></div>
  <div class="card conv-only" id="convBox" hidden>
    <button type="button" class="chead" id="dataHead" aria-expanded="true"><span>Данные для сайта</span><i class="chev">▾</i></button>
    <div class="cbody"><div class="cin">
      <div class="names" id="names">
        <span>RU</span><input id="nr" placeholder="Название (русский)">
        <span>EN</span><input id="ne" placeholder="Name (English)">
        <span>HE</span><input id="nh" placeholder="שם (עברית)" dir="rtl">
        <span>Тег</span><div style="display:flex;gap:4px"><input id="tr" placeholder="RU" value="Модель"><input id="te" placeholder="EN" value="Model"><input id="th" placeholder="HE" value="דגם" dir="rtl"></div>
        <span>Опис.</span><div style="display:flex;flex-direction:column;gap:4px"><input id="dr" placeholder="Описание RU (для поиска на сайте)"><input id="de" placeholder="Description EN"><input id="dh" placeholder="תיאור HE" dir="rtl"></div>
      </div>
      <div class="unit" style="margin-top:8px">Единицы в файле
        <select id="unit"><option value="1">мм</option><option value="10">см</option><option value="1000">м</option><option value="25.4">дюймы</option></select>
      </div>
    </div></div>
  </div>
  <div class="card">
    <div class="tools conv-only" id="tools" hidden>
      <button type="button" data-ll="ru" class="on">RU</button><button type="button" data-ll="en">EN</button><button type="button" data-ll="he">HE</button>
      <span class="fzb"><button type="button" id="fzm" data-tip="Шрифт меньше">A−</button><button type="button" id="fzp" data-tip="Шрифт больше">A+</button></span>
    </div>
    <div class="conv-only" id="thrBox" hidden>
      <label class="lkrow" data-tip="Упростить резьбу"><input type="checkbox" id="thr"><span>Упростить резьбу</span></label>
      <label class="lkrow" data-tip="Все ползунки"><input type="checkbox" id="allOn" checked><span>Все ползунки</span></label>
      <label class="lkrow" data-tip="Масштаб и оси"><input type="checkbox" id="onlyTot"><span>Масштаб и оси</span></label>
      <label class="lkrow" id="pinBox" data-tip="Поставить или снять фиксатор центра 🎯 сразу у всех размеров" hidden><input type="checkbox" id="allPin"><span>Все 🎯 центры</span></label>
      <label class="lkrow" id="scBox" data-tip="Показывать ползунок масштаба в %" hidden><input type="checkbox" id="scOn"><span>Масштаб %</span></label>
      <button type="button" id="allGear" data-tip="Свернуть настройки ⚙ у всех размеров" hidden>⚙ Свернуть все</button>
    </div>
    <div class="conv-only" id="fnBox" hidden>
      <div class="fnsec" id="fnMain" hidden><div class="fnh">Функции модели</div><div class="fnl"></div></div>
      <div class="fnsec test" id="fnTest"><div class="fnh">🧪 Тестовые функции</div><div class="fnl"></div></div>
    </div>
    <div id="axes"></div>
    <button id="rs">Исходные размеры</button>
    <button id="bd" class="dl conv-only" hidden>⬇ Скачать готовый HTML</button>
    <div class="s" id="msg"></div>
  </div>
</div>
<div class="bar">
<label class="btn primary conv-only">Открыть OBJ / HTML<input id="f" type="file" accept=".obj,.html,.htm"></label>
<button id="bz" class="on conv-only">Z вверх</button>
<button id="bs" class="on conv-only">Сглаживание</button>
<button id="bw">Каркас</button>
<button id="br" class="on">Вращение</button>
<label class="btn">Цвет <input id="col" type="color" value="#4a4d52"></label>
<button id="bv">Сброс вида</button>
</div>
<script type="text/plain" id="core-src">
function faceNormals(pos,n,area){
  const fn=new Float32Array(n*3);
  for(let f=0;f<n;f++){
    const o=f*9,ax=pos[o+3]-pos[o],ay=pos[o+4]-pos[o+1],az=pos[o+5]-pos[o+2],bx=pos[o+6]-pos[o],by=pos[o+7]-pos[o+1],bz=pos[o+8]-pos[o+2];
    const x=ay*bz-az*by,y=az*bx-ax*bz,z=ax*by-ay*bx,l=Math.hypot(x,y,z)||1;
    fn[f*3]=x/l;fn[f*3+1]=y/l;fn[f*3+2]=z/l;if(area)area[f]=l/2;
  }
  return fn;
}
// поиск ключевых плоскостей по каждой оси и построение параметров
function detect(pos,n,opt){
  const split=!!(opt&&opt.split); // split: каждая стенка отдельно (без зеркальной симметрии)
  const area=new Float32Array(n),fn=faceNormals(pos,n,area),res=[];
  const NV=pos.length/3,wid=new Int32Array(NV),wm=new Map(),wp=[];
  for(let v=0;v<NV;v++){const k=Math.round(pos[v*3]*1e4)+','+Math.round(pos[v*3+1]*1e4)+','+Math.round(pos[v*3+2]*1e4);
    let id=wm.get(k);if(id===undefined){id=wp.length/3;wm.set(k,id);wp.push(pos[v*3],pos[v*3+1],pos[v*3+2])}wid[v]=id}
  let e0=0;for(let a=0;a<3;a++){let l=Infinity,h=-Infinity;for(let i=a;i<pos.length;i+=3){l=Math.min(l,pos[i]);h=Math.max(h,pos[i])}e0=Math.max(e0,h-l)}
  const tau=.035*e0,par=Int32Array.from({length:wp.length/3},(_,i)=>i),find=x=>{while(par[x]!==x){par[x]=par[par[x]];x=par[x]}return x};
  for(let f=0;f<n;f++)for(let i=0;i<3;i++){
    const a=wid[f*3+i],b=wid[f*3+(i+1)%3];
    if(Math.hypot(wp[a*3]-wp[b*3],wp[a*3+1]-wp[b*3+1],wp[a*3+2]-wp[b*3+2])<tau)par[find(a)]=find(b);
  }

    const rs=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(t)+'&langpair=ru|'+lang,{signal:c.signal});clearTimeout(to);
    const j=await rs.json(),x=j&&j.responseData&&j.responseData.translatedText;
    if(x&&!/MYMEMORY|INVALID|QUERY LENGTH/i.test(x)&&!hasCyr(x))return x;
  }catch(e){}
  return '';
}
async function trText(t,lang){
  if(!t||!hasCyr(t))return t||'';
  const k=t.trim().toLowerCase();if(TRD[k])return TRD[k][lang==='en'?0:1];
  return (await netTr(t,lang))||dictTr(t,lang);
}
async function openTr(){
  const rows=[];
  plist().filter(p=>!UI.off.has(p.key)&&!(p.kind==='cm'&&st.cm[p.i].m.length<2)).forEach(p=>rows.push({k:'p',key:p.key,p,title:'',v:{ru:labText(p,'ru'),en:labText(p,'en'),he:labText(p,'he')}}));
  [['name','nr','ne','nh','Название модели'],['desc','dr','de','dh','Описание']].forEach(([t,a,b,c,ti])=>{
    const v={ru:$(a).value.trim(),en:$(b).value.trim(),he:$(c).value.trim()};
    if(v.ru)rows.push({k:'f',ids:[a,b,c],title:ti,name:t==='name',v});
  });
  const cs=getComputedStyle(document.body),bg=/rgba?\(0, 0, 0, 0\)|transparent/.test(cs.backgroundColor)?'#16181d':cs.backgroundColor;
  const ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center';
  const box=document.createElement('div');
  box.style.cssText='background:'+bg+';color:'+cs.color+';border:1px solid #888;border-radius:14px;width:min(980px,96vw);max-height:88vh;overflow:auto;padding:16px;font-size:13px';
  box.innerHTML='<b style="font-size:15px">Проверка перевода названий</b><div id="trSt" style="margin:6px 0 10px;opacity:.8">Перевожу…</div><table style="width:100%;border-collapse:collapse"><thead><tr><th style="text-align:left">RU</th><th style="text-align:left">EN</th><th style="text-align:right">HE</th></tr></thead><tbody></tbody></table><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button id="trCancel" type="button">Отмена</button><button id="trOk" type="button" style="font-weight:700">ОК — применить</button></div>';
  const tb=box.querySelector('tbody');
  rows.forEach(r=>{
    const tr=document.createElement('tr');r.inp=[];
    ['ru','en','he'].forEach(l=>{
      const td=document.createElement('td'),i=document.createElement('input');
      i.type='text';i.value=r.v[l];i.style.cssText='width:100%;box-sizing:border-box;margin:2px 0;padding:5px 7px';
      if(l==='he'){i.dir='rtl'}
      td.style.padding='0 4px';td.appendChild(i);tr.appendChild(td);r.inp.push(i);
    });
    tb.appendChild(tr);
  });
  ov.appendChild(box);document.body.appendChild(ov);
  const close=()=>ov.remove();
  box.querySelector('#trCancel').onclick=close;
  box.querySelector('#trOk').onclick=()=>{
    rows.forEach(r=>{
      if(r.k==='p')['ru','en','he'].forEach((l,i)=>{const v=r.inp[i].value.trim();if(v&&v!==r.p.lab[l])UI.lab[l][r.key]=v;else delete UI.lab[l][r.key]});
      else r.ids.forEach((id,i)=>{$(id).value=r.inp[i].value.trim()});
    });
    TR.done=true;close();buildUI();syncUI();
    $('msg').textContent='Переводы применены. Нажмите «Скачать готовый HTML» ещё раз, чтобы сохранить файл.';
  };
  let n=0;const st2=box.querySelector('#trSt');
  for(const r of rows){
    const src=r.name?r.v.ru.replace(/[_]+/g,' '):r.v.ru;
    for(const [i,l] of [[1,'en'],[2,'he']]){
      if(r.v[l]&&r.v[l]!==r.v.ru)continue;
      if(!hasCyr(src))continue;
      st2.textContent='Перевожу… '+(++n);
      r.inp[i].value=await trText(src,l);
    }
  }
  st2.textContent='Проверьте и при необходимости исправьте переводы, затем нажмите ОК.';
}
$('bd').onclick=()=>{

};

(function(){
  const root=document.documentElement,pn=$('panel'),rz=$('rz'),rm=$('rzm');
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  function bind(h,move,reset){
    h.addEventListener('pointerdown',e=>{h.setPointerCapture(e.pointerId);h.classList.add('drag');e.preventDefault()});
    h.addEventListener('pointermove',e=>{if(h.classList.contains('drag'))move(e)});
    const end=()=>h.classList.remove('drag');
    h.addEventListener('pointerup',end);h.addEventListener('pointercancel',end);
    h.addEventListener('dblclick',reset);
  }
  bind(rz,e=>root.style.setProperty('--pw',clamp(pn.getBoundingClientRect().right-e.clientX,240,Math.min(800,innerWidth-80))+'px'),()=>root.style.removeProperty('--pw'));
  bind(rm,e=>root.style.setProperty('--ph',clamp(pn.getBoundingClientRect().bottom-e.clientY,120,innerHeight-110)+'px'),()=>root.style.removeProperty('--ph'));
  const tip=$('tip');let tt=0;
  function hide(){tip.style.display='none';clearTimeout(tt)}
  document.addEventListener('pointerover',e=>{
    const t=e.target.closest&&e.target.closest('[data-tip]');if(!t){return}
    tip.textContent=t.dataset.tip;tip.style.display='block';
    const r=t.getBoundingClientRect(),w=tip.offsetWidth,h=tip.offsetHeight;
    tip.style.left=clamp(r.left,8,innerWidth-w-8)+'px';
    tip.style.top=(r.bottom+h+10>innerHeight?r.top-h-6:r.bottom+6)+'px';
    clearTimeout(tt);if(e.pointerType!=='mouse')tt=setTimeout(hide,2800);
  });
  document.addEventListener('pointerout',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(t&&e.pointerType==='mouse')hide()});
})();
