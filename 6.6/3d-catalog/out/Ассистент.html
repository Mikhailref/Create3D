           for (let i = 0; i \u003c= flatCoords.length - 3; i += 3) {\n                const x = flatCoords[i];\n                const y = flatCoords[i + 1];\n                const z = flatCoords[i + 2];\n                if (!Number.isFinite(x) || !Number.isFinite(y) || !Number.isFinite(z)) continue;\n                const pt = new THREE.Vector3(x, y, z);\n                points.push(pt);\n                if (points.length >= 2) {\n                    rawWireSegments.push([points[points.length - 2].clone(), pt.clone()]);\n                }\n            }\n            if (points.length >= 2) {\n                const lineGeo = new THREE.BufferGeometry().setFromPoints(points);\n                const lineMat = new THREE.LineBasicMaterial({\n                    color: isDarkScene ? 0x0f172a : 0x1e293b,\n                    transparent: true,\n                    opacity: 0.85\n                });\n                modelWiresGroup.add(new THREE.Line(lineGeo, lineMat));\n            }\n        }\n\n        function loadSingleGeometryModel(rawGeo, fileName, color = '#adb5bd') {\n            resetSceneForNewModel(fileName);\n\n            const nonIndexed = rawGeo.index ? rawGeo.toNonIndexed() : rawGeo.clone();\n            if (!nonIndexed.attributes.normal) {\n                nonIndexed.computeVertexNormals();\n            }\n\n            const posArray = nonIndexed.attributes.position.array;\n            const edgeSplit = new EdgeSplitModifier();\n            addPartMeshToGroup(posArray, color, 1.0, edgeSplit);\n\n            const wiresToSerialize = [];\n            try {\n                const edgesGeo = new THREE.EdgesGeometry(nonIndexed, 25);\n                const edgePos = edgesGeo.attributes.position.array;\n                for (let i = 0; i \u003c= edgePos.length - 6; i += 6) {\n                    const seg = [\n                        edgePos[i], edgePos[i + 1], edgePos[i + 2],\n                        edgePos[i + 3], edgePos[i + 4], edgePos[i + 5]\n                    ];\n                    wiresToSerialize.push(seg);\n                    rawWireSegments.push([\n                        new THREE.Vector3(seg[0], seg[1], seg[2]),\n                        new THREE.Vector3(seg[3], seg[4], seg[5])\n                    ]);\n                }\n                const edgesMat = new THREE.LineBasicMaterial({\n                    color: isDarkScene ? 0x0f172a : 0x1e293b,\n                    transparent: true,\n                    opacity: 0.8\n                });\n                modelWiresGroup.add(new THREE.LineSegments(edgesGeo, edgesMat));\n            } catch (_) {\n                // Игнорируем ошибку генерации рёбер на вырожденных мешах\n            }\n\n            collectUniqueVerticesFromModel();\n            serializedModelData = {\n                parts: [{ positions: Array.from(posArray), color: color, opacity: 1.0 }],\n                wires: wiresToSerialize\n            };\n\n            finalizeModelSetup();\n        }\n\n        function restoreSavedEditorProject(project, fallbackName) {\n            const name = project.modelName || fallbackName;\n            resetSceneForNewModel(name);\n\n            const edgeSplit = new EdgeSplitModifier();\n            const parts = project.parts || [];\n            const wires = project.wires || [];\n\n            for (const part of parts) {\n                addPartMeshToGroup(new Float32Array(part.positions), part.color || '#adb5bd', part.opacity ?? 1.0, edgeSplit);\n            }\n            for (const w of wires) {\n                addWirePolylineToScene(w);\n            }\n\n            collectUniqueVerticesFromModel();\n            serializedModelData = { parts, wires };\n            finalizeModelSetup();\n\n            if (typeof project.isDark === 'boolean' && project.isDark !== isDarkScene) {\n                toggleBgTheme();\n            }\n\n            const made = []; // номер размера в файле -> созданный размер\n            if (Array.isArray(project.annotations)) {\n                for (const [ix, a] of project.annotations.entries()) {\n                    const pts = (a.points || []).map(arr => new THREE.Vector3().fromArray(arr));\n                    const normal = new THREE.Vector3().fromArray(a.normal || [0, 0, 1]);\n                    if (pts.length === 0) continue;\n\n                    const created = createAnnotationFromSpec({\n                        type: a.type || 'linear',\n                        points: pts,\n                        normal,\n                        offset: typeof a.offset === 'number' ? a.offset : 10,\n                        color: a.color || '#38bdf8',\n                        customText: a.text || null,\n                        precision: typeof a.precision === 'number' ? a.precision : 2\n                    });\n                    made[ix] = created;\n                    if (created) {\n                        if (a.param === false) created.param = false;\n                        if (typeof a.pmin === 'number') created.pmin = a.pmin;\n                        if (typeof a.pmax === 'number') created.pmax = a.pmax;\n                        if (typeof a.anchor === 'number') created.anchor = a.anchor;\n                        if (a.name) created.name = a.name;\n                        if (a.skw) created.skw = true;\n                        if (typeof a.lblT === 'number') { created.lblT = a.lblT; rebuildAnnotation3D(created); }\n                        if (Array.isArray(a.refs)) created.refs = a.refs;\n                        if (a.lblScale) { created.lblScale = a.lblScale; applyLblScale(created); }\n                        if (a.limit) created.limitMode = a.limit;\n                        if (typeof a.amin === 'number') created.amin = a.amin;\n                        if (typeof a.amax === 'number') created.amax = a.amax;\n                        if (a.showScale) created.showScale = true;\n                        if (a.propGroup) { created.propGroup = a.propGroup; if (a.propName) propNames[a.propGroup] = a.propName; }\n                        if (typeof a.limRef === 'number' && a.limRef >= 0) created._limRef = a.limRef;\n                        if (a.limOp) created.limOp = a.limOp;\n                        if (typeof a.limVal === 'number') created.limVal = a.limVal;\n                        if (a.aux) {\n                            const V = (arr) => new THREE.Vector3().fromArray(arr);\n                            created.aux = { a: V(a.aux.a), b: V(a.aux.b), p3: V(a.aux.p3), fn: V(a.aux.fn), angle: a.aux.angle };\n                            created.isAux = true; rebuildAnnotation3D(created);\n                        }\n                        if (a.syncGroup) { created.syncGroup = a.syncGroup; if (a.syncName) groupNames[a.syncGroup] = a.syncName; }\n                        if (a.label && !a.name) { created.text = a.label; created.isCustomText = true; }\n                    }\n                    if (created && a.visible === false) {\n                        toggleAnnotationVisibility(created.id);\n                    }\n                }\n            }\n\n            skRestore(project.skeleton);\n            // в старых проектах этой настройки нет: берём значение по умолчанию (включено)\n            setShowScaleAll(project.showScaleAll !== false);\n            annotations.forEach(it => {\n                if (it._limRef !== undefined) {\n                    const r = annotations[it._limRef];\n                    if (r && r !== it) { it.limRef = r.id; it.limRefOn = true; }\n                    delete it._limRef;\n                }\n            });\n            compRestore(project.composites, made, project.order);\n            setLineK(+project.lineK || 1);\n            guidesRestore(project.guides);\n            showToast(`Проект восстановлен: «${name}» (размеров: ${annotations.length})`);\n        }\n\n        function setShowScaleAll(on) {\n            window.__showScaleAll = on;\n            annotations.forEach(x => { x.showScale = on; });\n            document.getElementById('show-scale-all').checked = on;\n            renderDimensionsSidebar();\n        }\n\n        function resetSceneForNewModel(fileName) {\n            window.__showScaleAll = true;\n            document.getElementById('show-scale-all').checked = true;\n            skeleton = null;\n            skPick.forEach(set => set.clear());\n            skClearVisuals();\n            clearAllDimensions(true);\n            guidesClear();\n            if (modelGroup) scene.remove(modelGroup);\n            if (bboxHelper) {\n                scene.remove(bboxHelper);\n                bboxHelper = null;\n            }\n            clearBBoxLabels();\n\n            modelGroup = new THREE.Group();\n            modelWiresGroup = new THREE.Group();\n            modelGroup.add(modelWiresGroup);\n            scene.add(modelGroup);\n\n            modelMeshes = [];\n            rawWireSegments = [];\n            rawVertices = [];\n\n            currentModelName = fileName;\n            const badge = document.getElementById('model-name-badge');\n            badge.textContent = fileName;\n            badge.title = fileName;\n        }\n\n        function collectUniqueVerticesFromModel() {\n            const seen = new Set();\n            rawVertices = [];\n\n            const addPt = (x, y, z) => {\n                if (!Number.isFinite(x) || !Number.isFinite(y) || !Number.isFinite(z)) return;\n                const key = `${x.toFixed(4)}_${y.toFixed(4)}_${z.toFixed(4)}`;\n                if (!seen.has(key)) {\n                    seen.add(key);\n                    rawVertices.push(new THREE.Vector3(x, y, z));\n                }\n            };\n\n            for (const [a, b] of rawWireSegments) {\n                addPt(a.x, a.y, a.z);\n                addPt(b.x, b.y, b.z);\n            }\n\n            for (const mesh of modelMeshes) {\n                const pos = mesh.geometry.attributes.position;\n                const step = pos.count > 60000 ? Math.ceil(pos.count / 60000) : 1;\n                for (let i = 0; i \u003c pos.count; i += step) {\n                    addPt(pos.getX(i), pos.getY(i), pos.getZ(i));\n                }\n            }\n        }\n\n        function finalizeModelSetup() {\n            modelBounds = new THREE.Box3();\n            for (const m of modelMeshes) {\n                modelBounds.expandByObject(m);\n            }\n            if (modelBounds.isEmpty() && rawWireSegments.length > 0) {\n                for (const [a, b] of rawWireSegments) {\n                    modelBounds.expandByPoint(a);\n                    modelBounds.expandByPoint(b);\n                }\n            }\n            if (modelBounds.isEmpty()) {\n                modelBounds.set(new THREE.Vector3(-50, -50, 0), new THREE.Vector3(50, 50, 50));\n            }\n\n            const size = modelBounds.getSize(new THREE.Vector3());\n            const center = modelBounds.getCenter(new THREE.Vector3());\n            const maxDim = Math.max(size.x, size.y, size.z) || 100;\n\n            updateModelStatsUI(size);\n\n            scene.remove(gridHelper);\n            const gridSize = Math.max(10, Math.ceil((maxDim * 2.5) / 10) * 10);\n            gridHelper = new THREE.GridHelper(gridSize, 20, 0x334155, 0x1e293b);\n            gridHelper.rotation.x = Math.PI / 2;\n            gridHelper.position.set(center.x, center.y, modelBounds.min.z - 0.05);\n            scene.add(gridHelper);\n\n            const markerScale = Math.max(0.2, maxDim * 0.011);\n            hoverMarker.scale.setScalar(markerScale);\n\n            bboxHelper = new THREE.BoxHelper(modelGroup, 0xa855f7);\n            bboxHelper.visible = showBBox;\n            scene.add(bboxHelper);\n            if (showBBox) buildBBoxLabels();\n\n            resetClippingSliders();\n            updateRenderMode();\n            setCameraView('iso');\n\n            skeleton = serializedModelData.parts.length ? skBuild(serializedModelData.parts) : null;\n            skRefresh();\n            if (assistDone) { const f = assistDone; assistDone = null; setTimeout(f, 0); }\n\n            if (autoDimsEnabledOnLoad) {\n                generateAutomaticDimensions(true);\n            }\n        }\n\n        // =========================================================================\n        // АВТОМАТИЧЕСКАЯ ПРОСТАНОВКА РАЗМЕРОВ (ГАБАРИТЫ + КОНТУРЫ / КАРМАНЫ)\n        // =========================================================================\n        function generateAutomaticDimensions(silent = false) {\n            if (modelBounds.isEmpty()) return;\n\n            const manualOnly = annotations.filter(a => !a.isAuto);\n            annotations.filter(a => a.isAuto).forEach(item => {\n                scene.remove(item.group3D);\n                if (item.domEl) item.domEl.remove();\n            });\n            annotations = manualOnly;\n\n            const b = modelBounds;\n            const size = b.getSize(new THREE.Vector3());\n            const maxDim = Math.max(size.x, size.y, size.z) || 100;\n            const baseOffset = Math.max(8, Math.round(maxDim * 0.17));\n            const createdItems = [];\n\n            if (size.x > 0.01) {\n                const dimX = createLinearDimension(\n                    new THREE.Vector3(b.min.x, b.min.y, b.min.z),\n                    new THREE.Vector3(b.max.x, b.min.y, b.min.z),\n                    new THREE.Vector3(0, -1, 0),\n                    baseOffset,\n                    '#38bdf8',\n                    `X: ${size.x.toFixed(2)} ${currentUnit}`,\n                    2\n                );\n                dimX.isAuto = true;\n                createdItems.push(dimX);\n            }\n\n            if (size.y > 0.01) {\n                const dimY = createLinearDimension(\n                    new THREE.Vector3(b.max.x, b.min.y, b.min.z),\n                    new THREE.Vector3(b.max.x, b.max.y, b.min.z),\n                    new THREE.Vector3(1, 0, 0),\n                    baseOffset,\n                    '#f59e0b',\n                    `Y: ${size.y.toFixed(2)} ${currentUnit}`,\n                    2\n                );\n                dimY.isAuto = true;\n                createdItems.push(dimY);\n            }\n\n            if (size.z > 0.01) {\n                const dimZ = createLinearDimension(\n                    new THREE.Vector3(b.max.x, b.min.y, b.min.z),\n                    new THREE.Vector3(b.max.x, b.min.y, b.max.z),\n                    new THREE.Vector3(1, -1, 0).normalize(),\n                    baseOffset,\n                    '#10b981',\n                    `Z: ${size.z.toFixed(2)} ${currentUnit}`,\n                    2\n                );\n                dimZ.isAuto = true;\n                createdItems.push(dimZ);\n            }\n\n            const featureDims = detectFeatureDimensionsFromWires(b, size, baseOffset);\n            for (const fd of featureDims) {\n                const fItem = createLinearDimension(fd.p1, fd.p2, fd.normal, fd.offset, fd.color, fd.label, 2);\n                fItem.isAuto = true;\n                createdItems.push(fItem);\n            }\n\n            renderDimensionsSidebar();\n            if (!silent) {\n                showToast(`Авторазмеры обновлены (${createdItems.length}). Любой размер можно отредактировать.`);\n            }\n        }\n\n        function detectFeatureDimensionsFromWires(bounds, size, baseOffset) {\n            const results = [];\n            if (!rawWireSegments || rawWireSegments.length === 0) return results;\n\n            const xMin = bounds.min.x, xMax = bounds.max.x;\n            const yMin = bounds.min.y, yMax = bounds.max.y;\n            const tol = Math.max(0.25, Math.max(size.x, size.y, size.z) * 0.004);\n\n            const xCandidates = [];\n            for (const [a, b] of rawWireSegments) {\n                const dy = Math.abs(a.y - b.y);\n                const dz = Math.abs(a.z - b.z);\n                const len = Math.abs(b.x - a.x);\n                if (dy \u003c tol && dz \u003c tol && len > size.x * 0.12 && len \u003c size.x * 0.92) {\n                    const nearOuterY = Math.abs(a.y - yMin) \u003c tol || Math.abs(a.y - yMax) \u003c tol;\n                    if (!nearOuterY) {\n                        xCandidates.push({ p1: a.clone(), p2: b.clone(), len });\n                    }\n                }\n            }\n\n            xCandidates.sort((u, v) => v.len - u.len);\n            const pickedX = [];\n            for (const cand of xCandidates) {\n                const minX = Math.min(cand.p1.x, cand.p2.x);\n                const maxX = Math.max(cand.p1.x, cand.p2.x);\n                const duplicate = pickedX.some(p =>\n                    Math.abs(Math.min(p.p1.x, p.p2.x) - minX) \u003c tol * 2 &&\n                    Math.abs(Math.max(p.p1.x, p.p2.x) - maxX) \u003c tol * 2\n                );\n                if (!duplicate) {\n                    pickedX.push(cand);\n                    results.push({\n                        p1: new THREE.Vector3(minX, cand.p1.y, cand.p1.z),\n                        p2: new THREE.Vector3(maxX, cand.p1.y, cand.p1.z),\n                        normal: new THREE.Vector3(0, 0, 1),\n                        offset: Math.max(3, baseOffset * 0.45),\n                        color: '#22d3ee',\n                        label: `${cand.len.toFixed(2)} ${currentUnit}`\n                    });\n                }\n                if (pickedX.length >= 2) break;\n            }\n\n            const yCandidates = [];\n            for (const [a, b] of rawWireSegments) {\n                const dx = Math.abs(a.x - b.x);\n                const dz = Math.abs(a.z - b.z);\n                const len = Math.abs(b.y - a.y);\n                if (dx \u003c tol && dz \u003c tol && len > size.y * 0.15 && len \u003c size.y * 0.92) {\n                    const nearOuterX = Math.abs(a.x - xMin) \u003c tol || Math.abs(a.x - xMax) \u003c tol;\n                    if (!nearOuterX) {\n                        yCandidates.push({ p1: a.clone(), p2: b.clone(), len });\n                    }\n                }\n            }\n            yCandidates.sort((u, v) => v.len - u.len);\n            if (yCandidates.length > 0) {\n                const c = yCandidates[0];\n                const minY = Math.min(c.p1.y, c.p2.y);\n                const maxY = Math.max(c.p1.y, c.p2.y);\n                results.push({\n                    p1: new THREE.Vector3(c.p1.x, minY, c.p1.z),\n                    p2: new THREE.Vector3(c.p1.x, maxY, c.p1.z),\n                    normal: new THREE.Vector3(0, 0, 1),\n                    offset: Math.max(3, baseOffset * 0.45),\n                    color: '#a78bfa',\n                    label: `${c.len.toFixed(2)} ${currentUnit}`\n                });\n            }\n\n            return results;\n        }\n\n        function updateModelStatsUI(size) {\n            document.getElementById('dim-x').textContent = `${size.x.toFixed(1)} ${currentUnit}`;\n            document.getElementById('dim-y').textContent = `${size.y.toFixed(1)} ${currentUnit}`;\n            document.getElementById('dim-z').textContent = `${size.z.toFixed(1)} ${currentUnit}`;\n        }\n\n        function mergeBufferGeometries(geos) {\n            let total = 0;\n            geos.forEach(g => total += g.attributes.position.count);\n            const merged = new Float32Array(total * 3);\n            let offset = 0;\n            geos.forEach(g => {\n                merged.set(g.attributes.position.array, offset);\n                offset += g.attributes.position.array.length;\n            });\n            const res = new THREE.BufferGeometry();\n            res.setAttribute('position', new THREE.BufferAttribute(merged, 3));\n            res.computeVertexNormals();\n            return res;\n        }\n\n        function extractMergedGeometryFromObject3D(rootObj) {\n            const geos = [];\n            rootObj.updateMatrixWorld(true);\n            rootObj.traverse(child => {\n                if (child.isMesh && child.geometry) {\n                    const g = child.geometry.clone();\n                    g.applyMatrix4(child.matrixWorld);\n                    geos.push(g.index ? g.toNonIndexed() : g);\n                }\n            });\n            if (geos.length === 0) return null;\n            return geos.length === 1 ? geos[0] : mergeBufferGeometries(geos);\n        }\n\n        // =========================================================================\n        // ПРИВЯЗКА К ВЕРШИНАМ И РЁБРАМ FREECAD\n        // =========================================================================\n        function getSnappedHit(event) {\n            if (modelMeshes.length === 0) return null;\n            const gs = guideSnap(event.clientX, event.clientY);\n            if (gs) return gs;\n\n            const rect = renderer.domElement.getBoundingClientRect();\n            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;\n            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;\n\n            raycaster.setFromCamera(mouse, activeCamera);\n            const intersects = raycaster.intersectObjects(modelMeshes, false);\n            if (intersects.length === 0) return null;\n\n            const hit = intersects[0];\n            const hitPoint = hit.point.clone();\n            const normal = hit.face\n                ? hit.face.normal.clone().transformDirection(hit.object.matrixWorld).normalize()\n                : new THREE.Vector3(0, 0, 1);\n\n            const snapEnabled = document.getElementById('snap-toggle').checked;\n            let snapType = 'Точка на грани';\n            let snapped = false;\n\n            if (snapEnabled) {\n                const camDist = activeCamera.isPerspectiveCamera\n                    ? activeCamera.position.distanceTo(hitPoint)\n                    : (orthCamera.top - orthCamera.bottom) * 1.2;\n                const threshold = camDist * 0.024;\n\n                let bestDist = threshold;\n                let bestPoint = null;\n\n                for (let i = 0; i \u003c rawVertices.length; i++) {\n                    const v = rawVertices[i];\n                    const d = v.distanceTo(hitPoint);\n                    if (d \u003c bestDist) {\n                        bestDist = d;\n                        bestPoint = v;\n                        snapType = 'Вершина';\n                    }\n                }\n\n                if (!bestPoint && rawWireSegments.length > 0) {\n                    const ab = new THREE.Vector3(), ap = new THREE.Vector3(), cp = new THREE.Vector3();\n                    let bestT = 0.5;\n                    for (let i = 0; i \u003c rawWireSegments.length; i++) {\n                        const [pa, pb] = rawWireSegments[i];\n                        ab.subVectors(pb, pa);\n                        const lsq = ab.lengthSq();\n                        if (lsq \u003c 1e-12) continue;\n                        ap.subVectors(hitPoint, pa);\n                        const t = Math.max(0, Math.min(1, ap.dot(ab) / lsq));\n                        cp.copy(pa).addScaledVector(ab, t);\n                        const d = cp.distanceTo(hitPoint);\n                        if (d \u003c bestDist) { bestDist = d; bestPoint = cp.clone(); bestT = t; }\n                    }\n                    if (bestPoint) {\n                        snapType = 'Точка на ребре';\n                        const stops = [[0.5, 'Середина ребра', 0.05], [0.25, 'Четверть ребра', 0.025], [0.75, 'Четверть ребра', 0.025], [1 / 3, 'Треть ребра', 0.025], [2 / 3, 'Треть ребра', 0.025]];\n                        for (const [st, nm, tol] of stops) {\n                            if (Math.abs(bestT - st) \u003c tol) {\n                                const seg = rawWireSegments.find(([pa, pb]) => {\n                                    const pt = new THREE.Vector3().lerpVectors(pa, pb, bestT);\n                                    return pt.distanceToSquared(bestPoint) \u003c 1e-8;\n                                });\n                                if (seg) { bestPoint = new THREE.Vector3().lerpVectors(seg[0], seg[1], st); snapType = nm; }\n                                break;\n                            }\n                        }\n                    }\n                }\n\n                if (!bestPoint && hit.face) {\n                    const posAttr = hit.object.geometry.attributes.position;\n                    const triVerts = [\n                        new THREE.Vector3().fromBufferAttribute(posAttr, hit.face.a).applyMatrix4(hit.object.matrixWorld),\n                        new THREE.Vector3().fromBufferAttribute(posAttr, hit.face.b).applyMatrix4(hit.object.matrixWorld),\n                        new THREE.Vector3().fromBufferAttribute(posAttr, hit.face.c).applyMatrix4(hit.object.matrixWorld)\n                    ];\n                    for (const tv of triVerts) {\n                        const d = tv.distanceTo(hitPoint);\n                        if (d \u003c bestDist) {\n                            bestDist = d;\n                            bestPoint = tv;\n                            snapType = 'Вершина сетки';\n                        }\n                    }\n                }\n\n                if (bestPoint) {\n                    hitPoint.copy(bestPoint);\n                    snapped = true;\n                }\n            }\n\n            return { point: hitPoint, normal, snapped, snapType };\n        }\n\n        // =========================================================================\n        // ИНТЕРАКТИВНЫЕ ИНСТРУМЕНТЫ\n        // =========================================================================\n        // клик выбранным инструментом по точке (с привязкой); hit = { point, normal, snapped, snapType, guideRef? }\n        function toolClick(hit) {\n                const sizeLen = modelBounds.getSize(new THREE.Vector3()).length() || 100;\n                const defaultOffset = Math.max(4, Math.round(sizeLen * 0.06));\n\n                if (currentTool === 'measure') {\n                    pendingPoints.push(hit);\n                    addTempMarker(hit.point);\n\n                    if (pendingPoints.length === 1) {\n                        updateStatusBanner('Кликните 2-ю точку на детали для завершения размера', 'bg-amber-400');\n                    } else if (pendingPoints.length === 2) {\n                        const p1 = pendingPoints[0].point;\n                        const p2 = pendingPoints[1].point;\n                        const avgN = pendingPoints[0].normal.clone().add(pendingPoints[1].normal).normalize();\n                        if (avgN.lengthSq() \u003c 0.01) avgN.set(0, 0, 1);\n\n                        const item = createLinearDimension(p1, p2, avgN, defaultOffset, '#38bdf8');\n                        // точки на вспомогательных линиях: размер будет следовать за линией\n                        const rf = [pendingPoints[0].guideRef || null, pendingPoints[1].guideRef || null];\n                        if (rf[0] || rf[1]) item.refs = rf;\n                        clearPendingMeasurement();\n                        afterCreate(item);\n                    }\n                } else if (currentTool === 'diameter') {\n                    pendingPoints.push(hit);\n                    addTempMarker(hit.point);\n\n                    if (pendingPoints.length === 1) {\n                        updateStatusBanner('Кликните 2-ю точку на кромке отверстия/дуги', 'bg-cyan-400');\n                    } else if (pendingPoints.length === 2) {\n                        updateStatusBanner('Кликните 3-ю точку на кромке отверстия/дуги', 'bg-cyan-400');\n                    } else if (pendingPoints.length === 3) {\n                        const circle = fitCircle3D(pendingPoints[0].point, pendingPoints[1].point, pendingPoints[2].point);\n                        if (!circle) {\n                            showToast('Точки лежат на одной прямой — невозможно построить окружность');\n                            clearPendingMeasurement();\n                            return;\n                        }\n                        const item = createDiameterDimension(circle.center, pendingPoints[0].point, circle.normal, circle.radius, defaultOffset, '#22d3ee');\n                        clearPendingMeasurement();\n                        afterCreate(item);\n                    }\n                } else if (currentTool === 'angle') {\n                    pendingPoints.push(hit);\n                    addTempMarker(hit.point);\n\n                    if (pendingPoints.length === 1) {\n                        updateStatusBanner('Кликните точку на первом луче угла', 'bg-pink-400');\n                    } else if (pendingPoints.length === 2) {\n                        updateStatusBanner('Кликните точку на втором луче угла', 'bg-pink-400');\n                    } else if (pendingPoints.length === 3) {\n                        const item = createAngleDimension(pendingPoints[0].point, pendingPoints[1].point, pendingPoints[2].point, defaultOffset, '#f472b6');\n                        clearPendingMeasurement();\n                        afterCreate(item);\n                    }\n                } else if (currentTool === 'aux') {\n                    pendingPoints.push(hit);\n                    addTempMarker(hit.point);\n                    if (pendingPoints.length === 1) {\n                        updateStatusBanner('Кликните 2-ю точку на грани — получится вспомогательная линия', 'bg-violet-400');\n                    } else if (pendingPoints.length === 2) {\n                        updateStatusBanner('Кликните 3-ю точку: размер пойдёт к линии под 90° (угол меняется в карточке)', 'bg-violet-400');\n                    } else if (pendingPoints.length === 3) {\n                        const [h1, h2, h3] = pendingPoints;\n                        const fn = h1.normal.clone().add(h2.normal).normalize();\n                        if (fn.lengthSq() \u003c 0.01) fn.set(0, 0, 1);\n                        const item = createAuxDimension(h1.point.clone(), h2.point.clone(), h3.point.clone(), fn, defaultOffset);\n                        clearPendingMeasurement();\n                        if (item) afterCreate(item); else showToast('Точки лежат на одной прямой — размер построить нельзя');\n                    }\n                } else if (currentTool === 'guide') {\n                    pendingPoints.push(hit);\n                    addTempMarker(hit.point);\n                    if (pendingPoints.length === 1) {\n                        updateStatusBanner('Кликните 2-ю точку — конец вспомогательной линии', 'bg-violet-400');\n                    } else {\n                        const [h1, h2] = pendingPoints;\n                        if (h1.point.distanceTo(h2.point) \u003c 1e-6) { clearPendingMeasurement(); showToast('Точки совпадают — линию построить нельзя'); return; }\n                        const n = h1.normal.clone().add(h2.normal);\n                        if (n.lengthSq() \u003c 0.01) n.set(0, 0, 1);\n                        const g = guideCreate(h1.point.clone(), h2.point.clone(), n.normalize(), [h1.guideRef || null, h2.guideRef || null]);\n                        clearPendingMeasurement();\n                        guidesChanged();\n                        focusGuide(g.id);\n                    }\n                } else if (currentTool === 'callout') {\n                    const item = createCalloutAnnotation(hit.point.clone(), hit.normal.clone(), Math.max(8, Math.round(sizeLen * 0.1)), 'Примечание / Отв.');\n                    selectAnnotation(item.id);\n                    setTimeout(() => {\n                        const inp = document.getElementById(`input-text-${item.id}`);\n                        if (inp) { inp.focus(); inp.select(); }\n                    }, 40);\n                }\n        }\n\n        function setupViewportInteractions() {\n            const canvas = renderer.domElement;\n            let downPos = { x: 0, y: 0 };\n\n            canvas.addEventListener('pointermove', (e) => {\n                if (currentTool === 'orbit' || modelMeshes.length === 0) {\n                    hoverMarker.visible = false;\n                    snapTooltipEl.classList.add('hidden');\n                    updateTempPreviewLine(null);\n                    return;\n                }\n\n                const hit = getSnappedHit(e);\n                if (hit) {\n                    hoverMarker.position.copy(hit.point);\n                    hoverMarker.visible = true;\n                    hoverMarker.material.color.setHex(hit.snapped ? 0x10b981 : 0xf59e0b);\n\n                    const rect = viewportEl.getBoundingClientRect();\n                    snapTooltipEl.style.left = `${e.clientX - rect.left}px`;\n                    snapTooltipEl.style.top = `${e.clientY - rect.top}px`;\n                    snapTooltipEl.textContent = hit.snapType;\n                    snapTooltipEl.classList.remove('hidden');\n                    snapTooltipEl.className = `px-2 py-0.5 rounded bg-slate-900/95 border text-[10px] font-medium shadow-lg ${\n                        hit.snapped ? 'border-emerald-500/70 text-emerald-300' : 'border-amber-500/70 text-amber-300'\n                    }`;\n\n                    if (pendingPoints.length > 0) {\n                        updateTempPreviewLine(hit.point);\n                    }\n                } else {\n                    hoverMarker.visible = false;\n                    snapTooltipEl.classList.add('hidden');\n                    updateTempPreviewLine(null);\n                }\n            });\n\n            canvas.addEventListener('pointerdown', (e) => {\n                downPos = { x: e.clientX, y: e.clientY };\n            });\n\n            canvas.addEventListener('pointerup', (e) => {\n                const dist = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);\n                if (dist > 4 || e.button !== 0 || currentTool === 'orbit') return;\n\n                const hit = getSnappedHit(e);\n                if (!hit) return;\n\n                toolClick(hit);\n            });\n\n            window.addEventListener('keydown', (e) => {\n                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;\n                const k = e.key.toLowerCase();\n                if (e.key === 'Escape') {\n                    clearPendingMeasurement();\n                    setTool('orbit');\n                } else if (k === 'm') setTool('measure');\n                else if (k === 'd') setTool('diameter');\n                else if (k === 'a') setTool('angle');\n                else if (k === 'n') setTool('callout');\n                else if (k === 'l') setTool('aux');\n                else if (k === 'g') setTool('guide');\n                else if (e.key === 'Delete' && selectedAnnotationId) {\n                    e.preventDefault();\n                    deleteAnnotation(selectedAnnotationId);\n                    showToast('Размер удалён');\n                }\n            });\n        }\n\n        function addTempMarker(point) {\n            const maxDim = modelBounds.getSize(new THREE.Vector3()).length() || 100;\n            const m = new THREE.Mesh(\n                new THREE.SphereGeometry(Math.max(0.3, maxDim * 0.008), 14, 14),\n                new THREE.MeshBasicMaterial({ color: 0x38bdf8, depthTest: false })\n            );\n            m.position.copy(point);\n            m.renderOrder = 999;\n            scene.add(m);\n            tempMarkers.push(m);\n        }\n\n        function updateTempPreviewLine(cursorPt) {\n            if (tempLine) {\n                scene.remove(tempLine);\n                tempLine.geometry.dispose();\n                tempLine = null;\n            }\n            if (pendingPoints.length === 0 || !cursorPt) return;\n\n            const pts = pendingPoints.map(p => p.point).concat([cursorPt]);\n            const geo = new THREE.BufferGeometry().setFromPoints(pts);\n            const mat = new THREE.LineDashedMaterial({ color: 0x38bdf8, dashSize: 2, gapSize: 1.5, depthTest: false });\n            tempLine = new THREE.Line(geo, mat);\n            tempLine.computeLineDistances();\n            tempLine.renderOrder = 998;\n            scene.add(tempLine);\n        }\n\n        function clearPendingMeasurement() {\n            pendingPoints = [];\n            tempMarkers.forEach(m => {\n                scene.remove(m);\n                m.geometry.dispose();\n            });\n            tempMarkers = [];\n            updateTempPreviewLine(null);\n            updateToolStatusPrompt();\n        }\n\n        function fitCircle3D(p1, p2, p3) {\n            const v1 = new THREE.Vector3().subVectors(p2, p1);\n            const v2 = new THREE.Vector3().subVectors(p3, p1);\n            const cross = new THREE.Vector3().crossVectors(v1, v2);\n            const area2 = cross.lengthSq();\n            if (area2 \u003c 1e-8) return null;\n\n            const normal = cross.clone().normalize();\n            const v1Sq = v1.lengthSq();\n            const v2Sq = v2.lengthSq();\n\n            const num = new THREE.Vector3()\n                .crossVectors(cross, v1).multiplyScalar(v2Sq)\n                .add(new THREE.Vector3().crossVectors(v2, cross).multiplyScalar(v1Sq));\n            const center = p1.clone().add(num.divideScalar(2 * area2));\n            const radius = center.distanceTo(p1);\n            return { center, radius, normal };\n        }\n\n        // =========================================================================\n        // СОЗДАНИЕ И ПЕРЕСЧЁТ 3D-РАЗМЕРОВ И ВЫНОСОК\n        // =========================================================================\n        function createAnnotationFromSpec(spec) {\n            if (spec.type === 'linear' && spec.points.length >= 2) {\n                return createLinearDimension(spec.points[0], spec.points[1], spec.normal, spec.offset, spec.color, spec.customText, spec.precision);\n            } else if (spec.type === 'diameter' && spec.points.length >= 2) {\n                const r = spec.points[0].distanceTo(spec.points[1]);\n                return createDiameterDimension(spec.points[0], spec.points[1], spec.normal, r, spec.offset, spec.color, spec.customText, spec.precision);\n            } else if (spec.type === 'angle' && spec.points.length >= 3) {\n                return createAngleDimension(spec.points[0], spec.points[1], spec.points[2], spec.offset, spec.color, spec.customText, spec.precision);\n            }\n            return createCalloutAnnotation(spec.points[0], spec.normal, spec.offset, spec.customText || 'Заметка', spec.color);\n        }\n\n        function auxCompute(item) {\n            const { a, b, p3, fn, angle } = item.aux;\n            const u = new THREE.Vector3().subVectors(b, a);\n            if (u.lengthSq() \u003c 1e-9) return false;\n            u.normalize();\n            const w = new THREE.Vector3().crossVectors(fn, u).normalize();\n            const d = new THREE.Vector3().subVectors(p3, a);\n            const th = THREE.MathUtils.degToRad(angle), sn = Math.sin(th), cs = Math.cos(th);\n            const tt = d.dot(u), ww = d.dot(w);\n            if (Math.abs(sn) \u003c 0.05 || Math.abs(ww) \u003c 1e-6) return false;\n            const sLen = ww / sn, t = tt - sLen * cs;\n            const foot = a.clone().add(u.multiplyScalar(t));\n            item.points = [foot, p3.clone()];\n            item.value = Math.abs(sLen);\n            if (!item.isCustomText) item.text = formatAutoValue(item);\n            if (item.domEl) item.domEl.textContent = item.text;\n            rebuildAnnotation3D(item);\n            return true;\n        }\n        function createAuxDimension(a, b, p3, fn, offset) {\n            const item = createLinearDimension(a.clone(), p3.clone(), fn, offset, '#a78bfa', null, 2);\n            item.aux = { a, b, p3: p3.clone(), fn: fn.clone(), angle: 90 };\n            item.isAux = true;\n            if (!auxCompute(item)) { deleteAnnotation(item.id); return null; }\n            return item;\n        }\n\n        function createLinearDimension(p1, p2, normal, offset = 10, color = '#38bdf8', customText = null, precision = 2) {\n            const id = 'ann_' + Date.now() + '_' + Math.floor(Math.random() * 10000);\n            const distance = p1.distanceTo(p2);\n            const item = {\n                id,\n                type: 'linear',\n                points: [p1.clone(), p2.clone()],\n                normal: normal.clone(),\n                value: distance,\n                precision,\n                text: customText || `${distance.toFixed(precision)} ${currentUnit}`,\n                isCustomText: Boolean(customText),\n                color,\n                offset,\n                visible: true,\n                group3D: new THREE.Group(),\n                labelPos3D: new THREE.Vector3(),\n                domEl: null\n            };\n            rebuildAnnotation3D(item);\n            scene.add(item.group3D);\n            createAnnotationBadge(item);\n            annotations.push(item);\n            if (item.type === 'linear' || item.type === 'angle') item.anchor = window.__defAnchor ?? 0;\n            if (window.__showScaleAll) item.showScale = true;\n            if (window.__defLimit) item.limitMode = window.__defLimit;\n            renderDimensionsSidebar();\n            return item;\n        }\n\n        function createDiameterDimension(center, edgePt, normal, radius, offset = 10, color = '#22d3ee', customText = null, precision = 2) {\n            const id = 'ann_' + Date.now() + '_' + Math.floor(Math.random() * 10000);\n            const diameter = radius * 2;\n            const item = {\n                id,\n                type: 'diameter',\n                points: [center.clone(), edgePt.clone()],\n                normal: normal.clone(),\n                value: diameter,\n                precision,\n                text: customText || `Ø${diameter.toFixed(precision)} ${currentUnit}`,\n                isCustomText: Boolean(customText),\n                color,\n                offset,\n                visible: true,\n                group3D: new THREE.Group(),\n                labelPos3D: new THREE.Vector3(),\n                domEl: null\n            };\n            rebuildAnnotation3D(item);\n            scene.add(item.group3D);\n            createAnnotationBadge(item);\n            annotations.push(item);\n            if (item.type === 'linear' || item.type === 'angle') item.anchor = window.__defAnchor ?? 0;\n            if (window.__showScaleAll) item.showScale = true;\n            if (window.__defLimit) item.limitMode = window.__defLimit;\n            renderDimensionsSidebar();\n            return item;\n        }\n\n        function createAngleDimension(vertex, ptA, ptB, offset = 12, color = '#f472b6', customText = null, precision = 1) {\n            const id = 'ann_' + Date.now() + '_' + Math.floor(Math.random() * 10000);\n            const vA = new THREE.Vector3().subVectors(ptA, vertex).normalize();\n            const vB = new THREE.Vector3().subVectors(ptB, vertex).normalize();\n            const deg = THREE.MathUtils.radToDeg(vA.angleTo(vB));\n            const normal = new THREE.Vector3().crossVectors(vA, vB).normalize();\n            if (normal.lengthSq() \u003c 0.01) normal.set(0, 0, 1);\n\n            const item = {\n                id,\n                type: 'angle',\n                points: [vertex.clone(), ptA.clone(), ptB.clone()],\n                normal,\n                value: deg,\n                precision,\n                text: customText || `${deg.toFixed(precision)}°`,\n                isCustomText: Boolean(customText),\n                color,\n                offset,\n                visible: true,\n                group3D: new THREE.Group(),\n                labelPos3D: new THREE.Vector3(),\n                domEl: null\n            };\n            rebuildAnnotation3D(item);\n            scene.add(item.group3D);\n            createAnnotationBadge(item);\n            annotations.push(item);\n            if (item.type === 'linear' || item.type === 'angle') item.anchor = window.__defAnchor ?? 0;\n            if (window.__showScaleAll) item.showScale = true;\n            if (window.__defLimit) item.limitMode = window.__defLimit;\n            renderDimensionsSidebar();\n            return item;\n        }\n\n        function createCalloutAnnotation(p1, normal, offset = 15, text = 'Заметка', color = '#10b981') {\n            const id = 'ann_' + Date.now() + '_' + Math.floor(Math.random() * 10000);\n            const item = {\n                id,\n                type: 'callout',\n                points: [p1.clone()],\n                normal: normal.clone(),\n                value: 0,\n                precision: 0,\n                text,\n                isCustomText: true,\n                color,\n                offset,\n                visible: true,\n                group3D: new THREE.Group(),\n                labelPos3D: new THREE.Vector3(),\n                domEl: null\n            };\n            rebuildAnnotation3D(item);\n            scene.add(item.group3D);\n            createAnnotationBadge(item);\n            annotations.push(item);\n            if (item.type === 'linear' || item.type === 'angle') item.anchor = window.__defAnchor ?? 0;\n            if (window.__showScaleAll) item.showScale = true;\n            if (window.__defLimit) item.limitMode = window.__defLimit;\n            renderDimensionsSidebar();\n            return item;\n        }\n\n        // линия размера: толщина w пикселей × общая «Толщина размерных линий»; без Line2 — обычная линия в 1 пиксель\n        function fatLine(pts, color, w, opacity = 1) {\n            const k = window.__lineK || 1;\n            if (Line2 && LineMaterial && LineGeometry) {\n                const geo = new LineGeometry();\n                geo.setPositions(pts.flatMap(p => [p.x, p.y, p.z]));\n                const mat = new LineMaterial({ color: new THREE.Color(color), linewidth: w * k, transparent: opacity \u003c 1, opacity, depthTest: false });\n                mat.resolution.set(Math.max(1, viewportEl.clientWidth), Math.max(1, viewportEl.clientHeight));\n                const l = new Line2(geo, mat);\n                if (l.computeLineDistances) l.computeLineDistances();\n                l.renderOrder = 10;\n                return l;\n            }\n            return new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: new THREE.Color(color), transparent: opacity \u003c 1, opacity, depthTest: false }));\n        }\n        function setLineK(k) {\n            window.__lineK = k > 0 ? k : 1;\n            const sel = document.getElementById('line-k'); if (sel) sel.value = String(window.__lineK);\n            annotations.forEach(rebuildAnnotation3D);\n            guides.forEach(rebuildGuide3D);\n        }\n\n        function rebuildAnnotation3D(item) {\n            while (item.group3D.children.length > 0) {\n                const c = item.group3D.children[0];\n                if (c.geometry) c.geometry.dispose();\n                item.group3D.remove(c);\n            }\n\n            const hexColor = new THREE.Color(item.color);\n            const dotMat = new THREE.MeshBasicMaterial({ color: hexColor, depthTest: false });\n\n            if (item.type === 'linear') {\n                const [p1, p2] = item.points;\n                const offVec = item.normal.clone().multiplyScalar(item.offset);\n                const p1Off = p1.clone().add(offVec);\n                const p2Off = p2.clone().add(offVec);\n                const overVec = item.normal.clone().multiplyScalar(item.offset >= 0 ? 1.5 : -1.5);\n\n                // место подписи вдоль размерной линии: 0 — у первой точки, 1 — у второй (можно и за концом)\n                const lt = typeof item.lblT === 'number' ? item.lblT : 0.5;\n                const at = (t) => p1Off.clone().lerp(p2Off, t);\n                const mainLine = fatLine([at(Math.min(0, lt)), at(Math.max(1, lt))], item.color, 1.25);\n                const ext1 = fatLine([p1, p1Off.clone().add(overVec)], item.color, 1, 0.55);\n                const ext2 = fatLine([p2, p2Off.clone().add(overVec)], item.color, 1, 0.55);\n                mainLine.renderOrder = 900; ext1.renderOrder = 900; ext2.renderOrder = 900;\n                item.group3D.add(mainLine, ext1, ext2);\n\n                const r = Math.max(0.35, item.value * 0.012);\n                const sGeo = new THREE.SphereGeometry(r, 10, 10);\n                [p1, p2, p1Off, p2Off].forEach(pt => {\n                    const dot = new THREE.Mesh(sGeo, dotMat);\n                    dot.position.copy(pt);\n                    dot.renderOrder = 901;\n                    item.group3D.add(dot);\n                });\n\n                if (item.aux) {\n                    const ua = new THREE.Vector3().subVectors(item.aux.b, item.aux.a), len = ua.length();\n                    if (len > 1e-6) {\n                        ua.normalize();\n                        const ts = [0, len, new THREE.Vector3().subVectors(p1, item.aux.a).dot(ua)];\n                        const lo = item.aux.a.clone().add(ua.clone().multiplyScalar(Math.min(...ts)));\n                        const hi = item.aux.a.clone().add(ua.clone().multiplyScalar(Math.max(...ts)));\n                        const dl = new THREE.Line(new THREE.BufferGeometry().setFromPoints([lo, hi]), new THREE.LineDashedMaterial({ color: hexColor, dashSize: 1.6, gapSize: 1.1, depthTest: false }));\n                        dl.computeLineDistances(); dl.renderOrder = 900;\n                        item.group3D.add(dl);\n                    }\n                }\n                item.labelPos3D.copy(at(lt));\n            } else if (item.type === 'diameter') {\n                const [center, edgePt] = item.points;\n                const radialDir = new THREE.Vector3().subVectors(edgePt, center).normalize();\n                const oppEdgePt = center.clone().sub(radialDir.clone().multiplyScalar(item.value * 0.5));\n                const leaderTip = edgePt.clone()\n                    .add(radialDir.clone().multiplyScalar(Math.abs(item.offset) * 0.7))\n                    .add(item.normal.clone().multiplyScalar(item.offset * 0.6));\n\n                const diamLine = fatLine([oppEdgePt, edgePt, leaderTip], item.color, 1.25);\n                diamLine.renderOrder = 900;\n                item.group3D.add(diamLine);\n\n                const r = Math.max(0.35, item.value * 0.015);\n                const sGeo = new THREE.SphereGeometry(r, 10, 10);\n                [center, edgePt, oppEdgePt].forEach(pt => {\n                    const dot = new THREE.Mesh(sGeo, dotMat);\n                    dot.position.copy(pt);\n                    dot.renderOrder = 901;\n                    item.group3D.add(dot);\n                });\n\n                item.labelPos3D.copy(leaderTip);\n            } else if (item.type === 'angle') {\n                const [vertex, ptA, ptB] = item.points;\n                const vA = new THREE.Vector3().subVectors(ptA, vertex).normalize();\n                const vB = new THREE.Vector3().subVectors(ptB, vertex).normalize();\n                const radius = Math.max(4, Math.abs(item.offset) + 4);\n\n                const arcPts = [];\n                const steps = 24;\n                for (let i = 0; i \u003c= steps; i++) {\n                    const dir = new THREE.Vector3().lerpVectors(vA, vB, i / steps).normalize();\n                    arcPts.push(vertex.clone().add(dir.multiplyScalar(radius)));\n                }\n\n                const arcLine = fatLine(arcPts, item.color, 1.25);\n                const leg1 = fatLine([vertex, arcPts[0]], item.color, 1, 0.55);\n                const leg2 = fatLine([vertex, arcPts[arcPts.length - 1]], item.color, 1, 0.55);\n                arcLine.renderOrder = 900; leg1.renderOrder = 900; le   const up = () => {\n                    el.removeEventListener('pointermove', mv);\n                    el.removeEventListener('pointerup', up);\n                    if (moved) { el.dataset.dragged = '1'; setTimeout(() => { delete el.dataset.dragged; }, 0); }\n                };\n                el.addEventListener('pointermove', mv);\n                el.addEventListener('pointerup', up);\n            });\n            el.addEventListener('click', (e) => {\n                e.stopPropagation();\n                if (el.dataset.dragged) return;\n                selectAnnotation(item.id);\n                if (document.activeElement && document.activeElement.blur) document.activeElement.blur();\n                focusCard(item.id, false);\n            });\n\n            el.addEventListener('dblclick', (e) => { e.stopPropagation(); openCard(item.id); setTimeout(() => focusCard(item.id, true), 60); });\n            overlayEl.appendChild(el);\n            item.domEl = el;\n        }\n\n        // =========================================================================\n        // ПАЛИТРА ПРИ НАВЕДЕНИИ НА РАЗМЕР: название и 6 цветов\n        // =========================================================================\n        const PAL_COLORS = ['#38bdf8', '#22c55e', '#f59e0b', '#ef4444', '#a855f7', '#ec4899'];\n        let palEl = null, palT = 0;\n        function palShow(item, el) {\n            clearTimeout(palT);\n            if (!palEl) {\n                palEl = document.createElement('div');\n                palEl.className = 'dim-pal';\n                palEl.addEventListener('pointerenter', () => clearTimeout(palT));\n                palEl.addEventListener('pointerleave', palHideSoon);\n                document.body.appendChild(palEl);\n            }\n            const cur = String(item.color).toLowerCase();\n            palEl.innerHTML = '\u003cspan class=\"dim-pal-n\">\u003c/span>' + PAL_COLORS.map(c => `\u003cbutton type=\"button\" class=\"dim-pal-c${c === cur ? ина и направление сохраняются)\n                    if (g.refs[0] && !(g.rel && g.rel.kind === 'cross')) {\n                        const p = g.refs[0].id !== g.id && guidePt(g.refs[0]);\n                        if (p) { const dlt = p.clone().sub(g.a); g.a.copy(p); if (!g.refs[1] || g.rel) g.b.add(dlt); }\n                        else g.refs[0] = null;\n                    }\n                    if (g.refs[1] && !g.rel) { const p = g.refs[1].id !== g.id && guidePt(g.refs[1]); if (p) g.b.copy(p); else g.refs[1] = null; }\n                    if (!g.rel) return;\n                    const r = guideById(g.rel.ref);\n                    if (!r || r === g) { g.rel = null; return; }\n                    const L = g.a.distanceTo(g.b) || 1, dr = r.b.clone().sub(r.a).normalize(), cur = g.b.clone().sub(g.a);\n                    let v;\n                    if (g.rel.kind === 'ang' || g.rel.kind === 'cross') {\n                        // под углом deg к другой линии, в плоскости обеих линий (плоскость запоминается, чтобы не «перевернуться»)\n                        let n = Array.isArray(g.rel.n) ? new THREE.Vector3().fromArray(g.rel.n) : dr.clone().cross(cur);\n                        if (n.lengthSq() \u003c 1e-10) n = g.normal.clone().addScaledVector(dr, -g.normal.dot(dr));\n                        if (n.lengthSq() \u003c 1e-10) for (const alt of [new THREE.Vector3(0, 0, 1), new THREE.Vector3(1, 0, 0)]) { n = dr.clone().cross(alt); if (n.lengthSq() > 1e-10) break; }\n                        n.normalize();\n                        g.rel.n = n.toArray();\n                        const th = (+g.rel.deg || 0) * Math.PI / 180, cs = Math.cos(th), sn = Math.sin(th);\n                        v = dr.clone().multiplyScalar(cs).add(n.clone().cross(dr).multiplyScalar(sn)).add(n.clone().multiplyScalar(n.dot(dr) * (1 - cs)));\n                        if (g.rel.kind === 'cross') {\n                            const c = r.a.clone().lerp(r.b, 0.5);\n                            g.a.copy(c).add      annotations.forEach(a => {\n                if (!a.refs) return;\n                let ch = false;\n                a.refs.forEach((r, i) => {\n                    if (!r) return;\n                    const p = guidePt(r);\n                    if (!p) { a.refs[i] = null; return; }\n                    if (p.distanceTo(a.points[i]) > 1e-6) { a.points[i].copy(p); ch = true; }\n                });\n                if (!a.refs[0] && !a.refs[1]) delete a.refs;\n                if (ch && a.type === 'linear') {\n                    a.value = a.points[0].distanceTo(a.points[1]);\n                    if (!a.isCustomText) a.text = `${a.value.toFixed(a.precision ?? 2)} ${currentUnit}`;\n                    rebuildAnnotation3D(a);\n                    if (a.domEl) a.domEl.textContent = a.text;\n                }\n            });\n            renderGuides();\n            renderDimensionsSidebar();\n            updateOverlayPositions();\n        }\n        function guideDelete(g) {\n            scene.remove(g.group3D);\n            if (g.tagEl) g.tagEl.remove();\n            guides = guides.filter(x => x !== g);\n            guides.forEach(o => {\n                if (o.rel && o.rel.ref === g.id) o.rel = null;\n                o.refs = o.refs.map(r => (r && r.id === g.id ? null : r));\n            });\n            annotations.forEach(a => { if (a.refs) a.refs = a.refs.map(r => (r && r.id === g.id ? null : r)); });\n            guidesChanged();\n        }\n        function guidesClear() {\n            guides.forEach(g => { scene.remove(g.group3D); if (g.tagEl) g.tagEl.remove(); });\n            guides = []; guideSeq = 0;\n            renderGuides();\n        }\n        function guidesExport() {\n            return guides.map(g => ({ id: g.id, n: g.n, name: g.name, a: g.a.toArray(), b: g.b.toArray(), normal: g.normal.toArray(), color: g.color, rel: g.rel, marks: g.marks.slice(), refs: g.refs, ...(g.collapsed ? { collapsed: 1 } : {}) }));\n        }\n        function guidesRestore(list) {\n            guidesClear();\n            (Array.isArray(list) ? list : []).forEach(x => {\n                if (!Array.isArray(x.a) || !Array.isArray(x.b)) return;\n                guideCreate(new THREE.Vector3().fromArray(x.a), new THREE.Vector3().fromArray(x.b), new THREE.Vector3().fromArray(x.normal || [0, 0, 1]), x.refs || [], { id: x.id, n: x.n, name: x.name, color: x.color, rel: x.rel, marks: x.marks }).collapsed = !!x.collapsed;\n            });\n            guidesChanged();\n        }\n        function renderGuides() {\n            const wrap = document.getElementById('guides-wrap'), list = document.getElementById('guides-list');\n            if (!wrap || !list) return;\n            wrap.style.display = guides.length ? '' : 'none';\n            document.getElementById('guide-count').textContent = guides.length;\n            list.innerHTML = '';\n            guides.forEach(g => {\n                if (g.tagEl) g.tagEl.textContent = g.name;\n                const deps = guideDependents(g.id);\n                const opts = guides.filter(o => o !== g && !deps.has(o.id)).map(o => {\n                    const nm = escapeHtml(o.name), rv = g.rel && g.rel.ref === o.id ? g.rel.kind : '';\n                    return `\u003coption value=\"par:${o.id}\" ${rv === 'par' ? 'selected' : ''}>∥ параллельна «${nm}»\u003c/option>\u003coption value=\"perp:${o.id}\" ${rv === 'perp' ? 'selected' : ''}>⟂ перпендикулярна «${nm}»\u003c/option>` +\n                        `\u003coption value=\"ang:${o.id}\" ${rv === 'ang' ? 'selected' : ''}>∠ под углом к «${nm}»\u003c/option>\u003coption value=\"cross:${o.id}\" ${rv === 'cross' ? 'selected' : ''}>✕ пересекает «${nm}» по центрам под углом\u003c/option>`;\n                }).join('');\n                const marks = g.marks.map((m, i) => `\u003cspan class=\"gmk\">${fmtN(m)}\u003cbutton type=\"button\" data-g=\"mark-del\" data-i=\"${i}\" title=\"Убрать метку\">✕\u003c/button>\u003c/span>`).join('');\n                const c = document.createElement('div');\n                c.className = 'guide-card' + (g.collapsed ? ' folded' : '');\n                c.dataset.guideId = g.id;\n                const angRow = g.rel && (g.rel.kind === 'ang' || g.rel.kind === 'cross')\n                    ? `\u003cdiv style=\"display:flex;gap:6px;align-items:center;margin-top:4px\">\u003cspan>Угол\u003c/span>\u003cinput data-g=\"ang\" type=\"number\" step=\"1\" value=\"${fmtN(+g.rel.deg || 0)}\" style=\"width:70px\">\u003cspan>°\u003c/span>\u003c/div>` : '';\n                c.innerHTML = `\n                    \u003cdiv style=\"display:flex;gap:6px;align-items:center\">\n                        \u003cbutton type=\"button\" data-g=\"fold\" title=\"${g.collapsed ? 'Развернуть' : 'Свернуть'} карточку\" style=\"width:18px;flex:none;color:#c4b5fd\">${g.collapsed ? '▸' : '▾'}\u003c/button>\n                        \u003cspan style=\"width:10px;height:10px;border-radius:50%;background:${g.color};flex:none\">\u003c/span>\n                        \u003cinput data-g=\"name\" type=\"text\" value=\"${escapeHtml(g.name)}\" style=\"flex:1;min-width:0;font-weight:600\">\n                        \u003cbutton type=\"button\" data-g=\"del\" title=\"Удалить линию\" style=\"color:#f87171\">✕\u003c/button>\n                    \u003c/div>\n                    \u003cdiv class=\"gbody\">\n                    \u003cdiv style=\"display:flex;gap:6px;align-items:center;margin-top:5px\">\n                        \u003cspan>Длина\u003c/span>\u003cinput data-g=\"len\" type=\"number\" step=\"0.1\" min=\"0.1\" value=\"${fmtN(g.a.distanceTo(g.b))}\" style=\"width:84px\">\u003cspan>${escapeHtml(currentUnit)}\u003c/span>\n                    \u003c/div>\n                    \u003cdiv style=\"margin-top:5px\">\u003cselect data-g=\"rel\" title=\"Связь с другой линией: направление этой линии следует за ней (начало и длина остаются)\" style=\"width:100%\">\n                        \u003coption value=\"\">— без связи —\u003c/option>${opts}\u003c/select>\u003c/div>${angRow}\n                    \u003cdiv style=\"margin-top:5px\">${marks}\n                        \u003cdiv style=\"display:flex;gap:5px;align-items:center;margin-top:3px\">\n                            \u003cinput data-g=\"mark-in\" type=\"number\" step=\"0.1\" min=\"0\" placeholder=\"от начала\" title=\"Метка на расстоянии от начала линии — к ней можно привязать размер\" style=\"width:84px\">\n                            \u003cbutton type=\"button\" data-g=\"mark-add\" title=\"Добавить метку на линии\">＋ Метка\u003c/button>\n                        \u003c/div>\n                    \u003c/div>\n                    \u003cdiv style=\"margin-top:4px;color:#94a3b8;font-size:10px\">Привязка: концы, центр, трети, четверти, метки и любая точка линии\u003c/div>\n                    \u003c/div>`;\n                list.appendChild(c);\n            });\n        }\n        function focusGuide(id) {\n            const c = document.querySelector(`#guides-list [data-guide-id=\"${id}\"]`);\n            if (!c) return;\n            // прокручиваем только список линий, не всю страницу\n            const list = document.getElementById('guides-list');\n            const r = c.getBoundingClientRect(), pr = list.getBoundingClientRect();\n            if (r.top \u003c pr.top || r.bottom > pr.bottom) list.scrollTo({ top: Math.max(0, list.scrollTop + (r.top - pr.top) - (list.clientHeight - r.height) / 2), behavior: 'smooth' });\n            c.classList.add('flash-b');\n            setTimeout(() => c.classList.remove('flash-b'), 1800);\n        }\n        function setupGuidesUI() {\n            const list = document.getElementById('guides-list');\n            document.getElementById('guides-fold').addEventListener('click', (e) => {\n                const hide = list.style.display !== 'none';\n                list.style.display = hide ? 'none' : '';\n                e.currentTarget.textContent = hide ? '▸' : '▾';\n            });\n            list.addEventListener('change', (e) => {\n                const c = e.target.closest('[data-guide-id]'), g = c && guideById(c.dataset.guideId), k = e.target.dataset.g;\n                if (!g) return;\n                if (k === 'len') {\n                    const L = +e.target.value;\n                    if (L > 0) { const d = g.b.clone().sub(g.a).normalize(); g.b.copy(g.a).addScaledVector(d, L); g.refs[1] = null; guidesChanged(); }\n                } else if (k === 'rel') {\n                    const v = e.target.value, i = v.indexOf(':');\n                    const deg = g.rel && g.rel.deg !== undefined ? g.rel.deg : 45;\n                    g.rel = v ? { kind: v.slice(0, i), ref: v.slice(i + 1) } : null;\n                    if (g.rel && (g.rel.kind === 'ang' || g.rel.kind === 'cross')) g.rel.deg = deg;\n                    guidesChanged();\n                } else if (k === 'ang') {\n                    if (g.rel) { g.rel.deg = +e.target.value || 0; guidesChanged(); }\n                } else if (k === 'name') {\n                    g.name = e.target.value.trim() || g.name;\n                    renderGuides();\n                }\n            });\n            list.addEventListener('click', (e) => {\n                const b = e.target.closest('[data-g]'), c = e.target.closest('[data-guide-id]'), g = c && guideById(c.dataset.guideId);\n                if (!b || !g) return;\n                const k = b.dataset.g;\n                if (k === 'del') guideDelete(g);\n                else if (k === 'fold') { g.collapsed = !g.collapsed; renderGuides(); }\n                else if (k === 'mark-add') {\n                    const v = +c.querySelector('[data-g=\"mark-in\"]').value;\n                    if (isFinite(v) && v >= 0) { g.marks.push(v); g.marks.sort((x, y) => x - y); guidesChanged(); }\n                } else if (k === 'mark-del') { g.marks.splice(+b.dataset.i, 1); guidesChanged(); }\n            });\n        }\n        // привязка к вспомогательным линиям по положению мыши на экране: особые точки (10 px), затем любая точка линии (7 px)\n        function guideSnap(cx, cy) {\n            if (!guides.length || !document.getElementById('snap-toggle').checked) return null;\n            const r = viewportEl.getBoundingClientRect(), w = viewportEl.clientWidth, h = viewportEl.clientHeight;\n            const scr = (v) => { const q = v.clone().project(activeCamera); return [r.left + (q.x * 0.5 + 0.5) * w, r.top + (-q.y * 0.5 + 0.5) * h, q.z]; };\n            const STOPS = [[0, 'конец'], [1, 'конец'], [0.5, 'центр'], [1 / 3, 'треть'], [2 / 3, 'треть'], [0.25, 'четверть'], [0.75, 'четверть']];\n            let best = null, bd = 10;\n            guides.forEach(g => {\n                const c = STOPS.map(([t, n]) => ({ p: g.a.clone().lerp(g.b, t), ref: { id: g.id, t }, n }));\n                g.marks.forEach(m => c.push({ p: guidePt({ id: g.id, d: m }), ref: { id: g.id, d: m }, n: 'метка ' + fmtN(m) }));\n                c.forEach(x => {\n                    const sp = scr(x.p);\n                    if (sp[2] > 1) return;\n                    const d = Math.hypot(sp[0] - cx, sp[1] - cy);\n                    if (d \u003c bd) { bd = d; best = { point: x.p, normal: g.normal.clone(), snapped: true, snapType: `${g.name}: ${x.n}`, guideRef: x.ref }; }\n                });\n            });\n            if (best) return best;\n            bd = 7;\n            guides.forEach(g => {\n                const A = scr(g.a), B = scr(g.b), vx = B[0] - A[0], vy = B[1] - A[1], l2 = vx * vx + vy * vy;\n                if (l2 \u003c 1) return;\n                const t = Math.max(0, Math.min(1, ((cx - A[0]) * vx + (cy - A[1]) * vy) / l2));\n                const d = Math.hypot(A[0] + vx * t - cx, A[1] + vy * t - cy);\n                if (d \u003c bd) { bd = d; best = { point: g.a.clone().lerp(g.b, t), normal: g.normal.clone(), snapped: true, snapType: g.name, guideRef: { id: g.id, t } }; }\n            });\n            return best;\n        }\n\n        function updateOverlayPositions() {\n            skUpdateLabels();\n            const width = viewportEl.clientWidth;\n            const height = viewportEl.clientHeight;\n            for (const g of guides) {\n                if (!g.tagEl) continue;\n                const q = g.a.clone().lerp(g.b, 0.5).project(activeCamera);\n                if (q.z > 1) { g.tagEl.style.display = 'none'; continue; }\n                g.tagEl.style.display = 'block';\n                g.tagEl.style.left = `${(q.x * 0.5 + 0.5) * width}px`;\n                g.tagEl.style.top = `${(-(q.y * 0.5) + 0.5) * height}px`;\n            }\n\n            for (const item of annotations) {\n                if (!item.domEl) continue;\n                if (!item.visible) {\n                    item.domEl.style.display = 'none';\n                    continue;\n                }\n                const projected = item.labelPos3D.clone().project(activeCamera);\n                if (projected.z > 1) {\n                    item.domEl.style.display = 'none';\n                    continue;\n                }\n                const x = (projected.x * 0.5 + 0.5) * width;\n                const y = (-(projected.y * 0.5) + 0.5) * height;\n                item.domEl.style.display = 'block';\n                item.domEl.style.left = `${x}px`;\n                item.domEl.style.top = `${y}px`;\n            }\n\n            if (showBBox && bboxLabels.length > 0) {\n                for (const lbl of bboxLabels) {\n                    const proj = lbl.pos3D.clone().project(activeCamera);\n                    if (proj.z > 1) {\n                        lbl.el.style.display = 'none';\n                    } else {\n                        lbl.el.style.display = 'block';\n                        lbl.el.style.left = `${(proj.x * 0.5 + 0.5) * width}px`;\n                        lbl.el.style.top = `${(-(proj.y * 0.5) + 0.5) * height}px`;\n                    }\n                }\n            }\n        }\n\n        // =========================================================================\n        // ПРАВАЯ ПАНЕЛЬ ИНСПЕКТОРА РАЗМЕРОВ\n        // =========================================================================\n        // параметры «ползунка» для конвертера: границы в % (размер, диаметр) или в градусах (угол), опорная точка\n        function annParam(a) {\n            const isA = a.type === 'angle';\n            const mode = a.limitMode || 'abs';\n            const amin = a.amin ?? (isA ? 1 : 0), amax = a.amax ?? (isA ? 178 : 250);\n            let pmin = a.pmin ?? (isA ? Math.max(1, Math.round(a.value - 20)) : 50);\n            let pmax = a.pmax ?? (isA ? Math.min(178, Math.round(a.value + 20)) : 200);\n            if (mode === 'abs') {\n                if (isA) { pmin = amin; pmax = amax; }\n                else if (a.value > 0) { pmin = a.type === 'linear' ? amin / a.value * 100 : Math.max(0.1, amin / a.value * 100); pmax = amax / a.value * 100; }\n            }\n            return { param: a.param !== false, pmin, pmax, anchor: a.anchor ?? 0,\n                label: a.name || (a.isCustomText ? a.text : ''), name: a.name || '',\n                lblScale: a.lblScale || 1, syncName: groupNames[a.syncGroup] || '', propGroup: a.propGroup || 0, propName: propNames[a.propGroup] || '',\n                limOp: a.limOp || '*', limVal: a.limVal ?? 1,\n                limRef: (a.limRefOn && annotations.some(x => x.id === a.limRef)) ? annotations.findIndex(x => x.id === a.limRef) : -1, limit: mode, amin, amax, showScale: a.showScale === true, syncGroup: a.syncGroup || 0 };\n        }\n\n        // все карточки панели: обычные размеры и составные\n        const isComp = (x) => Array.isArray(x.members);\n        const allCards = () => [...annotations, ...composites];\n        let cardOrder = []; // id карточек сверху вниз: этот порядок уходит в конвертер и на сайт\n        function orderedCards() {\n            const byId = new Map(allCards().map(x => [x.id, x]));\n            const out = cardOrder.filter(id => byId.has(id));\n            cardOrder = composites.map(c => c.id).filter(id => !out.includes(id)).concat(out, annotations.map(a => a.id).filter(id => !out.includes(id)));\n            return cardOrder.map(id => byId.get(id));\n        }\n        function collapseOthers(item) { allCards().forEach(x => { if (x !== item) x.collapsed = true; }); }\n\n        const EYE_ON = '\u003csvg class=\"w-3.5 h-3.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\">\u003cpath stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z\"/>\u003cpath stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M15 12a3 3 0 11-6 0 3 3 0 016 0z\"/>\u003c/svg>';\n        const EYE_OFF = '\u003csvg class=\"w-3.5 h-3.5 text-slate-600\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\">\u003cpath stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88\"/>\u003c/svg>';\n        const SEL = 'bg-slate-900 border border-slate-700 rounded px-1 py-0.5 text-[10px] text-slate-200';\n        const NUM = 'bg-slate-900 border border-slate-700 rounded px-1 py-0.5 font-mono text-slate-200';\n\n        // шапка карточки — одинаковая для всех: она видна и в свёрнутой карточке\n        function cardHead(item) {\n            const comp = isComp(item);\n            const visible = comp ? compMembers(item).some(a => a.visible) || !compMembers(item).length : item.visible;\n            const precision = item.type !== 'callout' ? `\n                \u003cselect data-action=\"precision\"
