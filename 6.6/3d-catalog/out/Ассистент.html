ype=\"checkbox\" data-action=\"exclusive\" data-id=\"${item.id}\" ${window.__accordion ? 'checked' : ''} class=\"w-3.5 h-3.5 accent-sky-500\">\u003c/label>\n                        \u003c/div>\n                        \u003cdiv class=\"flex items-center gap-1\">\n                            ${precision}\n                            \u003cbutton type=\"button\" data-action=\"toggle\" data-id=\"${item.id}\" title=\"${comp ? 'Скрыть / показать на модели входящие размеры' : 'Скрыть / показать'}\" class=\"p-1 rounded hover:bg-slate-800 text-slate-400 hover:text-white cursor-pointer\">${visible ? EYE_ON : EYE_OFF}\u003c/button>\n                            \u003cbutton type=\"button\" data-action=\"delete\" data-id=\"${item.id}\" title=\"${comp ? 'Удалить составной размер (сами размеры останутся)' : 'Удалить'}\" class=\"p-1 rounded hover:bg-rose-500/20 text-slate-400 hover:text-rose-400 cursor-pointer\">\n                                \u003csvg class=\"w-3.5 h-3.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\">\u003cpath stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M6 18L18 6M6 6l12 12\"/>\u003c/svg>\n                            \u003c/button>\n                        \u003c/div>\n                    \u003c/div>\n                    \u003cdiv class=\"flex items-center justify-between gap-2 text-[10px]\">\n                        ${slider}\n                        \u003cdiv class=\"flex items-center gap-1\">\n                            \u003cbutton type=\"button\" class=\"mvb\" data-action=\"up\" data-id=\"${item.id}\" title=\"Переместить выше\">▲\u003c/button>\n                            \u003cbutton type=\"button\" class=\"mvb\" data-action=\"down\" data-id=\"${item.id}\" title=\"Переместить ниже\">▼\u003c/button>\n                        \u003c/div>\n                    \u003c/div>\n                \u003c/div>`;\n        }\n        // «Ограничить существующим размером»\n        function limRefBlock(item) {\n            return `\n                \u003clabel class=\"flex items-center gap-1.5 cursor-pointer\">\u003cinput type=\"checkbox\" data-action=\"refon\" data-id=\"${item.id}\" ${item.limRefOn ? 'checked' : ''}>\u003cspan>Ограничить существующим размером\u003c/span>\u003c/label>\n                ${item.limRefOn ? `\u003cselect data-action=\"refsel\" data-id=\"${item.id}\" title=\"Этот размер не будет больше выбранного\" class=\"w-full ${SEL}\">${refOptions(item)}\u003c/select>\n                    \u003cdiv class=\"flex items-center gap-1.5\">\u003cspan>Формула: размер\u003c/span>\n                        \u003cselect data-action=\"refop\" data-id=\"${item.id}\" class=\"${SEL}\">\n                            ${[['*', '×'], ['/', '÷'], ['+', '+'], ['-', '−']].map(([v, s]) => `\u003coption value=\"${v}\" ${(item.limOp || '*') === v ? 'selected' : ''}>${s}\u003c/option>`).join('')}\n                        \u003c/select>\n                        \u003cinput type=\"number\" data-action=\"refval\" data-id=\"${item.id}\" step=\"any\" value=\"${item.limVal ?? 1}\" class=\"w-14 ${NUM}\">\n                        \u003cspan class=\"font-mono\">≤ ${refCap(item) === null ? '—' : refCap(item).toFixed(1)}\u003c/span>\u003c/div>` : ''}`;\n        }\n        // лимит «от/до»\n        function limitBlock(item, mode, lo, hi, unit) {\n            return `\n                \u003cdiv class=\"flex items-center gap-1.5\">\n                    \u003cspan>Лимит:\u003c/span>\n                    \u003cselect data-action=\"limit\" data-id=\"${item.id}\" class=\"${SEL}\">\n                        \u003coption value=\"abs\" ${mode === 'abs' ? 'selected' : ''}>размер (${item.type === 'angle' ? '°' : 'мм'})\u003c/option>\n                        \u003coption value=\"pct\" ${mode === 'pct' ? 'selected' : ''}>масштаб (%)\u003c/option>\n                    \u003c/select>\n                \u003c/div>\n                \u003cdiv class=\"flex items-center gap-1.5\">\n                    \u003cspan>от\u003c/span>\n                    \u003cinput type=\"number\" data-action=\"${mode === 'abs' ? 'amin' : 'pmin'}\" data-id=\"${item.id}\" value=\"${lo}\" step=\"${isComp(item) ? 'any' : 1}\" class=\"w-14 ${NUM}\">\n                    \u003cspan>до\u003c/span>\n                    \u003cinput type=\"number\" data-action=\"${mode === 'abs' ? 'amax' : 'pmax'}\" data-id=\"${item.id}\" value=\"${hi}\" step=\"${isComp(item) ? 'any' : 1}\" class=\"w-14 ${NUM}\">\n                    \u003cspan>${unit}\u003c/span>\n                \u003c/div>`;\n        }\n        // масштаб % и группы\n        function groupBlock(item, showScale) {\n            return `\n                \u003clabel class=\"flex items-center gap-1.5 cursor-pointer\">\u003cinput type=\"checkbox\" data-action=\"showscale\" data-id=\"${item.id}\" ${showScale ? 'checked' : ''}>\u003cspan>Показывать масштаб % в конвертере\u003c/span>\u003c/label>\n                \u003cdiv class=\"flex items-center gap-1.5\">\u003cspan>Синхр.:\u003c/span>\n                    \u003cselect data-action=\"sync\" data-id=\"${item.id}\" title=\"Одинаковое значение у всех размеров группы\" class=\"flex-1 min-w-0 ${SEL}\">${grpOptions(item, 'syncGroup', groupNames)}\u003c/select>${grpName(item, 'syncGroup', 'gname', groupNames)}\u003c/div>\n                \u003cdiv class=\"flex items-center gap-1.5\">\u003cspan>Пропорц.:\u003c/span>\n                    \u003cselect data-action=\"prop\" data-id=\"${item.id}\" title=\"Размеры группы меняются в том же соотношении\" class=\"flex-1 min-w-0 ${SEL}\">${grpOptions(item, 'propGroup', propNames)}\u003c/select>${grpName(item, 'propGroup', 'pname', propNames)}\u003c/div>`;\n        }\n        const cardClass = (item) => `p-2.5 rounded-xl border-2 shadow-md transition ${item.id === selectedAnnotationId ? 'card-selected ring-2 ring-sky-400 bg-slate-800 border-sky-400 shadow-lg shadow-sky-500/30' : 'bg-slate-950/70 border-slate-600 hover:border-slate-500'}`;\n        function newCard(item) {\n            const card = document.createElement('div');\n            card.className = cardClass(item);\n            card.dataset.cardId = item.id;\n            card.addEventListener('click', () => selectAnnotation(item.id));\n            return card;\n        }\n\n        function annCard(item) {\n            const card = newCard(item);\n            card.innerHTML = `${cardHead(item)}\n                \u003cinput id=\"input-name-${item.id}\" data-action=\"name\" data-id=\"${item.id}\" type=\"text\" value=\"${escapeHtml(item.name || defName(item))}\" placeholder=\"Название размера (имя ползунка)\"\n                    class=\"w-full mb-1.5 bg-slate-900 border border-slate-700/80 rounded-lg px-2 py-1 text-xs text-white focus:outline-none focus:border-sky-500\">\n                \u003cinput id=\"input-text-${item.id}\" data-action=\"text\" data-id=\"${item.id}\" type=\"text\" value=\"${escapeHtml(item.text)}\"\n                    class=\"w-full bg-slate-900 border border-slate-700/80 rounded-lg px-2 py-1 text-xs font-mono text-white focus:outline-none focus:border-sky-500\">\n\n                \u003cdiv class=\"mt-2 flex items-center justify-between gap-2 text-[10px] text-slate-400\">\n                    \u003cspan>Размер метки:\u003c/span>\n                    \u003cinput type=\"range\" data-action=\"lblscale\" data-id=\"${item.id}\" min=\"0.6\" max=\"2.5\" step=\"0.1\" value=\"${item.lblScale || 1}\" class=\"flex-1 h-1 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-sky-500\">\n                    \u003cspan class=\"font-mono w-7 text-right\">${(item.lblScale || 1).toFixed(1)}×\u003c/span>\n                \u003c/div>\n                ${item.type !== 'callout' ? (() => {\n                    const pp = annParam(item);\n                    const anchorOpts = item.type === 'diameter' ? '' : `\n                        \u003cselect data-action=\"anchor\" data-id=\"${item.id}\" title=\"Что остаётся на месте при изменении размера\" class=\"w-full bg-slate-900 border border-slate-700 rounded px-1 py-0.5 text-[10px] text-slate-300\">\n                            \u003coption value=\"0\" ${pp.anchor === 0 ? 'selected' : ''}>${item.type === 'angle' ? 'Сторона 1 неподвижна' : 'Точка 1 неподвижна'}\u003c/option>\n                            \u003coption value=\"1\" ${pp.anchor === 1 ? 'selected' : ''}>${item.type === 'angle' ? 'Сторона 2 неподвижна' : 'Точка 2 неподвижна'}\u003c/option>\n                            \u003coption value=\"2\" ${pp.anchor === 2 ? 'selected' : ''}>Растягивать от центра\u003c/option>\n                        \u003c/select>`;\n                    const abs = pp.limit === 'abs';\n                    return `\n                \u003cdiv class=\"mt-2 pt-2 border-t border-slate-800 space-y-1.5 text-[10px] text-slate-400\">\n                    ${item.aux ? `\u003cdiv class=\"flex items-center gap-1.5\">\u003cspan>Угол к вспом. линии:\u003c/span>\u003cinput type=\"number\" data-action=\"auxang\" data-id=\"${item.id}\" min=\"5\" max=\"175\" step=\"1\" value=\"${item.aux.angle}\" class=\"w-14 ${NUM}\">\u003cspan>°\u003c/span>\u003c/div>` : ''}\n                    ${limRefBlock(item)}\n                    ${limitBlock(item, pp.limit, abs ? pp.amin : Math.round(pp.pmin), abs ? pp.amax : Math.round(pp.pmax), abs ? (item.type === 'angle' ? '°' : 'мм') : (item.type === 'angle' ? '°' : '%'))}\n                    ${groupBlock(item, pp.showScale)}\n                    ${anchorOpts}\n                \u003c/div>`;\n                })() : ''}\n            `;\n            if (item.collapsed) [...card.children].slice(2).forEach(c => c.remove());\n            compOf(item.id).forEach(c => {\n                const note = document.createElement('div');\n                note.dataset.compNote = c.id;\n                note.className = 'mb-1.5 px-2 py-1 rounded-lg border-l-4 text-slate-200 text-[10px]';\n                note.style.borderColor = c.color; note.style.background = c.color + '33';\n                note.textContent = compNote(c);\n                card.insertBefore(note, card.children[1]);\n            });\n            bindCard(card, item);\n            return card;\n        }\n\n        // составной размер: та же шапка и те же настройки, вместо метки — список входящих размеров\n        function compCard(c) {\n            const card = newCard(c);\n            card.dataset.compCard = c.id;\n            card.classList.remove('border-slate-600', 'hover:border-slate-500'); // рамка — цветом самой карточки\n            card.style.borderColor = c.color;\n            const can = annotations.filter(compCan), list = compMembers(c), r = compReach(list), bad = compOverlap(list);\n            const f2 = (v) => +v.toFixed(2);\n            const pct = c.limitMode === 'pct';\n            const lo = pct ? (c.pmin ?? 50) : (c.amin ?? f2(r.sum * 0.5)), hi = pct ? (c.pmax ?? 200) : (c.amax ?? f2(r.sum * 2));\n            const unit = pct ? '%' : currentUnit;\n            const reach = (v) => pct ? f2(r.sum ? v / r.sum * 100 : 0) : f2(v);\n            const lin = list.filter(a => a.type === 'linear');\n            const same = lin.length && lin.every(a => (a.anchor ?? 0) === (lin[0].anchor ?? 0)) ? String(lin[0].anchor ?? 0) : '';\n            const p = c.precision ?? 2;\n            card.innerHTML = `${cardHead(c)}\n                \u003cdiv class=\"space-y-1\">\n                    \u003cspan data-comp-badge=\"${c.id}\" class=\"inline-block text-[10px] px-1.5 py-0.5 rounded border text-slate-200 font-medium\" style=\"border-color:${c.color};background:${c.color}33\">Составной размер\u003c/span>\n                    \u003cinput id=\"comp-name-${c.id}\" data-action=\"name\" data-id=\"${c.id}\" type=\"text\" value=\"${escapeHtml(c.name || compName(c))}\" placeholder=\"Название (имя ползунка)\" class=\"w-full bg-slate-900 border border-slate-700/80 rounded-lg px-2 py-1 text-xs text-white focus:outline-none focus:border-violet-500\">\n                \u003c/div>\n                \u003cdiv class=\"mt-2 space-y-0.5 text-[10px] text-slate-300\">\n                    \u003cdiv>Входят размеры:\u003c/div>\n                    ${can.map(a => `\u003clabel class=\"flex items-center gap-1.5 cursor-pointer\">\u003cinput type=\"checkbox\" data-action=\"member\" data-id=\"${c.id}\" data-member=\"${a.id}\" ${c.members.includes(a.id) ? 'checked' : ''}>\u003cspan data-comp-lab=\"${a.id}\" class=\"flex-1\">${escapeHtml(annLabel(a))}\u003c/span>\u003cspan class=\"font-mono\">${a.value.toFixed(p)}\u003c/span>\u003c/label>`).join('')}\n                    ${list.length \u003c 2 ? '\u003cdiv style=\"color:#f59e0b\">Отметьте хотя бы два размера, иначе ползунок не появится.\u003c/div>' : `\u003cdiv data-comp-sum class=\"text-xs text-white pt-1\">Сейчас: \u003cb>${r.sum.toFixed(p)} ${currentUnit}\u003c/b> = ${list.map(a => a.value.toFixed(p)).join(' + ')}\u003c/div>`}\n                    ${bad.length ? `\u003cdiv style=\"color:#f59e0b\">Перекрывают друг друга: ${escapeHtml(bad.join('; '))}. Общий участок посчитается дважды.\u003c/div>` : ''}\n                \u003c/div>\n                \u003cdiv class=\"mt-2 pt-2 border-t border-slate-800 space-y-1.5 text-[10px] text-slate-400\">\n                    ${limRefBlock(c)}\n                    ${limitBlock(c, pct ? 'pct' : 'abs', lo, hi, unit)}\n                    ${list.length \u003c 2 ? '' : `\u003cdiv>Пределы входящих размеров позволяют от ${reach(r.min)} до ${reach(r.max)} ${unit}.\u003c/div>`}\n                    ${groupBlock(c, window.__showScaleAll === true)}\n                    \u003cselect data-action=\"anchor\" data-id=\"${c.id}\" ${lin.length ? '' : 'disabled'} title=\"Что остаётся на месте. Выбор задаётся сразу всем входящим размерам\" class=\"w-full bg-slate-900 border border-slate-700 rounded px-1 py-0.5 text-[10px] text-slate-300\">\n                        \u003coption value=\"\" ${same === '' ? 'selected' : ''}>У каждого входящего размера — своё\u003c/option>\n                        ${[['0', 'Точка 1 неподвижна'], ['1', 'Точка 2 неподвижна'], ['2', 'Растягивать от центра']].map(([v, s]) => `\u003coption value=\"${v}\" ${same === v ? 'selected' : ''}>${s} (у всех входящих)\u003c/option>`).join('')}\n                    \u003c/select>\n                \u003c/div>`;\n            if (c.collapsed) [...card.children].slice(2).forEach(x => x.remove());\n            bindCard(card, c);\n            return card;\n        }\n\n        // цвет карточки / линии\n        function paintCard(x) {\n            if (isComp(x)) {\n                const el = document.querySelector(`#dimensions-list [data-card-id=\"${x.id}\"]`);\n                if (el) el.style.borderColor = x.color;\n                document.querySelectorAll(`[data-comp-note=\"${x.id}\"],[data-comp-badge=\"${x.id}\"]`).forEach(n => { n.style.borderColor = x.color; n.style.background = x.color + '33'; });\n            } else {\n                if (x.domEl) x.domEl.style.borderColor = x.color;\n                rebuildAnnotation3D(x);\n            }\n        }\n\n        function bindCard(card, item) {\n            const comp = isComp(item);\n            card.querySelector('.mvh').addEventListener('pointerdown', (e) => dragCard(e, card));\n            card.querySelector('.mvh').addEventListener('click', (e) => e.stopPropagation());\n            card.querySelectorAll('label').forEach(el => el.addEventListener('click', (e) => e.stopPropagation()));\n            card.querySelectorAll('[data-action]').forEach(el => {\n                el.addEventListener('click', (e) => e.stopPropagation());\n                const action = el.dataset.action;\n                if (action === 'text') {\n                    el.addEventListener('input', (e) => {\n                        item.text = e.target.value;\n                        item.isCustomText = true;\n                        if (item.domEl) item.domEl.textContent = item.text;\n                    });\n                } else if (action === 'color') {\n                    el.addEventListener('input', (e) => {\n                        item.color = e.target.value;\n                        paintCard(item);\n                        if (item.syncGroup) allCards().forEach(x => {\n                            if (x === item || x.syncGroup !== item.syncGroup) return;\n                            x.color = item.color;\n                            paintCard(x);\n                            const ci = document.querySelector(`[data-action=\"color\"][data-id=\"${x.id}\"]`);\n                            if (ci) ci.value = x.color;\n                        });\n                    });\n                } else if (action === 'offset') {\n                    el.addEventListener('input', (e) => {\n                        item.offset = parseFloat(e.target.value);\n                        el.nextElementSibling.textContent = item.offset;\n                        rebuildAnnotation3D(item);\n                    });\n                } else if (action === 'precision') {\n                    el.addEventListener('change', (e) => {\n                        item.precision = parseInt(e.target.value, 10);\n                        if (!comp) {\n                            item.isCustomText = false;\n                            item.text = formatAutoValue(item);\n                            if (item.domEl) item.domEl.textContent = item.text;\n                        }\n                        renderDimensionsSidebar();\n                    });\n                } else if (action === 'param') {\n                    el.addEventListener('change', (e) => { item.param = e.target.checked; });\n                } else if (action === 'pmin' || action === 'pmax') {\n                    el.addEventListener('change', (e) => {\n                        const v = parseFloat(e.target.value);\n                        if (comp) item[action] = isFinite(v) && v > 0 ? v : null;\n                        else if (isFinite(v) && (item.type === 'linear' || v > 0)) { item[action] = v; compRefresh(); }\n                    });\n                } else if (action === 'prop') {\n                    el.addEventListener('change', (e) => setGroup(item, 'propGroup', e.target.value));\n                } else if (action === 'pname') {\n                    el.addEventListener('input', (e) => { propNames[item.propGroup] = e.target.value; });\n                    el.addEventListener('change', () => renderDimensionsSidebar());\n                } else if (action === 'refon') {\n                    el.addEventListener('change', (e) => {\n                        item.limRefOn = e.target.checked;\n                        const can = refList(item);\n                        if (item.limRefOn && !can.some(x => x.id === item.limRef)) {\n                            if (can.length) item.limRef = can[0].id; else { item.limRefOn = false; showToast('Нет других размеров для ограничения'); }\n                        }\n                        renderDimensionsSidebar();\n                    });\n                } else if (action === 'refop') {\n                    el.addEventListener('change', (e) => { item.limOp = e.target.value; renderDimensionsSidebar(); });\n                } else if (action === 'refval') {\n                    el.addEventListener('change', (e) => { const v = parseFloat(e.target.value); if (isFinite(v)) item.limVal = v; renderDimensionsSidebar(); });\n                } else if (action === 'refsel') {\n                    el.addEventListener('change', (e) => { item.limRef = e.target.value; renderDimensionsSidebar(); });\n                } else if (action === 'auxang') {\n                    el.addEventListener('change', (e) => {\n                        const prev = item.aux.angle, v = parseFloat(e.target.value);\n                        if (isFinite(v)) item.aux.angle = Math.max(5, Math.min(175, v));\n                        if (!auxCompute(item)) { item.aux.angle = prev; auxCompute(item); showToast('Для такого угла размер построить нельзя'); }\n                        renderDimensionsSidebar();\n                    });\n                } else if (action === 'gname') {\n                    el.addEventListener('input', (e) => { groupNames[item.syncGroup] = e.target.value; });\n                    el.addEventListener('change', () => renderDimensionsSidebar());\n                } else if (action === 'collapse') {\n                    el.addEventListener('click', () => {\n                        item.collapsed = !item.collapsed;\n                        if (!item.collapsed && window.__accordion) collapseOthers(item);\n                        renderDimensionsSidebar();\n                    });\n                } else if (action === 'exclusive') {\n                    el.addEventListener('change', (e) => {\n                        window.__accordion = e.target.checked;\n                        if (window.__accordion && selectedAnnotationId) allCards().forEach(x => { x.collapsed = x.id !== selectedAnnotationId; });\n                        renderDimensionsSidebar();\n                    });\n                } else if (action === 'lblscale') {\n                    el.addEventListener('input', (e) => { item.lblScale = parseFloat(e.target.value); el.nextElementSibling.textContent = item.lblScale.toFixed(1) + '×'; applyLblScale(item);\n                        if (item.syncGroup) annotations.forEach(x => {\n                            if (x === item || x.syncGroup !== item.syncGroup) return;\n                            x.lblScale = item.lblScale; applyLblScale(x);\n                            const inp = document.querySelector(`[data-action=\"lblscale\"][data-id=\"${x.id}\"]`);\n                            if (inp) { inp.value = x.lblScale; inp.nextElementSibling.textContent = x.lblScale.toFixed(1) + '×'; }\n                        });\n                    });\n                } else if (action === 'name') {\n                    el.addEventListener('input', (e) => {\n                        item.name = e.target.value;\n                        if (comp) document.querySelectorAll(`[data-comp-note=\"${item.id}\"]`).forEach(n => { n.textContent = compNote(item); });\n                        else document.querySelectorAll(`[data-comp-lab=\"${item.id}\"]`).forEach(n => { n.textContent = annLabel(item); });\n                    });\n                } else if (action === 'limit') {\n                    el.addEventListener('change', (e) => { item.limitMode = e.target.value; renderDimensionsSidebar(); });\n                } else if (action === 'amin' || action === 'amax') {\n                    el.addEventListener('change', (e) => {\n                        const v = parseFloat(e.target.value);\n                        if (comp) item[action] = isFinite(v) && v > 0 ? v : null;\n                        else if (isFinite(v) && (item.type === 'linear' || v >= 0)) { item[action] = v; compRefresh(); }\n                    });\n                } else if (action === 'showscale') {\n                    el.addEventListener('change', (e) => setShowScaleAll(e.target.checked));\n                } else if (action === 'sync') {\n                    el.addEventListener('change', (e) => setSync(item, e.target.value));\n                } else if (action === 'anchor') {\n                    el.addEventListener('change', (e) => {\n                        if (e.target.value === '') return;\n                        const v = parseInt(e.target.value, 10);\n                        if (comp) { compMembers(item).forEach(a => { if (a.type === 'linear') a.anchor = v; }); renderDimensionsSidebar(); }\n                        else { item.anchor = v; compRefresh(); }\n                    });\n                } else if (action === 'member') {\n                    el.addEventListener('change', () => {\n                        const a = annotations.find(x => x.id === el.dataset.member);\n                        item.members = item.members.filter(x => x !== a.id);\n                        if (el.checked) {\n                            if (['syncGroup', 'propGroup'].some(k => item[k] && a[k] === item[k])) showToast('Этот размер в одной группе с составным — сначала уберите общую группу');\n                            else { item.members.push(a.id); if (item.limRef === a.id) item.limRefOn = false; }\n                        }\n                        renderDimensionsSidebar();\n                    });\n                } else if (action === 'toggle') {\n                    el.addEventListener('click', () => {\n                        if (!comp) return toggleAnnotationVisibility(item.id);\n                        const list = compMembers(item), show = !list.some(a => a.visible);\n                        list.forEach(a => { a.visible = show; a.group3D.visible = show; });\n                        renderDimensionsSidebar();\n                    });\n                } else if (action === 'delete') {\n                    el.addEventListener('click', () => deleteAnnotation(item.id));\n                } else if (action === 'up' || action === 'down') {\n                    el.addEventListener('click', () => moveCard(item.id, action === 'up' ? -1 : 1));\n                }\n            });\n        }\n\n        // ---- порядок карточек ----\n        const cardEls = () => [...document.querySelectorAll('#dimensions-list > [data-card-id]')];\n        function markEnds() {\n            const L = cardEls();\n            L.forEach((el, n) => {\n                const u = el.querySelector('[data-action=\"up\"]'), d = el.querySelector('[data-action=\"down\"]');\n                u.disabled = n === 0; d.disabled = n === L.length - 1;\n            });\n        }\n        function moveCard(id, dir) {\n            const i = cardOrder.indexOf(id), j = i + dir;\n            if (i \u003c 0 || j \u003c 0 || j >= cardOrder.length) return;\n            [cardOrder[i], cardOrder[j]] = [cardOrder[j], cardOrder[i]];\n            renderDimensionsSidebar();\n            setTimeout(() => { const el = document.querySelector(`#dimensions-list [data-card-id=\"${id}\"]`); if (el) el.scrollIntoView({ block: 'nearest' }); }, 30);\n        }\n        function dragCard(e, card) {\n            e.preventDefault(); e.stopPropagation();\n            const list = document.getElementById('dimensions-list');\n            card.classList.add('dragging');\n            const move = (ev) => {\n                const L = cardEls().filter(x => x !== card);\n                const nx = L.find(x => { const r = x.getBoundingClientRect(); return ev.clientY \u003c r.top + r.height / 2; });\n                if (nx) { if (card.nextElementSibling !== nx) nx.before(card); }\n                else if (L.length && L[L.length - 1].nextElementSibling !== card) L[L.length - 1].after(card);\n                const r = list.getBoundingClientRect();\n                if (ev.clientY \u003c r.top + 40) list.scrollTop -= 14; else if (ev.clientY > r.bottom - 40) list.scrollTop += 14;\n            };\n            const up = () => {\n                window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);\n                cardOrder = cardEls().map(x => x.dataset.cardId);\n                renderDimensionsSidebar();\n            };\n            window.addEventListener('pointermove', move); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);\n        }\n\n        function renderDimensionsSidebar() {\n            const listEl = document.getElementById('dimensions-list');\n            document.getElementById('dim-count').textContent = annotations.length;\n            skRefresh();\n\n            if (annotations.length === 0 && composites.length === 0) {\n                listEl.innerHTML = `\n                    \u003cdiv class=\"text-center py-8 px-4 border border-dashed border-slate-800 rounded-xl\">\n                        \u003cp class=\"text-xs text-slate-400\">Размеров пока нет\u003c/p>\n                        \u003cp class=\"text-[11px] text-slate-500 mt-1\">Нажмите \u003cspa => a.name || defName(a);\n        function afterCreate(item) {\n            selectAnnotation(item.id);\n            setTimeout(() => { const n = document.getElementById('input-name-' + item.id); if (n) n.focus(); }, 40);\n        }\n        function applyLblScale(item) { if (item.domEl) item.domEl.style.fontSize = (12 * (item.lblScale || 1)) + 'px'; }\n        function openCard(id) {\n            const it = annotations.find(a => a.id === id); if (it) { it.collapsed = false; if (window.__accordion) collapseOthers(it); }\n            selectAnnotation(id);\n            setTimeout(() => { const n = document.getElementById('input-name-' + id); if (n) { n.focus(); n.select(); } }, 40);\n        }\n        function grpOptions(item, key, names) {\n            const groups = [...new Set(allCards().map(a => a[key] || 0).filter(g => g))].sort((x, y) => x - y);\n            let h = `\u003coption value=\"0\" ${!item[key] ? 'selected' : ''}>— нет —\u003c/option>`;\n            groups.forEach(g => { h += `\u003coption value=\"${g}\" ${item[key] === g ? 'selected' : ''}>${escapeHtml(names[g] || 'Группа ' + g)}\u003c/option>`; });\n            return h + '\u003coption value=\"new\">＋ Новая группа\u003c/option>';\n        }\n        function grpName(item, key, act, names) {\n            if (!item[key]) return '';\n            return `\u003cinput data-action=\"${act}\" data-id=\"${item.id}\" type=\"text\" value=\"${escapeHtml(names[item[key]] || '')}\" placeholder=\"имя группы\" class=\"w-24 bg-slate-900 border border-slate-700 rounded px-1 py-0.5 text-[10px] text-slate-200\">`;\n        }\n        function refCap(item) {\n            const r = annotations.find(x => x.id === item.limRef);\n            if (!r) return null;\n            const k = +(item.limVal ?? 1), v = r.value, op = item.limOp || '*';\n            return op === '*' ? v * k : op === '/' ? (k ? v / k : v) : op === '+' ? v + k : v - k;\n        }\n        // какими размерами можно ограничить: углы — углами, остальные — размерами; составной нельзя ограничить своей частью\n        function refList(item) {\n            return annotations.filter(x => x !== item && x.type !== 'callout' && ((x.type === 'angle') === (item.type === 'angle')) && !(item.members || []).includes(x.id));\n        }\n        function refOptions(item) {\n            return refList(item).map(x => `\u003coption value=\"${x.id}\" ${item.limRef === x.id ? 'selected' : ''}>${escapeHtml(annLabel(x))} — ${x.value.toFixed(1)}\u003c/option>`).join('');\n        }\n        // первый в группе — ведущий, у остальных ползунок по умолчанию выключен\n        const isLead = (a) => ['syncGroup', 'propGroup'].every(k => !a[k] || allCards().find(x => x[k] === a[k]) === a);\n        function setGroup(item, key, val) {\n            const names = key === 'syncGroup' ? groupNames : propNames;\n            const g = val === 'new' ? Math.max(0, ...allCards().map(a => a[key] || 0)) + 1 : (parseInt(val, 10) || 0);\n            if (g && (isComp(item) ? compMembers(item).some(a => a[key] === g) : compOf(item.id).some(c => c[key] === g))) {\n                showToast('Составной размер и входящий в него размер не могут быть в одной группе');\n                renderDimensionsSidebar();\n                return;\n            }\n            if (val === 'new') delete names[g];\n            item[key] = g;\n            if (g && key === 'syncGroup') {\n                const o = allCards().find(a => a !== item && a.syncGroup === g);\n                if (o) { item.color = o.color; if (!isComp(o) && !isComp(item)) item.lblScale = o.lblScale || 1; }\n                else item.color = SYNC_COLORS[(g - 1) % SYNC_COLORS.length];\n                if (!isComp(item)) applyLblScale(item);\n                paintCard(item);\n            }\n            if (!item.syncGroup && !item.propGroup) item.param = true;\n            allCards().forEach(a => { if (a.syncGroup || a.propGroup) a.param = isLead(a); });\n            renderDimensionsSidebar();\n        }\n        function setSync(item, val) { setGroup(item, 'syncGroup', val); }\n        // удалили ведущий размер группы — ползунок переходит следующему\n        function dropAndPromote(gone, remove) {\n            const keys = ['syncGroup', 'propGroup'].filter(k => gone[k] && allCards().find(x => x[k] === gone[k]) === gone);\n            remove();\n            keys.forEach(k => { const first = allCards().find(x => x[k] === gone[k]); if (first && isLead(first)) first.param = true; });\n        }\n\n        // ---- Составные размеры: один ползунок пропорционально меняет несколько размеров ----\n        let composites = []; // {id, name, members: [id размеров], color, amin, amax, ... те же настройки, что у размера}\n        const COMP_COLOR = '#8b5cf6';\n        const compCan = (a) => a.type === 'linear' || a.type === 'diameter';\n        const compMembers = (c) => c.members.map(id => annotations.find(a => a.id === id)).filter(a => a && compCan(a));\n        const compName = (c) => c.name || `Составной ${composites.indexOf(c) + 1}`;\n        const compOf = (id) => composites.filter(c => c.members.includes(id));\n        // сколько позволяют собственные пределы «от/до» входящих размеров (все меняются в одно и то же число раз)\n        function compReach(list) {\n            let lo = 0, hi = Infinity, sum = 0;\n            for (const a of list) {\n                const pp = annParam(a), v = a.value;\n                if (!(v > 0)) continue;\n                const mn = Math.min(v, pp.limit === 'abs' ? pp.amin : v * pp.pmin / 100), mx = Math.max(v, pp.limit === 'abs' ? pp.amax : v * pp.pmax / 100);\n                sum += v; lo = Math.max(lo, mn / v); hi = Math.min(hi, mx / v);\n            }\n            return { sum, min: sum * lo, max: sum * (isFinite(hi) ? hi : 1) };\n        }\n        // размеры на одной оси, перекрывающие друг друга: такой участок посчитается дважды\n        function compOverlap(list) {\n            const sp = list.map(a => ({ a, s: skeleton && a.type === 'linear x => isComp(x) ? 'c' + composites.indexOf(x) : 'a' + annotations.indexOf(x)); }\n        function compRestore(saved, made, order) {\n            const num = (v) => typeof v === 'number' ? v : null;\n            composites = (Array.isArray(saved) ? saved : []).map((c, n) => {\n                const o = {\n                    id: 'cmp_' + Date.now() + '_' + n, name: c.name || '',\n                    members: (c.members || []).map(i => made[i] && made[i].id).filter(Boolean),\n                    color: c.color || COMP_COLOR, precision: typeof c.precision === 'number' ? c.precision : 2, param: c.param !== false,\n                    limitMode: c.limit === 'pct' ? 'pct' : 'abs', amin: num(c.amin), amax: num(c.amax), pmin: num(c.pmin), pmax: num(c.pmax),\n                    syncGroup: c.syncGroup || 0, propGroup: c.propGroup || 0, limOp: c.limOp || '*', limVal: typeof c.limVal === 'number' ? c.limVal : 1\n                };\n                if (o.syncGroup && c.syncName) groupNames[o.syncGroup] = c.syncName;\n                if (o.propGroup && c.propName) propNames[o.propGroup] = c.propName;\n                if (c.limRef >= 0 && made[c.limRef]) { o.limRef = made[c.limRef].id; o.limRefOn = true; }\n                return o;\n            });\n            cardOrder = (Array.isArray(order) ? order : []).map(t => { const n = +String(t).slice(1), x = String(t)[0] === 'a' ? made[n] : composites[n]; return x && x.id; }).filter(Boolean);\n            renderDimensionsSidebar();\n        }\n        function applyCursor() {\n            const shape = document.getElementById('cur-shape').value;\n            const sz = parseInt(document.getElementById('cur-size').value, 10), c = sz / 2;\n            const g = { arrow: `\u003cpath d='M1 1L1 ${sz * 0.8}L${sz * 0.3} ${sz * 0.6}L${sz * 0.5} ${sz * 0.95}L${sz * 0.65} ${sz * 0.88}L${sz * 0.45} ${sz * 0.55}L${sz * 0.8} ${sz * 0.55}Z' fill='#10b981' stroke='#064e3b' stroke-width='1'/>`,\n                cross: `\u003cpath d='M${c} 0V${sz}M0
