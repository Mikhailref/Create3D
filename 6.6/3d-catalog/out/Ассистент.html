() => setFs(-0.1));\n            document.getElementById('fs-plus').addEventListener('click', () => setFs(0.1));\n            document.getElementById('mv-toggle').addEventListener('click', () => {\n                const blk = document.getElementById('mv-block'); const hide = !blk.dataset.collapsed;\n                blk.dataset.collapsed = hide ? '1' : '';\n                [...blk.children].slice(1).forEach(ch => ch.style.display = hide ? 'none' : '');\n                document.getElementById('mv-toggle').textContent = (hide ? '▶' : '▼') + ' Модель и вид';\n            });\n            const side = document.getElementById('side-panel');\n            document.getElementById('side-resize').addEventListener('pointerdown', (e) => {\n                const mv = (ev) => { side.style.width = Math.min(900, Math.max(260, window.innerWidth - ev.clientX)) + 'px'; onWindowResize(); };\n                const up = () => { window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); };\n                window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up);\n            });\n        }\n\n        function formatAutoValue(item) {\n            if (item.type === 'linear') return `${item.value.toFixed(item.precision)} ${currentUnit}`;\n            if (item.type === 'diameter') return `Ø${item.value.toFixed(item.precision)} ${currentUnit}`;\n            if (item.type === 'angle') return `${item.value.toFixed(item.precision)}°`;\n            return item.text;\n        }\n\n        // прокрутить список к карточке размера (в центр) и подсветить: рамку (full=false) или всю карточку (full=true)\n        function focusCard(id, full) {\n            const list = document.getElementById('dimensions-list');\n            list.querySelectorAll('.flash-b,.flash-all').forEach(x => x.classList.remove('flash-b', 'flash-all'));\n            const c = list.querySelector(`[data-card-id=\"${id}\"]`);\n            if (!c) return;\n            // плавно прокручиваем сам список (ближайший прокручиваемый родитель), чтобы карточка встала в центр\n            requestAnimationFrame(() => {\n                let p = c.parentElement;\n                while (p && !(/(auto|scroll)/.test(getComputedStyle(p).overflowY) && p.scrollHeight > p.clientHeight + 1)) p = p.parentElement;\n                if (!p) { c.scrollIntoView({ block: 'center' }); return; }\n                const r = c.getBoundingClientRect(), pr = p.getBoundingClientRect();\n                p.scrollTo({ top: Math.max(0, p.scrollTop + (r.top - pr.top) - (p.clientHeight - r.height) / 2), behavior: 'smooth' });\n            });\n            c.classList.add(full ? 'flash-all' : 'flash-b');\n            clearTimeout(focusCard.t);\n            focusCard.t = setTimeout(() => c.classList.remove('flash-b', 'flash-all'), 1800);\n        }\n\n        function selectAnnotation(id) {\n            selectedAnnotationId = id;\n            if (window.__accordion) allCards().forEach(a => { a.collapsed = a.id !== id; });\n            annotations.forEach(a => {\n                if (a.domEl) a.domEl.classList.toggle('selected', a.id === id);\n            });\n            renderDimensionsSidebar();\n            const c = document.querySelector('#dimensions-list .card-selected');\n            if (c) c.scrollIntoView({ block: 'nearest', behavior: 'smooth' });\n        }\n\n        function toggleAnnotationVisibility(id) {\n            const item = annotations.find(a => a.id === id);\n            if (!item) return;\n            item.visible = !item.visible;\n            item.group3D.visible = item.visible;\n            renderDimensionsSidebar();\n        }\n\n        function deleteAnnotation(id) {\n            const comp = composites.find(c => c.id === id);\n            if (comp) {\n                dropAndPromote(comp, () => { composites = composites.filter(c => c !== comp); });\n                if (selectedAnnotationId === id) selectedAnnotationId = null;\n                renderDimensionsSidebar();\n                return;\n            }\n            const idx = annotations.findIndex(a => a.id === id);\n            if (idx === -1) return;\n            const item = annotations[idx];\n            scene.remove(item.group3D);\n            if (item.domEl) item.domEl.remove();\n            dropAndPromote(item, () => { annotations.splice(idx, 1); });\n            composites.forEach(c => { c.members = c.members.filter(x => x !== id); if (c.limRef === id) c.limRefOn = false; });\n            if (selectedAnnotationId === id) selectedAnnotationId = null;\n            renderDimensionsSidebar();\n        }\n\n        function clearAllDimensions(silent = false) {\n            annotations.forEach(item => {\n                scene.remove(item.group3D);\n                if (item.domEl) item.domEl.remove();\n            });\n            annotations = [];\n            composites = [];\n            cardOrder = [];\n            selectedAnnotationId = null;\n            renderDimensionsSidebar();\n            if (!silent) showToast('Все размеры очищены');\n        }\n\n        // =========================================================================\n        // ГАБАРИТНЫЙ КОНТЕЙНЕР (X × Y × Z), КАМЕРА И СЕЧЕНИЯ\n        // =========================================================================\n        function toggleBoundingBox() {\n            showBBox = !showBBox;\n            const btn = document.getElementById('btn-bbox');\n            if (showBBox) {\n                btn.classList.add('bg-purple-600/30', 'text-purple-300', 'border', 'border-purple-500/50');\n                if (bboxHelper) bboxHelper.visible = true;\n                buildBBoxLabels();\n            } else {\n                btn.classList.remove('bg-purple-600/30', 'text-purple-300', 'border', 'border-purple-500/50');\n                if (bboxHelper) bboxHelper.visible = false;\n                clearBBoxLabels();\n            }\n        }\n\n        function removeBBoxCards() {\n            annotations.filter(x => x.isBBox || /^Габарит [XYZ]$/.test(x.name || '')).map(x => x.id).forEach(deleteAnnotation);\n        }\n        function buildBBoxLabels() {\n            clearBBoxLabels();\n            if (modelBounds.isEmpty()) return;\n            const b = modelBounds, sz = b.getSize(new THREE.Vector3());\n            const off = Math.max(8, Math.round((Math.max(sz.x, sz.y, sz.z) || 100) * 0.17));\n            const V = (x, y, z) => new THREE.Vector3(x, y, z);\n            const specs = [\n                { n: 'X', ok: sz.x > 0.01, p1: V(b.min.x, b.min.y, b.min.z), p2: V(b.max.x, b.min.y, b.min.z), nr: V(0, -1, 0), c: '#f43f5e' },\n                { n: 'Y', ok: sz.y > 0.01, p1: V(b.max.x, b.min.y, b.min.z), p2: V(b.max.x, b.max.y, b.min.z), nr: V(1, 0, 0), c: '#10b981' },\n                { n: 'Z', ok: sz.z > 0.01, p1: V(b.max.x, b.min.y, b.min.z), p2: V(b.max.x, b.min.y, b.max.z), nr: V(1, -1, 0).normalize(), c: '#38bdf8' }\n            ];\n            const made = [];\n            specs.forEach(sp => {\n                if (!sp.ok) return;\n                const it = createLinearDimension(sp.p1, sp.p2, sp.nr, off, sp.c, null, 2);\n                it.isBBox = true; it.name = 'Габарит ' + sp.n;\n                made.push(it);\n            });\n            renderDimensionsSidebar();\n            if (made.length) selectAnnotation(made[0].id);\n        }\n\n        function clearBBoxLabels() {\n            removeBBoxCards();\n            bboxLabels.forEach(l => l.el.remove());\n            bboxLabels = [];\n        }\n\n        function setCameraView(view) {\n            const center = modelBounds.getCenter(new THREE.Vector3());\n            const size = modelBounds.getSize(new THREE.Vector3());\n            const maxDim = Math.max(size.x, size.y, size.z) || 100;\n            const dist = maxDim * 2.1;\n\n            controls.target.copy(center);\n\n            const aspect = Math.max(0.2, viewportEl.clientWidth / Math.max(1, viewportEl.clientHeight));\n            const viewH = maxDim * 1.45;\n            orthCamera.left = -viewH * aspect / 2;\n            orthCamera.right = viewH * aspect / 2;\n            orthCamera.top = viewH / 2;\n            orthCamera.bottom = -viewH / 2;\n            orthCamera.updateProjectionMatrix();\n\n            switch (view) {\n                case 'front':  activeCamera.position.set(center.x, center.y - dist, center.z); break;\n                case 'back':   activeCamera.position.set(center.x, center.y + dist, center.z); break;\n                case 'top':    activeCamera.position.set(center.x, center.y - 0.01, center.z + dist); break;\n                case 'bottom': activeCamera.position.set(center.x, center.y + 0.01, center.z - dist); break;\n                case 'right':  activeCamera.position.set(center.x + dist, center.y, center.z); break;\n                case 'left':   activeCamera.position.set(center.x - dist, center.y, center.z); break;\n                case 'iso':\n                default:\n                    activeCamera.position.set(center.x + dist * 0.72, center.y - dist * 0.78, center.z + dist * 0.65);\n                    break;\n            }\n            activeCamera.lookAt(center);\n            controls.update();\n        }\n\n        function toggleCameraProjection() {\n            const oldCam = activeCamera;\n            const target = controls.target.clone();\n            isOrtho = !isOrtho;\n            activeCamera = isOrtho ? orthCamera : persCamera;\n\n            activeCamera.position.copy(oldCam.position);\n            activeCamera.up.set(0, 0, 1);\n\n            const aspect = Math.max(0.2, viewportEl.clientWidth / Math.max(1, viewportEl.clientHeight));\n            if (isOrtho) {\n                const dist = oldCam.position.distanceTo(target);\n                const viewH = Math.max(10, dist * 0.85);\n                orthCamera.left = -viewH * aspect / 2;\n                orthCamera.right = viewH * aspect / 2;\n                orthCamera.top = viewH / 2;\n                orthCamera.bottom = -viewH / 2;\n                orthCamera.updateProjectionMatrix();\n            } else {\n                persCamera.aspect = aspect;\n                persCamera.updateProjectionMatrix();\n            }\n\n            controls.object = activeCamera;\n            controls.target.copy(target);\n            controls.update();\n\n            document.getElementById('btn-cam-type').textContent = isOrtho ? 'Орто.' : 'Персп.';\n            showToast(isOrtho ? 'Ортографическая проекция' : 'Перспективная проекция');\n        }\n\n        function updateClipping() {\n            const cx = parseInt(document.getElementById('clip-x').value, 10);\n            const cy = parseInt(document.getElementById('clip-y').value, 10);\n            const cz = parseInt(document.getElementById('clip-z').value, 10);\n\n            document.getElementById('clip-x-val').textContent = `${cx}%`;\n            document.getElementById('clip-y-val').textContent = `${cy}%`;\n            document.getElementById('clip-z-val').textContent = `${cz}%`;\n\n            if (cx >= 100 && cy >= 100 && cz >= 100) {\n                renderer.clippingPlanes = [];\n                return;\n            }\n\n            const pad = 0.5;\n            clipPlaneX.constant = (modelBounds.max.x - modelBounds.min.x + pad * 2) * (cx / 100) + modelBounds.min.x - pad;\n            clipPlaneY.constant = (modelBounds.max.y - modelBounds.min.y + pad * 2) * (cy / 100) + modelBounds.min.y - pad;\n            clipPlaneZ.constant = (modelBounds.max.z - modelBounds.min.z + pad * 2) * (cz / 100) + modelBounds.min.z - pad;\n            renderer.clippingPlanes = [clipPlaneX, clipPlaneY, clipPlaneZ];\n        }\n\n        function resetClippingSliders() {\n            ['clip-x', 'clip-y', 'clip-z'].forEach(id => document.getElementById(id).value = 100);\n            updateClipping();\n        }\n\n        // =========================================================================\n        // ИНСТРУМЕНТЫ, ТЕМА И РЕЖИМЫ ОТРИСОВКИ\n        // =========================================================================\n        function setTool(tool) {\n            currentTool = tool;\n            clearPendingMeasurement();\n\n            document.querySelectorAll('.tool-btn').forEach(btn => {\n                const active = btn.dataset.tool === tool;\n                btn.classList.toggle('bg-sky-600', active);\n                btn.classList.toggle('text-white', active);\n                btn.classList.toggle('shadow', active);\n                btn.classList.toggle('text-slate-300', !active);\n            });\n\n            renderer.domElement.style.cursor = window.__cursorCSS || (tool === 'orbit' ? 'grab' : 'crosshair');\n            updateToolStatusPrompt();\n        }\n\n        function updateToolStatusPrompt() {\n            if (currentTool === 'orbit') {\n                updateStatusBanner('ЛКМ — вращение • ПКМ — сдвиг • Колёсико — масштаб • Перетащите HTML / STL / OBJ / GLB сюда', 'bg-sky-400');\n            } else if (currentTool === 'measure') {\n                updateStatusBanner('Кликните 1-ю точку на модели (зелёный маркер = привязка к вершине/ребру)', 'bg-amber-400');\n            } else if (currentTool === 'diameter') {\n                updateStatusBanner('Кликните 3 точки на кромке отверстия или дуги для расчёта Ø диаметра', 'bg-cyan-400');\n            } else if (currentTool === 'angle') {\n                updateStatusBanner('Кликните вершину угла, затем 2 точки на его сторонах', 'bg-pink-400');\n            } else if (currentTool === 'aux') {\n                updateStatusBanner('Кликните 2 точки на грани — вспомогательная линия, затем 3-ю точку для размера под углом', 'bg-violet-400');\n            } else if (currentTool === 'guide') {\n                updateStatusBanner('Кликните 2 точки — вспомогательная линия (привязка к вершинам, рёбрам и другим линиям)', 'bg-violet-400');\n            } else if (currentTool === 'callout') {\n                updateStatusBanner('Кликните точку на модели для создания выноски с примечанием', 'bg-emerald-400');\n            }\n        }\n\n        function updateStatusBanner(text, dotColor) {\n            document.getElementById('status-text').textContent = text;\n            document.getElementById('status-dot').className = `w-2 h-2 rounded-full ${dotColor} animate-pulse shrink-0`;\n        }\n\n        function updateRenderMode() {\n            const mode = document.getElementById('render-mode').value;\n            if (modelWiresGroup) {\n                modelWiresGroup.visible = (mode === 'cad' || mode === 'xray');\n            }\n            for (const m of modelMeshes) {\n                const baseOp = m.userData.baseOpacity ?? 1.0;\n                m.material.wireframe = (mode === 'wireframe');\n                if (mode === 'xray') {\n                    m.material.transparent = true;\n                    m.material.opacity = Math.min(0.32, baseOp);\n                } else {\n                    m.material.transparent = baseOp \u003c 1.0;\n                    m.material.opacity = baseOp;\n                }\n                m.material.needsUpdate = true;\n            }\n        }\n\n        function updateUnits() {\n            currentUnit = document.getElementById('unit-select').value;\n            updateModelStatsUI(modelBounds.getSize(new THREE.Vector3()));\n            if (showBBox) buildBBoxLabels();\n\n            annotations.forEach(item => {\n                if (!item.isCustomText && (item.type === 'linear' || item.type === 'diameter')) {\n                    item.text = formatAutoValue(item);\n                    if (item.domEl) item.domEl.textContent = item.text;\n                }\n            });\n            renderDimensionsSidebar();\n        }\n\n        function toggleBgTheme() {\n            isDarkScene = !isDarkScene;\n            scene.background = new THREE.Color(isDarkScene ? 0x090d16 : 0xf1f5f9);\n            if (modelWiresGroup) {\n                modelWiresGroup.traverse(c => {\n                    if (c.isLine) c.material.color.setHex(isDarkScene ? 0x0f172a : 0x1e293b);\n                });\n            }\n        }\n\n        // ---- ЯДРО КАРКАСА (без зависимостей, этот же код нужен программе с ползунками) ----\n        // Грани: соседние треугольники с углом меньше 20° считаются одной поверхностью\n        function skFaces(parts, tol, skip) {\n            const faces = [], q = v => Math.round(v / tol);\n            for (const { positions: p } of parts) {\n                const tris = [], edges = new Map();\n                for (let i = 0; i + 8 \u003c p.length; i += 9) {\n                    const a = [p[i], p[i+1], p[i+2]], b = [p[i+3], p[i+4], p[i+5]], c = [p[i+6], p[i+7], p[i+8]];\n                    if (skip && skip(a, b, c)) continue;\n                    const u = b.map((v, k) => v - a[k]), w = c.map((v, k) => v - a[k]);\n                    const n = [u[1]*w[2]-u[2]*w[1], u[2]*w[0]-u[0]*w[2], u[0]*w[1]-u[1]*w[0]];\n                    const l = Math.hypot(...n);\n                    if (l \u003c 1e-12) continue;\n                    const t = { v: [a, b, c], n: n.map(x => x / l), area: l / 2, nb: [] };\n                    const key = t.v.map(v => v.map(q).join(','));\n                    for (let e = 0; e \u003c 3; e++) {\n                        const k = [key[e], key[(e+1)%3]].sort().join('|');\n                        for (const o of edges.get(k) || []) { t.nb.push(o); o.nb.push(t); }\n                        if (!edges.has(k)) edges.set(k, []);\n                        edges.get(k).push(t);\n                    }\n                    tris.push(t);\n                }\n                for (const s of tris) {\n                    if (s.done) continue;\n                    s.done = true;\n                    const face = [s], stack = [s];\n                    while (stack.length) {\n                        const t = stack.pop();\n                        for (const o of t.nb) {\n                            if (!o.done && t.n[0]*o.n[0] + t.n[1]*o.n[1] + t.n[2]*o.n[2] > 0.94) { o.done = true; face.push(o); stack.push(o); }\n                        }\n                    }\n                    faces.push(face);\n                }\n            }\n            return faces;\n        }\n\n        // Круг по трём точкам на плоскости\n        function skCircle(pts) {\n            const far = a => pts.reduce((m, p) => Math.hypot(p[0]-a[0], p[1]-a[1]) > Math.hypot(m[0]-a[0], m[1]-a[1]) ? p : m, a);\n            const A = far(pts[0]), B = far(A);\n            const dist = p => Math.abs((B[0]-A[0])*(p[1]-A[1]) - (B[1]-A[1])*(p[0]-A[0]));\n            const C = pts.reduce((m, p) => dist(p) > dist(m) ? p : m, pts[0]);\n            const d = 2 * (A[0]*(B[1]-C[1]) + B[0]*(C[1]-A[1]) + C[0]*(A[1]-B[1]));\n            if (Math.abs(d) \u003c 1e-9) return null;\n            const s = p => p[0]*p[0] + p[1]*p[1];\n            const x = (s(A)*(B[1]-C[1]) + s(B)*(C[1]-A[1]) + s(C)*(A[1]-B[1])) / d;\n            const y = (s(A)*(C[0]-B[0]) + s(B)*(A[0]-C[0]) + s(C)*(B[0]-A[0])) / d;\n            const r = Math.hypot(A[0]-x, A[1]-y);\n            return pts.every(p => Math.abs(Math.hypot(p[0]-x, p[1]-y) - r) \u003c r * 0.01) ? { c: [x, y], r } : null;\n        }\n\n        // Каркас: позиции плоскостей по каждой оси и участки между соседними плоскостями\n        // Резьба: кольцевая зона из витков (грани наклонены к оси). Подробности витков каркасу не нужны:\n        // остаются длина зоны и два диаметра — по впадинам (rl) и по вершинам (rh)\n        function skThreads(parts, tol) {\n            const zones = [];\n            for (const { positions: p } of parts) {\n                const q = v => Math.round(v / (tol / 10)), ids = new Map(), V = [];\n                const vid = (x, y, z) => { const k = q(x) + ',' + q(y) + ',' + q(z); let i = ids.get(k); if (i === undefined) { i = V.length / 3; ids.set(k, i); V.push(x, y, z); } return i; };\n                const T = [], N = [];\n                for (let i = 0; i + 8 \u003c p.length; i += 9) {\n                    const a = vid(p[i], p[i+1], p[i+2]), b = vid(p[i+3], p[i+4], p[i+5]), c = vid(p[i+6], p[i+7], p[i+8]);\n                    if (a === b || b === c || a === c) continue;\n                    const u = [p[i+3] - p[i], p[i+4] - p[i+1], p[i+5] - p[i+2]], w = [p[i+6] - p[i], p[i+7] - p[i+1], p[i+8] - p[i+2]];\n                    const n = [u[1]*w[2] - u[2]*w[1], u[2]*w[0] - u[0]*w[2], u[0]*w[1] - u[1]*w[0]], l = Math.hypot(...n);\n                    if (l \u003c 1e-12) continue;\n                    T.push(a, b, c); N.push(n[0] / l, n[1] / l, n[2] / l);\n                }\n                const nT = T.length / 3, nV = V.length / 3;\n                for (let A = 0; A \u003c 3; A++) {\n                    const B = (A + 1) % 3, C = (A + 2) % 3, par = Int32Array.from({ length: nV }, (_, i) => i);\n                    const fd = x => { while (par[x] !== x) { par[x] = par[par[x]]; x = par[x]; } return x; };\n                    const mid = [];\n                    for (let f = 0; f \u003c nT; f++) { const na = Math.abs(N[f*3+A]); if (na > .12 && na \u003c .97) { mid.push(f); par[fd(T[f*3])] = fd(T[f*3+1]); par[fd(T[f*3+1])] = fd(T[f*3+2]); } }\n                    const cp = new Map();\n                    for (const f of mid) {\n                        const r = fd(T[f*3]); let c = cp.get(r);\n                        if (!c) cp.set(r, c = { n: 0, mn: [1e9, 1e9, 1e9], mx: [-1e9, -1e9, -1e9] });\n                        c.n++;\n                        for (let j = 0; j \u003c 3; j++) for (let k = 0; k \u003c 3; k++) { const x = V[T[f*3+j]*3+k]; if (x \u003c c.mn[k]) c.mn[k] = x; if (x > c.mx[k]) c.mx[k] = x; }\n                    }\n                    for (const [r, c] of cp) {\n                        if (c.n \u003c 150) continue;\n                        const eb = c.mx[B] - c.mn[B], ec = c.mx[C] - c.mn[C], ez = c.mx[A] - c.mn[A];\n                        if (Math.abs(eb - ec) > .08 * Math.max(eb, ec)) continue; // должно быть полное кольцо\n                        const cb = (c.mn[B] + c.mx[B]) / 2, cc = (c.mn[C] + c.mx[C]) / 2;\n                        let rl = 1e9, rh = -1e9;\n                        for (const f of mid) {\n                            if (fd(T[f*3]) !== r) continue;\n                            for (let j = 0; j \u003c 3; j++) { const v = T[f*3+j] * 3, d = Math.hypot(V[v+B] - cb, V[v+C] - cc); if (d \u003c rl) rl = d; if (d > rh) rh = d; }\n                        }\n                        const depth = rh - rl, rm = (rl + rh) / 2;\n                        if (depth \u003c .005 * rm || depth > .3 * rm || ez \u003c 3 * depth) continue;\n                        zones.push({ k: A, zl: c.mn[A], zh: c.mx[A], c: [cb, cc], rl, rh, tr: Math.max(tol, depth * .03) });\n                    }\n                }\n            }\n            return zones;\n        }\n\n        function skBuild(parts) {\n            const lo = [Infinity, Infinity, Infinity], hi = [-Infinity, -Infinity, -Infinity];\n            for (const { positions: p } of parts) for (let i = 0; i \u003c p.length; i++) { const k = i % 3; if (p[i] \u003c lo[k]) lo[k] = p[i]; if (p[i] > hi[k]) hi[k] = p[i]; }\n            const tol = Math.max(0.01, Math.max(...hi.map((v, k) => v - lo[k])) * 1e-4);\n            const raw = [[], [], []], round = [[], [], []], cyls = [];\n            for (let k = 0; k \u003c 3; k++) raw[k].push({ v: lo[k], s: 0 }, { v: hi[k], s: 0 });\n\n            // резьба: витки в каркас не попадают, вместо них длина зоны и два диаметра\n            const zones = skThreads(parts, tol);\n            const inZone = (z, v) => { const B = (z.k + 1) % 3, C = (z.k + 2) % 3, r = Math.hypot(v[B] - z.c[0], v[C] - z.c[1]); return v[z.k] >= z.zl - tol && v[z.k] \u003c= z.zh + tol && r >= z.rl - z.tr && r \u003c= z.rh + z.tr; };\n            const skip = zones.length ? (a, b, c) => zones.some(z => inZone(z, a) && inZone(z, b) && inZone(z, c)) : null;\n\n            for (const face of skFaces(parts, tol / 10, skip)) {\n                const pts = face.flatMap(t => t.v);\n                const mn = [0, 1, 2].map(k => pts.reduce((m, p) => Math.min(m, p[k]), Infinity));\n                const mx = [0, 1, 2].map(k => pts.reduce((m, p) => Math.max(m, p[k]), -Infinity));\n                for (let k = 0; k \u003c 3; k++) {\n                    raw[k].push({ v: mn[k], s: 0 }, { v: mx[k], s: 0 });\n                    // плоские площадки, перпендикулярные оси: знак показывает, с какой стороны материал\n                    for (const t of face) if (Math.abs(t.n[k]) > 0.999) raw[k].push({ v: t.v[0][k], s: Math.sign(t.n[k]) * t.area });\n                    // цилиндрические поверхности вдоль оси k (отверстия, скругления)\n                    if (!face.every(t => Math.abs(t.n[k]) \u003c 0.02)) continue;\n                    const f = face[0].n;\n                    if (!face.some(t => t.n[0]*f[0] + t.n[1]*f[1] + t.n[2]*f[2] \u003c 0.87)) continue;\n                    const u = (k + 1) % 3, w = (k + 2) % 3;\n                    const c = skCircle(pts.map(p => [p[u], p[w]]));\n                    if (!c) continue;\n                    cyls.push({ k, c: c.c, r: c.r, lo: mn[k], hi: mx[k] });\n                    [u, w].forEach((ax, j) => {\n                        round[ax].push([mn[ax], mx[ax]]);\n                        // центр окружности тоже опорная плоскость (для размеров до центра)\n                        if (c.c[j] > lo[ax] + tol && c.c[j] \u003c hi[ax] - tol) raw[ax].push({ v: c.c[j], s: 0 });\n                    });\n                }\n            }\n            for (const z of zones) {\n                const u = (z.k + 1) % 3, w = (z.k + 2) % 3;\n                raw[z.k].push({ v: z.zl, s: 0 }, { v: z.zh, s: 0 });\n                [[u, z.c[0]], [w, z.c[1]]].forEach(([ax, c]) => {\n                    if (c > lo[ax] + tol && c \u003c hi[ax] - tol) raw[ax].push({ v: c, s: 0 });\n                    for (const d of [z.rl, z.rh]) raw[ax].push({ v: c - d, s: 0 }, { v: c + d, s: 0 });\n                    round[ax].push([c - z.rh, c + z.rh]);\n                });\n            }\n\n            const axes = [0, 1, 2].map(k => {\n                const st = [];\n                raw[k].sort((a, b) => a.v - b.v);\n                for (const r of raw[k]) {\n                    const last = st[st.length - 1];\n                    if (last && r.v - last.v \u003c= tol) last.s += r.s; else st.push({ v: r.v, s: r.s });\n                }\n                const segments = st.slice(1).map((b, i) => {\n                    const a = st[i];\n                    const isRound = round[k].some(([m, M]) => a.v >= m - tol && b.v \u003c= M + tol);\n                    const isThread = zones.some(z => z.k === k && a.v >= z.zl - tol && b.v \u003c= z.zh + tol);\n                    const type = isThread ? 'thread' : isRound ? 'round' : (a.s \u003c 0 && b.s > 0) ? 'wall' : (a.s > 0 && b.s \u003c 0) ? 'gap' : 'step';\n                    return { type, fixed: type === 'wall' || type === 'round' || type === 'thread' };\n                });\n                return { stations: st.map(s => s.v), segments };\n            });\n\n            // привязки: диаметр резьбы (по впадинам и по вершинам) к диаметру носителя — длина a = r × длина b.\n            // Носитель — цилиндр на той же оси, примыкающий к резьбе, с близким радиусом; нет носителя — вершины привязаны к впадинам\n            const ties = [], threads = [];\n            const idx = (k, v) => axes[k].stations.findIndex(s => Math.abs(s - v) \u003c= tol * 3);\n            const add = (k, a, b) => {\n                if (a[0] \u003c 0 || a[1] \u003c= a[0] || b[0] \u003c 0 || b[1] \u003c= b[0] || (a[0] === b[0] && a[1] === b[1])) return;\n                const S = axes[k].stations, r = (S[a[1]] - S[a[0]]) / (S[b[1]] - S[b[0]]);\n                if (r > 0 && isFinite(r)) ties.push({ k, a, b, r: Math.abs(r - 1) \u003c 0.005 ? 1 : r });\n            };\n            for (const z of zones) {\n                const rm = (z.rl + z.rh) / 2, u = (z.k + 1) % 3, w = (z.k + 2) % 3;\n                let car = null;\n                for (const c of cyls) {\n                    if (c.k !== z.k || Math.hypot(c.c[0] - z.c[0], c.c[1] - z.c[1]) > Math.max(tol * 5, .03 * rm)) continue;\n                    if (c.r \u003c .5 * rm || c.r > 1.6 * rm || c.lo > z.zh + tol * 3 || c.hi \u003c z.zl - tol * 3) continue;\n                    if (!car || Math.abs(c.r - rm) \u003c Math.abs(car.r - rm)) car = c;\n                }\n                [[u, z.c[0]], [w, z.c[1]]].forEach(([ax, c]) => {\n                    const span = d => [idx(ax, c - d), idx(ax, c + d)];\n                    if (car) { const b = span(car.r); add(ax, span(z.rl), b); add(ax, span(z.rh), b); }\n                    else add(ax, span(z.rl), span(z.rh));\n                    // круг симметричен: часть от центра влево равна части вправо (вершины, носитель, впадины) — отдельные размеры для сторон не нужны\n                    const ds = (car ? [z.rl, z.rh, car.r] : [z.rl, z.rh]).sort((p, q) => p - q), m = idx(ax, c);\n                    ds.forEach((d, i) => add(ax, [idx(ax, c - d), i ? idx(ax, c - ds[i - 1]) : m], [i ? idx(ax, c + ds[i - 1]) : m, idx(ax, c + d)]));\n                });\n                threads.push({ k: z.k, zl: z.zl, zh: z.zh, c: z.c, rl: z.rl, rh: z.rh, carrier: !!car });\n            }\n            return { tol, axes, threads, ties };\n        }\n\n        // Какие участки однозначно определяются размерами. dims: пары [i, j] номеров плоскостей, i \u003c j\n        function skAnalyze(n, dims, ties) {\n            const basis = [], redundant = [], zero = x => Math.abs(x) \u003c 1e-9;\n            const addRow = (v) => {\n                for (const b of basis) { const k = v[b.p]; if (!zero(k)) v = v.map((x, c) => x - k * b.row[c]); }\n                const p = v.findIndex(x => !zero(x));\n                if (p \u003c 0) return false;\n                const row = v.map(x => x / v[p]);\n                for (const b of basis) { const k = b.row[p]; if (!zero(k)) b.row = b.row.map((x, c) => x - k * row[c]); }\n                basis.push({ row, p });\n                return true;\n            };\n            const add = ([i, j]) => addRow(Array.from({ length: n }, (_, c) => c >= i && c \u003c j ? 1 : 0));\n            // привязки (например, диаметр резьбы к диаметру носителя) — известные связи: размер на них ставить не нужно\n            (ties || []).forEach(t => addRow(Array.from({ length: n }, (_, c) => (c >= t.a[0] && c \u003c t.a[1] ? 1 : 0) - t.r * (c >= t.b[0] && c \u003c t.b[1] ? 1 : 0))));\n            dims.forEach((d, i) => { if (!add(d)) redundant.push(i); });\n            const known = Array.from({ length: n }, (_, k) => basis.some(b => b.p === k && b.row.every((x, c) => c === k || zero(x))));\n            return { known, redundant, missing: n - basis.length, add };\n        }\n\n        // Новое расстояние между плоскостями i и j. Плоскости до i стоят на месте, после j сдвигаются целиком.\n        // Закреплённые участки не меняются (если свободных нет, растягиваются все). Участок не становится тоньше min.\n        function skSetSpan(s, i, j, value, segments, min = 0.1) {\n            const len = s.slice(1).map((v, k) => v - s[k]);\n            let flex = []; for (let k = i; k \u003c j; k++) if (!segments[k].fixed) flex.push(k);\n            if (!flex.length) for (let k = i; k \u003c j; k++) flex.push(k);\n            const total = flex.reduce((a, k) => a + len[k], 0);\n            const rest = s[j] - s[i] - total;\n            const kMin = Math.max(...flex.map(k => Math.min(1, min / len[k])));\n            const f = Math.max(kMin, (value - rest) / total);\n            for (const k of flex) len[k] *= f;\n            const out = [s[0]];\n            len.forEach((l, k) => out.push(out[k] + l));\n            return out;\n        }\n\n        // Перенос координаты вершины из исходных плоскостей s в новые t\n        function skRemap(x, s, t) {\n            const n = s.length - 1;\n            if (x \u003c= s[0]) return t[0] + x - s[0];\n            if (x >= s[n]) return t[n] + x - s[n];\n            let i = 0; while (x > s[i + 1]) i++;\n            return t[i] + (x - s[i]) * (t[i + 1] - t[i]) / (s[i + 1] - s[i]);\n        }\n        // ---- КОНЕЦ ЯДРА ----\n\n        // =========================================================================\n        // КАРКАС МОДЕЛИ: исходная геометрия по участкам и проверка проставленных размеров\n        // =========================================================================\n        const SK_AXES = ['X', 'Y', 'Z'];\n        const SK_TYPES = { wall: 'стенка', gap: 'паз', step: 'ступень', round: 'радиус', thread: 'резьба' };\n        let skeleton = null, skShow = false, skAxis = 0, skGroup = null, skLabels = [];\n\n        // К какой оси и каким плоскостям относится размер\n        function skSpans(item) {\n            const out = [];\n            if (!skeleton) return out;\n            const find = (k, v) => skeleton.axes[k].stations.findIndex(s => Math.abs(s - v) \u003c= skeleton.tol * 3);\n            const push = (k, a, b) => {\n                const i = find(k, Math.min(a, b)), j = find(k, Math.max(a, b));\n                if (i >= 0 && j > i) out.push({ axis: k, i, j });\n            };\n            if (item.type === 'linear') {\n                const [a, b] = item.points.map(p => p.toArray());\n                const d = b.map((v, k) => Math.abs(v - a[k])), len = Math.hypot(...d);\n                const k = d.findIndex(v => len > 0 && v / len > 0.9999);\n                if (k >= 0) push(k, a[k], b[k]);\n            } else if (item.type === 'diameter') {\n                const c = item.points[0].toArray(), r = item.value / 2, n = item.normal.toArray();\n                for (let k = 0; k \u003c 3; k++) {\n                    if (Math.abs(n[k]) > 0.1) continue;\n                    const before = out.length;\n                    push(k, c[k] - r, c[k]); push(k, c[k], c[k] + r);\n                    if (out.length === before) push(k, c[k] - r, c[k] + r);\n                }\n            }\n            return out;\n        }\n\n        function skCheck() {\n            const dims = [[], [], []], skipped = [];\n            annotations.forEach((a, idx) => {\n                if (a.isBBox || (a.type !== 'linear' && a.type !== 'diameter')) return;\n                const spans = skSpans(a);\n                if (!spans.length) skipped.push(idx + 1);\n                spans.forEach(s => dims[s.axis].push({ span: [s.i, s.j], num: idx + 1 }));\n            });\n            return { skipped, axes: skeleton.axes.map((ax, k) => ({ dims: dims[k], ...skAnalyze(ax.segments.length, dims[k].map(d => d.span), (skeleton.ties || []).filter(e => e.k === k)) })) };\n        }\n\n        function skPoints(k, v) {\n            const b = modelBounds, p = b.min.toArray();\n            p[k] = v;\n            return new THREE.Vector3().fromArray(p);\n        }\n\n        // участки каркаса, отмеченные галочкой «Взять» (по осям X, Y, Z)\n        const skPick = [new Set(), new Set(), new Set()];\n        const skDirect = (r, i) => r.dims.some(d => d.span[0] === i && d.span[1] === i + 1);\n        function skAddPicked() {\n            if (!skeleton) return;\n            const res = skCheck(), size = modelBounds.getSize(new THREE.Vector3());\n            const off = Math.max(6, Math.max(size.x, size.y, size.z) * 0.08);\n            const todo = [];\n            skeleton.axes.forEach((ax, k) => [...skPick[k]].sort((x, y) => x - y).forEach(i => {\n                if (i \u003c ax.segments.length && !skDirect(res.axes[k], i)) todo.push([k, ax.stations[i], ax.stations[i + 1]]);\n            }));\n            skPick.forEach(s => s.clear());\n            const normals = [[0, -1, 0], [-1, 0, 0], [-1, -1, 0]];\n            for (const [k, from, to] of todo) {\n                createLinearDimension(skPoints(k, from), skPoints(k, to), new THREE.Vector3().fromArray(normals[k]).normalize(), off, '#fb923c');\n            }\n            skRefresh();\n            showToast(todo.length ? `Добавлено размеров: ${todo.length}` : 'Отметьте участки галочками в столбце «Взять»');\n        }\n\n        function skClearVisuals() {\n            if (skGroup) { skGroup.traverse(c => c.geometry && c.geometry.dispose()); scene.remove(skGroup); skGroup = null; }\n            skLabels.forEach(l => l.el.remove());\n            skLabels = [];\n        }\n\n        function skRender() {\n            skClearVisuals();\n            const panel = document.getElementById('sk-panel');\n            document.getElementById('btn-skeleton').classList.toggle('bg-orange-600', skShow);\n            panel.style.display = (skShow && skeleton) ? 'flex' : 'none';\n            if (!skShow || !skeleton) return;\n\n            const res = skCheck(), ax = skeleton.axes[skAxis], r = res.axes[skAxis];\n            const b = modelBounds, size = b.getSize(new THREE.Vector3());\n            const u = (skAxis + 1) % 3, w = (skAxis + 2) % 3;\n            skGroup = new THREE.Group();\n            const line = (pts, color, opacity = 1) => skGroup.add(new THREE.Line(\n                new THREE.BufferGeometry().setFromPoints(pts),\n                new THREE.LineBasicMaterial({ color, transparent: true, opacity, depthTest: false })));\n\n            for (const v of ax.stations) {\n                const corner = (cu, cw) => { const p = [0, 0, 0]; p[skAxis] = v; p[u] = cu; p[w] = cw; return new THREE.Vector3().fromArray(p); };\n                const mn = b.min.toArray(), mx = b.max.toArray();\n                line([corner(mn[u], mn[w]), corner(mx[u], mn[w]), corner(mx[u], mx[w]), corner(mn[u], mx[w]), corner(mn[u], mn[w])], 0xfb923c, 0.45);\n            }\n\n            const shift = new THREE.Vector3();\n            shift.setComponent(skAxis === 1 ? 0 : 1, -Math.max(size.x, size.y, size.z) * 0.05);\n            ax.segments.forEach((seg, i) => {\n                const p1 = skPoints(skAxis, ax.stations[i]).add(shift), p2 = skPoints(skAxis, ax.stations[i + 1]).add(shift);\n                line([p1, p2], r.known[i] ? 0x22c55e : 0xef4444);\n                if (ax.segments.length > 40) return;\n                const el = document.createElement('div');\n                el.textContent = `${SK_AXES[skAxis]}${i + 1}: ${(ax.stations[i + 1] - ax.stations[i]).toFixed(2)}`;\n                el.style.cssText = `position:absolute;transform:translate(-50%,-50%);pointer-events:none;font:600 10px monospace;padding:1px 4px;border-radius:4px;background:#0f172a;color:#fff;border:1.5px solid ${r.known[i] ? '#22c55e' : '#ef4444'}`;\n                document.getElementById('annotations-overlay').appendChild(el);\n                skLabels.push({ el, pos3D: p1.clone().add(p2).multiplyScalar(0.5) });\n            });\n            scene.add(skGroup);\n\n            const tabs = SK_AXES.map((n, k) => `\u003cbutton type=\"button\" data-ax=\"${k}\" style=\"flex:1;padding:4px;border-radius:6px;cursor:pointer;background:${k === skAxis ? '#ea580c' : '#1e293b'};color:#fff\">${n} ${res.axes[k].missing ? '✗ ' + res.axes[k].missing : '✓'}\u003c/button>`).join('');\n            [...skPick[skAxis]].forEach(i => { if (i >= ax.segments.length || skDirect(r, i)) skPick[skAxis].delete(i); });\n            const picked = skPick.reduce((n, set) => n + set.size, 0);\n            const pickCell = (i) => skDirect(r, i) ? '\u003cspan style=\"color:#64748b\" title=\"Размер на этот участок уже есть\">есть\u003c/span>'\n                : `\u003cinput type=\"checkbox\" data-pick=\"${i}\" ${skPick[skAxis].has(i) ? 'checked' : ''}>`;\n            const rows = ax.segments.map((s, i) => `\u003ctr style=\"border-top:1px solid #334155\">\u003ctd style=\"padding:3px 0\">${SK_AXES[skAxis]}${i + 1}\u003c/td>\u003ctd>${SK_TYPES[s.type]}\u003c/td>\u003ctd style=\"text-align:right\">${(ax.stations[i + 1] - ax.stations[i]).toFixed(2)}\u003c/td>\u003ctd style=\"text-align:center;color:${r.known[i] ? '#22c55e' : '#ef4444'}\">${r.known[i] ? '✓' : '✗'}\u003c/td>\u003ctd style=\"text-align:center\">\u003cinput type=\"checkbox\" data-seg=\"${i}\" ${s.fixed ? 'checked' : ''}>\u003c/td>\u003ctd style=\"text-align:center\">${pickCell(i)}\u003c/td>\u003c/tr>`).join('');\n            const extra = r.redundant.map(i => `#${r.dims[i].num}`);\n            const scrollTop = panel.querySelector('[data-scroll]')?.scrollTop || 0;\n            panel.innerHTML = `\u003cdiv style=\"display:flex;gap:4px\">${tabs}\u003c/div>\n                \u003cdiv>${r.missing ? `Не хватает размеров по оси ${SK_AXES[skAxis]}: \u003cb style=\"color:#ef4444\">${r.missing}\u003c/b>` : '\u003cb style=\"color:#22c55e\">Ось определена полностью\u003c/b>'}\u003c/div>\n                ${(skeleton.threads || []).length ? `\u003cdiv style=\"color:#38bdf8\" data-threads>Резьба: ${skeleton.threads.length} ${skeleton.threads.length === 1 ? 'зона' : 'зон(ы)'} — вместо витков длина и два диаметра. Диаметр резьбы привязан к носителю (то же отношение).\u003c/div>` : ''}\n                ${extra.length ? `\u003cdiv style=\"color:#fbbf24\">Лишние (повторяют другие): ${[...new Set(extra)].join(', ')}\u003c/div>` : ''}\n                ${res.skipped.length ? `\u003cdiv style=\"color:#fbbf24\">Не легли на каркас (наклонные или не по плоскостям): ${res.skipped.map(n => '#' + n).join(', ')}\u003c/div>` : ''}\n                \u003cdiv data-scroll style=\"overflow:auto;min-height:0\">\u003ctable style=\"width:100%;border-collapse:collapse\">\u003ctr style=\"color:#94a3b8\">\u003ctd>Участок\u003c/td>\u003ctd>Тип\u003c/td>\u003ctd style=\"text-align:right\">Длина\u003c/td>\u003ctd style=\"text-align:center\">Размер\u003c/td>\u003ctd style=\"text-align:center\" title=\"Не растягивается ползунком\">Фикс.\u003c/td>\u003ctd style=\"text-align:center\" title=\"Отметьте участки, для которых нужно создать размер\">Взять\u003c/td>\u003c/tr>${rows}\u003c/table>\u003c/div>\n                \u003cbutton type=\"button\" data-pick-missing style=\"padding:5px;border-radius:8px;background:#1e293b;color:#fff;cursor:pointer\">Отметить все недостающие по ${SK_AXES[skAxis]}\u003c/button>\n                \u003cbutton type=\"button\" data-add ${picked ? '' : 'disabled'} style=\"padding:6px;border-radius:8px;background:#ea580c;color:#fff;cursor:pointer;opacity:${picked ? 1 : .45}\">Добавить отмеченные (${picked})\u003c/button>`;\n            panel.querySelector('[data-scroll]').scrollTop = scrollTop;\n            panel.querySelectorAll('[data-ax]').forEach(el => el.onclick = () => { skAxis = +el.dataset.ax; skRender(); });\n            panel.querySelectorAll('[data-seg]').forEach(el => el.onchange = () => { ax.segments[+el.dataset.seg].fixed = el.checked; });\n            panel.querySelectorAll('[data-pick]').forEach(el => el.onchange = () => { const i = +el.dataset.pick; el.checked ? skPick[skAxis].add(i) : skPick[skAxis].delete(i); skRender(); });\n            panel.querySelector('[data-pick-missing]').onclick = () => { ax.segments.forEach((s, i) => { if (!r.known[i] && !skDirect(r, i)) skPick[skAxis].add(i); }); skRender(); };\n            panel.querySelector('[data-add]').onclick = skAddPicked;\n        }\n\n        // перерисовка после изменения списка размеров (один раз за кадр)\n        let skPending = false;\n        function skRefresh() {\n            if (skPending) return;\n            skPending = true;\n            requestAnimationFrame(() => { skPending = false; skRender(); });\n        }\n\n        function skUpdateLabels() {\n            for (const l of skLabels) {\n                const p = l.pos3D.clone().project(activeCamera);\n                l.el.style.display = p.z > 1 ? 'none' : 'block';\n                l.el.style.left = `${(p.x * 0.5 + 0.5) * viewportEl.clientWidth}px`;\n                l.el.style.top = `${(-p.y * 0.5 + 0.5) * viewportEl.clientHeight}px`;\n            }\n        }\n\n        function skRestore(saved) {\n            if (!saved || !saved.axes || !skeleton) return;\n            skeleton.axes.forEach((ax, k) => {\n                const old = saved.axes[SK_AXES[k].toLowerCase()];\n                if (!old) return;\n                ax.segments.forEach((s, i) => {\n                    const m = old.segments.find(o => Math.abs(o.from - ax.stations[i]) \u003c= skeleton.tol * 3 && Math.abs(o.to - ax.stations[i + 1]) \u003c= skeleton.tol * 3);\n                    if (m) s.fixed = m.fixed;\n                });\n            });\n            skRefresh();\n        }\n\n        function skExport() {\n            if (!skeleton) return null;\n            const res = skCheck();\n            const axes = {};\n            skeleton.axes.forEach((ax, k) => {\n                axes[SK_AXES[k].toLowerCase()] = {\n                    stations: ax.stations,\n                    segments: ax.segments.map((s, i) => ({ from: ax.stations[i], to: ax.stations[i + 1], type: s.type, fixed: s.fixed, defined: res.axes[k].known[i] })),\n                    missing: res.axes[k].missing\n                };\n            });\n            const ties = (skeleton.ties || []).map(e => { const S = skeleton.axes[e.k].stations; return { axis: SK_AXES[e.k].toLowerCase(), a: [S[e.a[0]], S[e.a[1]]], b: [S[e.b[0]], S[e.b[1]]], r: e.r }; });\n            const out = { version: 1, tolerance: skeleton.tol, axes };\n            if (ties.length) out.ties = ties;\n            if ((skeleton.threads || []).length) out.threads = skeleton.threads.map(z => ({ axis: SK_AXES[z.k].toLowerCase(), from: z.zl, to: z.zh, center: z.c, rootRadius: z.rl, crestRadius: z.rh, carrier: z.carrier }));\n            return out;\n        }\n\n        // =========================================================================\n        // ЭКСПОРТ В АВТОНОМНЫЙ HTML И PNG\n        // =========================================================================\n        // собрать файл проекта (HTML с размерами) без скачивания: { html, name } или null, если модели нет\n        function buildProjectHTML() {\n            if (!serializedModelData || modelMeshes.length === 0) return null;\n\n            const exportedAnnotations = annotations.map(a => ({\n                type: a.type,\n                points: a.points.map(p => p.toArray()),\n                normal: a.normal.toArray(),\n                value: a.value,\n                precision: a.precision,\n                text: a.text,\n                color: a.color,\n                offset: a.offset,\n                visible: a.visible,\n                aux: a.aux ? { a: a.aux.a.toArray(), b: a.aux.b.toArray(), p3: a.aux.p3.toArray(), fn: a.aux.fn.toArray(), angle: a.aux.angle } : null,\n                ...annParam(a),\n                ...(a.skw ? { skw: 1 } : {}),\n                ...(typeof a.lblT === 'number' && a.lblT !== 0.5 ? { lblT: a.lblT } : {}),\n                ...(a.refs ? { refs: a.refs } : {}),\n                spans: skSpans(a).map(s => ({ axis: SK_AXES[s.axis].toLowerCase(), i: s.i, j: s.j }))\n            }));\n\n            const projectPayload = JSON.stringify({\n                modelName: currentModelName,\n                unit: currentUnit,\n                parts: serializedModelData.parts,\n                wires: serializedModelData.wires,\n                annotations: exportedAnnotations,\n                skeleton: skExport(),\n                composites: compExport(),\n                order: orderExport(),\n                showScaleAll: window.__showScaleAll === true,\n                isDark: isDarkScene,\n                guides: guidesExport(),\n                lineK: window.__lineK || 1\n            }).replace(/\u003c\\/script>/gi, '\u003c\\\\/script>');\n\n            const safeTitle = escapeHtml(currentModelName);\n            const visibleCount = exportedAnnotations.filter(a => a.visible).length;\n\n            const standaloneHTML = `\u003c!DOCTYPE html>\n\u003chtml lang=\"ru\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>3D Чертёж: ${safeTitle}\u003c/title>\n\u003cscript type=\"importmap\">\n{\n  \"imports\": {\n    \"three\": \"https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.module.js\",\n    \"three/addons/\": \"https://cdn.jsdelivr.net/npm/three@0.172.0/examples/jsm/\"\n  }\n}\n\u003c\\/script>\n\u003cstyle>\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n  body { font-family: system-ui, -apple-system, sans-serif; overflow: hidden; background: ${isDarkScene ? '#090d16' : '#f1f5f9'}; color: #f8fafc; }\n  #canvas { display: block; width: 100vw; height: 100vh; }\n  #overlay { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }\n  .badge {\n    position: absolute; transform: translate(-50%, -50%);\n    background: rgba(15, 23, 42, 0.92); color: #f8fafc;\n    padding: 3px 8px; border-radius: 6px; font-family: monospace;\n    font-size: 12px; font-weight: 600; white-space: pre-line; text-align: center;\n    border: 1.5px solid #38bdf8; box-shadow: 0 4px 14px rgba(0,0,0,0.38);\n  }\n  .hud {\n    position: fixed; top: 12px; left: 12px; right: 12px;\n    display: flex; justify-content: space-between; align-items: flex-start;\n    pointer-events: none; gap: 10px; flex-wrap: wrap;\n  }\n  .panel {\n    pointer-events: auto; background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(8px);\n    border: 1px solid rgba(148,163,184,0.25); border-radius: 12px;\n    padding: 8px 12px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap;\n  }\n  button {\n    background: #1e293b; color: #e2e8f0; border: 1px solid #334155;\n    padding: 5px 9px; border-radius: 8px; font-size: 12px; cursor: pointer;\n  }\n  button:hover { background: #334155; color: #fff; }\n  .dim-table {\n    position: fixed; bottom: 12px; right: 12px; max-width: 280px; max-height: 45vh; overflow-y: auto;\n    pointer-events: auto; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px);\n    border: 1px solid rgba(148,163,184,0.25); border-radius: 12px; padding: 10px 12px; font-size: 12px;\n  }\n  .dim-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px solid rgba(148,163,184,0.12); font-family: monospace; }\n  .dim-row:last-child { border-bottom: none; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003ccanvas id=\"canvas\">\u003c/canvas>\n\u003cdiv id=\"overlay\">\u003c/div>\n\u003cdiv class=\"hud\">\n  \u003cdiv class=\"panel\">\n    \u003cstrong style=\"font-size:13px;\">${safeTitle}\u003c/strong>\n    \u003cspan style=\"font-size:11px; color:#94a3b8;\">| Размеров: ${visibleCount}\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"panel\">\n    \u003cbutton onclick=\"setView('iso')\">Изометрия\u003c/button>\n    \u003cbutton onclick=\"setView('front')\">Спереди\u003c/button>\n    \u003cbutton onclick=\"setView('top')\">Сверху\u003c/button>\n    \u003cbutton onclick=\"setView('right')\">Справа\u003c/button>\n    \u003cbutton onclick=\"toggleDims()\">Скрыть/показать размеры\u003c/button>\n    \u003cbutton onclick=\"toggleTable()\">Таблица\u003c/button>\n  \u003c/div>\n\u003c/div>\n\u003cdiv id=\"dim-table\" class=\"dim-table\">\n  \u003cdiv style=\"font-weight:700; margin-bottom:6px; color:#38bdf8;\">Спецификация размеров\u003c/div>\n  \u003cdiv id=\"dim-rows\">\u003c/div>\n\u003c/div>\n\u003cscript id=\"__CAD_ANNOTATIONS_DATA__\" type=\"application/json\">${projectPayload}\u003c\\/script>\n\u003cscript type=\"module\">\nimport * as THREE from 'three';\nimport { OrbitControls } from 'three/addons/controls/OrbitControls.js';\n\nTHREE.Object3D.DEFAULT_UP = new THREE.Vector3(0, 0, 1);\nconst DATA = JSON.parse(document.getElementById('__CAD_ANNOTATIONS_DATA__').textContent);\n\nconst scene = new THREE.Scene();\nscene.background = new THREE.Color(DATA.isDark ? 0x090d16 : 0xf1f5f9);\nconst camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200000);\ncamera.up.set(0, 0, 1);\n\nconst renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: true });\nrenderer.setSize(window.innerWidth, window.innerHeight);\nrenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));\n\nscene.add(new THREE.HemisphereLight(0xdbeafe, 0xfef3c7, 0.65));\nconst d1 = new THREE.DirectionalLight(0xffffff, 0.75); d1.position.set(200, -180, 260); scene.add(d1);\nconst d2 = new THREE.DirectionalLight(0x93c5fd, 0.45); d2.position.set(-220, 200, 140); scene.add(d2);\n\nconst controls = new OrbitControls(camera, renderer.domElement);\ncontrols.enableDamping = true;\n\nconst modelGroup = new THREE.Group();\nscene.add(modelGroup);\n\n(DATA.parts || []).forEach(p => {\n  const geo = new THREE.BufferGeometry();\n  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(p.positions), 3));\n  geo.computeVertexNormals();\n  const mat = new THREE.MeshStandardMaterial({\n    color: p.color || '#adb5bd', metalness: 0.22, roughness: 0.48, side: THREE.DoubleSide,\n    transparent: (p.opacity ?? 1) \u003c 1, opacity: p.opacity ?? 1\n  });\n  modelGroup.add(new THREE.Mesh(geo, mat));\n});\n\nconst wireMat = new THREE.LineBasicMaterial({ color: DATA.isDark ? 0x0f172a : 0x1e293b, transparent: true, opacity: 0.85 });\n(DATA.wires || []).forEach(w => {\n  const pts = [];\n  for (let i = 0; i \u003c= w.length - 3; i += 3) pts.push(new THREE.Vector3(w[i], w[i+1], w[i+2]));\n  if (pts.length >= 2) modelGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), wireMat));\n});\n\nconst box = new THREE.Box3().setFromObject(modelGroup);\nconst center = box.getCenter(new THREE.Vector3());\nconst size = box.getSize(new THREE.Vector3());\nconst maxDim = Math.max(size.x, size.y, size.z) || 100;\n\nconst grid = new THREE.GridHelper(Math.max(10, Math.ceil(maxDim * 2.5 / 10) * 10), 20, 0x334155, 0x1e293b);\ngrid.rotation.x = Math.PI / 2;\ngrid.position.set(center.x, center.y, box.min.z - 0.05);\nscene.add(grid);\n\nconst dimGroup = new THREE.Group();\nscene.add(dimGroup);\nconst overlay = document.getElementById('overlay');\nconst rowsEl = document.getElementById('dim-rows');\nconst labels = [];\nlet dimsVisible = true;\n\n(DATA.annotations || []).filter(a => a.visible !== false).forEach((a, idx) => {\n  const color = new THREE.Color(a.color);\n  const lMat = new THREE.LineBasicMaterial({ color, depthTest: false });\n  const eMat = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.55, depthTest: false });\n  const dMat = new THREE.MeshBasicMaterial({ color, depthTest: false });\n  const pts = a.points.map(arr => new THREE.Vector3().fromArray(arr));\n  const normal = new THREE.Vector3().fromArray(a.normal);\n  let labelPos = new THREE.Vector3();\n\n  if (a.type === 'linear' && pts.length >= 2) {\n    const offVec = normal.clone().multiplyScalar(a.offset);\n    const p1O = pts[0].clone().add(offVec);\n    const p2O = pts[1].clone().add(offVec);\n    dimGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([p1O, p2O]), lMat));\n    dimGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([pts[0], p1O]), eMat));\n    dimGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([pts[1], p2O]), eMat));\n    labelPos.copy(p1O).add(p2O).multiplyScalar(0.5);\n  } else if (a.type === 'diameter' && pts.length >= 2) {\n    const rDir = new THREE.Vector3().subVectors(pts[1], pts[0]).normalize();\n    const opp = pts[0].clone().sub(rDir.clone().multiplyScalar(a.value * 0.5));\n    const tip = pts[1].clone().add(rDir.clone().multiplyScalar(Math.abs(a.offset) * 0.7)).add(normal.clone().multiplyScalar(a.offset * 0.6));\n    dimGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([opp, pts[1], tip]), lMat));\n    labelPos.copy(tip);\n  } else if (a.type === 'angle' && pts.length >= 3) {\n    const vA = new THREE.Vector3().subVectors(pts[1], pts[0]).normalize();\n    const vB = new THREE.Vector3().subVectors(pts[2], pts[0]).normalize();\n    const rad = Math.max(4, Math.abs(a.offset) + 4);\n    const arcPts = [];\n    for (let i = 0; i \u003c= 24; i++) arcPts.push(pts[0].clone().add(new THREE.Vector3().lerpVectors(vA, vB, i / 24).normalize().multiplyScalar(rad)));\n    dimGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(arcPts), lMat));\n    labelPos.copy(arcPts[12]);\n  } else {\n    const dir = normal.clone().add(new THREE.Vector3(0.3, -0.3, 0.8)).normalize();\n    const pEnd = pts[0].clone().add(dir.multiplyScalar(a.offset));\n    dimGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([pts[0], pEnd]), lMat));\n    const m = new THREE.Mesh(new THREE.SphereGeometry(0.75, 10, 10), dMat); m.position.copy(pts[0]); dimGroup.add(m);\n    labelPos.copy(pEnd);\n  }\n\n  const el = document.createElement('div');\n  el.className = 'badge';\n  el.style.borderColor = a.color;\n  el.textContent = a.text;\n  overlay.appendChild(el);\n  labels.push({ el, pos: labelPos });\n\n  const row = document.createElement('div');\n  row.className = 'dim-row';\n  row.innerHTML = '\u003cspan style=\"width:10px;height:10px;border-radius:50%;background:' + a.color + ';display:inline-block;flex-shrink:0;\">\u003c/span>\u003cspan>#' + (idx + 1) + ': ' + a.text + '\u003c/span>';\n  rowsEl.appendChild(row);\n});\n\nwindow.setView = (v) => {\n  const d = maxDim * 2.1;\n  controls.target.copy(center);\n  if (v === 'front') camera.position.set(center.x, center.y - d, center.z);\n  else if (v === 'top') camera.position.set(center.x, center.y - 0.01, center.z + d);\n  else if (v === 'right') camera.position.set(center.x + d, center.y, center.z);\n  else camera.position.set(center.x + d * 0.72, center.y - d * 0.78, center.z + d * 0.65);\n  controls.update();\n};\nwindow.toggleDims = () => {\n  dimsVisible = !dimsVisible;\n  dimGroup.visible = dimsVisible;\n  overlay.style.display = dimsVisible ? 'block' : 'none';\n};\nwindow.toggleTable = () => {\n  const t = document.getElementById('dim-table');\n  t.style.display = t.style.display === 'none' ? 'block' : 'none';\n};\n\nwindow.setView('iso');\nwindow.addEventListener('resize', () => {\n  camera.aspect = window.innerWidth / window.innerHeight;\n  camera.updateProjectionMatrix();\n  renderer.setSize(window.innerWidth, window.innerHeight);\n});\n\nfunction animate() {\n  requestAnimationFrame(animate);\n  controls.update();\n  renderer.render(scene, camera);\n  if (dimsVisible) {\n    labels.forEach(l => {\n      const p = l.pos.clone().project(camera);\n      if (p.z > 1) l.el.style.display = 'none';\n      else {\n        l.el.style.display = 'block';\n        l.el.style.left = (p.x * 0.5 + 0.5) * window.innerWidth + 'px';\n        l.el.style.top = (-p.y * 0.5 + 0.5) * window.innerHeight + 'px';\n      }\n    });\n  }\n}\nanimate();\n\u003c\\/script>\n\u003c/body>\n\u003c/html>`;\n\n            const baseName = currentModelName.replace(/\\.[^/.]+$/, '');\n            return { html: standaloneHTML, name: `${baseName}_с_размерами.html` };\n        }\n\n        function exportStandaloneHTML() {\n            const prj = buildProjectHTML();\n            if (!prj) {\n                showToast('Нет загруженной модели для экспорта');\n                return;\n            }\n            const blob = new Blob([prj.html], { type: 'text/html;charset=utf-8' });\n            const url = URL.createObjectURL(blob);\n            const a = document.createElement('a');\n            a.href = url;\n            a.download = prj.name;\n            document.body.appendChild(a);\n            a.click();\n            document.body.removeChild(a);\n            URL.revokeObjectURL(url);\n\n            showToast('Готовый HTML с размерами скачан!');\n        }\n\n        // =========================================================================\n        // АССИСТЕНТ: автоматическая простановка размеров по каркасу и связь с файлом «Ассистент.html»\n        // =========================================================================\n        // название размера по оси и типу участка каркаса (как принято в каталоге: «ширина стенки», «глубина кармана»…)\n        const AS_OVERALL = ['Ширина', 'Длина', 'Высота'];\n        const AS_NAMES = {\n            gap: ['ширина кармана', 'длина кармана', 'глубина кармана'],\n            step: ['ширина ступени', 'длина ступени', 'высота ступени']\n        };\n        function asName(k, i, j, n, type, num, count) {\n            if (i === 0 && j === n) return AS_OVERALL[k];\n            // по высоте: участок до верха детали, открытый сверху (карман или ступень) — глубина кармана\n            if (k === 2 && j === n && (type === 'gap' || type === 'step')) return count > 1 ? `глубина кармана ${num}` : 'глубина кармана';\n            if (type === 'wall') {\n                if (k \u003c 2) return 'ширина стенки';\n                return i === 0 ? 'высота пола' : j === n ? 'толщина крышки' : 'толщина перегородки';\n            }\n            const base = (AS_NAMES[type] || ['размер', 'размер', 'размер'])[k];\n            return count > 1 ? `${base} ${num}` : base;\n        }\n        // одна автоматизация: габарит по каждой оси + каждый участок (стенки, карманы, ступени) своим размером,\n        // названия только у размеров без названия; уже стоящие размеры и ваши названия не трогаются\n        // какие размеры ассистент может поставить, по важности: габариты, затем карманы и ступени (длиннее — раньше), затем стенки\n        function assistCandidates() {\n            const has = (k, i, j) => annotations.some(a => !a.isBBox && skSpans(a).some(s => s.axis === k && s.i === i && s.j === j));\n            const out = [];\n            skeleton.axes.forEach((ax, k) => {\n                const n = ax.segments.length;\n                if (!n) return;\n                const len = (i, j) => Math.abs(ax.stations[j] - ax.stations[i]);\n                if (!has(k, 0, n)) out.push({ k, i: 0, j: n, rank: 0, len: len(0, n) });\n                if (n > 1) ax.segments.forEach((sg, i) => {\n                    if (sg.type !== 'round' && sg.type !== 'thread' && !has(k, i, i + 1)) out.push({ k, i, j: i + 1, rank: sg.type === 'wall' ? 2 : 1, len: len(i, i + 1) });\n                });\n            });\n            return out.sort((a, b) => a.rank - b.rank || b.len - a.len || a.k - b.k || a.i - b.i);\n        }\n        // limit — сколько размеров поставить (самые важные); без limit — все\n        function assistAutomate(opts) {\n            if (!skeleton) return { ok: false, msg: 'Сначала откройте модель' };\n            const size = modelBounds.getSize(new THREE.Vector3());\n            const off = Math.max(6, Math.max(size.x, size.y, size.z) * 0.08);\n            const normals = [[0, -1, 0], [-1, 0, 0], [-1, -1, 0]];\n            const all = assistCandidates(), lim = opts && opts.limit > 0 ? Math.min(opts.limit, all.length) : all.length;\n            let added = 0, named = 0;\n            // skw: размер ассистента — по участку каркаса; конвертер привязывает его к каркасу, даже если плоскость из нескольких граней\n            all.slice(0, lim).sort((a, b) => a.k - b.k || (a.rank === 0 ? 0 : 1) - (b.rank === 0 ? 0 : 1) || a.i - b.i).forEach(c => {\n                const ax = skeleton.axes[c.k];\n                createLinearDimension(skPoints(c.k, ax.stations[c.i]), skPoints(c.k, ax.stations[c.j]), new THREE.Vector3().fromArray(normals[c.k]).normalize(), c.rank === 0 ? off * 2 : off, '#fb923c').skw = true;\n                added++;\n            });\n            // названия: нумеруем карманы и ступени по порядку вдоль оси\n            skeleton.axes.forEach((ax, k) => {\n                const n = ax.segments.length, cnt = {}, num = {};\n                ax.segments.forEach(sg => { cnt[sg.type] = (cnt[sg.type] || 0) + 1; });\n                ax.segments.forEach((sg, i) => {\n                    num[sg.type] = (num[sg.type] || 0) + 1;\n                    annotations.forEach(a => {\n                        if (a.isBBox || a.name || a.type !== 'linear') return;\n                        const sp = skSpans(a);\n                        if (sp.length !== 1 || sp[0].axis !== k) return;\n                        if (sp[0].i === 0 && sp[0].j === n && i === 0) { a.name = asName(k, 0, n, n); named++; return; }\n                        if (sp[0].i === i && sp[0].j === i + 1) { a.name = asName(k, i, i + 1, n, sg.type, num[sg.type], cnt[sg.type]); named++; }\n                    });\n                });\n            });\n            renderDimensionsSidebar();\n            skRefresh();\n            return { ok: true, added, named, total: all.length, missing: skCheck().axes.map(x => x.missing) };\n        }\n        window.ASSIST = {\n            // открыть файл; Promise выполняется, когда модель (и размеры из проекта) загружены\n            loadFile: (file) => new Promise(res => {\n                if (/\\.html?$/i.test(file.name)) file.text().then(t => { parseFreeCADHtml(t, file.name); res(); });\n                else { assistDone = res; handleUploadedFile(file); }\n            }),\n            status: () => ({\n                model: modelMeshes.length > 0 && !!skeleton,\n                dims: annotations.filter(a => !a.isBBox).length,\n                names: annotations.filter(a => !a.isBBox).map(a => a.name || ''),\n                missing: skeleton ? skCheck().axes.map(x => x.missing) : [],\n                name: currentModelName,\n                tool: currentTool\n            }),\n            project: () => buildProjectHTML(),\n            tool: (t) => setTool(t),\n            click: (h) => toolClick({ point: new THREE.Vector3().fromArray(h.point), normal: new THREE.Vector3().fromArray(h.normal || [0, 0, 1]), snapped: true, snapType: h.snapType || '', guideRef: h.guideRef || null }),\n            snapAt: (x, y) => { const h = getSnappedHit({ clientX: x, clientY: y }); return h && h.point ? { point: h.point.toArray(), normal: h.normal.toArray(), snapType: h.snapType, guideRef: h.guideRef || null } : null; },\n            screenOf: (p) => { const r = viewportEl.getBoundingClientRect(), q = new THREE.Vector3().fromArray(p).project(activeCamera); return [r.left + (q.x * 0.5 + 0.5) * viewportEl.clientWidth, r.top + (-q.y * 0.5 + 0.5) * viewportEl.clientHeight]; },\n            guides: () => guides.map(g => ({ id: g.id, name: g.name, a: g.a.toArray(), b: g.b.toArray(), len: g.a.distanceTo(g.b), rel: g.rel ? { kind: g.rel.kind, ref: g.rel.ref } : null, marks: g.marks.slice(), color: g.color })),\n            dimsInfo: () => annotations.filter(a => !a.isBBox).map(a => ({ id: a.id, type: a.type, value: a.value, color: a.color, refs: a.refs || null, lineW: a.group3D.children.filter(c => c.material && c.material.isLineMaterial === true).map(c => c.material.linewidth) })),\n            // подписи линейных размеров: место вдоль линии (t), отступ, центр подписи и концы размерной линии на экране\n            labels: () => {\n                const vr = viewportEl.getBoundingClientRect(), w = viewportEl.clientWidth, h = viewportEl.clientHeight;\n                const sp = (v) => { const q = v.clone().project(activeCamera); return [vr.left + (q.x * 0.5 + 0.5) * w, vr.top + (-q.y * 0.5 + 0.5) * h]; };\n                return annotations.filter(a => a.type === 'linear' && a.domEl && !a.isBBox).map(a => {\n                    const r = a.domEl.getBoundingClientRect(), off = a.normal.clone().multiplyScalar(a.offset);\n                    const A = sp(a.points[0].clone().add(off)), B = sp(a.points[1].clone().add(off));\n                    return { id: a.id, t: typeof a.lblT === 'number' ? a.lblT : 0.5, offset: a.offset, x: r.left + r.width / 2, y: r.top + r.height / 2, ax: A[0], ay: A[1], bx: B[0], by: B[1] };\n                });\n            },\n            automate: (opts) => assistAutomate(opts),\n            plan: () => ({ count: skeleton ? assistCandidates().length : 0 }),\n            save: () => exportStandaloneHTML()\n        };\n\n        function exportScreenshotPNG() {\n            renderer.render(scene, activeCamera);\n            const srcCanvas = renderer.domElement;\n            const outCanvas = document.createElement('canvas');\n            outCanvas.width = srcCanvas.width;\n            outCanvas.height = srcCanvas.height;\n            const ctx = outCanvas.getContext('2d');\n            ctx.drawImage(srcCanvas, 0, 0);\n\n            const dpr = srcCanvas.width / Math.max(1, viewportEl.clientWidth);\n            ctx.font = `600 ${Math.round(12 * dpr)}px monospace`;\n            ctx.textAlign = 'center';\n            ctx.textBaseline = 'middle';\n\n            annotations.forEach(item => {\n                if (!item.visible || !item.domEl || item.domEl.style.display === 'none') return;\n                const x = parseFloat(item.domEl.style.left) * dpr;\n                const y = parseFloat(item.domEl.style.top) * dpr;\n                const text = item.text;\n                const padX = 8 * dpr;\n                const boxH = 22 * dpr;\n                const textW = ctx.measureText(text).width + padX * 2;\n\n                ctx.fillStyle = 'rgba(15, 23, 42, 0.92)';\n                ctx.strokeStyle = item.color;\n                ctx.lineWidth = 1.5 * dpr;\n                ctx.beginPath();\n                ctx.roundRect(x - textW / 2, y - boxH / 2, textW, boxH, 6 * dpr);\n                ctx.fill();\n                ctx.stroke();\n\n                ctx.fillStyle = '#f8fafc';\n                ctx.fillText(text, x, y);\n            });\n\n            outCanvas.toBlob(blob => {\n                if (!blob) return;\n                const url = URL.createObjectURL(blob);\n                const a = document.createElement('a');\n                const baseName = currentModelName.replace(/\\.[^/.]+$/, '');\n                a.href = url;\n                a.download = `${baseName}_чертеж.png`;\n                document.body.appendChild(a);\n                a.click();\n                document.body.removeChild(a);\n                URL.revokeObjectURL(url);\n                showToast('Скриншот PNG сохранён!');\n            });\n        }\n\n        // =========================================================================\n        // СОБЫТИЯ ИНТЕРФЕЙСА, DRAG & DROP И ЦИКЛ РЕНДЕРИНГА\n        // =========================================================================\n        function bindUIEvents() {\n            initExtras();\n            document.getElementById('btn-close-diag').addEventListener('click', hideDiagnostic);\n\n\n            document.querySelectorAll('.tool-btn').forEach(btn => {\n                // повторный клик по выбранному инструменту снимает его — обзор\n                btn.addEventListener('click', () => setTool(btn.dataset.tool !== 'orbit' && currentTool === btn.dataset.tool ? 'orbit' : btn.dataset.tool));\n            });\n            document.querySelectorAll('.view-btn').forEach(btn => {\n                btn.addEventListener('click', () => setCameraView(btn.dataset.view));\n            });\n\n            document.getElementById('btn-auto-dims').addEventListener('click', () => generateAutomaticDimensions(false));\n            document.getElementById('show-scale-all').addEventListener('change', (e) => setShowScaleAll(e.target.checked));\n            document.getElementById('auto-dims-on-load').addEventListener('change', (e) => {\n                autoDimsEnabledOnLoad = e.target.checked;\n            });\n            document.getElementById('btn-bbox').addEventListener('click', toggleBoundingBox);\n            document.getElementById('btn-skeleton').addEventListener('click', () => { skShow = !skShow; skRender(); });\n            document.getElementById('btn-cam-type').addEventListener('click', toggleCameraProjection);\n            document.getElementById('btn-fit').addEventListener('click', () => setCameraView('iso'));\n            document.getElementById('btn-export-html').addEventListener('click', exportStandaloneHTML);\n            document.getElementById('btn-export-png').addEventListener('click', exportScreenshotPNG);\n            document.getElementById('btn-clear-all').addEventListener('click', () => clearAllDimensions(false));\n\n            document.getElementById('render-mode').addEventListener('change', updateRenderMode);\n            document.getElementById('unit-select').addEventListener('change', updateUnits);\n            document.getElementById('grid-toggle-btn').addEventListener('click', () => {\n                gridHelper.visible = !gridHelper.visible;\n            });\n            document.getElementById('bg-toggle-btn').addEventListener('click', toggleBgTheme);\n\n            ['clip-x', 'clip-y', 'clip-z'].forEach(id => {\n                document.getElementById(id).addEventListener('input', updateClipping);\n            });\n        }\n\n        function setupDragAndDrop() {\n            const dropOverlay = document.getElementById('drop-overlay');\n            let counter = 0;\n\n            window.addEventListener('dragenter', (e) => {\n                e.preventDefault();\n                counter++;\n                dropOverlay.classList.remove('hidden');\n            });\n            window.addEventListener('dragleave', (e) => {\n                e.preventDefault();\n                counter--;\n                if (counter \u003c= 0) {\n                    counter = 0;\n                    dropOverlay.classList.add('hidden');\n                }\n            });\n            window.addEventListener('dragover', (e) => e.preventDefault());\n            window.addEventListener('drop', (e) => {\n                e.preventDefault();\n                counter = 0;\n                dropOverlay.classList.add('hidden');\n                if (e.dataTransfer.files && e.dataTransfer.files[0]) {\n                    handleUploadedFile(e.dataTransfer.files[0]);\n                }\n            });\n        }\n\n        function onWindowResize() {\n            const width = Math.max(1, viewportEl.clientWidth);\n            const height = Math.max(1, viewportEl.clientHeight);\n            const aspect = width / height;\n\n            persCamera.aspect = aspect;\n            persCamera.updateProjectionMatrix();\n\n            const viewH = orthCamera.top - orthCamera.bottom;\n            orthCamera.left = -viewH * aspect / 2;\n            orthCamera.right = viewH * aspect / 2;\n            orthCamera.updateProjectionMatrix();\n\n            renderer.setSize(width, height);\n            scene.traverse(o => { if (o.material && o.material.isLineMaterial === true) o.material.resolution.set(width, height); });\n        }\n\n        function animate() {\n            requestAnimationFrame(animate);\n            controls.update();\n            renderer.render(scene, activeCamera);\n            updateOverlayPositions();\n\n            if (gizmoRenderer && gizmoCamera) {\n                gizmoCamera.position.copy(activeCamera.position).sub(controls.target).setLength(180);\n                gizmoCamera.lookAt(0, 0, 0);\n                gizmoRenderer.render(gizmoScene, gizmoCamera);\n            }\n        }\n\n        function showToast(msg) {\n            const toast = document.getElementById('toast-box');\n            toast.textContent = msg;\n            toast.classList.remove('hidden');\n            clearTimeout(toast._timer);\n            toast._timer = setTimeout(() => toast.classList.add('hidden'), 3200);\n        }\n\n        function escapeHtml(str) {\n            return String(str)\n                .replace(/&/g, '&amp;')\n                .replace(/\u003c/g, '&lt;')\n                .replace(/>/g, '&gt;')\n                .replace(/\"/g, '&quot;');\n        }\n\n        if (document.readyState === 'loading') {\n            document.addEventListener('DOMContentLoaded', initScene);\n        } else {\n            initScene();\n        }\n    \u003c/script>\n\u003c/body>\n\u003c/html>"</script>
