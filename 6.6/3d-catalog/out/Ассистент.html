px;left:8px;padding:6px 10px}\n  .bar{left:8px;right:8px;top:auto;bottom:auto;position:fixed;top:calc(env(safe-area-inset-top,0px) + 56px);flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;padding-bottom:2px}\n  .bar button,.bar label.btn{white-space:nowrap;padding:6px 11px;font-size:calc(12px*var(--fz,1))}\n  .panel{left:8px;right:8px;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);width:auto;max-height:var(--ph,46vh)}\n  .rz{display:none}\n  .rzm{display:flex}\n  body.viewer .bar{right:8px}\n}\n\u003c/style>\u003c/head>\n\u003cbody>\n\u003ccanvas id=\"c\">\u003c/canvas>\n\u003cdiv id=\"drop\">\u003cdiv>Перетащите сюда файл .obj или .html (экспорт FreeCAD или проект из редактора размеров)\u003cbr>или нажмите «Открыть OBJ / HTML»\u003c/div>\u003c/div>\n\u003cdiv id=\"over\">\u003c/div>\n\u003cdiv class=\"card s\" id=\"info\">Файл не загружен\u003c/div>\n\u003cdiv class=\"rz\" id=\"rz\" title=\"Потяните, чтобы изменить ширину (двойной клик — сбросить)\">\u003c/div>\n\u003cdiv id=\"tip\">\u003c/div>\n\u003cdiv class=\"panel\" id=\"panel\">\n  \u003cdiv class=\"rzm\" id=\"rzm\">\u003c/div>\n  \u003cdiv class=\"card conv-only\" id=\"convBox\" hidden>\n    \u003cbutton type=\"button\" class=\"chead\" id=\"dataHead\" aria-expanded=\"true\">\u003cspan>Данные для сайта\u003c/span>\u003ci class=\"chev\">▾\u003c/i>\u003c/button>\n    \u003cdiv class=\"cbody\">\u003cdiv class=\"cin\">\n      \u003cdiv class=\"names\" id=\"names\">\n        \u003cspan>RU\u003c/span>\u003cinput id=\"nr\" placeholder=\"Название (русский)\">\n        \u003cspan>EN\u003c/span>\u003cinput id=\"ne\" placeholder=\"Name (English)\">\n        \u003cspan>HE\u003c/span>\u003cinput id=\"nh\" placeholder=\"שם (עברית)\" dir=\"rtl\">\n        \u003cspan>Тег\u003c/span>\u003cdiv style=\"display:flex;gap:4px\">\u003cinput id=\"tr\" placeholder=\"RU\" value=\"Модель\">\u003cinput id=\"te\" placeholder=\"EN\" value=\"Model\">\u003cinput id=\"th\" placeholder=\"HE\" value=\"דגם\" dir=\"rtl\">\u003c/div>\n        \u003cspan>Опис.\u003c/span>\u003cdiv style=\"display:flex;flex-direction:column;gap:4px\">\u003cinput id=\"dr\" placeholder=\"Описание RU (для поиска на сайте)\">\u003cinput id=\"de\" placeholder=\"Description EN\">\u003cinput id=\"dh\" placeholder=\"תיאור HE\" dir=\"rtl\">\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"unit\" style=\"margin-top:8px\">Единицы в файле\n        \u003cselect id=\"unit\">\u003coption value=\"1\">мм\u003c/option>\u003coption value=\"10\">см\u003c/option>\u003coption value=\"1000\">м\u003c/option>\u003coption value=\"25.4\">дюймы\u003c/option>\u003c/select>\n      \u003c/div>\n    \u003c/div>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"card\">\n    \u003cdiv class=\"tools conv-only\" id=\"tools\" hidden>\n      \u003cbutton type=\"button\" data-ll=\"ru\" class=\"on\">RU\u003c/button>\u003cbutton type=\"button\" data-ll=\"en\">EN\u003c/button>\u003cbutton type=\"button\" data-ll=\"he\">HE\u003c/button>\n      \u003cspan class=\"fzb\">\u003cbutton type=\"button\" id=\"fzm\" data-tip=\"Шрифт меньше\">A−\u003c/button>\u003cbutton type=\"button\" id=\"fzp\" data-tip=\"Шрифт больше\">A+\u003c/button>\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"conv-only\" id=\"thrBox\" hidden>\n      \u003clabel class=\"lkrow\" data-tip=\"Упростить резьбу\">\u003cinput type=\"checkbox\" id=\"thr\">\u003cspan>Упростить резьбу\u003c/span>\u003c/label>\n      \u003clabel class=\"lkrow\" data-tip=\"Все ползунки\">\u003cinput type=\"checkbox\" id=\"allOn\" checked>\u003cspan>Все ползунки\u003c/span>\u003c/label>\n      \u003clabel class=\"lkrow\" data-tip=\"Масштаб и оси\">\u003cinput type=\"checkbox\" id=\"onlyTot\">\u003cspan>Масштаб и оси\u003c/span>\u003c/label>\n      \u003clabel class=\"lkrow\" id=\"pinBox\" data-tip=\"Поставить или снять фиксатор центра 🎯 сразу у всех размеров\" hidden>\u003cinput type=\"checkbox\" id=\"allPin\">\u003cspan>Все 🎯 центры\u003c/span>\u003c/label>\n      \u003clabel class=\"lkrow\" id=\"scBox\" data-tip=\"Показывать ползунок масштаба в %\" hidden>\u003cinput type=\"checkbox\" id=\"scOn\">\u003cspan>Масштаб %\u003c/span>\u003c/label>\n      \u003clabel class=\"lkrow\" id=\"dimBox\" data-tip=\"Показать или скрыть на модели все размеры со значениями\" hidden>\u003cinput type=\"checkbox\" id=\"dimAll\">\u003cspan>Размеры на модели\u003c/span>\u003c/label>\n      \u003cbutton type=\"button\" id=\"allGear\" data-tip=\"Свернуть настройки ⚙ у всех размеров\" hidden>⚙ Свернуть все\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"conv-only\" id=\"fnBox\" hidden>\n      \u003cdiv class=\"fnsec\" id=\"fnMain\" hidden>\u003cdiv class=\"fnh\">Функции модели\u003c/div>\u003cdiv class=\"fnl\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"fnsec test\" id=\"fnTest\">\u003cdiv class=\"fnh\">🧪 Тестовые функции\u003c/div>\u003cdiv class=\"fnl\">\u003c/div>\u003c/div>\n    \u003c/div>\n    \u003cdiv id=\"axes\">\u003c/div>\n    \u003cbutton id=\"rs\">Исходные размеры\u003c/button>\n    \u003cbutton id=\"bd\" class=\"dl conv-only\" hidden>⬇ Скачать готовый HTML\u003c/button>\n    \u003cdiv class=\"s\" id=\"msg\">\u003c/div>\n  \u003c/div>\n\u003c/div>\n\u003cdiv class=\"bar\">\n\u003clabel class=\"btn primary conv-only\">Открыть OBJ / HTML\u003cinput id=\"f\" type=\"file\" accept=\".obj,.html,.htm\">\u003c/label>\n\u003cbutton id=\"bz\" class=\"on conv-only\">Z вверх\u003c/button>\n\u003cbutton id=\"bs\" class=\"on conv-only\">Сглаживание\u003c/button>\n\u003cbutton id=\"bw\">Каркас\u003c/button>\n\u003cbutton id=\"br\" class=\"on\">Вращение\u003c/button>\n\u003clabel class=\"btn\">Цвет \u003cinput id=\"col\" type=\"color\" value=\"#4a4d52\">\u003c/label>\n\u003cbutton id=\"bv\">Сброс вида\u003c/button>\n\u003c/div>\n\u003cscript type=\"text/plain\" id=\"core-src\">\nfunction faceNormals(pos,n,area){\n  const fn=new Float32Array(n*3);\n  for(let f=0;f\u003cn;f++){\n    const o=f*9,ax=pos[o+3]-pos[o],ay=pos[o+4]-pos[o+1],az=pos[o+5]-pos[o+2],bx=pos[o+6]-pos[o],by=pos[o+7]-pos[o+1],bz=pos[o+8]-pos[o+2];\n    const x=ay*bz-az*by,y=az*bx-ax*bz,z=ax*by-ay*bx,l=Math.hypot(x,y,z)||1;\n    fn[f*3]=x/l;fn[f*3+1]=y/l;fn[f*3+2]=z/l;if(area)area[f]=l/2;\n  }\n  return fn;\n}\n// поиск ключевых плоскостей по каждой оси и построение параметров\nfunction detect(pos,n,opt){\n  const split=!!(opt&&opt.split); // split: каждая стенка отдельно (без зеркальной симметрии)\n  const area=new Float32Array(n),fn=faceNormals(pos,n,area),res=[];\n  const NV=pos.length/3,wid=new Int32Array(NV),wm=new Map(),wp=[];\n  for(let v=0;v\u003cNV;v++){const k=Math.round(pos[v*3]*1e4)+','+Math.round(pos[v*3+1]*1e4)+','+Math.round(pos[v*3+2]*1e4);\n    let id=wm.get(k);if(id===undefined){id=wp.length/3;wm.set(k,id);wp.push(pos[v*3],pos[v*3+1],pos[v*3+2])}wid[v]=id}\n  let e0=0;for(let a=0;a\u003c3;a++){let l=Infinity,h=-Infinity;for(let i=a;i\u003cpos.length;i+=3){l=Math.min(l,pos[i]);h=Math.max(h,pos[i])}e0=Math.max(e0,h-l)}\n  const tau=.035*e0,par=Int32Array.from({length:wp.length/3},(_,i)=>i),find=x=>{while(par[x]!==x){par[x]=par[par[x]];x=par[x]}return x};\n  for(let f=0;f\u003cn;f++)for(let i=0;i\u003c3;i++){\n    const a=wid[f*3+i],b=wid[f*3+(i+1)%3];\n    if(Math.hypot(wp[a*3]-wp[b*3],wp[a*3+1]-wp[b*3+1],wp[a*3+2]-wp[b*3+2])\u003ctau)par[find(a)]=find(b);\n  }\n  // плотные участки мелкой геометрии (например, выпуклый текст) двигаются как жёсткий блок\n  const cm=new Map();\n  for(let i=0;i\u003cwp.length/3;i++){const r=find(i);let c=cm.get(r);if(!c)cm.set(r,c={n:0,mn:[1e9,1e9,1e9],mx:[-1e9,-1e9,-1e9]});c.n++;for(let k=0;k\u003c3;k++){c.mn[k]=Math.min(c.mn[k],wp[i*3+k]);c.mx[k]=Math.max(c.mx[k],wp[i*3+k])}}\n  const dense=new Set();\n  for(const [r,c] of cm){if(c.n\u003c200)continue;const ex=c.mx.map((x,k)=>x-c.mn[k]).sort((x,y)=>y-x);\n    if(c.n/Math.max(ex[0]*ex[1],1e-6)*tau*tau>20)dense.add(r)}\n  const cid=new Int32Array(NV);for(let v=0;v\u003cNV;v++){const r=find(wid[v]);cid[v]=dense.has(r)?r:-1}\n  for(let a=0;a\u003c3;a++){\n    let lo=Infinity,hi=-Infinity;\n    for(let i=a;i\u003cpos.length;i+=3){lo=Math.min(lo,pos[i]);hi=Math.max(hi,pos[i])}\n    const bins=new Map();\n    for(let f=0;f\u003cn;f++){\n      if(Math.abs(fn[f*3+a])\u003c.999)continue;\n      const c0=pos[f*9+a];if(Math.abs(c0-pos[f*9+3+a])>1e-3||Math.abs(c0-pos[f*9+6+a])>1e-3)continue;\n      const k=Math.round(c0*10),b=bins.get(k)||{a:0,s:0,n:0};b.a+=area[f];b.s+=c0*area[f];b.n+=area[f]*Math.sign(fn[f*3+a]);bins.set(k,b);\n    }\n    const ks=[...bins.keys()].sort((x,y)=>x-y),grp=[];\n    for(const k of ks){const b=bins.get(k),g=grp[grp.length-1];\n      if(g&&k-g.k\u003c=1){g.a+=b.a;g.s+=b.s;g.n+=b.n;g.k=k}else grp.push({a:b.a,s:b.s,n:b.n,k})}\n    const mx=Math.max(0,...grp.map(g=>g.a));\n    let P=grp.filter(g=>g.a>=mx*.1).map(g=>g.s/g.a);\n    // стенки: наружная плоскость на краю детали + ближайшая внутренняя плоскость с противоположной нормалью\n    const gv=grp.map(g=>({v:g.s/g.a,a:g.a,n:g.n})),ex0=hi-lo;let wLo=null,wHi=null;\n    const lowOut=gv.find(g=>Math.abs(g.v-lo)\u003c.3&&g.n\u003c0&&g.a>=mx*.1);\n    if(lowOut){const w=gv.find(g=>g.v>lowOut.v+.3&&g.n>0&&g.a>=mx*.015&&g.v-lowOut.v\u003c=.33*ex0);if(w)wLo=w.v}\n    const hiOut=gv.slice().reverse().find(g=>Math.abs(g.v-hi)\u003c.3&&g.n>0&&g.a>=mx*.1);\n    if(hiOut){const w=gv.slice().reverse().find(g=>g.v\u003chiOut.v-.3&&g.n\u003c0&&g.a>=mx*.015&&hiOut.v-g.v\u003c=.33*ex0);if(w)wHi=w.v}\n    [wLo,wHi].forEach(w=>{if(w!==null&&!P.some(x=>Math.abs(x-w)\u003c.3))P.push(w)});\n    P.sort((x,y)=>x-y);\n    if(!P.length||P[0]-lo>.3)P.unshift(lo);\n    if(hi-P[P.length-1]>.3)P.push(hi);\n    const k=P.length,c=(lo+hi)/2;\n    let sym=!split&&k>=4&&k%2===0;\n    for(let i=0;sym&&i\u003ck/2;i++)if(Math.abs((P[i]-c)+(P[k-1-i]-c))>.2)sym=false;\n    const A={a,sym,c,P,lo,hi};\n    if(sym){\n      const h=P.slice(k/2).map(p=>p-c);A.bp=[0,...h];\n      A.segs=[2*h[0],...h.slice(1).map((v,i)=>v-h[i])];\n      A.names=A.segs.map((_,i)=>i===0?'Внутренняя ширина':(A.segs.length===2?'Толщина стенки':'Стенка '+i));\n    }else{\n      A.bp=P.slice();A.segs=P.slice(1).map((v,i)=>v-P[i]);\n      A.names=A.segs.map((_,i)=>'Участок '+(i+1));\n    }\n    A.wall=sym?A.segs.map((_,i)=>i>=1):A.segs.map((_,i)=>{const L=A.segs.length;return L>1&&((wLo!==null&&i===0&&Math.abs(P[1]-wLo)\u003c.3)||(wHi!==null&&i===L-1&&Math.abs(P[L-1]-wHi)\u003c.3))});\n    A.inner=A.segs.map((_,i)=>!sym&&A.segs.length===3&&A.wall[0]&&A.wall[2]&&i===1);\n    A.vals=A.segs.slice();A.totName=['Внешняя длина','Внешняя ширина','Внешняя высота'][a];\n    A.rng=A.segs.map((s,i)=>sym?(i===0?[s*.5,s*2]:[Math.max(1,s*.5),s*2.5]):(A.wall[i]?[Math.max(.5,s*.5),s*2.5]:[s*.5,s*2.5]));\n    const T0=sym?A.segs[0]+2*A.segs.slice(1).reduce((q,x)=>q+x,0):A.segs.reduce((q,x)=>q+x,0);\n    A.trng=sym?[A.rng[0][0]+2*A.rng.slice(1).reduce((q,x)=>q+x[0],0),A.rng[0][1]+2*A.rng.slice(1).reduce((q,x)=>q+x[1],0)]:[T0*.7,T0*1.4];\n    const N=NV;A.idx=new Uint8Array(N);A.sg=new Int8Array(N);A.f=new Float32Array(N);\n    const U=new Float32Array(N);\n    for(let v=0;v\u003cN;v++){let u=pos[v*3+a];if(sym){u-=c;A.sg[v]=u\u003c0?-1:1;u=Math.abs(u)}U[v]=u}\n    // жёсткие блоки по этой оси: скругления, фаски, текст и другие мелкие детали двигаются целиком и не деформируются\n    const ext=hi-lo,rig=new Set();\n    for(const [rt,cc] of cm){if(dense.has(rt)||(cc.n>=3&&cc.mx[a]-cc.mn[a]\u003c=.2*ext))rig.add(rt)}\n    const cida=new Int32Array(N);for(let v=0;v\u003cN;v++){const rt=find(wid[v]);cida[v]=rig.has(rt)?rt:-1}\n    const cs=new Map();\n    for(let v=0;v\u003cN;v++)if(cida[v]>=0){const u=sym?pos[v*3+a]-c:pos[v*3+a];let q=cs.get(cida[v]);if(!q)cs.set(cida[v],q={s:0,n:0,mn:u,mx:u});q.s+=u;q.n++;if(u\u003cq.mn)q.mn=u;if(u>q.mx)q.mx=u}\n    if(sym){\n      const su=Array.from(U).sort((x,y)=>x-y).filter((x,i,r)=>!i||x-r[i-1]>1e-3),cuts=[];\n      for(let j=0;j\u003cA.bp.length-1;j++){\n        const lo2=A.bp[j],hi2=A.bp[j+1],L=hi2-lo2,mg=L>20?.15*L:0,pts=[lo2,...su.filter(x=>x>lo2+1e-3&&x\u003chi2-1e-3),hi2];\n        let bg=0,cut=(lo2+hi2)/2;\n        for(let i=1;i\u003cpts.length;i++){const m=(pts[i]+pts[i-1])/2;if(m\u003clo2+mg||m>hi2-mg)continue;if(pts[i]-pts[i-1]>bg){bg=pts[i]-pts[i-1];cut=m}}\n        cuts.push(cut);\n      }\n      const zone=u=>{let j=0;while(j\u003ccuts.length&&u>cuts[j])j++;return j};\n      // блок привязывается к ключевой плоскости, которой он касается (скругление едет вместе со своей стенкой)\n      const bind=q=>{\n        if(q.mn*q.mx\u003c0)return -1;\n        const lo2=Math.min(Math.abs(q.mn),Math.abs(q.mx)),hi2=Math.max(Math.abs(q.mn),Math.abs(q.mx));let jl=-1,jh=-1;\n        for(let k=1;k\u003cA.bp.length;k++){if(Math.abs(hi2-A.bp[k])\u003c.3)jh=k;if(Math.abs(lo2-A.bp[k])\u003c.3)jl=k}\n        if(jh>=0&&jl\u003c0)return jh;if(jl>=0&&jh\u003c0)return jl;if(jh>=0&&jh===jl)return jh;return -1;\n      };\n      for(let v=0;v\u003cN;v++){A.idx[v]=zone(U[v]);\n        if(cida[v]>=0){const q=cs.get(cida[v]),m=q.s/q.n,j=bind(q);A.idx[v]=j>=0?j:zone(Math.abs(m));A.sg[v]=m\u003c0?-1:1}}\n    }else{\n      const L=hi-lo,r0=lo+.15*L,r1=hi-.15*L,fr=x=>Math.min(1,Math.max(0,(x-r0)/(r1-r0)));\n      A.T0=A.segs.reduce((q,x)=>q+x,0);\n      for(let v=0;v\u003cN;v++){A.f[v]=fr(U[v]);if(cida[v]>=0){const q=cs.get(cida[v]);A.f[v]=fr(q.s/q.n)}}\n      // режим «по участкам»: каждая деталь привязана к участку между ключевыми плоскостями\n      A.sj=new Uint8Array(N);A.st=new Float32Array(N);\n      for(let v=0;v\u003cN;v++){\n        let ref=U[v];\n        if(cida[v]>=0){\n          const q=cs.get(cida[v]);ref=q.s/q.n;let jl=-1,jh=-1;\n          for(let k=0;k\u003cA.bp.length;k++){if(Math.abs(q.mx-A.bp[k])\u003c.3)jh=k;if(Math.abs(q.mn-A.bp[k])\u003c.3)jl=k}\n          if((jh>=0&&jl\u003c0)||(jl>=0&&jh\u003c0)||(jh>=0&&jh===jl))ref=A.bp[jh>=0?jh:jl];\n        }\n        let j=0;while(j\u003cA.bp.length-2&&ref>A.bp[j+1])j++;\n        const dl=A.bp[j+1]-A.bp[j];A.sj[v]=j;A.st[v]=dl>1e-9?Math.min(1,Math.max(0,(ref-A.bp[j])/dl)):0;\n      }\n    }\n    A.seg=false;A.free=null;\n    res.push(A);\n  }\n  return res;\n}\nfunction newBP(A){\n  const v=A.vals,o=[];\n  if(A.sym){o.push(0,v[0]/2);for(let i=1;i\u003cv.length;i++)o.push(o[o.length-1]+v[i])}\n  else{o.push(A.P[0]);for(let i=0;i\u003cv.length;i++)o.push(o[o.length-1]+v[i])}\n  return o;\n}\nfunction total(A){return A.sym?A.vals[0]+2*A.vals.slice(1).reduce((s,x)=>s+x,0):A.vals.reduce((s,x)=>s+x,0)}\nfunction setSeg(A,i,v){A.vals[i]=Math.min(A.rng[i][1],Math.max(A.rng[i][0],v))}\nfunction setTotal(A,T){\n  if(A.sym){setSeg(A,0,T-2*A.vals.slice(1).reduce((s,x)=>s+x,0))}\n  else if(A.seg){\n    T=Math.min(A.trng[1],Math.max(A.trng[0],T));\n    const fr=A.free||A.vals.map(()=>true),all=A.vals.map((_,i)=>i);\n    let idx=all.filter(i=>fr[i]&&!(A.wall&&A.wall[i]));\n    if(!idx.length)idx=all.filter(i=>fr[i]);\n    if(!idx.length)return;\n    let Sf=0,So=0;A.vals.forEach((x,i)=>{if(idx.indexOf(i)>=0)Sf+=x;else So+=x});\n    if(Sf\u003c=0)return;\n    const k=(T-So)/Sf;\n    idx.forEach(i=>{A.vals[i]=Math.min(A.rng[i][1],Math.max(A.rng[i][0],A.vals[i]*k))});\n  }\n  else{T=Math.min(A.trng[1],Math.max(A.trng[0],T));let m=0;A.vals.forEach((x,i)=>{if(x>A.vals[m])m=i});\n    A.vals[m]=Math.max(.1,T-A.vals.reduce((s,x,i)=>s+(i===m?0:x),0))}\n}\nfunction deform(pos0,out,AX){\n  out.set(pos0);\n  for(const A of AX){\n    const a=A.a,N=A.idx.length;\n    if(A.sym){const nb=newBP(A),d=nb.map((x,j)=>x-A.bp[j]);for(let v=0;v\u003cN;v++)out[v*3+a]+=A.sg[v]*d[A.idx[v]]}\n    else if(A.seg){const nb=newBP(A);for(let v=0;v\u003cN;v++){const j=A.sj[v],t=A.st[v];out[v*3+a]+=nb[j]+t*(nb[j+1]-nb[j])-(A.bp[j]+t*(A.bp[j+1]-A.bp[j]))}}\n    else{const D=total(A)-A.T0;for(let v=0;v\u003cN;v++)out[v*3+a]+=A.f[v]*D}\n  }\n}\n// ---------- разбор OBJ ----------\nfunction parseOBJ(t){\n  const V=[],o=[];\n  for(const line of t.split(/\\r?\\n/)){\n    const c=line.charCodeAt(0);\n    if(c!==118&&c!==102&&c!==32&&c!==9)continue; // быстрый отсев: только строки v и f\n    const p=line.trim().split(/\\s+/);\n    if(p[0]==='v')V.push(+p[1],+p[2],+p[3]);\n    else if(p[0]==='f'){\n      const ix=p.slice(1).map(s=>{const i=parseInt(s);return i\u003c0?V.length/3+i:i-1});\n      for(let k=1;k\u003cix.length-1;k++)for(const i of [ix[0],ix[k],ix[k+1]])o.push(V[i*3],V[i*3+1],V[i*3+2]);\n    }\n  }\n  return {pos:Float32Array.from(o),n:o.length/9};\n}\n// ---------- сварка вершин: индексная форма (компактная) ----------\nfunction weld(pos){\n  const m=new Map(),U=[],I=[];\n  for(let i=0;i\u003cpos.length;i+=3){\n    const k=Math.round(pos[i]*1e4)+','+Math.round(pos[i+1]*1e4)+','+Math.round(pos[i+2]*1e4);\n    let id=m.get(k);\n    if(id===undefined){id=U.length/3;m.set(k,id);U.push(pos[i],pos[i+1],pos[i+2])}\n    I.push(id);\n  }\n  const T=[];\n  for(let f=0;f\u003cI.length;f+=3){const a=I[f],b=I[f+1],c=I[f+2];if(a!==b&&b!==c&&a!==c)T.push(a,b,c)}\n  return {U:Float32Array.from(U),I:Uint32Array.from(T)};\n}\nfunction expand(U,I){\n  const o=new Float32Array(I.length*3);\n  for(let i=0;i\u003cI.length;i++){o[i*3]=U[I[i]*3];o[i*3+1]=U[I[i]*3+1];o[i*3+2]=U[I[i]*3+2]}\n  return o;\n}\n// эталонная («каноническая») геометрия: и конвертер, и сайт работают с одним и тем же массивом\nfunction canon(pos){const w=weld(pos);return {U:w.U,I:w.I,pos:expand(w.U,w.I),n:w.I.length/3}}\nfunction b64enc(a){const u=new Uint8Array(a.buffer,a.byteOffset,a.byteLength);let s='';for(let i=0;i\u003cu.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)}\nfunction b64dec(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i\u003cb.length;i++)u[i]=b.charCodeAt(i);return u}\nfunction slug(name){\n  const base=name.replace(/\\.[^.]+$/,'');\n  const a=base.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');\n  let h=5381;for(let i=0;i\u003cbase.length;i++)h=((h\u003c\u003c5)+h+base.charCodeAt(i))>>>0;\n  const pure=/^[\\x20-\\x7e]+$/.test(base)&&a;\n  return 'obj-'+(pure?a:(a?a+'-':'')+h.toString(36));\n}\n// ---------- параметры модели: список, подписи, видимость ----------\nconst LBL={\n  he:{axis:['אורך','רוחב','גובה'],tot:['אורך חיצוני','רוחב חיצוני','גובה חיצוני'],inner:'מידה פנימית',wall:'עובי דופן',part:'קטע',thick:'עובי',all:'עובי כל הקירות, %',lo:['התחלה','התחלה','תחתית'],hi:['סוף','סוף','עליון']},\n  en:{axis:['Length','Width','Height'],tot:['Outer length','Outer width','Outer height'],inner:'inner size',wall:'wall thickness',part:'section',thick:'thickness',all:'All walls thickness, %',lo:['start','start','bottom'],hi:['end','end','top']},\n  ru:{axis:['Длина','Ширина','Высота'],tot:['Внешняя длина','Внешняя ширина','Внешняя высота'],inner:'внутренний размер',wall:'толщина стенки',part:'участок',thick:'толщина',all:'Толщина всех стенок, %',lo:['начало','начало','низ'],hi:['конец','конец','верх']}\n};\n// все возможные ползунки: s — сегменты симметричной оси, p — участки несимметричной оси, t — внешний размер\nfunction paramList(axes){\n  const o=[];\n  axes.forEach((ax,ai)=>{\n    if(ax.sym)for(let i=0;i\u003cax.n;i++)o.push({key:'a'+ai+'s'+i,ai,i,kind:'s',ax});\n    else if(ax.n>1)for(let i=0;i\u003cax.n;i++)o.push({key:'a'+ai+'s'+i,ai,i,kind:(ax.wall&&ax.wall[i])?'w':(ax.inner&&ax.inner[i]?'i':'p'),ax});\n    o.push({key:'a'+ai+'t',ai,i:-1,kind:'t',ax});\n  });\n  if(o.filter(isWall).length>1)o.unshift({key:'wall_all',ai:-1,i:-1,kind:'m',ax:null});\n  return o;\n}\nfunction defLabel(lang,p){\n  const L=LBL[lang]||LBL.en,ax=L.axis[p.ai]||'';\n  if(p.kind==='t')return L.tot[p.ai];\n  if(p.kind==='m')return L.all;\n  if(p.kind==='i')return ax+': '+L.inner;\n  if(p.kind==='w')return ax+': '+L.thick+' ('+(p.i===0?L.lo[p.ai]:L.hi[p.ai])+')';\n  if(p.kind==='p')return ax+': '+L.part+' '+(p.i+1);\n  return ax+': '+(p.i===0?L.inner:(p.ax.n===2?L.wall:L.wall+' '+p.i));\n}\n// выключенные ползунки; у старых моделей (без поля ui) участки несимметричных осей выключены\nfunction offSet(e){\n  let s;\n  if(e.ui&&Array.isArray(e.ui.off))s=new Set(e.ui.off);\n  else{s=new Set();paramList(e.axes).forEach(p=>{if(p.kind== ],mi=-1;\n  for(let i=0;i\u003can.length-1;i++){const g=an[i+1]-an[i];if(g>mg){mg=g;mi=i}}\n  const A=mi\u003c0?an[0]:an[mi+1],B=mi\u003c0?an[an.length-1]:an[mi];\n  return {cov:2*Math.PI-mg,A,B};\n}\n// резьбовые зоны: связные группы «винтовых» граней, вытянутые вдоль оси и кольцевые по сечению\nfunction threadZones(P,I){\n  const NV=P.length/3,nF=I.length/3,nn=new Float32Array(nF*3);\n  for(let f=0;f\u003cnF;f++){const a=I[f*3]*3,b=I[f*3+1]*3,c=I[f*3+2]*3,ux=P[b]-P[a],uy=P[b+1]-P[a+1],uz=P[b+2]-P[a+2],wx=P[c]-P[a],wy=P[c+1]-P[a+1],wz=P[c+2]-P[a+2];\n    const x=uy*wz-uz*wy,y=uz*wx-ux*wz,z=ux*wy-uy*wx,l=Math.hypot(x,y,z)||1;nn[f*3]=x/l;nn[f*3+1]=y/l;nn[f*3+2]=z/l}\n  const zid=new Int16Array(NV),zones=[];\n  for(let A=0;A\u003c3;A++){\n    const B=(A+1)%3,C=(A+2)%3,par=new Int32Array(NV).map((_,i)=>i),fd=x=>{while(par[x]!==x){par[x]=par[par[x]];x=par[x]}return x},mid=[];\n    for(let f=0;f\u003cnF;f++){const na=Math.abs(nn[f*3+A]);if(na>.12&&na\u003c.97){mid.push(f);par[fd(I[f*3])]=fd(I[f*3+1]);par[fd(I[f*3+1])]=fd(I[f*3+2])}}\n    const cp=new Map();\n    for(const f of mid){const r=fd(I[f*3]);let q=cp.get(r);if(!q)cp.set(r,q={n:0,mn:[1e9,1e9,1e9],mx:[-1e9,-1e9,-1e9]});q.n++;\n      for(let j=0;j\u003c3;j++){const v=I[f*3+j]*3;for(let k=0;k\u003c3;k++){q.mn[k]=Math.min(q.mn[k],P[v+k]);q.mx[k]=Math.max(q.mx[k],P[v+k])}}}\n    const cand=[];\n    for(const [r,q] of cp){\n      if(q.n\u003c150)continue;\n      const eb=q.mx[B]-q.mn[B],ec=q.mx[C]-q.mn[C],ez=q.mx[A]-q.mn[A];\n      if(Math.abs(eb-ec)>.08*Math.max(eb,ec))continue;\n      cand.push({r,cb:(q.mn[B]+q.mx[B])/2,cc:(q.mn[C]+q.mx[C])/2,zl:q.mn[A],zh:q.mx[A],ez,rl:1e9,rh:-1e9});\n    }\n    if(!cand.length)continue;\n    const byRoot=new Map(cand.map(c=>[c.r,c]));\n    for(const f of mid){const c=byRoot.get(fd(I[f*3]));if(!c)continue;for(let j=0;j\u003c3;j++){const v=I[f*3+j]*3,r=Math.hypot(P[v+B]-c.cb,P[v+C]-c.cc);c.rl=Math.min(c.rl,r);c.rh=Math.max(c.rh,r)}}\n    for(const c of cand){\n      const depth=c.rh-c.rl,rmid=(c.rl+c.rh)/2;\n      if(depth\u003c.02||depth>.3*rmid||c.ez\u003c3*depth)continue;\n      zones.push({A,B,C,cb:c.cb,cc:c.cc,rm:rmid,rl:c.rl,rh:c.rh,zl:c.zl,zh:c.zh,tr:Math.max(.005,depth*.03)});\n    }\n  }\n  zones.forEach((z,zi)=>{\n    for(let v=0;v\u003cNV;v++){if(zid[v])continue;const a=P[v*3+z.A];if(a\u003cz.zl-1e-3||a>z.zh+1e-3)continue;\n      const r=Math.hypot(P[v*3+z.B]-z.cb,P[v*3+z.C]-z.cc);if(r\u003cz.rl-z.tr||r>z.rh+z.tr)continue;zid[v]=zi+1}\n  });\n  return {zones,zid};\n}\n// номер тела для каждого диаметра, отверстия и уклона (тело = отдельная связная часть сетки)\nfunction geoBodies(I,V,holes,bosses,slopes,part){\n  const par=new Int32Array(V);for(let i=0;i\u003cV;i++)par[i]=i;\n  const fd=x=>{while(par[x]!==x){par[x]=par[par[x]];x=par[x]}return x};\n  for(let t=0;t\u003cI.length;t+=3){par[fd(I[t])]=fd(I[t+1]);par[fd(I[t+1])]=fd(I[t+2])}\n  const items=[];\n  const cylV=f=>f.verts.length?f.verts[0]:(f.tv&&f.tv.length?f.tv[0]:f.pts.values().next().value);\n  bosses.forEach((f,i)=>items.push(['d'+i,cylV(f)]));\n  holes.forEach((f,i)=>items.push(['h'+i,cylV(f)]));\n  slopes.forEach((s,i)=>items.push(['sl'+i,s.faces.length?s.faces[0].verts[0]:undefined]));\n  const num=new Map(),body={};let last=0;\n  items.forEach(([k,v])=>{if(!part[k]||v===undefined)return;const c=fd(v);if(!num.has(c))num.set(c,part[k]);last=Math.max(last,part[k])});\n  items.forEach(([k,v])=>{\n    if(part[k]){body[k]=part[k];return}\n    if(v===undefined)return;\n    const c=fd(v);if(!num.has(c))num.set(c,++last);body[k]=num.get(c)});\n  return body;\n}\nfunction geoDetect(U,I){\n  const V=U.length/3,T=I.length/3;\n  const mn=[1e9,1e9,1e9],mx=[-1e9,-1e9,-1e9];\n  for(let i=0;i\u003cV;i++)for(let k=0;k\u003c3;k++){const x=U[i*3+k];if(x\u003cmn[k])mn[k]=x;if(x>mx[k])mx[k]=x}\n  const c0=mn.map((x,k)=>(x+mx[k])/2),dim=mx.map((x,k)=>x-mn[k]);\n  const nrm=new Float32Array(T*3),area=new Float32Array(T);let vol=0,tot=0;\n  for(let t=0;t\u003cT;t++){\n    const a=I[t*3]*3,b=I[t*3+1]*3,c=I[t*3+2]*3;\n    const e1x=U[b]-U[a],e1y=U[b+1]-U[a+1],e1z=U[b+2]-U[a+2],e2x=U[c]-U[a],e2y=U[c+1]-U[a+1],e2z=U[c+2]-U[a+2];\n    const nx=e1y*e2z-e1z*e2y,ny=e1z*e2x-e1x*e2z,nz=e1x*e2y-e1y*e2x,l=Math.hypot(nx,ny,nz);\n    area[t]=l/2;tot+=l/2;\n    if(l>1e-12){nrm[t*3]=nx/l;nrm[t*3+1]=ny/l;nrm[t*3+2]=nz/l}\n    vol+=(U[a]*(U[b+1]*U[c+2]-U[b+2]*U[c+1])-U[a+1]*(U[b]*U[c+2]-U[b+2]*U[c])+U[a+2]*(U[b]*U[c+1]-U[b+1]*U[c]))/6;\n  }\n  if(vol\u003c0)for(let i=0;i\u003cnrm.length;i++)nrm[i]=-nrm[i]; // нормали наружу\n  const em=new Map(),nb=new Array(T);for(let t=0;t\u003cT;t++)nb[t]=[];\n  for(let t=0;t\u003cT;t++)for(let e=0;e\u003c3;e++){\n    const p=I[t*3+e],q=I[t*3+(e+1)%3],key=p\u003cq?p*V+q:q*V+p,o=em.get(key);\n    if(o===undefined)em.set(key,t);else{nb[t].push(o);nb[o].push(t)}\n  }\n  const TZ=threadZones(U,I),tmask=new Uint8Array(V);\n  // маска — вершины строго внутри резьбовой зоны (граничные кольца принадлежат гладкому цилиндру)\n  for(let i=0;i\u003cV;i++)if(TZ.zid[i]){const z=TZ.zones[TZ.zid[i]-1],a=U[i*3+z.A];if(a>z.zl+1e-3&&a\u003cz.zh-1e-3)tmask[i]=1}\n  // ---- цилиндры вдоль осей X, Y, Z ----\n  const found=[];\n  for(let a=0;a\u003c3;a++){\n    const u=(a+1)%3,v=(a+2)%3,q=new Uint8Array(T),phi=new Float32Array(T);\n    for(let t=0;t\u003cT;t++)if(area[t]>0&&Math.abs(nrm[t*3+a])\u003c.05&&!(tmask[I[t*3]]&&tmask[I[t*3+1]]&&tmask[I[t*3+2]])){q[t]=1;phi[t]=Math.atan2(nrm[t*3+v],nrm[t*3+u])}\n    const dph=(s,t)=>{const d=Math.abs(phi[s]-phi[t]);return d>Math.PI?2*Math.PI-d:d};\n    const cvx=new Uint8Array(T);\n    for(let t=0;t\u003cT;t++)if(q[t])for(const s of nb[t])if(q[s]){const d=dph(s,t);if(d>.005&&d\u003c1.22){cvx[t]=1;break}}\n    const comp=new Uint8Array(T);\n    for(let t0=0;t0\u003cT;t0++){\n      if(!cvx[t0]||comp[t0])continue;\n      const st=[t0],tris=[];comp[t0]=1;\n      while(st.length){const x=st.pop();tris.push(x);for(const s of nb[x])if(cvx[s]&&!comp[s]&&dph(s,x)\u003c1.22){comp[s]=1;st.push(s)}}\n      const ids=new Set();tris.forEach(t=>{for(let e=0;e\u003c3;e++)ids.add(I[t*3+e])});\n      let pts=[...ids],fit=null;\n      for(let it=0;it\u003c3&&pts.length>=6;it++){\n        fit=geoKasa(U,pts,u,v);if(!fit){pts=[];break}\n        const lim=Math.max(.05*fit.r,.15);\n        const keep=pts.filter(i=>Math.abs(Math.hypot(U[i*3+u]-fit.cu,U[i*3+v]-fit.cv)-fit.r)\u003c=lim);\n        if(keep.length===pts.length)break;pts=keep;\n      }\n      if(pts.length\u003c6||!fit)continue;\n      fit=geoKasa(U,pts,u,v);if(!fit)continue;\n      let rms=0;pts.forEach(i=>{const d=Math.hypot(U[i*3+u]-fit.cu,U[i*3+v]-fit.cv)-fit.r;rms+=d*d});rms=Math.sqrt(rms/pts.length);\n      if(fit.r\u003c.4||fit.r>Math.max(...dim)||rms>.03*fit.r+.03)continue;\n      const set=new Set(pts);let os=0;\n      tris.forEach(t=>{\n        let ok=true;for(let e=0;e\u003c3;e++)if(!set.has(I[t*3+e]))ok=false;if(!ok)return;\n        let mu=0,mv=0;for(let e=0;e\u003c3;e++){mu+=U[I[t*3+e]*3+u];mv+=U[I[t*3+e]*3+v]}mu=mu/3-fit.cu;mv=mv/3-fit.cv;\n        const l=Math.hypot(mu,mv)||1;os+=area[t]*(nrm[t*3+u]*mu+nrm[t*3+v]*mv)/l;\n      });\n      found.push({ax:a,u,v,cu:fit.cu,cv:fit.cv,r:fit.r,pts:set,os});\n    }\n  }\n  // ---- слияние кусков одного цилиндра (разрезанных на половины / по длине) ----\n  const merged=[];\n  found.forEach(f=>{\n    const m=merged.find(g=>g.ax===f.ax&&Math.abs(g.cu-f.cu)\u003c.3&&Math.abs(g.cv-f.cv)\u003c.3&&Math.abs(g.r-f.r)\u003c.02*g.r+.05);\n    if(m){f.pts.forEach(i=>m.pts.add(i));m.os+=f.os}else merged.push(f);\n  });\n  const cyl=[];\n  merged.forEach(f=>{\n    const pts=[...f.pts],cv=geoCover(U,pts,f.u,f.v,f.cu,f.cv);\n    let kind='arc';if(cv.cov>=5.76)kind=f.os>0?'boss':'hole';\n    let bu=0,bv=0;\n    if(kind==='arc'){\n      const bind=(ph)=>{const c=Math.cos(ph),s=Math.sin(ph);return Math.abs(s)\u003c.035?[Math.sign(c),0]:(Math.abs(c)\u003c.035?[0,Math.sign(s)]:[0,0])};\n      const e1=bind(cv.A),e2=bind(cv.B);\n      const comb=(x,y)=>x&&y?(x===y?x:0):(x||y);\n      bu=comb(e1[0],e2[0]);bv=comb(e1[1],e2[1]);\n    }\n    if(kind==='arc'&&f.r>.15*Math.max(...dim))return; // большие дуги — часть формы детали, масштабируются вместе с ней\n    cyl.push({ax:f.ax,u:f.u,v:f.v,cu:f.cu,cv:f.cv,r:f.r,kind,bu,bv,pts,ri:f.r,ro:f.r,rm:f.r});\n  });\n  // ---- резьба следует за своим диаметром: на крышке — внутренним, на теле — наружным ----\n  let nThr=0;\n  TZ.zones.forEach((z,zi)=>{\n    const tv=[];for(let i=0;i\u003cV;i++)if(TZ.zid[i]===zi+1)tv.push(i);\n    if(!tv.length)return;\n    let sg=0; // знак радиальной составляющей наружных нормалей: \u003c0 — внутренняя резьба (в отверстии)\n    for(let t=0;t\u003cT;t++){\n      const a=I[t*3],b=I[t*3+1],c=I[t*3+2];\n      if(TZ.zid[a]!==zi+1&&TZ.zid[b]!==zi+1&&TZ.zid[c]!==zi+1)continue;\n      const mu=(U[a*3+z.B]+U[b*3+z.B]+U[c*3+z.B])/3-z.cb,mv=(U[a*3+z.C]+U[b*3+z.C]+U[c*3+z.C])/3-z.cc,l=Math.hypot(mu,mv)||1;\n      sg+=area[t]*(nrm[t*3+z.B]*mu+nrm[t*3+z.C]*mv)/l;\n    }\n    const kind=sg\u003c0?'hole':'boss';\n    let lo=1e9,hi=-1e9;tv.forEach(i=>{const x=U[i*3+z.A];if(x\u003clo)lo=x;if(x>hi)hi=x});\n    const tol=Math.max(1.5*(z.rh-z.rl),.06*z.rm);\n    let par=null,bd=1e9;\n    cyl.forEach(f=>{\n      if(f.kind!==kind||f.ax!==z.A)return;\n      if(Math.hypot(f.cu-z.cb,f.cv-z.cc)>Math.max(.3,.02*f.r))return;\n      const dr=Math.abs(f.r-z.rm);if(dr>tol)return;\n      let flo=1e9,fhi=-1e9;f.pts.forEach(i=>{const x=U[i*3+f.ax];if(x\u003cflo)flo=x;if(x>fhi)fhi=x});\n      if(Math.max(flo,lo)-Math.min(fhi,hi)>.5)return;\n      if(dr\u003cbd){bd=dr;par=f}\n    });\n    if(par){par.tv=(par.tv||[]).concat(tv);par.ri=Math.min(par.ri,z.rl);par.ro=Math.max(par.ro,z.rh);par.rm=z.rm}\n    else cyl.push({ax:z.A,u:z.B,v:z.C,cu:z.cb,cv:z.cc,r:z.rm,kind,bu:0,bv:0,pts:new Set(),tv,ri:z.rl,ro:z.rh,rm:z.rm});\n    nThr++;\n  });\n  const rank=k=>({hole:0,boss:1,arc:2})[k];\n  cyl.sort((x,y)=>rank(x.kind)-rank(y.kind)||(y.r-x.r)||(x.cu-y.cu)||(x.cv-y.cv));\n  let nh=0,nbss=0;\n  cyl.forEach(f=>{\n    if(f.kind==='hole'){if(nh\u opes=[];\n  faces.forEach(f=>{\n    const w=Math.abs(f.nu)>=Math.abs(f.nv)?f.u:f.v,o=w===f.u?f.v:f.u,nw=w===f.u?f.nu:f.nv,no=w===f.u?f.nv:f.nu;\n    const m0=-no/nw,a0=Math.atan(Math.abs(m0));\n    const ids=new Set();f.tris.forEach(t=>{for(let e=0;e\u003c3;e++)ids.add(I[t*3+e])});\n    const verts=[...ids];\n    // шарнир уклона — конец грани, примыкающий к основанию (нижний при наклоне наружу в +w, верхний при -w)\n    let wb=nw>0?1e9:-1e9,up=0;\n    verts.forEach(i=>{const x=U[i*3+w];if(nw>0?x\u003cwb:x>wb)wb=x});\n    let cn=0;verts.forEach(i=>{if(Math.abs(U[i*3+w]-wb)\u003c1e-4){up+=U[i*3+o];cn++}});up/=cn||1;\n    let s=slopes.find(x=>x.w===w&&x.u===o&&x.c===f.c&&Math.abs(x.a0-a0)\u003c.012);\n    if(!s){if(slopes.length>=4)return;s={c:f.c,w,u:o,a0,faces:[]};slopes.push(s)}\n    let umin=1e9,umax=-1e9;verts.forEach(i=>{const x=U[i*3+o];if(x\u003cumin)umin=x;if(x>umax)umax=x});\n    s.nw=nw>0?1:-1;\n    if(s.faces.length\u003c6)s.faces.push({verts:Int32Array.from(verts),m0,up,wp:wb,umin,umax});\n  });\n  // ---- зависимости размеров: внутренний диаметр не может выйти за внешний; резьба и посадка крышки ----\n  const rel=[],ext=[];\n  const nodes=[];\n  holes.forEach(f=>nodes.push({f,t:'h',i:f.hi}));bosses.forEach(f=>nodes.push({f,t:'d',i:f.di}));\n  nodes.forEach(n=>{let lo=1e9,hi=-1e9;const ch=i=>{const x=U[i*3+n.f.ax];if(x\u003clo)lo=x;if(x>hi)hi=x};n.f.pts.forEach(ch);(n.f.tv||[]).forEach(ch);n.lo=lo;n.hi=hi});\n  nodes.forEach(a=>nodes.forEach(b=>{\n    if(a===b||a.t===b.t||a.f.ax!==b.f.ax)return;\n    const fa=a.f,fb=b.f,wall=a.t==='h';\n    // k:'w' — стенка: отверстие a внутри наружного цилиндра b; k:'f' — посадка: цилиндр a внутри отверстия b (крышка на горловине)\n    if(!(wall?fa.ro\u003cfb.ri:fa.rm\u003cfb.rm))return;\n    const dist=Math.hypot(fa.cu-fb.cu,fa.cv-fb.cv);\n    if(dist>Math.max(.3,.02*fb.r))return;\n    const ov=Math.min(a.hi,b.hi)-Math.max(a.lo,b.lo);\n    const w0=(wall?fb.ri-fa.ro:fb.rm-fa.rm)-dist;if(!(w0>.05))return;\n    const near=!wall&&w0\u003c=Math.max(1.5,.06*fb.r);\n    if(!(ov>.2&&ov>.25*Math.min(a.hi-a.lo,b.hi-b.lo))&&!near)return;\n    rel.push(wall?{s:a.t+a.i,b:b.t+b.i,k:'w',w0,cs:fa.ro,rs:fa.r,cb:fb.ri,rb:fb.r}:{s:a.t+a.i,b:b.t+b.i,k:'f',w0,cs:fa.rm,rs:fa.r,cb:fb.rm,rb:fb.r});\n  }));\n  // номера деталей: пара «внутренний + внешний» одной детали (по убыванию наружного диаметра)\n  const part={};let pn=0;\n  rel.filter(x=>x.k==='w').sort((x,y)=>y.rb-x.rb).forEach(x=>{if(part[x.b]||part[x.s])return;pn++;part[x.b]=part[x.s]=pn});\n  // отверстие, не вложенное в наружный цилиндр, не должно выходить за габарит детали\n  holes.forEach(f=>{\n    if(rel.some(x=>x.k==='w'&&x.s==='h'+f.hi))return;\n    const Mu=Math.min(f.cu-mn[f.u],mx[f.u]-f.cu),Mv=Math.min(f.cv-mn[f.v],mx[f.v]-f.cv),e0=Math.min(Mu,Mv)-f.r;\n    if(e0>=.5)ext.push({i:f.hi,u:f.u,v:f.v,Mu,Mv,e0});\n  });\n  const body=geoBodies(I,V,holes,bosses,slopes,part);\n  return {c0,dim,mn,mx,V,T,I,cyl,holes,bosses,round,slopes,owner,rel,ext,part,body,thr:nThr};\n}\n// ---- применение параметров ----\n// ================= РАЗМЕРЫ ИЗ РЕДАКТОРА (режим «dm») =================\n// st.dm — список размеров (линейный L, диаметр D, угол A), st.dv — их текущие значения.\n// Линейный: деталь растягивается между двумя точками, всё за второй точкой сдвигается целиком.\n// Диаметр: радиус цилиндра меняется, влияние затухает по поверхности до соседних элементов.\n// Угол: шарнирный изгиб вокруг вершины угла.\nconst DMC=new WeakMap(),DMAN=[0,1,.5];\nfunction dmCSR(I,V){\n  let c=DMC.get(I);if(c)return c;\n  const off=new Int32Array(V+1);\n  for(let t=0;t\u003cI.length;t++)off[I[t]+1]+=2;\n  for(let i=0;i\u003cV;i++)off[i+1]+=off[i];\n  const nb=new Int32Array(off[V]),p=off.slice(0,V);\n  for(let t=0;t\u003cI.length;t+=3){\n    const a=I[t],b=I[t+1],d=I[t+2];\n    nb[p[a]++]=b;nb[p[a]++]=d;nb[p[b]++]=a;nb[p[b]++]=d;nb[p[d]++]=a;nb[p[d]++]=b;\n  }\n  c={off,nb};DMC.set(I,c);return c;\n}\n// кратчайшие расстояния по рёбрам сетки от набора вершин src\nfunction dmDijk(U,csr,src,V){\n  const d=new Float64Array(V).fill(Infinity);\n  if(!src.length)return d;\n  const hd=[],hv=[];\n  const push=(a,b)=>{let i=hd.length;hd.push(a);hv.push(b);while(i>0){const p=(i-1)>>1;if(hd[p]\u003c=a)break;hd[i]=hd[p];hv[i]=hv[p];i=p}hd[i]=a;hv[i]=b};\n  const pop=()=>{\n    const a=hd[0],b=hv[0],la=hd.pop(),lb=hv.pop(),n=hd.length;\n    if(n){let i=0;for(;;){let c=2*i+1;if(c>=n)break;if(c+1\u003cn&&hd[c+1]\u003chd[c])c++;if(hd[c]>=la)break;hd[i]=hd[c];hv[i]=hv[c];i=c}hd[i]=la;hv[i]=lb}\n    return [a,b];\n  };\n  for(const s of src){d[s]=0;push(0,s)}\n  while(hd.length){\n    const [a,v]=pop();\n    if(a>d[v])continue;\n    for(let e=csr.off[v];e\u003ccsr.off[v+1];e++){\n      const w=csr.nb[e],dx=U[w*3]-U[v*3],dy=U[w*3+1]-U[v*3+1],dz=U[w*3+2]-U[v*3+2],nd=a+Math.sqrt(dx*dx+dy*dy+dz*dz);\n      if(nd\u003cd[w]){d[w]=nd;push(nd,w)}\n    }\n  }\n  return d;\n}\n// подготовка: «жёсткие» точки для цилиндров и веса влияния для диаметров (считается один раз на модель)\nfunction dmInw(U,csr,s,V){\n  const w=s.inw,ax=w.ax,u=(ax+1)%3,v=(ax+2)%3,fc=w.fc,rc=w.rc,tol=.01*Math.abs(fc-rc)+.02,k=new Float32Array(V);\n  let best=-1,bd=Infinity;\n  for(let i=0;i\u003cV;i++){if(Math.abs(U[i*3+ax]-fc)>tol)continue;const dx=U[i*3+u]-w.fp[u],dy=U[i*3+v]-w.fp[v],d2=dx*dx+dy*dy;if(d2\u003cbd){bd=d2;best=i}}\n  if(best\u003c0)return {bad:1};\n  const A=new Uint8Array(V),qu=[best];A[best]=1;let u0=1e9,u1=-1e9,v0=1e9,v1=-1e9;\n  for(let h=0;h\u003cqu.length;h++){const a=qu[h];u0=Math.min(u0,U[a*3+u]);u1=Math.max(u1,U[a*3+u]);v0=Math.min(v0,U[a*3+v]);v1=Math.max(v1,U[a*3+v]);\n    for(let e=csr.off[a];e\u003ccsr.off[a+1];e++){const b=csr.nb[e];if(!A[b]&&Math.abs(U[b*3+ax]-fc)\u003c=tol){A[b]=1;qu.push(b)}}}\n  const m=tol*2;\n  for(let i=0;i\u003cV;i++){const x=U[i*3+u],y=U[i*3+v],c=U[i*3+ax];\n    if(x\u003cu0-m||x>u1+m||y\u003cv0-m||y>v1+m)continue;\n    const t=(c-rc)/(fc-rc);if(t\u003c-1e-6||t>1+1e-6)continue;k[i]=Math.min(1,Math.max(0,t))}\n  return {k};\n}\nfunction dmPrep(U,I,G,dm){\n  const V=U.length/3,csr=dmCSR(I,V),ev=Float32Array.from(U),ws=[],cyl=G.cyl||[],ow=G.owner;\n  const cmp=new Int32Array(V);for(let i=0;i\u003cV;i++)cmp[i]=i;const cfd=x=>{while(cmp[x]!==x){cmp[x]=cmp[cmp[x]];x=cmp[x]}return x};for(let t=0;t\u003cI.length;t+=3){cmp[cfd(I[t])]=cfd(I[t+1]);cmp[cfd(I[t+1])]=cfd(I[t+2])}\n  if(ow)for(let i=0;i\u003cV;i++){const o=ow[i];if(o>=0){const f=cyl[o];ev[i*3+f.u]=f.cu;ev[i*3+f.v]=f.cv}}\n  dm.forEach((s,q)=>{\n    ws[q]=null;\n    if(s.t==='L'&&s.inw){ws[q]=dmInw(U,csr,s,V);return}\n    if(s.t!=='D')return;\n    const u=s.u,v=s.v,tol=.02*s.r0+.03,rho=i=>Math.hypot(U[i*3+u]-s.cu,U[i*3+v]-s.cv);\n    let best=-1,bd=Infinity;\n    for(let i=0;i\u003cV;i++){\n      if(Math.abs(rho(i)-s.r0)>tol)continue;\n      const dx=U[i*3]-s.e[0],dy=U[i*3+1]-s.e[1],dz=U[i*3+2]-s.e[2],d2=dx*dx+dy*dy+dz*dz;\n      if(d2\u003cbd){bd=d2;best=i}\n    }\n    if(best\u003c0){ws[q]={bad:1};return}\n    // стенка цилиндра: связная область вершин на радиусе r0\n    const A=new Uint8Array(V),qu=[best];A[best]=1;\n    for(let h=0;h\u003cqu.length;h++){\n      const a=qu[h];\n      for(let e=csr.off[a];e\u003ccsr.off[a+1];e++){const b=csr.nb[e];if(!A[b]&&Math.abs(rho(b)-s.r0)\u003c=tol){A[b]=1;qu.push(b)}}\n    }\n    // соседние цилиндры (кроме этого же) удерживают свою геометрию на месте\n    const same=new Uint8Array(cyl.length),sl=.3+.02*s.r0;let tm=null;\n    cyl.forEach((f,o)=>{\n      if(f.ax!==s.ax||Math.abs(f.cu-s.cu)>=sl||Math.abs(f.cv-s.cv)>=sl)return;\n      const isT=f.tv&&f.tv.length>0,dd=isT?Math.max(0,(f.ri||f.r)-s.r0,s.r0-(f.ro||f.r)):0;\n      const tb=isT&&cfd(f.tv[0])===cfd(best)&&dd\u003c=.08*s.r0+.5;\n      if(Math.abs(f.r-s.r0)\u003ctol+.02*s.r0||tb){same[o]=1;if(isT)f.tv.forEach(vi=>{(tm=tm||new Uint8Array(V))[vi]=1;if(!A[vi]){A[vi]=1;qu.push(vi)}})}\n    });\n    const Bs=[];\n    if(ow)for(let i=0;i\u003cV;i++){const o=ow[i];if(o>=0&&!A[i]&&!same[o])Bs.push(i)}\n    const dA=dmDijk(U,csr,qu,V),dB=dmDijk(U,csr,Bs,V),k=new Float32Array(V),F=.8*s.r0+3;\n    for(let i=0;i\u003cV;i++){\n      if(A[i]){k[i]=1;ev[i*3+u]=s.cu;ev[i*3+v]=s.cv;continue}\n      const a=dA[i];if(a===Infinity)continue;\n      const b=dB[i];\n      if(b!==Infinity)k[i]=Math.min(b/(a+b),Math.max(0,1-a/F));\n      else k[i]=rho(i)\u003cs.r0?rho(i)/s.r0:Math.max(0,1-a/F);\n    }\n    ws[q]={k,t:tm};\n  });\n  return {ev,ws};\n}\n// ---- общая логика для линейных размеров на одной оси (вложенные/перекрывающиеся: деталь + паз) ----\n// Все такие размеры собираются в кластер, ось режется на сегменты по всем границам размеров,\n// длины сегментов подбираются так, чтобы каждый размер получил своё значение, а остальное\n// сжималось/растягивалось пропорционально (от собственного центра сегмента). Вложенный размер\n// не может быть больше своей доли в родителе, поэтому паз не выходит за деталь.\nfunction dmAxMaps(dm,dv){\n  const E=1e-6,it=[],MG={},C=[];\n  dm.forEach((s,q)=>{\n    if(s.t!=='L'||!s.rg||s.inw||s.sk)return;\n    const ax=s.d.findIndex(x=>x!==0);if(ax\u003c0)return;\n    const sg=s.d[ax]>0?1:-1,p1=s.a[ax]+sg*s.L0;\n    it.push({q,ax,lo:Math.min(s.a[ax],p1),hi:Math.max(s.a[ax],p1),L0:s.L0,v:Math.max(0,dv[q]),an:sg>0?DMAN[s.an]:1-DMAN[s.an]});\n  });\n  for(let ax=0;ax\u003c3;ax++){\n    const A=it.filter(x=>x.ax===ax).sort((x,y)=>x.lo-y.lo||y.hi-x.hi);\n    let cur=null;const cl=[];\n    A.forEach(x=>{if(cur&&x.lo\u003ccur.hi-E){cur.m.push(x);cur.hi=Math.max(cur.hi,x.hi)}else{cur={m:[x],lo:x.lo,hi:x.hi};cl.push(cur)}});\n    cl.forEach(c=>{\n      if(c.m.length\u003c2)return;\n      const bp=[];c.m.forEach(x=>{bp.push(x.lo,x.hi)});bp.sort((x,y)=>x-y);\n      const B=[bp[0]];for(let i=1;i\u003cbp.length;i++)if(bp[i]-B[B.length-1]>E)B.push(bp[i]);\n      const n=B.length-1,l0=[];for(let j=0;j\u003cn;j++)l0.push(B[j+1]-B[j]);\n      c.m.forEach(x=>{x.ja=B.findIndex(b=>Math.abs(b-x.lo)\u003c=E);x.jb=B.findIndex(b=>Math.abs(b-x.hi)\u003c=E)});\n      // эффективные значения: от больших к малым, влож :0}return x}\n// замки: st.lk = {номер размера:1} — такой размер меняется только своим ползунком, чужие в него упираются\n// st.un — размеры, которые временно удерживаются сразу после установки или снятия замка (чтобы модель не дёрнулась)\nfunction dmMoved(st,q){return !!(st.lk&&st.lk[q])||!!(st.un&&st.un.indexOf(q)>=0)||Math.abs(st.dv[q]-st.dm[q].v0)>1e-7}\nfunction dmSkSolve(st){\n  const out={c:[],val:{}},dm=st.dm,dv=st.dv,last=st.last||[],lk=st.lk||{},ua=st.ua||[];\n  if(!st.sk)return out;\n  for(let ax=0;ax\u003c3;ax++){\n    const ids=[];dm.forEach((s,q)=>{if(s.sk&&s.d[ax]!==0)ids.push(q)});\n    if(!ids.length)continue;\n    const S=st.sk.s[ax],F=st.sk.f[ax],n=S.length-1,l0=[];for(let k=0;k\u003cn;k++)l0.push(S[k+1]-S[k]);\n    const moved=q=>dmMoved(st,q);\n    // фиксаторы центра: st.cp[q] — где должен оставаться центр размера q на своей оси\n    // st.cg — только что снятые фиксаторы: держат форму до следующего движения по этой оси, чтобы деталь не дёрнулась\n    const cp=Object.assign({},st.cg,st.cp),R=ids.filter(q=>st.cp&&st.cp[q]!==undefined),P=R.concat(ids.filter(q=>cp[q]!==undefined&&R.indexOf(q)\u003c0));\n    const cRow=q=>{const r=new Array(n).fill(0),a=dm[q].sk[0],z=dm[q].sk[1];for(let k=0;k\u003cz;k++)r[k]=k\u003ca?1:.5;return r};\n    let l=l0.slice();\n    if(ids.some(moved)||P.length>1){ // связи действуют, как только на оси что-то двигали\n      const top=last.filter(q=>ids.indexOf(q)>=0),pin=[],done={};\n      const row=(i,j)=>{const r=new Array(n).fill(0);for(let k=i;k\u003cj;k++)r[k]=1;return r};\n      const eqs=dmEq(st,ax,n);\n      for(let it=0;it\u003c=n+ids.length;it++){\n        const A=[],b=[];for(let k=0;k\u003cn;k++){A.push(new Array(n).fill(0));const w=(F[k]?1e6:.01)/l0[k];A[k][k]=w;b.push(w*l0[k])}\n        // жёсткие условия: замки, затем пределы, затем ползунок, который двигают сейчас (повторяющие условия пропускаются)\n        const hard=[],basis=[];\n        const add=(r,v)=>{const o=r.slice();basis.forEach(e=>{let d=0;for(let k=0;k\u003cn;k++)d+=o[k]*e[k];for(let k=0;k\u003cn;k++)o[k]-=d*e[k]});const len=Math.hypot(...o);if(len\u003c1e-6)return;basis.push(o.map(x=>x/len));hard.push([r,v])};\n        ids.forEach(q=>{if(lk[q]&&top.indexOf(q)\u003c0)add(row(dm[q].sk[0],dm[q].sk[1]),dv[q])});\n        // привязки st.sk.t: длина a = r × длина b (диаметр резьбы к диаметру носителя) — жёсткая связь, не зависит от того, какой из размеров двигают\n        ((st.sk&&st.sk.t)||[]).forEach(e=>{if(e.k!==ax)return;const r=new Array(n).fill(0);for(let k=e.a[0];k\u003ce.a[1];k++)r[k]+=1;for(let k=e.b[0];k\u003ce.b[1];k++)r[k]-=e.r;add(r,0)});\n        P.slice(1).forEach(q=>{const a=cRow(q),z=cRow(P[0]);add(a.map((v,k)=>v-z[k]),cp[q]-cp[P[0]])});\n        eqs.forEach(r=>add(r,0));\n        pin.forEach(p=>add(p[0],p[1]));\n        top.forEach(q=>{if(moved(q))add(row(dm[q].sk[0],dm[q].sk[1]),dv[q])});\n        ids.forEach(q=>{\n          if(top.indexOf(q)>=0&&moved(q))return;\n          const s=dm[q],i=s.sk[0],j=s.sk[1];\n          // приоритет: изменённые раньше > закреплённые участки > объемлющие размеры > остальные\n          const parent=top.some(t=>t!==q&&ua.indexOf(t)\u003c0&&dm[t].sk[0]>=i&&dm[t].sk[1]\u003c=j);\n          const W=(moved(q)?1e9:parent?1e3:.1)/s.L0,v=moved(q)?dv[q]:s.L0;\n          for(let a=i;a\u003cj;a++){b[a]+=W*v;for(let c=i;c\u003cj;c++)A[a][c]+=W}\n        });\n        const solve=()=>{const m=hard.length,M=A.map((r,k)=>r.concat(hard.map(h=>h[0][k]))),c=b.slice();hard.forEach(h=>{M.push(h[0].concat(new Array(m).fill(0)));c.push(h[1])});return dmGauss(M,c).slice(0,n)};\n        l=solve();\n        // проверка пределов: толщина участков и «от/до» остальных ползунков\n        let bad=false;\n        for(let k=0;k\u003cn&&!bad;k++){const mn=dmMinL(st,ax,k,l0[k]);if(!done['s'+k]&&l[k]\u003cmn-1e-6){done['s'+k]=bad=true;pin.unshift([row(k,k+1),mn])}}\n        for(let x=0;x\u003cids.length&&!bad;x++){const q=ids[x],s=dm[q];if(done[q])continue;let v=0;for(let k=s.sk[0];k\u003cs.sk[1];k++)v+=l[k];\n          const c=Math.min(Math.max(v,Math.min(s.mn,s.L0)),Math.max(s.mx,s.L0));if(Math.abs(c-v)>1e-6){done[q]=bad=true;pin.push([row(s.sk[0],s.sk[1]),c])}}\n        if(!bad){\n          // изменённые раньше размеры держим точно: мягкое решение отстаёт от них на доли процента\n          const len=(x,q)=>{let v=0;for(let k=dm[q].sk[0];k\u003cdm[q].sk[1];k++)v+=x[k];return v};\n          // так же держим габариты вокруг двигаемого размера: без этого они «уплывают» на сотые доли\n          const want=q=>moved(q)?dv[q]:dm[q].L0,outer=q=>top.some(t=>t!==q&&ua.indexOf(t)\u003c0&&dm[t].sk[0]>=dm[q].sk[0]&&dm[t].sk[1]\u003c=dm[q].sk[1]);\n          const near=ids.filter(q=>{if(lk[q]||top.indexOf(q)>=0||!(moved(q)||outer(q)))return false;const e=Math.abs(len(l,q)-want(q));return e>1e-9&&e\u003c.005*Math.abs(want(q))+.05}).sort((a,b)=>moved(b)-moved(a));\n          if(near.length){\n            near.forEach(q=>add(row(dm[q].sk[0],dm[q].sk[1]),want(q)));\n            const x=solve();\n            if(x.every((v,k)=>v>=dmMinL(st,ax,k,l0[k])-1e-6))l=x;\n          }\n          break;\n        }\n      }\n    }\n    const t=[S[0]];for(let k=0;k\u003cn;k++)t.push(t[k]+l[k]);\n    // опорная точка остаётся на месте: у самого большого размера под замком, иначе у последнего изменённого\n    let r=-1;ids.forEach(q=>{if(lk[q]&&(r\u003c0||dm[q].L0>dm[r].L0))r=q});\n    if(r\u003c0)last.forEach(q=>{if(r\u003c0&&ids.indexOf(q)>=0)r=q});if(r\u003c0)r=ids[0];\n    const s=dm[r],i1=s.sk[2]?s.sk[0]:s.sk[1],i2=s.sk[2]?s.sk[1]:s.sk[0],f=DMAN[s.an];\n    const sh=(S[i1]+f*(S[i2]-S[i1]))-(t[i1]+f*(t[i2]-t[i1]));\n    // зафиксированный центр главнее остальных опорных точек\n    const move=R.length?cp[R[0]]-(t[dm[R[0]].sk[0]]+t[dm[R[0]].sk[1]])/2:sh;\n    for(let k=0;k\u003ct.length;k++)t[k]+=move;\n    ids.forEach(q=>{out.val[q]=t[dm[q].sk[1]]-t[dm[q].sk[0]]});\n    out.c.push({ax,bx:S,by:t});\n  }\n  return out;\n}\n// записать в ползунки то, что получилось на самом деле (чтобы посл 3cm-1e-6)return false;\n  }\n  for(const x of E){\n    const h=g.hole[x.i];if(!h)continue;\n    const m=Math.min(x.e0,Math.max(.2*x.e0,.4));\n    if(Math.min(st.k[x.u]*x.Mu,st.k[x.v]*x.Mv)-h.r*st.hf[x.i]\u003cm-1e-6)return false;\n  }\n  return true;\n}\n// участники связей: ключ «g1» — синхронизация, «p1» — пропорция. m — номера размеров, k — делитель (для пропорции исходная величина)\nfunction dmLinks(st){\n  const out={};\n  const add=(x,m,k0)=>{if(x.g)(out['g'+x.g]=out['g'+x.g]||[]).push({m,k:1});if(x.pg)(out['p'+x.pg]=out['p'+x.pg]||[]).push({m,k:k0})};\n  // участники под замком тоже в связи: чужой размер их не изменит, значит и всю группу врозь не растащит\n  (st.dm||[]).forEach((s,q)=>{if(s.t!=='A')add(s,[q],s.v0)});\n  (st.cm||[]).forEach(c=>{if(c.m.length>1)add(c,c.m,cmSum0(st,c))});\n  return out;\n}\n// замок и связь вместе. Для движения ползунком key:\n// open — замки, которые отменяются: участники тех же групп (и групп, связанных через них); составной, у которого под замком всё, — тоже участник;\n// shut — размеры чужих групп, где кто-то под замком: этот ползунок не может изменить замок, значит и остальных, иначе связь разорвётся\nfunction dmFree(st,key){\n  const lk=st.lk||{},out={open:[],shut:[]};\n  if(!st.dm||!Object.keys(lk).length)return out;\n  const E=st.dm.map((s,q)=>({s,m:[q],key:'q'+q})).concat((st.cm||[]).map((s,i)=>({s,m:s.m,key:'c'+i})).filter(e=>e.m.length>1));\n  const start=E.find(e=>e.key===key);if(!start)return out;\n  const tags=e=>['g','pg'].filter(k=>e.s[k]&&e.s.t!=='A').map(k=>k[0]+e.s[k]); // те же ключи, что в dmLinks\n  // семья: всё, что связано группами с e; same — учитывать только связи, где значения сейчас совпадают\n  const family=(e,same)=>{const f=[e];for(let n=0;n\u003cf.length;n++){const t=tags(f[n]).filter(same);E.forEach(x=>{if(f.indexOf(x)\u003c0&&tags(x).some(y=>t.indexOf(y)>=0))f.push(x)})}return f};\n  const mine=family(start,()=>true),locked=e=>e.m.every(j=>lk[j]);\n  mine.slice(1).forEach(e=>{if(locked(e))e.m.forEach(j=>{if(out.open.indexOf(j)\u003c0)out.open.push(j)})});\n  const G=dmLinks(st),A=dmSkSolve(st).val,held=k=>G[k]&&dmSame(st,G[k],A);\n  const seen=mine.slice();\n  E.forEach(e=>{\n    if(seen.indexOf(e)>=0)return;\n    const f=family(e,held);f.forEach(x=>seen.push(x));\n    if(f.some(locked))f.forEach(x=>{const q=x.m[0];if(x.key[0]==='q'&&!lk[q]&&mine.indexOf(x)\u003c0&&st.dm[q].sk&&A[q]!==undefined)out.shut.push(q)});\n  });\n  return out;\n}\n// приведённая величина участника: у всех участников целой связи она одинакова\nfunction dmVal(st,e,A){return e.m.reduce((t,j)=>t+(A&&A[j]!==undefined?A[j]:st.dv[j]),0)/e.k}\nconst dmSame=(st,L,A)=>{const v=L.map(e=>dmVal(st,e,A)),k=Math.max(...L.map(e=>e.k));return (Math.max(...v)-Math.min(...v))*k\u003c=.002};\n// строки «участник − участник = 0» для одной оси: связываются те, у кого заданные значения сейчас совпадают\nfunction dmEq(st,ax,n){\n  const out=[],G=dmLinks(st),on=e=>e.m.every(j=>{const s=st.dm[j];return s.sk&&s.d[ax]!==0});\n  for(const key in G){\n    const seen=[];\n    G[key].filter(on).forEach(e=>{\n      const v=dmVal(st,e),r=seen.find(x=>Math.abs(x.v-v)*e.k\u003c=.01);\n      if(!r){seen.push({v,e});return}\n      const row=new Array(n).fill(0),put=(m,f)=>m.forEach(j=>{for(let a=st.dm[j].sk[0];a\u003cst.dm[j].sk[1];a++)row[a]+=f});\n      put(e.m,1);put(r.e.m,-e.k/r.e.k);out.push(row);\n    });\n  }\n  return out;\n}\n// всё, что нужно для проверки состояния: расчёт каркаса и фактические величины\nfunction dmMinL(st,ax,k,l0){const t=(st.sk&&st.sk.t)||[];return t.some(e=>e.k===ax&&(k>=e.a[0]&&k\u003ce.a[1]||k>=e.b[0]&&k\u003ce.b[1]))?.05*l0:Math.min(l0,Math.max(.4,.05*l0))}\nfunction dmShot(st){const s=dmSkSolve(st);return {st,c:s.c,A:s.val}}\n// что сломалось по сравнению с состоянием «до»: стенки, замки, пределы «от/до», связи групп\nfunction dmGood(now,was,need,drag){\n  const st=now.st,lk=st.lk||{},act=(S,q)=>S.A[q]!==undefined?S.A[q]:S.st.dv[q];\n  const thin=(S,ax,k)=>{const e=S.c.find(c=>c.ax===ax);if(!e)return false;const l0=e.bx[k+1]-e.bx[k];return e.by[k+1]-e.by[k]\u003cdmMinL(S.st,ax,k,l0)-.005};\n  if(now.c.some(e=>e.by.some((v,k)=>k&&thin(now,e.ax,k-1)&&!thin(was,e.ax,k-1))))return false;\n  for(let q=0;q\u003cst.dm.length;q++){\n    const s=st.dm[q],v=act(now,q),o=act(was,q);\n    if(lk[q]&&drag.indexOf(q)\u003c0&&Math.abs(v-o)>.01)return false;\n    if(s.t==='A'||!s.sk)continue;\n    const out=x=>Math.max(Math.min(s.mn,s.v0)-x,x-Math.max(s.mx,s.v0));\n    if(out(v)>.01&&out(v)>out(o)+.001)return false;\n  }\n  const G=dmLinks(st);\n  return need.every(key=>!G[key]||dmSame(st,G[key],now.A));\n}\n// после движения: если разошлись связи, остальные участники подтягиваются за изменившимся (например, стенки другой оси)\nfunction dmSpread(t,was,need,drag){\n  need.forEach(key=>{\n    const now=dmShot(t),L=dmLinks(t)[key];if(!L||dmSame(t,L,now.A))return;\n    if(L.some(e=>e.m.some(j=>drag.indexOf(j)>=0)))return; // двигают участника этой связи — тогда просто ограничиваем ход\n    let lead=L[0],far=-1;L.forEach(e=>{const d=Math.abs(dmVal(t,e,now.A)-dmVal(was.st,e,was.A))*e.k;if(d>far){far=d;lead=e}});\n    const v=dmVal(t,lead,now.A),set=[],lk=t.lk||{};\n    L.forEach(e=>{\n      if(e===lead||Math.abs(dmVal(t,e,now.A)-v)*e.k\u003c=.001)return;\n      const act=j=>now.A[j]!==undefined?now.A[j]:t.dv[j],free=e.m.filter(j=>!lk[j]),part=free.reduce((a,j)=>a+act(j),0),all=e.m.reduce((a,j)=>a+act(j),0);\n      if(part>0)free.forEach(j=>set.push([j,act(j)*Math.max(0,(v*e.k-(all-part))/part)]));\n    });\n    if(set.length)dmCommit(t,set);\n  });\n}\n// заданные значения участников целой связи приводятся к фактическим: иначе следующее движение их «разведёт»\nfunction dmSettle(t,was,need,drag){\n  const now=dmShot(t),G=dmLinks(t),s=JSON.parse(JSON.stringify(t));\n  let any=false;\n  need.forEach(key=>{(G[key]||[]).forEach(e=>{if(e.m.length>1)return;const q=e.m[0],a=now.A[q];if(a===undefined)return;\n    const v=Math.abs(a-s.dm[q].v0)\u003c1e-6?s.dm[q].v0:a;if(Math.abs(v-s.dv[q])>1e-7){s.dv[q]=v;any=true}})});\n  if(any&&dmGood(dmShot(s),was,need,drag))t.dv=s.dv;\n}\n// не даёт движению сломать деталь: если запрошенное значение не помещается, ползунок останавливается на последнем подходящем\nfunction dmKeep(g,st,old,key,val){\n  const i=+key.slice(1),drag=key[0]==='q'?[i]:old.cm&&old.cm[i]?old.cm[i].m:[],was=dmShot(old),G=dmLinks(old);\n  const held=Object.keys(G).filter(k=>G[k].length>1&&dmSame(old,G[k],was.A));\n  // связи самого двигаемого размера должны выполняться и после движения, даже если раньше значения различались\n  const own=Object.keys(G).filter(k=>held.indexOf(k)\u003c0&&G[k].length>1&&G[k].some(e=>key[0]==='q'?e.m.length===1&&e.m[0]===i:old.cm&&e.m===old.cm[i].m));\n  const fit=(t,need)=>{\n    if(dmGood(dmShot(t),was,need,drag)){dmSettle(t,was,need,drag);return t}\n    const s=JSON.parse(JSON.stringify(t)),before=dmShot(t).A;dmSpread(s,was,need,drag);\n    const now=dmShot(s);\n    if(drag.some(j=>before[j]!==undefined&&Math.abs(now.A[j]-before[j])>.01)||!dmGood(now,was,need,drag))return null;\n    dmSettle(s,was,need,drag);return s;\n  };\n  const search=need=>{\n    const first=fit(JSON.parse(JSON.stringify(st)),need);if(first)return first;\n    const p=geoParams({...g,st:old}).find(x=>x.key===key);\n    let a=p?p.def:val,b=val,ok=null;\n    for(let n=0;n\u003c22;n++){const m=(a+b)/2,t=JSON.parse(JSON.stringify(old));geoSetRaw(g,t,key,m);const r=fit(t,need);if(r){a=m;ok=r}else b=m}\n    return ok;\n  };\n  const res=search(held.concat(own))||(own.length?search(held):null)||old;\n  if(res!==st)['dv','last','un','ua','cb','cg'].forEach(k=>{if(res[k]===undefined)delete st[k];else st[k]=res[k]});\n}\nfunction geoSet1(g,st,key,val){\n  // на время движения замки меняются (см. dmFree), потом ставятся обратно уже на новых значениях\n  const lk=st.lk,{open,shut}=dmFree(st,key);\n  if(!open.length&&!shut.length)return geoMove(g,st,key,val);\n  // записать в ползунки фактические величины: замок держит именно их\n  const fix=L=>{const A=dmSkSolve(st).val;L.forEach(q=>{if(A[q]!==undefined){const v0=st.dm[q].v0;st.dv[q]=Math.abs(A[q]-v0)\u003c1e-6?v0:A[q]}})};\n  const old=JSON.parse(JSON.stringify(st));\n  // открытые и защищённые размеры пока удерживаются на нынешних значениях, чтобы деталь не дёрнулась от смены замков\n  const keep=L=>L.forEach(q=>{if((st.last=st.last||[]).indexOf(q)\u003c0){st.last.push(q);(st.ua=st.ua||[]).push(q)}if((st.un=st.un||[]).indexOf(q)\u003c0)st.un.push(q)});\n  fix(shut.concat(open));keep(open);\n  const t=Object.assign({},lk);open.forEach(q=>delete t[q]);shut.forEach(q=>{t[q]=1});st.lk=t;\n  geoMove(g,st,key,val);\n  fix(open);\n  st.lk=lk;\n  keep(shut); // как после установки замка: держатся, пока на их оси не двинут другое\n  // проверка уже с настоящими замками: если в редком сложном случае что-то разошлось, это движение не выполняется\n  const was=dmShot(old),now=dmShot(st),L=Object.assign({},lk);open.forEach(q=>delete L[q]);\n  const drag=key[0]==='q'?[+key.slice(1)]:old.cm[+key.slice(1)].m,G=dmLinks(old);\n  const gap=(S,l)=>{const v=l.map(e=>dmVal(S.st,e,S.A));return (Math.max(...v)-Math.min(...v))*Math.max(...l.map(e=>e.k))};\n  const mid=(S,q)=>{const s=st.dm[q],ax=s.d.findIndex(x=>x!==0),e=S.c.find(c=>c.ax===ax),p=e?e.by:st.sk.s[ax];return (p[s.sk[0]]+p[s.sk[1]])/2};\n  if(dmGood({st:Object.assign({},st,{lk:L}),c:now.c,A:now.A},was,[],drag)\n    &&Object.keys(G).every(k=>gap(now,G[k])\u003c=Math.max(gap(was,G[k]),.003)+.002)\n    &&Object.keys(st.cp||{}).every(q=>Math.abs(mid(now,+q)-mid(was,+q))\u003c=.01))return;\n  ['dv','last','un','ua','cb','cg'].forEach(k=>{if(old[k]===undefined)delete st[k];else st[k]=old[k]});\n}\n// ---- односторонняя связь (st.ow) ----\n// Если размер вырос из-за другого, то при обратном движении первого он назад не сжимается (и наоборот: сжатый до предела не растёт),\n// когда между гранями этих размеров на каркасе было расстояние. Если грань общая («вровень»), связь двусторонняя, как раньше.\n// st.rh — какие размеры сейчас удерживаются: {номер размера: {h: удерживаемая величина}}\n// расстояние между ближайшими гранями двух размеров по исходному каркасу: 0 — грань общая, -1 — размеры на разных осях\nfunction owGap(st,p,q){\n  const a=st.dm[p],b=st.dm[q];let m=Infinity,any=false;\n  for(let ax=0;ax\u003c3;ax++){\n    if(a.d[ax]===0||b.d[ax]===0)continue;\n    any=true;const S=st.sk.s[ax],tol=1e-4*Math.abs(S[S.length-1]-S[0])+1e-6;\n    [a.sk[0],a.sk[1]].forEach(i=>[b.sk[0],b.sk[1]].forEach(j=>{const d=Math.abs(S[i]-S[j]);m=Math.min(m,d\u003c=tol?0:d)}));\n  }\n  return any?m:-1;\n}\n// двигаемые размеры вместе со всеми, кто связан с ними группами синхронизации и пропорции\nfunction owFam(st,drag){\n  const f=drag.slice(),G=dmLinks(st);\n  for(let more=true;more;){more=false;for(const k in G)if(G[k].some(e=>e.m.some(j=>f.indexOf(j)>=0)))G[k].forEach(e=>e.m.forEach(j=>{if(f.indexOf(j)\u003c0){f.push(j);more=true}}))}\n  return f.filter(q=>st.dm[q]&&st.dm[q].sk);\n}\nfunction owSet(g,st,key,val){\n  const old=JSON.parse(JSON.stringify(st)),lk=old.lk||{},rh=old.rh||{};\n  const drag=key[0]==='q'?[+key.slice(1)]:((old.cm&&old.cm[+key.slice(1)])||{m:[]}).m;\n  const fam=owFam(old,drag),was=dmShot(old);\n  // 1. свободный ход: удержания сняты, работает прежняя логика\n  delete st.rh;\n  Object.keys(rh).forEach(q=>{if(lk[q])return;st.dv[q]=st.dm[q].v0;['last','un','ua'].forEach(k=>{if(st[k])st[k]=st[k].filter(x=>x!==+q)})});\n  const pre=JSON.stringify(st);\n  geoSet1(g,st,key,val);\n  const restore=()=>{Object.keys(st).forEach(k=>delete st[k]);Object.assign(st,JSON.parse(JSON.stringify(old)))};\n  // ход не выполнен (не поместился) — всё остаётся как было, вместе с удержаниями\n  if(JSON.stringify(st)===pre){restore();return}\n  const free=JSON.parse(JSON.stringify(st)),a1=dmSkSolve(free).val,a0=was.A,F=free.sk.f;\n  // 2. кого удерживать: тех, кто вырос (или сжат до предела) из-за этого хода и сам по себе не двигался\n  const H=[];\n  free.dm.forEach((s,D)=>{\n    if(!s.sk||s. n(lo,hi)),Math.max(lo,hi));\n  const set=[[i,v]].concat(eq.map(j=>[j,v]),pr.map(j=>{const x=st.dm[j];return [j,x.t==='A'?x.v0+(v-s.v0):x.v0*v/s.v0]}));\n  cs.forEach(e=>e.make(v).forEach(x=>{if(!set.some(y=>y[0]===x[0]))set.push(x)}));\n  dmCommit(st,set);\n}\n// составные из той же группы, что и размер i: получают то же значение (синхронизация) или то же соотношение (пропорция)\nfunction cmFollow(st,i,taken){\n  const s=st.dm[i],out=[];let A=null;\n  (st.cm||[]).forEach((c,ci)=>{\n    if(s.t==='A'||c.m.length\u003c2||c.m.indexOf(i)>=0)return;\n    const eq=s.g&&c.g===s.g,pr=!eq&&s.pg&&c.pg===s.pg;if(!eq&&!pr)return;\n    A=A||dmSkSolve(st).val;\n    const r=cmRoom(st,ci,A,c.m.map(j=>A[j]!==undefined?A[j]:st.dv[j]),taken);if(!r)return;\n    const k=eq?1:cmSum0(st,c)/s.v0;\n    out.push({lo:r.lo/k,hi:r.hi/k,make:v=>r.set(v*k)});\n  });\n  return out;\n}\n// составной ci как единое целое: допустимая сумма [lo, hi] и значения входящих для суммы T\nfunction cmRoom(st,ci,A,vals,taken){\n  const c=st.cm[ci],lk=st.lk||{},mem=[],v=[];let fix=0;\n  c.m.forEach((j,n)=>{if(lk[j]||taken.indexOf(j)>=0)fix+=vals[n];else{mem.push(j);v.push(vals[n])}});\n  const sum=v.reduce((a,x)=>a+x,0);if(!(sum>0))return null;\n  let lo=0,hi=1e9;mem.forEach((j,n)=>{const l=dmLim(st,j,ci);lo=Math.max(lo,l[0]/v[n]);hi=Math.min(hi,l[1]/v[n])});\n  return {mem,lo:Math.max(c.mn,fix+sum*lo),hi:Math.min(c.mx,cmCap(st,c,A),fix+sum*hi),set:T=>mem.map((j,n)=>[j,v[n]*Math.max(0,(T-fix)/sum)])};\n}\n// записать новые значения сразу нескольких размеров: set = [[номер размера, значение], …]\nfunction dmCommit(st,set){\n  const lk=st.lk||{},now=set.map(e=>e[0]);\n  // по каждой оси помним, какой размер на ней двигали последним (движение по другой оси её не трогает)\n  const hit=[0,1,2].map(a=>now.some(q=>st.dm[q].sk&&st.dm[q].d[a]!==0));\n  const keep=(st.last||[]).filter(q=>{const x=st.dm[q];return now.indexOf(q)\u003c0&&x.sk&&!x.d.some((c,a)=>c!==0&&hit[a])});\n  st.last=now.concat(keep);\n  if(st.cg)for(const q in st.cg)if(st.dm[q].d.some((c,a)=>c!==0&&hit[a]))delete st.cg[q];\n  if(st.un)st.un=st.un.filter(q=>keep.indexOf(q)>=0);\n  if(st.ua)st.ua=st.ua.filter(q=>keep.indexOf(q)>=0);\n  set.forEach(e=>{st.dv[e[0]]=e[1]});\n  st.dm.forEach((x,j)=>{if(x.rf>=0&&now.indexOf(x.rf)>=0&&!lk[j]){const cp=dmCap(x,st.dv[x.rf]);if(st.dv[j]>cp)st.dv[j]=Math.max(x.mn,cp)}});\n  // составной с пределом «не больше другого размера»: уменьшается вслед за этим размером\n  (st.cm||[]).forEach(c=>{\n    if(!(c.rf>=0)||c.m.indexOf(c.rf)>=0||now.indexOf(c.rf)\u003c0)return;\n    const A=dmSkSolve(st).val,act=j=>A[j]!==undefined?A[j]:st.dv[j],cap=dmCap(c,act(c.rf)),sum=cmNow(st,c,A);\n    if(sum\u003c=cap+1e-6)return;\n    const free=c.m.filter(j=>!lk[j]&&now.indexOf(j)\u003c0),part=free.reduce((t,j)=>t+act(j),0);if(!(part>0))return;\n    const f=Math.max(0,(cap-(sum-part))/part),set=free.map(j=>[j,Math.max(st.dm[j].mn,act(j)*f)]);\n    set.forEach(e=>{st.dv[e[0]]=e[1];if(st.dm[e[0]].sk&&st.last.indexOf(e[0])\u003c0)st.last.push(e[0])});\n  });\n  delete st.cb;\n  if(Object.keys(lk).length||Object.keys(st.cp||{}).length)dmSync(st);\n}\n// ---- составной размер (st.cm): один ползунок меняет несколько размеров в одно и то же число раз ----\n// фактическая сумма входящих размеров; A — то, что насчитал каркас\nfunction cmNow(st,c,A){return c.m.reduce((t,j)=>t+(A[j]!==undefined?A[j]:st.dv[j]),0)}\nfunction cmSet(st,i,val){\n  const c=st.cm&&st.cm[i];if(!c)return;\n  const lk=st.lk||{},A=dmSkSolve(st).val,act=j=>A[j]!==undefined?A[j]:st.dv[j];\n  const mem=c.m.filter(j=>!lk[j]);if(!mem.length)return;\n  // пропорции берутся с фактических размеров и держатся, пока двигают этот же ползунок\n  const b=st.cb&&st.cb.i===i?st.cb:{i,v:mem.map(act),o:st.cm.map(x=>x.m.map(act)),f:1};\n  const sum=b.v.reduce((a,x)=>a+x,0);if(!(sum>0))return;\n  const fix=c.m.reduce((t,j)=>t+(lk[j]?act(j):0),0);\n  // ent: [номер размера, значение при коэффициенте f]; следом идут связанные и пропорциональные размеры\n  con onst goal=(Math.min(Math.max(val,c.mn),c.mx)-fix)/sum;\n  let f=Math.min(Math.max(goal,Math.min(lo,b.f)),Math.max(hi,b.f));\n  const make=k=>ent.map(e=>[e[0],e[1](k)]);\n  // если все сразу не помещаются (замки, стенки), берём наибольший коэффициент, при котором пропорция сохраняется\n  const fits=k=>{const t=JSON.parse(JSON.stringify(st)),w=make(k);dmCommit(t,w);const R=dmSkSolve(t).val;return w.every(e=>(R[e[0]]===undefined||Math.abs(R[e[0]]-e[1])\u003c.005)&&(tied.indexOf(e[0])\u003c0||Math.abs(t.dv[e[0]]-e[1])\u003c.005))};\n  if(Math.abs(f-b.f)>1e-12&&!fits(f)){let ok=b.f,no=f;for(let n=0;n\u003c18;n++){const m=(ok+no)/2;if(fits(m))ok=m;else no=m}f=ok}\n  dmCommit(st,make(f));\n  st.cb={i,v:b.v,o:b.o,f};\n}\nfunction geoSetRaw(g,st,key,val){\n  if(key==='sc')st.U=gclamp(val/100,.3,3);\n  else if(key[0]==='c')cmSet(st,+key.slice(1),val);\n  else if(key[0]==='q'){const i=+key.slice(1),s=st.dm&&st.dm[i];if(s)dmSet(st,i,val)}\n  else if(key[0]==='k'){const a=GAX.toLowerCase().indexOf(key[1]);st.k[a]=gclamp(val/(g.dim[a]*st.U),.25,4)}\n  else if(key[0]==='p'){const a=GAX.toLowerCase().indexOf(key[1]),b=GAX.toLowerCase().indexOf(key[2]);st.k[a]=st.k[b]=gclamp(val/100,.25,4)}\n  else if(key[0]==='d'){const i=+key.slice(1);st.df[i]=gclamp(val/(2*g.boss[i].r*st.U),.2,5)}\n  else if(key[0]==='h'){const i=+key.slice(1);st.hf[i]=gclamp(val/(2*g.hole[i].r*st.U),.2,5)}\n  else if(key.slice(0,2)==='sl'){const i=+key.slice(2),s=g.slope[i];st.sf[i]=gclamp(Math.tan(gclamp(val,.5,70)*Math.PI/180)/(Math.tan(s.a0*Math.PI/180)*(st.k[s.w]/st.k[s.u])),.2,5)}\n}\nfunction geoVals(g,st){const o={};geoParams({...g,st}).forEach(p=>{o[p.key]=p.def});return o}\n\nfunction geoOff(e){\n  if(e.ui&&Array.isArray(e.ui.off))return new Set(e.ui.off);\n  return new Set(geoParams(e.geo).filter(p=>p.kind==='pr').map(p=>p.key));\n}\n// запись модели (формат objmodel v6: масштаб, оси, диаметры, отверстия, уклоны)\nfunction buildEntryGeo(o){\n  const c=o.canon,big=c.U.length/3>65535;\n  const idx=big?Ui ;for(let j=0;j\u003c3;j++){const v=I[f*3+j]*3,r=Math.hypot(P[v+B]-c.cb,P[v+C]-c.cc);c.rl=Math.min(c.rl,r);c.rh=Math.max(c.rh,r)}}\n    for(const c of cand){\n      const depth=c.rh-c.rl,rmid=(c.rl+c.rh)/2;\n      if(depth\u003c.02||depth>.3*rmid||c.ez\u003c3*depth)continue;\n      zones.push({A,B,C,cb:c.cb,cc:c.cc,rm:rmid,rl:c.rl,rh:c.rh,zl:c.zl,zh:c.zh,tr:Math.max(.005,depth*.03)});\n    }\n  }\n  zones.forEach((z,zi)=>{\n    for(let v=0;v\u003cNV;v++){if(zid[v])continue;const a=P[v*3+z.A];if(a\u003cz.zl-1e-3||a>z.zh+1e-3)continue;\n      const r=Math.hypot(P[v*3+z.B]-z.cb,P[v*3+z.C]-z.cc);if(r\u003cz.rl-z.tr||r>z.rh+z.tr)continue;zid[v]=zi+1}\n  });\n  return {zones,zid};\n}\n// номер тела для каждого диаметра, отверстия и уклона (тело = отдельная связная часть сетки)\nfunction geoBodies(I,V,holes,bosses,slopes,part){\n  const par=new Int32Array(V);for(let i=0;i\u003cV;i++)par[i]=i;\n  const fd=x=>{while(par[x]!==x){par[x]=par[par[x]];x=par[x]}return x};\n  for(let t=0;t\u003cI.length;t+=3){par[fd(I[t])]=fd(I[t+1]);par[fd(I[t+1])]=fd(I[t+2])}\n  const items=[];\n  const cylV=f=>f.verts.length?f.verts[0]:(f.tv&&f.tv.length?f.tv[0]:f.pts.values().next().value);\n  bosses.forEach((f,i)=>items.push(['d'+i,cylV(f)]));\n  holes.forEach((f,i)=>items.push(['h'+i,cylV(f)]));\n  slopes.forEach((s,i)=>items.push(['sl'+i,s.faces.length?s.faces[0].verts[0]:undefined]));\n  const num=new Map(),body={};let last=0;\n  items.forEach(([k,v])=>{if(!part[k]||v===undefined)return;const c=fd(v);if(!num.has(c))num.set(c,part[k]);last=Math.max(last,part[k])});\n  items.forEach(([k,v])=>{\n    if(part[k]){body[k]=part[k];return}\n    if(v===undefined)return;\n    const c=fd(v);if(!num.has(c))num.set(c,++last);body[k]=num.get(c)});\n  return body;\n}\nfunction geoDetect(U,I){\n  const V=U.length/3,T=I.length/3;\n  const mn=[1e9,1e9,1e9],mx=[-1e9,-1e9,-1e9];\n  for(let i=0;i\u003cV;i++)for(let k=0;k\u003c3;k++){const x=U[i*3+k];if(x\u003cmn[k])mn[k]=x;if(x>mx[k])mx[k]=x}\n  const c0=mn.map((x,k)=>(x+mx[k])/2),dim=mx.map((x,k)=>x-mn[k]);\n  const nrm=new Float32Array(T*3),area=new Float32Array(T);let vol=0,tot=0;\n  for(let t=0;t\u003cT;t++){\n    const a=I[t*3]*3,b=I[t*3+1]*3,c=I[t*3+2]*3;\n    const e1x=U[b]-U[a],e1y=U[b+1]-U[a+1],e1z=U[b+2]-U[a+2],e2x=U[c]-U[a],e2y=U[c+1]-U[a+1],e2z=U[c+2]-U[a+2];\n    const nx=e1y*e2z-e1z*e2y,ny=e1z*e2x-e1x*e2z,nz=e1x*e2y-e1y*e2x,l=Math.hypot(nx,ny,nz);\n    area[t]=l/2;tot+=l/2;\n    if(l>1e-12){nrm[t*3]=nx/l;nrm[t*3+1]=ny/l;nrm[t*3+2]=nz/l}\n    vol+=(U[a]*(U[b+1]*U[c+2]-U[b+2]*U[c+1])-U[a+1]*(U[b]*U[c+2]-U[b+2]*U[c])+U[a+2]*(U[b]*U[c+1]-U[b+1]*U[c]))/6;\n  }\n  if(vol\u003c0)for(let i=0;i\u003cnrm.length;i++)nrm[i]=-nrm[i]; // нормали наружу\n  const em=new Map(),nb=new Array(T);for(let t=0;t\u003cT;t++)nb[t]=[];\n  for(let t=0;t\u003cT;t++)for(let e=0;e\u003c3;e++){\n    const p=I[t*3+e],q=I[t*3+(e+1)%3],key=p\u003cq?p*V+q:q*V+p,o=em.get(key);\n    if(o===undefined)em.set(key,t);else{nb[t].push(o);nb[o].push(t)}\n  }\n  const TZ=threadZones(U,I),tmask=new Uint8Array(V);\n  // маска — вершины строго внутри резьбовой зоны (граничные кольца принадлежат гладкому цилиндру)\n  for(let i=0;i\u003cV;i++)if(TZ.zid[i]){const z=TZ.zones[TZ.zid[i]-1],a=U[i*3+z.A];if(a>z.zl+1e-3&&a\u003cz.zh-1e-3)tmask[i]=1}\n  // ---- цилиндры вдоль осей X, Y, Z ----\n  const found=[];\n  for(let a=0;a\u003c3;a++){\n    const u=(a+1)%3,v=(a+2)%3,q=new Uint8Array(T),phi=new Float32Array(T);\n    for(let t=0;t\u003cT;t++)if(area[t]>0&&Math.abs(nrm[t*3+a])\u003c.05&&!(tmask[I[t*3]]&&tmask[I[t*3+1]]&&tmask[I[t*3+2]])){q[t]=1;phi[t]=Math.atan2(nrm[t*3+v],nrm[t*3+u])}\n    const dph=(s,t)=>{const d=Math.abs(phi[s]-phi[t]);return d>Math.PI?2*Math.PI-d:d};\n    const cvx=new Uint8Array(T);\n    for(let t=0;t\u003cT;t++)if(q[t])for(const s of nb[t])if(q[s]){const d=dph(s,t);if(d>.005&&d\u003c1.22){cvx[t]=1;break}}\n    const comp=new Uint8Array(T);\n    for(let t0=0;t0\u003cT;t0++){\n      if(!cvx[t0]||comp[t0])continue;\n      const st=[t0],tris=[];comp[t0]=1;\n      while(st.length){const x=st.pop();tris.push(x);for(const s of nb[x])if(cvx[s]&&!comp[s]&&dph(s,x)\u003c1.22){comp[s]=1;st.push(s)}}\n      const ids=new Set();tris.forEach(t=>{for(let e=0;e\u003c3;e++)ids.add(I[t*3+e])});\n      let pts=[...ids],fit=null;\n      for(let it=0;it\u003c3&&pts.length>=6;it++){\n        fit=geoKasa(U,pts,u,v);if(!fit){pts=[];break}\n        const lim=Math.max(.05*fit.r,.15);\n        const keep=pts.filter(i=>Math.abs(Math.hypot(U[i*3+u]-fit.cu,U[i*3+v]-fit.cv)-fit.r)\u003c=lim);\n        if(keep.length===pts.length)break;pts=keep;\n      }\n      if(pts.length\u003c6||!fit)continue;\n      fit=geoKasa(U,pts,u,v);if(!fit)continue;\n      let rms=0;pts.forEach(i=>{const d=Math.hypot(U[i*3+u]-fit.cu,U[i*3+v]-fit.cv)-fit.r;rms+=d*d});rms=Math.sqrt(rms/pts.length);\n      if(fit.r\u003c.4||fit.r>Math.max(...dim)||rms>.03*fit.r+.03)continue;\n      const set=new Set(pts);let os=0;\n      tris.forEach(t=>{\n        let ok=true;for(let e=0;e\u003c3;e++)if(!set.has(I[t*3+e]))ok=false;if(!ok)return;\n        let mu=0,mv=0;for(let e=0;e\u003c3;e++){mu+=U[I[t*3+e]*3+u];mv+=U[I[t*3+e]*3+v]}mu=mu/3-fit.cu;mv=mv/3-fit.cv;\n        const l=Math.hypot(mu,mv)||1;os+=area[t]*(nrm[t*3+u]*mu+nrm[t*3+v]*mv)/l;\n      });\n      found.push({ax:a,u,v,cu:fit.cu,cv:fit.cv,r:fit.r,pts:set,os});\n    }\n  }\n  // ---- слияние кусков одного цилиндра (разрезанных на половины / по длине) ----\n  const merged=[];\n  found.forEach(f=>{\n    const m=merged.find(g=>g.ax===f.ax&&Math.abs(g.cu-f.cu)\u003c.3&&Math.abs(g.cv-f.cv)\u003c.3&&Math.abs(g.r-f.r)\u003c.02*g.r+.05);\n    if(m){f.pts.forEach(i=>m.pts.add(i));m.os+=f.os}else merged.push(f);\n  });\n  const cyl=[];\n  merged.forEach(f=>{\n    const pts=[...f.pts],cv=geoCover(U,pts,f.u,f.v,f.cu,f.cv);\n    let kind='arc';if(cv.cov>=5.76)kind=f.os>0?'boss':'hole';\n    let bu=0,bv=0;\n    if(kind==='arc'){\n      const bind=(ph)=>{const c=Math.cos(ph),s=Math.sin(ph);return Math.abs(s)\u003c.035?[Math.sign(c),0]:(Math.abs(c)\u003c.035?[0,Math.sign(s)]:[0,0])};\n      const e1=bind(cv.A),e2=bind(cv.B);\n      const comb=(x,y)=>x&&y?(x===y?x:0):(x||y);\n      bu=comb(e1[0],e2[0]);bv=comb(e1[1],e2[1]);\n    }\n    if(kind==='arc'&&f.r>.15*Math.max(...dim))return; // большие дуги — часть формы детали, масштабируются вместе с ней\n    cyl.push({ax:f.ax,u:f.u,v:f.v,cu:f.cu,cv:f.cv,r:f.r,kind,bu,bv,pts,ri:f.r,ro:f.r,rm:f.r});\n  });\n  // ---- резьба следует за своим диаметром: на крышке — внутренним, на теле — наружным ----\n  let nThr=0;\n  TZ.zones.forEach((z,zi)=>{\n    const tv=[];for(let i=0;i\u003cV;i++)if(TZ.zid[i]===zi+1)tv.push(i);\n    if(!tv.length)return;\n    let sg=0; // знак радиальной составляющей наружных нормалей: \u003c0 — внутренняя резьба (в отверстии)\n    for(let t=0;t\u003cT;t++){\n      const a=I[t*3],b=I[t*3+1],c=I[t*3+2];\n      if(TZ.zid[a]!==zi+1&&TZ.zid[b]!==zi+1&&TZ.zid[c]!==zi+1)continue;\n      const mu=(U[a*3+z.B]+U[b*3+z.B]+U[c*3+z.B])/3-z.cb,mv=(U[a*3+z.C]+U[b*3+z.C]+U[c*3+z.C])/3-z.cc,l=Math.hypot(mu,mv)||1;\n      sg+=area[t]*(nrm[t*3+z.B]*mu+nrm[t*3+z.C]*mv)/l;\n    }\n    const kind=sg\u003c0?'hole':'boss';\n    let lo=1e9,hi=-1e9;tv.forEach(i=>{const x=U[i*3+z.A];if(x\u003clo)lo=x;if(x>hi)hi=x});\n    const tol=Math.max(1.5*(z.rh-z.rl),.06*z.rm);\n    let par=null,bd=1e9;\n    cyl.forEach(f=>{\n      if(f.kind!==kind||f.ax!==z.A)return;\n      if(Math.hypot(f.cu-z.cb,f.cv-z.cc)>Math.max(.3,.02*f.r))return;\n      const dr=Math.abs(f.r-z.rm);if(dr>tol)return;\n      let flo=1e9,fhi=-1e9;f.pts.forEach(i=>{const x=U[i*3+f.ax];if(x\u003cflo)flo=x;if(x>fhi)fhi=x});\n      if(Math.max(flo,lo)-Math.min(fhi,hi)>.5)return;\n      if(dr\u003cbd){bd=dr;par=f}\n    });\n    if(par){par.tv=(par.tv||[]).concat(tv);par.ri=Math.min(par.ri,z.rl);par.ro=Math.max(par.ro,z.rh);par.rm=z.rm}\n    else cyl.push({ax:z.A,u:z.B,v:z.C,cu:z.cb,cv:z.cc,r:z.rm,kind,bu:0,bv:0,pts:new Set(),tv,ri:z.rl,ro:z.rh,rm:z.rm});\n    nThr++;\n  });\n  const rank=k=>({h    if(dist>Math.max(.3,.02*fb.r))return;\n    const ov=Math.min(a.hi,b.hi)-Math.max(a.lo,b.lo);\n    const w0=(wall?fb.ri-fa.ro:fb.rm-fa.rm)-dist;if(!(w0>.05))return;\n    const near=!wall&&w0\u003c=Math.max(1.5,.06*fb.r);\n    if(!(ov>.2&&ov>.25*Math.min(a.hi-a.lo,b.hi-b.lo))&&!near)return;\n    rel.push(wall?{s:a.t+a.i,b:b.t+b.i,k:'w',w0,cs:fa.ro,rs:fa.r,cb:fb.ri,rb:fb.r}:{s:a.t+a.i,b:b.t+b.i,k:'f',w0,cs:fa.rm,rs:fa.r,cb:fb.rm,rb:fb.r});\n  }));\n  // номера деталей: пара «внутренний + внешний» одной детали (по убыванию наружного диаметра)\n  const part={};let pn=0;\n  rel.filter(x=>x.k==='w').sort((x,y)=>y.rb-x.rb).forEach(x=>{if(part[x.b]||part[x.s])return;pn++;part[x.b]=part[x.s]=pn});\n  // отверстие, не вложенное в наружный цилиндр, не должно выходить за габарит детали\n  holes.forEach(f=>{\n    if(rel.some(x=>x.k==='w'&&x.s==='h'+f.hi))return;\n    const Mu=Math.min(f.cu-mn[f.u],mx[f.u]-f.cu),Mv=Math.min(f.cv-mn[f.v],mx[f.v]-f.cv),e0=Math.min(Mu,Mv)-f.r;\n    if(e0>=.5)ext.push({i:f.hi,u:f.u,v:f.v,Mu,Mv,e0});\n  });\n  const body=geoBodies(I,V,holes,bosses,slopes,part);\n  return {c0,dim,mn,mx,V,T,I,cyl,holes,bosses,round,slopes,owner,rel,ext,part,body,thr:nThr};\n}\n// ---- применение параметров ----\n// ================= РАЗМЕРЫ ИЗ РЕДАКТОРА (режим «dm») =================\n// st.dm — список размеров (линейный L, диаметр D, угол A), st.dv — их текущие значения.\n// Линейный: деталь растягивается между двумя точками, всё за второй точкой сдвигается целиком.\n// Диаметр: радиус цилиндра меняется, влияние затухает по поверхности до соседних элементов.\n// Угол: шарнирный изгиб вокруг вершины угла.\nconst DMC=new WeakMap(),DMAN=[0,1,.5];\nfunction dmCSR(I,V){\n  let c=DMC.get(I);if(c)return c;\n  const off=new Int32Array(V+1);\n  for(let t=0;t\u003cI.length;t++)off[I[t]+1]+=2;\n  for(let i=0;i\u003cV;i++)off[i+1]+=off[i];\n  const nb=new Int32Array(off[V]),p=off.slice(0,V);\n  for(let t=0;t\u003cI.length;t+=3){\n    const a=I[t],b=I[t+1],d=I[t+2];\n    nb[p[a]+ n  };\n  const search=need=>{\n    const first=fit(JSON.parse(JSON.stringify(st)),need);if(first)return first;\n    const p=geoParams({...g,st:old}).find(x=>x.key===key);\n    let a=p?p.def:val,b=val,ok=null;\n    for(let n=0;n\u003c22;n++){const m=(a+b)/2,t=JSON.parse(JSON.stringify(old));geoSetRaw(g,t,key,m);const r=fit(t,need);if(r){a=m;ok=r}else b=m}\n    return ok;\n  };\n  const res=search(held.concat(own))||(own.length?search(held):null)||old;\n  if(res!==st)['dv','last','un','ua','cb','cg'].forEach(k=>{if(res[k]===undefined)delete st[k];else st[k]=res[k]});\n}\nfunction geoSet1(g,st,key,val){\n  // на время движения замки меняются (см. dmFree), потом ставятся обратно уже на новых значениях\n  const lk=st.lk,{open,shut}=dmFree(st,key);\n  if(!open.length&&!shut.length)return geoMove(g,st,key,val);\n  // записать в ползунки фактические величины: замок держит именно их\n  const fix=L=>{const A=dmSkSolve(st).val;L.forEach(q=>{if(A[q]!==undefined){const v0=st.dm[q].v0;st.dv[q]=Math.abs(A[q]-v0)\u003c1e-6?v0:A[q]}})};\n  const old=JSON.parse(JSON.stringify(st));\n  // открытые и защищённые размеры пока удерживаются на нынешних значениях, чтобы деталь не дёрнулась от смены замков\n  const keep=L=>L.forEach(q=>{if((st.last=st.last||[]).indexOf(q)\u003c0){st.last.push(q);(st.ua=st.ua||[]).push(q)}if((st.un=st.un||[]).indexOf(q)\u003c0)st.un.push(q)});\n  fix(shut.concat(open));keep(open);\n  const t=Object.assign({},lk);open.forEach(q=>delete t[q]);shut.forEach(q=>{t[q]=1});st.lk=t;\n  geoMove(g,st,key,val);\n  fix(open);\n  st.lk=lk;\n  keep(shut); // как после установки замка: держатся, пока на их оси не двинут другое\n  // проверка уже с настоящими замками: если в редком сложном случае что-то разошлось, это движение не выполняется\n  const was=dmShot(old),now=dmShot(st),L=Object.assign({},lk);open.forEach(q=>delete L[q]);\n  const drag=key[0]==='q'?[+key.slice(1)]:old.cm[+key.slice(1)].m,G=dmLinks(old);\n  const gap=(S,l)=>{const v=l.map(e=>dmVal(S.st,e,S.A));retu key.slice(1)]:((old.cm&&old.cm[+key.slice(1)])||{m:[]}).m;\n  const fam=owFam(old,drag),was=dmShot(old);\n  // 1. свободный ход: удержания сняты, работает прежняя логика\n  delete st.rh;\n  Object.keys(rh).forEach(q=>{if(lk[q])return;st.dv[q]=st.dm[q].v0;['last','un','ua'].forEach(k=>{if(st[k])st[k]=st[k].filter(x=>x!==+q)})});\n  const pre=JSON.stringify(st);\n  geoSet1(g,st,key,val);\n  const restore=()=>{Object.keys(st).forEach(k=>delete st[k]);Object.assign(st,JSON.parse(JSON.stringify(old)))};\n  // ход не выполнен (не поместился) — всё остаётся как было, вместе с удержаниями\n  if(JSON.stringify(st)===pre){restore();return}\n  const free=JSON.parse(JSON.stringify(st)),a1=dmSkSolve(free).val,a0=was.A,F=free.sk.f;\n  // 2. кого удерживать: тех, кто вырос (или сжат до предела) из-за этого хода и сам по себе не двигался\n  const H=[];\n  free.dm.forEach((s,D)=>{\n    if(!s.sk||s.t==='A'||fam.indexOf(D)>=0||lk[D]||a0[D]===undefined||a1[D]===undefined)return;\n    if(Math.abs(free.dv[D]-s.v0)>1e-7)return;\n    const ax=s.d.findIndex(x=>x!==0);\n    let wide=false;for(let k=s.sk[0];k\u003cs.sk[1];k++)if(F[ax]&&!F[ax][k])wide=true;\n    if(!wide)return; // стенки сами по себе не тянутся: они только занимают освободившееся место\n    const gaps=fam.map(p=>owGap(free,p,D)).filter(x=>x>=0);\n    if(!gaps.length||gaps.some(x=>x===0))return; // грань общая — движется в обе стороны\n    const o=a0[D],f=a1[D];\n    if(o>s.v0+.01&&f\u003co-.01)H.push([D,o]);\n    else if(o\u003cs.v0-.01&&f>o+.01&&o\u003c=Math.min(s.mn,s.v0)+.01)H.push([D,o]);\n  });\n  if(!H.length)return;\n  // 3. те же ходы, но удерживаемые размеры стоят на своих величинах\n  const open=dmFree(old,key).open,L=Object.assign({},lk);open.forEach(q=>delete L[q]);\n  const G0=dmLinks(old),gap=(S,l)=>{const v=l.map(e=>dmVal(S.st,e,S.A));return (Math.max(...v)-Math.min(...v))*Math.max(...l.map(e=>e.k))};\n  const mid=(S,q)=>{const s=free.dm[q],ax=s.d.findIndex(x=>x!==0),e=S.c.find(c=>c.ax===ax),p=e?e.by:free.sk.s[ tion geoMove(g,st,key,val){\n  const old=JSON.parse(JSON.stringify(st));\n  geoSetRaw(g,st,key,val);\n  if((key[0]==='q'||key[0]==='c')&&st.dm)dmKeep(g,st,old,key,val);\n  if(geoOk(g,st)||!geoOk(g,old))return;\n  // новое значение нарушает связь — останавливаем ползунок на границе допустимого\n  const nw=JSON.parse(JSON.stringify(st));\n  const mix=t=>{st.U=old.U+(nw.U-old.U)*t;['k','hf','df','sf'].forEach(f=>{for(let i=0;i\u003cold[f].length;i++)st[f][i]=old[f][i]+(nw[f][i]-old[f][i])*t})};\n  let lo=0,hi=1;\n  for(let it=0;it\u003c30;it++){const mid=(lo+hi)/2;mix(mid);if(geoOk(g,st))lo=mid;else hi=mid}\n  mix(lo);\n}\n// текущий допустимый диапазон ползунка с учётом остальных размеров\nfunction geoRange(g,st,p){\n  const lim=v=>{const c=JSON.parse(JSON.stringify(st));geoSet(g,c,p.key,v);const q=geoParams({...g,st:c}).find(x=>x.key===p.key);return q?q.def:v};\n  const a=lim(p.min),b=lim(p.max);\n  return [Math.min(a,b,p.def),Math.max(a,b,p.def)];\n}\nfunction dmCap(s,v){const k=+s.rval;if(!isFinite(k))return v;switch(s.rop){case '*':return v*k;case '/':return k?v/k:v;case '+':return v+k;case '-':return v-k;default:return v}}\nconst cmSum0=(st,c)=>c.m.reduce((t,j)=>t+st.dm[j].v0,0);\n// верхний предел составного от «Ограничить существующим размером»\nfunction cmCap(st,c,A){if(c.rf>=0&&c.m.indexOf(c.rf)\u003c0)return dmCap(c,A[c.rf]!==undefined?A[c.rf]:st.dv[c.rf]);return c.rfv>0?c.rfv:Infinity}\n// skip — номер составного, чей предел сейчас учитывается отдельно\nfunction dmLim(st,i,skip){const s=st.dm[i];let lo=s.mn,hi=s.mx,A=null;\n  (st.cm||[]).forEach((c,ci)=>{if(ci===skip||c.m.indexOf(i)\u003c0||!(c.rf>=0||c.rfv>0))return;A=A||dmSkSolve(st).val;const cap=cmCap(st,c,A);if(!isFinite(cap))return;\n    hi=Math.min(hi,cap-c.m.reduce((t,j)=>j===i?t:t+(A[j]!==undefined?A[j]:st.dv[j]),0))});\n  (s.hi||[]).forEach(h=>{const od=h.j>=0?st.dv[h.j]:2*h.r;hi=Math.min(hi,od-2*h.m)});\n  (s.lo||[]).forEach(h=>{const id=h.j>=0?st.dv[h.j]:2*h.r;lo=Math.max(lo,id+2*h.m)});\n  if(s
