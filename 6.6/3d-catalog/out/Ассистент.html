<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ассистент 3D-модели</title>
<style>
:root{--bg:#0b1120;--bar:#111827;--fg:#e5e7eb;--mut:#94a3b8;--bd:#334155;--ac:#f59e0b;--ok:#16a34a;--soft:#1e293b}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.35 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
body{display:flex;flex-direction:column}
.bar{position:relative;display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--bar);border-bottom:1px solid var(--bd);flex-wrap:wrap}
.brand{font-weight:700;font-size:15px;margin-right:4px;white-space:nowrap}
.steps{display:flex;align-items:center;gap:6px;margin-right:8px}
.steps span{color:var(--mut)}
button,.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--bd);background:var(--soft);color:var(--fg);font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
button:hover:not(:disabled),.btn:hover{border-color:#64748b}
button:disabled{opacity:.4;cursor:default}
.step{border-radius:999px}
.step.on{background:var(--ac);border-color:var(--ac);color:#111;font-weight:700}
.pri{background:var(--ac);border-color:var(--ac);color:#111;font-weight:700}
.go{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:700}
.sp{flex:1}
.msg{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:6;width:min(720px,calc(100% - 24px));padding:9px 34px 9px 14px;background:rgba(15,23,42,.96);border:1px solid var(--bd);border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.45);font-size:13px;color:#cbd5e1;white-space:pre-line;max-height:40vh;overflow:auto}
.msg[hidden]{display:none!important}
#aMsgX{position:absolute;top:6px;right:6px;height:24px;width:24px;padding:0;justify-content:center;border-radius:6px;font-size:12px}
.msg b{color:#fff}
.msg .bad{color:#f87171}.msg .good{color:#4ade80}
.frames{flex:1;position:relative;min-height:0}
.frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#fff}
body[data-step="1"] #fMes,body[data-step="2"] #fConv{display:block}
body.busy,body.busy *{cursor:progress!important}
.wait{display:none;position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:5;background:var(--ac);color:#111;font-weight:700;padding:6px 14px;border-radius:999px;font-size:13px}
body.busy .wait{display:block}
/* буфер версий */
.buf{position:absolute;right:12px;top:calc(100% + 6px);z-index:20;width:min(460px,94vw);max-height:60vh;overflow:auto;background:var(--bar);border:1px solid var(--bd);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.45);padding:10px}
.buf h3{margin:0 0 6px;font-size:13px;color:var(--mut);font-weight:600}
.buf .empty{color:var(--mut);font-size:13px;padding:6px 2px}
.bi{display:flex;align-items:center;gap:8px;padding:7px 6px;border-top:1px solid var(--bd)}
.bi:first-of-type{border-top:0}
.bi .tg{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:#334155;white-space:nowrap}
.bi .tg.mes{background:#0e7490}.bi .tg.conv{background:#7c3aed}
.bi .nm{flex:1;min-width:0;font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bi .nm b{color:var(--fg);font-weight:600}
.bi button{height:28px;padding:0 9px;font-size:12px}
.buf .hint{font-size:11px;color:var(--mut);margin-top:6px}
/* вопрос ассистента */
.ask{position:fixed;inset:0;z-index:50;background:rgba(2,6,23,.6);display:flex;align-items:center;justify-content:center}
.ask .box{width:min(460px,92vw);background:var(--bar);border:1px solid var(--bd);border-radius:14px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.ask .t{white-space:pre-line;font-size:14px;line-height:1.45;margin-bottom:12px}
.ask .t b{color:#fff}
.ask input{width:110px;height:34px;border-radius:8px;border:1px solid var(--bd);background:#0f172a;color:var(--fg);font:inherit;font-size:15px;padding:0 10px;margin-bottom:12px}
.ask .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
</style>
</head>
<body data-step="1">
<div class="bar">
  <span class="brand">🪄 Ассистент 3D-модели</span>
  <div class="steps">
    <button id="aStep1" class="step on" type="button" title="Редактор размеров">1 · Размеры</button><span>→</span>
    <button id="aStep2" class="step" type="button" title="Конвертер: ползунки. Текущий файл размеров переносится сам" disabled>2 · Ползунки</button>
  </div>
  <label class="btn" title="Экспорт FreeCAD (HTML), OBJ, STL, GLB — или файл с размерами, или готовая модель">📂 Открыть файл<input id="aFile" type="file" accept=".html,.htm,.obj,.stl,.glb,.gltf" hidden></label>
  <button id="aAuto" class="pri" type="button" disabled>🪄 Автоматизировать</button>
  <button id="aUndo" type="button" disabled title="Вернуть то, что было до последней автоматизации на этом шаге">↶ Отменить</button>
  <button id="aSave" type="button" disabled title="Скачать файл этого шага: на шаге 1 — файл с размерами, на шаге 2 — готовую модель для редактора сайта">⬇ Скачать</button>
  <button id="aKeep" type="button" disabled title="Сохранить текущее состояние этого шага в буфер версий">💾 В буфер</button>
  <button id="aBufBtn" type="button" title="Сохранённые версии обоих шагов">📚 Буфер (0)</button>
  <div class="buf" id="aBuf" hidden></div>
</div>
<div class="frames">
  <div class="msg" id="aMsg"><button type="button" id="aMsgX" title="Закрыть">✕</button><div id="aMsgT">Откройте модель: экспорт FreeCAD (HTML), OBJ или STL — ассистент начнёт с простановки размеров. Файл с размерами откроется на шаге 1, готовая модель (-3d.html) — сразу на шаге 2.</div></div>
  <div class="wait">Ассистент работает…</div>
  <iframe id="fMes" title="Редактор размеров"></iframe>
  <iframe id="fConv" title="Конвертер"></iframe>
</div>
<div class="ask" id="aAsk" hidden><div class="box"><div class="t" id="aAskText"></div><input id="aAskN" type="number" min="1" step="1" hidden><div class="acts" id="aAskActs"></div></div></div>
<script type="application/json" id="app-mes">"\u003c!DOCTYPE html>\n\u003chtml lang=\"ru\" class=\"dark\">\n\u003chead>\n    \u003cmeta charset=\"UTF-8\">\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    \u003ctitle>FreeCAD 3D Редактор размеров и выносок\u003c/title>\n    \u003cscript src=\"https://cdn.tailwindcss.com\">\u003c/script>\n    \u003cscript>\n        tailwind.config = {\n            darkMode: 'class',\n            theme: {\n                extend: {\n                    fontFamily: {\n                        sans: ['Inter', 'system-ui', 'sans-serif'],\n                        mono: ['JetBrains Mono', 'Fira Code', 'monospace'],\n                    }\n                }\n            }\n        };\n    \u003c/script>\n    \u003clink href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap\" rel=\"stylesheet\">\n\n    \u003c!-- Основной Import Map (jsDelivr) + резервный загрузчик (unpkg) при сбое сети -->\n    \u003cscript id=\"three-importmap\" type=\"importmap\">\n        {\n            \"imports\": {\n                \"three\": \"https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.module.js\",\n                \"three/addons/\": \"https://cdn.jsdelivr.net/npm/three@0.172.0/examples/jsm/\"\n            }\n        }\n    \u003c/script>\n\n    \u003cstyle>\n        body {\n            overflow: hidden;\n            user-select: none;\n        }\n        #viewport-container {\n            position: relative;\n            width: 100%;\n            height: 100%;\n            overflow: hidden;\n        }\n        #three-canvas {\n            display: block;\n            width: 100%;\n            height: 100%;\n            outline: none;\n        }\n        #gizmo-canvas {\n            position: absolute;\n            left: 12px;\n            bottom: 48px;\n            width: 104px;\n            height: 104px;\n            pointer-events: none;\n            z-index: 15;\n        }\n        #annotations-overlay {\n            position: absolute;\n            inset: 0;\n            pointer-events: none;\n            overflow: hidden;\n        }\n        .dim-badge {\n            position: absolute;\n            transform: translate(-50%, -50%);\n            pointer-events: auto;\n            cursor: var(--badge-cursor,pointer);\n            transition: transform 0.1s ease, box-shadow 0.15s ease;\n            white-space: pre-line;\n            text-align: center;\n            line-height: 1.2;\n        }\n        .dim-badge:hover {\n            transform: translate(-50%, -50%) scale(1.06);\n            z-index: 30;\n        }\n        .dim-badge.selected {\n            box-shadow: 0 0 0 2px #38bdf8, 0 6px 16px rgba(0, 0, 0, 0.5);\n            z-index: 35;\n        }\n        #snap-tooltip {\n            position: absolute;\n            pointer-events: none;\n            transform: translate(12px, -50%);\n            z-index: 25;\n            white-space: nowrap;\n        }\n        ::-webkit-scrollbar {\n            width: 6px;\n            height: 6px;\n        }\n        ::-webkit-scrollbar-track {\n            background: transparent;\n        }\n        ::-webkit-scrollbar-thumb {\n            background: rgba(148, 163, 184, 0.3);\n            border-radius: 9999px;\n        }\n        ::-webkit-scrollbar-thumb:hover {\n            background: rgba(148, 163, 184, 0.5);\n        }\n\n        .dim-badge{cursor:var(--badge-cursor,pointer)!important}\n        .card-selected input[type=range]{height:8px!important;background:#475569!important;accent-color:#38bdf8;box-shadow:0 0 0 1px #38bdf8}\n        .mvh{cursor:grab;touch-action:none;user-select:none;font-size:15px;line-height:1;color:#94a3b8;padding:0 1px}\n        .mvb{width:22px;height:18px;display:inline-flex;align-items:center;justify-content:center;border-radius:5px;border:1px solid #475569;background:#1e293b;color:#e2e8f0;font-size:9px;line-height:1;cursor:pointer}\n        .mvb:disabled{opacity:.3;cursor:default}\n        html.light .mvb{background:#e2e8f0;color:#0f172a;border-color:#94a3b8}\n        [data-card-id].dragging{opacity:.7;outline:2px dashed #38bdf8}\n        html.light #btn-comp-add{color:#4c1d95!important}\n        #dimensions-list .text-xs{font-size:calc(12px*var(--fs,1))!important}\n        #dimensions-list .text-\\[11px\\]{font-size:calc(11px*var(--fs,1))!important}\n        #dimensions-list .text-\\[10px\\]{font-size:calc(10px*var(--fs,1))!important}\n        html.light .border-slate-600{border-color:#94a3b8!important}\n        html.light .border-slate-500{border-color:#64748b!important}\n        .card-selected{background:#475569!important}\n        .card-selected .text-slate-400,.card-selected .text-slate-500{color:#e2e8f0!important}\n        html.light .card-selected .text-slate-400,html.light .card-selected .text-slate-500{color:#1e293b!important}\n        #side-resize{position:absolute;left:-3px;top:0;bottom:0;width:6px;cursor:col-resize;z-index:30}\n        #side-resize:hover{background:rgba(56,189,248,.5)}\n        html.light body,html.light .bg-slate-950{background:#f1f5f9!important}\n        html.light .bg-slate-900,html.light .bg-slate-900\\/90,html.light .bg-slate-900\\/95,html.light .bg-slate-900\\/60,html.light .bg-slate-950\\/70,html.light .bg-slate-950\\/60,html.light .bg-slate-950\\/90{background:#fff!important}\n        html.light .bg-slate-800,html.light .bg-slate-800\\/90{background:#e2e8f0!important}\n        html.light .border-slate-800,html.light .border-slate-700,html.light .border-slate-800\\/80,html.light .border-slate-700\\/80{border-color:#cbd5e1!important}\n        html.light .text-white,html.light .text-slate-100,html.light .text-slate-200{color:#0f172a!important}\n        html.light .text-slate-300,html.light .text-slate-400{color:#475569!important}\n        html.light .card-selected{background:#a5c8f0!important}\n        html.light .card-selected input[type=range]{background:#94a3b8!important}\n        /* карточка, к которой перешли кликом по размеру на модели: рамка (одинарный клик) или вся карточка (двойной) */\n        /* палитра при наведении на размер: название и 6 цветов */\n        .dim-pal { position: fixed; z-index: 70; display: flex; align-items: center; gap: 5px; padding: 4px 8px 4px 10px; border-radius: 999px; background: rgba(15, 23, 42, 0.96); border: 1px solid #334155; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45); transform: translateX(-50%); }\n        .dim-pal-n { font: 600 11px system-ui, sans-serif; color: #e2e8f0; margin-right: 4px; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n        .dim-pal-c { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.85); padding: 0; cursor: pointer; transition: transform .1s; }\n        .dim-pal-c:hover, .dim-pal-c.on { transform: scale(1.25); }\n        /* вспомогательные линии */\n        .guide-tag { position: absolute; transform: translate(-50%, -130%); padding: 0 6px; border-radius: 6px; background: rgba(76, 29, 149, 0.92); color: #ede9fe; border: 1px solid #a78bfa; font: 600 10px system-ui, sans-serif; white-space: nowrap; cursor: pointer; pointer-events: auto; }\n        .guide-card { border: 1px solid #4c1d95; border-radius: 10px; padding: 7px 8px; background: rgba(46, 16, 101, 0.25); font-size: 11px; color: #cbd5e1; }\n        .guide-card.flash-b { outline: 3px solid #a78bfa; outline-offset: 2px; }\n        .guide-card input, .guide-card select { background: #020617; border: 1px solid #334155; border-radius: 5px; color: #e2e8f0; padding: 1px 4px; font-size: 11px; }\n        .guide-card .gmk { display: inline-flex; align-items: center; gap: 3px; padding: 0 5px; border-radius: 999px; background: #312e81; margin: 2px 3px 0 0; }\n        .guide-card button { cursor: pointer; }\n        .guide-card.folded .gbody { display: none; }\n        #dimensions-list .flash-b { outline: 3px solid #f59e0b !important; outline-offset: 2px; }\n        #dimensions-list .flash-all { outline: 3px solid #f59e0b !important; outline-offset: 2px; background-color: rgba(245, 158, 11, 0.22) !important; }\n    \u003c/style>\n\u003c/head>\n\u003cbody class=\"bg-slate-950 text-slate-100 font-sans h-screen flex flex-col\">\n\n    \u003c!-- ВЕРХНЯЯ ПАНЕЛЬ ИНСТРУМЕНТОВ -->\n    \u003cheader class=\"h-14 bg-slate-900 border-b border-slate-800 px-3 flex items-center justify-between gap-2 shrink-0 z-20 overflow-x-auto\">\n        \u003c!-- Загрузка файлов -->\n        \u003cdiv class=\"flex items-center gap-2 shrink-0\">\n\n            \u003clabel for=\"file-input\" class=\"cursor-pointer inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-100 text-xs font-medium border border-slate-700 transition\">\n                \u003csvg class=\"w-4 h-4 text-sky-400\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\">\n                    \u003cpath stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5\"/>\n                \u003c/svg>\n                \u003cspan>Открыть файл\u003c/span>\n                \u003cspan class=\"hidden md:inline text-[10px] text-slate-400\">(.HTML / .STL / .OBJ / .GLB)\u003c/span>\n            \u003c/label>\n            \u003cinput id=\"file-input\" type=\"file\" accept=\".html,.htm,.stl,.obj,.glb,.gltf\" class=\"hidden\">\n\n        \u003c/div>\n\n        \u003c!-- ЦЕНТРАЛЬНАЯ ПАНЕЛЬ ИНСТРУМЕНТОВ ИЗМЕРЕНИЯ -->\n        \u003cdiv class=\"flex items-center bg-slate-950/90 p-1 rounded-xl border border-slate-800 gap-1 shrink-0\">\n            \u003cbutton id=\"tool-orbit\" type=\"button\" data-tool=\"orbit\" title=\"Обзор и выделение (Esc)\" class=\"tool-btn flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-medium transition bg-sky-600 text-white shadow cursor-pointer\">\n                \u003csvg class=\"w-4 h-4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\">\n                    \u003cpath stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M15.042 21.672L13.684 16.6m0 0l-2.51 2.225.569-9.47 5.227 7.917-3.286-.672zM12 2.25V4.5m5.834.166l-1.591 1.591M20.25 10.5H18M7.757 14.743l-1.59 1.59M6 10.5H3.75m4.007-4.243l-1.59-1.59\"/>\n                \u003c/svg>\n                \u003cspan class=\"hidden lg:inline\">Обзор\u003c/span>\n            \u003c/button>\n\n            \u003cbutton id=\"tool-measure\" type=\"button\" data-tool=\"measure\" title=\"Линейный размер между 2 точками (M)\" class=\"tool-btn flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition cursor-pointer\">\n                \u003csvg class=\"w-4 h-4 text-amber-400\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\">\n                    \u003cpath stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M3 12h18M3 12l3-3m-3 3l3 3m15-3l-3-3m3 3l-3 3M4 6v12M20 6v12\"/>\n                \u003c/svg>\n                \u003cspan>Размер (2 т.)\u003c/span>\n            \u003c/button>\n\n            \u003cbutton id=\"tool-diameter\" type=\"button\" data-tool=\"diameter\" title=\"Диаметр / Радиус отверстия или дуги по 3 точкам (D)\" class=\"tool-btn flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition cursor-pointer\">\n                \u003csvg class=\"w-4 h-4 text-cyan-400\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\">\n                    \u003ccircle cx=\"12\" cy=\"12\" r=\"8\"/>\n                    \u003cpath stroke-linecap=\"round\" d=\"M6.34 17.66L17.66 6.34\"/>\n                \u003c/svg>\n                \u003cspan>Ø Диаметр\u003c/span>\n            \u003c/button>\n\n            \u003cbutton id=\"tool-angle\" type=\"button\" data-tool=\"angle\" title=\"Угол по 3 точкам: Вершина -> Точка А -> Точка Б (A)\" class=\"tool-btn flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition cursor-pointer\">\n                \u003csvg class=\"w-4 h-4 text-pink-400\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\">\n                    \u003cpath stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M4 19h16M4 19L15 5m-3 14a8 8 0 00-2.5-5.8\"/>\n                \u003c/svg>\n                \u003cspan>Угол\u003c/span>\n            \u003c/button>\n\n            \u003cbutton id=\"tool-callout\" type=\"button\" data-tool=\"callout\" title=\"Текстовая выноска / примечание (N)\" class=\"tool-btn flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition cursor-pointer\">\n                \u003csvg class=\"w-4 h-4 text-emerald-400\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\">\n                    \u003cpath stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M7.5 8.25h9m-9 3H12m-9.75 1.51c0 1.6 1.123 2.994 2.707 3.227 1.129.166 2.27.293 3.423.379.35.026.67.21.865.501L12 21l2.755-4.133a1.14 1.14 0 01.865-.501 48.172 48.172 0 003.423-.379c1.584-.233 2.707-1.626 2.707-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0012 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018z\"/>\n                \u003c/svg>\n                \u003cspan>Выноска\u003c/span>\n            \u003c/button>\n\n            \u003cbutton id=\"tool-guide\" type=\"button\" data-tool=\"guide\" title=\"Вспомогательная линия по 2 точкам (G). Привязка к вершинам, рёбрам и к другим линиям; от её концов, центра, третей, четвертей и меток можно ставить размеры\" class=\"tool-btn flex items-center gap-1.5 px-2.5 py-1.5 rounded-md text-xs font-medium text-slate-300 hover:bg-slate-800 transition\">\n                \u003cspan class=\"text-violet-400 font-bold\">╱\u003c/span>\n                \u003cspan>Вспом. линия\u003c/span>\n            \u003c/button>\n\n            \u003cbutton id=\"tool-aux\" type=\"button\" data-tool=\"aux\" title=\"Размер к линии: 2 точки на грани задают линию, 3-я — размер к ней под углом (L)\" class=\"tool-btn flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition cursor-pointer\">\n                \u003cspan class=\"text-violet-400 font-bold\">⟂\u003c/span>\n                \u003cspan>Размер к линии\u003c/span>\n            \u003c/button>\n\n            \u003cdiv class=\"w-px h-5 bg-slate-800 mx-0.5\">\u003c/div>\n\n            \u003cbutton id=\"btn-auto-dims\" type=\"button\" title=\"Автоматически расставить габаритные и характерные размеры модели\" class=\"flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-amber-500/15 hover:bg-amber-500/25 text-amber-300 border border-amber-500/40 transition cursor-pointer\">\n                \u003csvg class=\"w-4 h-4 text-amber-400\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\">\n                    \u003cpath stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z\"/>\n                \u003c/svg>\n                \u003cspan>Авторазмеры\u003c/span>\n            \u003c/button>\n\n            \u003cbutton id=\"btn-skeleton\" type=\"button\" title=\"Каркас: участки модели по осям и проверка размеров\" class=\"flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-medium text-orange-300 border border-orange-500/50 cursor-pointer\">▦ Каркас\u003c/button>\n            \u003cbutton id=\"btn-bbox\" type=\"button\" title=\"Показать общие габариты детали (X × Y × Z)\" class=\"flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition cursor-pointer\">\n                \u003csvg class=\"w-4 h-4 text-purple-400\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\">\n                    \u003cpath stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M21 7.5l-2.25-1.313M21 7.5v2.25m0-2.25l-2.25 1.313M3 7.5l2.25-1.313M3 7.5l2.25 1.313M3 7.5v2.25m9 3l2.25-1.313M12 12.75l-2.25-1.313M12 12.75V15m0 6.75l2.25-1.313M12 21.75V19.5m0 2.25l-2.25-1.313m0-16.875L12 2.25l2.25 1.313M21 14.25v2.25l-2.25 1.313m-13.5 0L3 16.5v-2.25\"/>\n                \u003c/svg>\n                \u003cspan class=\"hidden xl:inline\">Габариты\u003c/span>\n            \u003c/button>\n        \u003c/div>\n\n        \u003c!-- ПРАВЫЕ КНОПКИ ЭКСПОРТА -->\n        \u003cdiv class=\"flex items-center gap-2 shrink-0\">\n            \u003cbutton id=\"btn-export-png\" type=\"button\" title=\"Сохранить скриншот PNG\" class=\"inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium border border-slate-700 transition cursor-pointer\">\n                \u003csvg class=\"w-4 h-4 text-sky-400\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\">\n                    \u003cpath stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z\"/>\n                    \u003cpath stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M16.5 12.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0z\"/>\n                \u003c/svg>\n                \u003cspan class=\"hidden sm:inline\">PNG\u003c/span>\n            \u003c/button>\n\n            \u003cbutton id=\"btn-export-html\" type=\"button\" class=\"inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white text-xs font-semibold shadow-lg shadow-emerald-500/20 transition cursor-pointer\">\n                \u003csvg class=\"w-4 h-4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\">\n                    \u003cpath stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3\"/>\n                \u003c/svg>\n                \u003cspan>Скачать HTML с размерами\u003c/span>\n            \u003c/button>\n        \u003c/div>\n    \u003c/header>\n\n    \u003c!-- ОСНОВНАЯ РАБОЧАЯ ОБЛАСТЬ -->\n    \u003cdiv class=\"flex-1 flex overflow-hidden relative\">\n\n        \u003c!-- 3D ВЬЮПОРТ -->\n        \u003cmain id=\"viewport-container\" class=\"flex-1 relative bg-slate-950\">\n            \u003ccanvas id=\"three-canvas\">\u003c/canvas>\n            \u003ccanvas id=\"gizmo-canvas\">\u003c/canvas>\n\n            \u003c!-- Слой 2D-меток размеров -->\n            \u003cdiv id=\"annotations-overlay\">\u003c/div>\n            \u003cdiv id=\"sk-panel\" style=\"display:none;position:absolute;top:64px;left:12px;width:300px;max-height:calc(100% - 130px);z-index:30;flex-direction:column;gap:8px;padding:10px;border-radius:12px;background:rgba(15,23,42,.95);border:1px solid #ea580c;color:#e2e8f0;font-size:11px\">\u003c/div>\n\n            \u003c!-- Всплывающая подсказка типа привязки возле курсора -->\n            \u003cdiv id=\"snap-tooltip\" class=\"hidden px-2 py-0.5 rounded bg-slate-900/90 border border-emerald-500/60 text-[10px] font-medium text-emerald-300 shadow-lg\">\n                Вершина\n            \u003c/div>\n\n            \u003c!-- Панель стандартных CAD-видов и камеры -->\n            \u003cdiv class=\"absolute top-3 left-3 flex flex-wrap items-center gap-1 bg-slate-900/90 backdrop-blur-md p-1.5 rounded-xl border border-slate-800 shadow-xl z-10\">\n                \u003cbutton type=\"button\" data-view=\"iso\" class=\"view-btn px-2 py-1 rounded-lg text-[11px] font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition cursor-pointer\">Изометрия\u003c/button>\n                \u003cbutton type=\"button\" data-view=\"front\" class=\"view-btn px-2 py-1 rounded-lg text-[11px] font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition cursor-pointer\">Спереди\u003c/button>\n                \u003cbutton type=\"button\" data-view=\"back\" class=\"view-btn px-2 py-1 rounded-lg text-[11px] font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition cursor-pointer\">Сзади\u003c/button>\n                \u003cbutton type=\"button\" data-view=\"top\" class=\"view-btn px-2 py-1 rounded-lg text-[11px] font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition cursor-pointer\">Сверху\u003c/button>\n                \u003cbutton type=\"button\" data-view=\"bottom\" class=\"view-btn px-2 py-1 rounded-lg text-[11px] font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition cursor-pointer\">Снизу\u003c/button>\n                \u003cbutton type=\"button\" data-view=\"left\" class=\"view-btn px-2 py-1 rounded-lg text-[11px] font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition cursor-pointer\">Слева\u003c/button>\n                \u003cbutton type=\"button\" data-view=\"right\" class=\"view-btn px-2 py-1 rounded-lg text-[11px] font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition cursor-pointer\">Справа\u003c/button>\n                \u003cdiv class=\"w-px h-4 bg-slate-700 mx-0.5\">\u003c/div>\n                \u003cbutton id=\"btn-cam-type\" type=\"button\" title=\"Переключить Перспектива / Ортография\" class=\"px-2 py-1 rounded-lg text-[11px] font-mono font-medium bg-slate-800 text-sky-400 hover:bg-slate-700 transition cursor-pointer\">\n                    Персп.\n                \u003c/button>\n                \u003cbutton id=\"btn-fit\" type=\"button\" title=\"Вписать деталь в экран\" class=\"p-1 rounded-lg text-sky-400 hover:bg-slate-800 transition cursor-pointer\">\n                    \u003csvg class=\"w-4 h-4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\">\n                        \u003cpath stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15\"/>\n                    \u003c/svg>\n                \u003c/button>\n            \u003c/div>\n\n            \u003c!-- Диагностический баннер ошибок / загрузки (показывается только при проблемах) -->\n            \u003cdiv id=\"diagnostic-banner\" class=\"hidden absolute top-16 left-3 right-3 max-w-2xl bg-rose-950/95 border border-rose-500/70 text-rose-100 px-3.5 py-2.5 rounded-xl shadow-2xl z-30 text-xs\">\n                \u003cdiv class=\"flex items-start justify-between gap-2\">\n                    \u003cdiv>\n                        \u003cdiv class=\"font-bold text-rose-300 mb-0.5\">Диагностика загрузки модели:\u003c/div>\n                        \u003cdiv id=\"diagnostic-message\" class=\"font-mono text-[11px] text-rose-100 break-words\">\u003c/div>\n                    \u003c/div>\n                    \u003cbutton id=\"btn-close-diag\" type=\"button\" class=\"text-rose-300 hover:text-white px-1.5 py-0.5 rounded bg-rose-900/60 cursor-pointer\">✕\u003c/button>\n                \u003c/div>\n            \u003c/div>\n\n            \u003c!-- Строка состояния инструмента -->\n            \u003cdiv id=\"status-banner\" class=\"absolute bottom-3 left-1/2 -translate-x-1/2 bg-slate-900/90 backdrop-blur-md border border-slate-700/80 px-4 py-1.5 rounded-full text-xs text-slate-200 shadow-2xl flex items-center gap-2.5 z-10 pointer-events-none max-w-[92%]\">\n                \u003cspan id=\"status-dot\" class=\"w-2 h-2 rounded-full bg-sky-400 animate-pulse shrink-0\">\u003c/span>\n                \u003cspan id=\"status-text\" class=\"truncate\">Инициализация 3D-сцены...\u003c/span>\n            \u003c/div>\n\n            \u003c!-- Оверлей при перетаскивании файла (Drag & Drop) -->\n            \u003cdiv id=\"drop-overlay\" class=\"hidden absolute inset-4 rounded-2xl border-2 border-dashed border-sky-400 bg-slate-950/85 backdrop-blur-sm z-40 flex flex-col items-center justify-center text-center pointer-events-none\">\n                \u003cdiv class=\"w-16 h-16 rounded-2xl bg-sky-500/20 flex items-center justify-center mb-3 text-sky-400\">\n                    \u003csvg class=\"w-8 h-8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\">\n                        \u003cpath stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5\"/>\n                    \u003c/svg>\n                \u003c/div>\n                \u003cp class=\"text-base font-semibold text-white\">Отпустите файл 3D-модели\u003c/p>\n                \u003cp class=\"text-xs text-slate-400 mt-1\">Поддерживаются HTML из FreeCAD 1.1 (base90), сохранённые проекты HTML, а также STL, OBJ, GLB\u003c/p>\n            \u003c/div>\n\n            \u003c!-- Уведомление Toast -->\n            \u003cdiv id=\"toast-box\" class=\"hidden fixed bottom-14 right-84 bg-slate-800 border border-slate-700 text-white px-4 py-2.5 rounded-xl shadow-2xl text-xs font-medium z-50\">\u003c/div>\n        \u003c/main>\n\n        \u003c!-- ПРАВАЯ ПАНЕЛЬ ИНСПЕКТОРА -->\n        \u003caside id=\"side-panel\" class=\"relative w-80 lg:w-88 bg-slate-900 border-l border-slate-800 flex flex-col shrink-0 z-20\">\u003cdiv id=\"side-resize\" title=\"Потяните для изменения ширины\">\u003c/div>\n            \u003cdiv id=\"mv-block\" class=\"p-3 border-b border-slate-800 space-y-2.5 overflow-y-auto\" style=\"max-height:60vh\">\n                \u003cdiv class=\"flex items-center justify-between gap-2\">\n                    \u003cbutton id=\"mv-toggle\" type=\"button\" class=\"text-[11px] font-bold uppercase tracking-wider text-slate-400 hover:text-white cursor-pointer\">▼ Модель и вид\u003c/button>\n                    \u003cspan id=\"model-name-badge\" class=\"text-[11px] font-mono text-sky-400 truncate max-w-[175px]\" title=\"Ожидание модели\">не загружена\u003c/span>\n                \u003c/div>\n\n                \u003c!-- Габариты X / Y / Z (Z-up FreeCAD) -->\n                \u003cdiv class=\"grid grid-cols-3 gap-1.5 bg-slate-950 p-2 rounded-xl border border-slate-800/80 text-center\">\n                    \u003cdiv>\n                        \u003cdiv class=\"text-[10px] text-rose-400 font-semibold\">X (Длина)\u003c/div>\n                        \u003cdiv id=\"dim-x\" class=\"text-xs font-mono font-semibold text-slate-200 mt-0.5\">—\u003c/div>\n                    \u003c/div>\n                    \u003cdiv class=\"border-x border-slate-800\">\n                        \u003cdiv class=\"text-[10px] text-emerald-400 font-semibold\">Y (Ширина)\u003c/div>\n                        \u003cdiv id=\"dim-y\" class=\"text-xs font-mono font-semibold text-slate-200 mt-0.5\">—\u003c/div>\n                    \u003c/div>\n                    \u003cdiv>\n                        \u003cdiv class=\"text-[10px] text-sky-400 font-semibold\">Z (Высота)\u003c/div>\n                        \u003cdiv id=\"dim-z\" class=\"text-xs font-mono font-semibold text-slate-200 mt-0.5\">—\u003c/div>\n                    \u003c/div>\n                \u003c/div>\n\n                \u003c!-- Режим отображения и единицы -->\n                \u003cdiv class=\"grid grid-cols-2 gap-2\">\n                    \u003cdiv>\n                        \u003clabel class=\"block text-[10px] text-slate-400 mb-1\">Отображение\u003c/label>\n                        \u003cselect id=\"render-mode\" class=\"w-full bg-slate-950 border border-slate-800 rounded-lg px-2 py-1 text-xs text-slate-200 focus:outline-none focus:border-sky-500\">\n                            \u003coption value=\"cad\">CAD (Грани + рёбра)\u003c/option>\n                            \u003coption value=\"solid\">Гладкий (Без рёбер)\u003c/option>\n                            \u003coption value=\"xray\">Рентген (Прозрачный)\u003c/option>\n                            \u003coption value=\"wireframe\">Сетка (Wireframe)\u003c/option>\n                        \u003c/select>\n                    \u003c/div>\n                    \u003cdiv>\n                        \u003clabel class=\"block text-[10px] text-slate-400 mb-1\">Единицы\u003c/label>\n                        \u003cselect id=\"unit-select\" class=\"w-full bg-slate-950 border border-slate-800 rounded-lg px-2 py-1 text-xs text-slate-200 focus:outline-none focus:border-sky-500\">\n                            \u003coption value=\"мм\" selected>Миллиметры (мм)\u003c/option>\n                            \u003coption value=\"см\">Сантиметры (см)\u003c/option>\n                            \u003coption value=\"м\">Метры (м)\u003c/option>\n                        \u003c/select>\n                    \u003c/div>\n                \u003c/div>\n\n                \u003c!-- Масштаб в конвертере -->\n                \u003clabel class=\"flex items-center gap-1.5 cursor-pointer text-xs text-slate-300\" title=\"В конвертере появится ползунок «Масштаб, %»\">\n                    \u003cinput id=\"show-scale-all\" type=\"checkbox\" checked class=\"rounded bg-slate-950 border-slate-700 text-sky-500 focus:ring-0\">\n                    \u003cspan>Показывать масштаб в конвертере\u003c/span>\n                \u003c/label>\n\n                \u003c!-- Привязка и авторазмеры при входе -->\n                \u003cdiv class=\"flex items-center justify-between pt-0.5 text-xs\">\n                    \u003clabel class=\"inline-flex items-center gap-1.5 cursor-pointer text-slate-300\">\n                        \u003cinput id=\"snap-toggle\" type=\"checkbox\" checked class=\"rounded bg-slate-950 border-slate-700 text-sky-500 focus:ring-0\">\n                        \u003cspan>Привязка (вершины/рёбра)\u003c/span>\n                    \u003c/label>\n                    \u003clabel class=\"inline-flex items-center gap-1 cursor-pointer text-slate-300\" title=\"Автоматически расставлять размеры при загрузке модели\">\n                        \u003cinput id=\"auto-dims-on-load\" type=\"checkbox\" class=\"rounded bg-slate-950 border-slate-700 text-amber-500 focus:ring-0\">\n                        \u003cspan class=\"text-[11px]\">Авто при входе\u003c/span>\n                    \u003c/label>\n                    \u003cselect id=\"def-anchor\" title=\"Откуда по умолчанию меняются размеры\" class=\"bg-slate-950 border border-slate-800 rounded px-1 py-0.5 text-[11px] text-slate-200\">\u003coption value=\"0\">от точки 1\u003c/option>\u003coption value=\"1\">от точки 2\u003c/option>\u003coption value=\"2\" selected>от центра\u003c/option>\u003c/select>\n                \u003c/div>\n                \u003cdiv class=\"flex items-center justify-between pt-0.5 text-xs\">\n                    \u003cspan class=\"text-[11px] text-slate-400\">Лимит размеров по умолчанию:\u003c/span>\n                    \u003cselect id=\"def-limit\" title=\"Задавать границы ползунка в мм (размер) или в % масштаба. Применяется ко всем размерам\" class=\"bg-slate-950 border border-slate-800 rounded px-1 py-0.5 text-[11px] text-slate-200\">\u003coption value=\"abs\" selected>в мм (размер)\u003c/option>\u003coption value=\"pct\">в % масштаба\u003c/option>\u003c/select>\n                \u003c/div>\n                \u003cdiv class=\"flex items-center justify-between pt-0.5 text-xs\">\n                    \u003cspan class=\"text-[11px] text-slate-400\">Толщина размерных линий:\u003c/span>\n                    \u003cselect id=\"line-k\" title=\"Толщина линий всех размеров на модели\" class=\"bg-slate-950 border border-slate-800 rounded px-1 py-0.5 text-[11px] text-slate-200\">\n                        \u003coption value=\"1\">обычная\u003c/option>\n                        \u003coption value=\"1.5\">× 1,5\u003c/option>\n                        \u003coption value=\"2\">× 2\u003c/option>\n                        \u003coption value=\"3\">× 3\u003c/option>\n                    \u003c/select>\n                \u003c/div>\n\n                \u003c!-- Сетка и фон -->\n                \u003cdiv class=\"flex items-center justify-between pt-0.5 text-xs\">\n                    \u003cspan class=\"text-[11px] text-slate-400\">Оформление сцены:\u003c/span>\n                    \u003cdiv class=\"flex items-center gap-1\">\n                        \u003cbutton id=\"grid-toggle-btn\" type=\"button\" title=\"Сетка координат\" class=\"px-2 py-1 rounded bg-slate-800 text-slate-300 hover:text-white text-[11px] cursor-pointer\">Сетка\u003c/button>\n                        \u003cbutton id=\"bg-toggle-btn\" type=\"button\" title=\"Сменить тему фона (Тёмная / Светлая)\" class=\"px-2 py-1 rounded bg-slate-800 text-slate-300 hover:text-white text-[11px] cursor-pointer\">Фон\u003c/button>\n                    \u003c/div>\n                \u003c/div>\n\n                \u003cdiv class=\"space-y-1.5 text-[11px] text-slate-400\">\n                    \u003cbutton id=\"ui-theme-btn\" type=\"button\" class=\"px-2 py-1 rounded bg-slate-800 text-slate-300 hover:text-white cursor-pointer\">☀ Тема интерфейса\u003c/button>\n                    \u003cdiv class=\"flex items-center gap-1.5\">\u003cspan>Курсор:\u003c/span>\n                        \u003cselect id=\"cur-shape\" class=\"bg-slate-950 border border-slate-800 rounded px-1 py-0.5 text-slate-200\">\u003coption value=\"cross\">Крест\u003c/option>\u003coption value=\"dot\">Точка\u003c/option>\u003coption value=\"ring\">Кольцо\u003c/option>\u003coption value=\"square\">Квадрат\u003c/option>\u003coption value=\"arrow\" selected>Стрелка\u003c/option>\u003c/select>\n                        \u003cinput id=\"cur-size\" type=\"range\" min=\"10\" max=\"64\" value=\"24\" class=\"flex-1 h-1\">\u003c/div>\n                \u003c/div>\n                \u003c!-- Сечения модели -->\n                \u003cdetails class=\"group bg-slate-950/70 rounded-xl border border-slate-800/80 px-2.5 py-1.5\">\n                    \u003csummary class=\"text-[11px] font-medium text-slate-300 cursor-pointer flex items-center justify-between list-none\">\n                        \u003cspan class=\"flex items-center gap-1.5\">\n                            \u003csvg class=\"w-3.5 h-3.5 text-sky-400\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\">\n                                \u003cpath stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M7.5 3.75H6A2.25 2.25 0 003.75 6v1.5M16.5 3.75H18A2.25 2.25 0 0120.25 6v1.5m0 9V18A2.25 2.25 0 0118 20.25h-1.5m-9 0H6A2.25 2.25 0 013.75 18v-1.5M15 12a3 3 0 11-6 0 3 3 0 016 0z\"/>\n                            \u003c/svg>\n                            \u003cspan>Сечения модели (X / Y / Z)\u003c/span>\n                        \u003c/span>\n                        \u003cspan class=\"text-[10px] text-slate-500 group-open:rotate-180 transition-transform\">▼\u003c/span>\n                    \u003c/summary>\n                    \u003cdiv class=\"pt-2 pb-1 space-y-1.5 text-[10px] text-slate-400\">\n                        \u003cdiv class=\"flex items-center gap-2\">\n                            \u003cspan class=\"w-4 text-rose-400 font-bold\">X\u003c/span>\n                            \u003cinput id=\"clip-x\" type=\"range\" min=\"0\" max=\"100\" value=\"100\" class=\"flex-1 h-1 bg-slate-800 rounded-lg accent-rose-500 cursor-pointer\">\n                            \u003cspan id=\"clip-x-val\" class=\"w-8 text-right font-mono\">100%\u003c/span>\n                        \u003c/div>\n                        \u003cdiv class=\"flex items-center gap-2\">\n                            \u003cspan class=\"w-4 text-emerald-400 font-bold\">Y\u003c/span>\n                            \u003cinput id=\"clip-y\" type=\"range\" min=\"0\" max=\"100\" value=\"100\" class=\"flex-1 h-1 bg-slate-800 rounded-lg accent-emerald-500 cursor-pointer\">\n                            \u003cspan id=\"clip-y-val\" class=\"w-8 text-right font-mono\">100%\u003c/span>\n                        \u003c/div>\n                        \u003cdiv class=\"flex items-center gap-2\">\n                            \u003cspan class=\"w-4 text-sky-400 font-bold\">Z\u003c/span>\n                            \u003cinput id=\"clip-z\" type=\"range\" min=\"0\" max=\"100\" value=\"100\" class=\"flex-1 h-1 bg-slate-800 rounded-lg accent-sky-500 cursor-pointer\">\n                            \u003cspan id=\"clip-z-val\" class=\"w-8 text-right font-mono\">100%\u003c/span>\n                        \u003c/div>\n                    \u003c/div>\n                \u003c/details>\n            \u003c/div>\n\n            \u003c!-- Вспомогательные линии -->\n            \u003cdiv id=\"guides-wrap\" style=\"display:none\" class=\"border-b border-slate-800\">\n                \u003cdiv class=\"px-3 py-2 bg-slate-900/60 flex items-center gap-2\">\n                    \u003cbutton id=\"guides-fold\" type=\"button\" title=\"Свернуть или развернуть блок линий\" class=\"text-violet-300 text-xs w-4\">▾\u003c/button>\n                    \u003ch2 class=\"text-[11px] font-bold uppercase tracking-wider text-violet-300\">Вспомогательные линии\u003c/h2>\n                    \u003cspan id=\"guide-count\" class=\"px-1.5 py-0.5 rounded-full bg-slate-800 text-slate-300 text-[10px] font-mono\">0\u003c/span>\n                \u003c/div>\n                \u003cdiv id=\"guides-list\" class=\"p-2.5 space-y-2 overflow-y-auto\" style=\"max-height:38vh\">\u003c/div>\n            \u003c/div>\n\n            \u003c!-- Заголовок списка размеров -->\n            \u003cdiv class=\"px-3 py-2 bg-slate-900/60 border-b border-slate-800 flex items-center justify-between\">\n                \u003cdiv class=\"flex items-center gap-2\">\n                    \u003ch2 class=\"text-[11px] font-bold uppercase tracking-wider text-slate-400\">Размеры и выноски\u003c/h2>\n                    \u003cspan id=\"dim-count\" class=\"px-1.5 py-0.5 rounded-full bg-slate-800 text-slate-300 text-[10px] font-mono\">0\u003c/span>\n                \u003c/div>\n                \u003cdiv class=\"flex items-center gap-2\">\u003cbutton id=\"fs-minus\" type=\"button\" title=\"Уменьшить шрифт карточек\" class=\"text-[11px] text-slate-300 hover:text-white cursor-pointer px-1\">A−\u003c/button>\u003cbutton id=\"fs-plus\" type=\"button\" title=\"Увеличить шрифт карточек\" class=\"text-sm text-slate-300 hover:text-white cursor-pointer px-1\">A+\u003c/button>\u003cbutton id=\"btn-clear-all\" type=\"button\" class=\"text-[11px] text-rose-400 hover:text-rose-300 transition cursor-pointer\">Очистить\u003c/button>\u003c/div>\n            \u003c/div>\n\n            \u003c!-- Прокручиваемый список размеров -->\n            \u003cdiv id=\"dimensions-list\" class=\"flex-1 overflow-y-auto p-2.5 space-y-3\">\u003c/div>\n\n        \u003c/aside>\n    \u003c/div>\n\n    \u003cscript type=\"module\">\n        // =========================================================================\n        // ОТКАЗОУСТОЙЧИВАЯ ЗАГРУЗКА THREE.JS И МОДУЛЕЙ (JSDELIVR -> UNPKG FALLBACK)\n        // =========================================================================\n        const VERSION = '0.172.0';\n        const CDN_BASES = [\n            `https://cdn.jsdelivr.net/npm/three@${VERSION}`,\n            `https://unpkg.com/three@${VERSION}`\n        ];\n\n        function showDiagnostic(msg) {\n            console.error('[Редактор размеров]', msg);\n            const banner = document.getElementById('diagnostic-banner');\n            const msgEl = document.getElementById('diagnostic-message');\n            if (banner && msgEl) {\n                msgEl.textContent = msg;\n                banner.classList.remove('hidden');\n            }\n        }\n\n        function hideDiagnostic() {\n            const banner = document.getElementById('diagnostic-banner');\n            if (banner) banner.classList.add('hidden');\n        }\n\n        async function importFromCDNs(subpath) {\n            let lastErr = null;\n            for (const base of CDN_BASES) {\n                const url = `${base}/${subpath}`;\n                try {\n                    return await import(url);\n                } catch (err) {\n                    lastErr = err;\n                    console.warn(`Не удалось загрузить модуль с ${url}:`, err);\n                }\n            }\n            throw new Error(`Не удалось загрузить модуль \"${subpath}\" ни с одного CDN (${lastErr ? lastErr.message : 'ошибка сети'}).`);\n        }\n\n        let THREE, OrbitControls, STLLoader, OBJLoader, GLTFLoader, EdgeSplitModifier;\n        try {\n            THREE = await importFromCDNs('build/three.module.js');\n            const [orbitMod, stlMod, objMod, gltfMod, edgeMod] = await Promise.all([\n                importFromCDNs('examples/jsm/controls/OrbitControls.js'),\n                importFromCDNs('examples/jsm/loaders/STLLoader.js'),\n                importFromCDNs('examples/jsm/loaders/OBJLoader.js'),\n                importFromCDNs('examples/jsm/loaders/GLTFLoader.js'),\n                importFromCDNs('examples/jsm/modifiers/EdgeSplitModifier.js')\n            ]);\n            OrbitControls = orbitMod.OrbitControls;\n            STLLoader = stlMod.STLLoader;\n            OBJLoader = objMod.OBJLoader;\n            GLTFLoader = gltfMod.GLTFLoader;\n            EdgeSplitModifier = edgeMod.EdgeSplitModifier;\n        } catch (modErr) {\n            showDiagnostic(modErr.message + ' Проверьте подключение к интернету или доступность jsDelivr / unpkg.');\n            throw modErr;\n        }\n        // толстые линии размеров (Line2): если не загрузились — линии рисуются обычными, толщиной 1 пиксель\n        let Line2 = null, LineMaterial = null, LineGeometry = null;\n        try {\n            const [l2, lm, lg] = await Promise.all([\n                importFromCDNs('examples/jsm/lines/Line2.js'),\n                importFromCDNs('examples/jsm/lines/LineMaterial.js'),\n                importFromCDNs('examples/jsm/lines/LineGeometry.js')\n            ]);\n            Line2 = l2.Line2; LineMaterial = lm.LineMaterial; LineGeometry = lg.LineGeometry;\n        } catch (err) { console.warn('Толстые линии недоступны, линии будут тонкими', err); }\n\n        // =========================================================================\n        // СТАНДАРТ КООРДИНАТ FREECAD: ОСЬ Z НАПРАВЛЕНА ВВЕРХ (Z-UP)\n        // =========================================================================\n        THREE.Object3D.DEFAULT_UP = new THREE.Vector3(0, 0, 1);\n\n        // =========================================================================\n        // ГЛОБАЛЬНОЕ СОСТОЯНИЕ ПРИЛОЖЕНИЯ\n        // =========================================================================\n        let scene, persCamera, orthCamera, activeCamera;\n        let renderer, controls, raycaster;\n        let gizmoScene, gizmoCamera, gizmoRenderer;\n\n        let modelGroup = null;\n        let modelMeshes = [];\n        let modelWiresGroup = null;\n        let rawWireSegments = [];\n        let rawVertices = [];\n        let serializedModelData = null;\n\n        let gridHelper = null;\n        let bboxHelper = null;\n        let bboxLabels = [];\n        let showBBox = false;\n        let isDarkScene = true;\n        let isOrtho = false;\n\n        const clipPlaneX = new THREE.Plane(new THREE.Vector3(-1, 0, 0), 10000);\n        const clipPlaneY = new THREE.Plane(new THREE.Vector3(0, -1, 0), 10000);\n        const clipPlaneZ = new THREE.Plane(new THREE.Vector3(0, 0, -1), 10000);\n        let modelBounds = new THREE.Box3();\n\n        let currentTool = 'orbit';\n        let pendingPoints = [];\n        let hoverMarker = null;\n        let tempMarkers = [];\n        let tempLine = null;\n\n        let annotations = [];\n        let assistDone = null; // ассистент ждёт окончания загрузки модели\n        let guides = [], guideSeq = 0; // самостоятельные вспомогательные линии (не размеры, в конвертер не идут)\n        let selectedAnnotationId = null;\n        let currentUnit = 'мм';\n        let currentModelName = 'Коробка с двумя карманами (пример).html';\n        let autoDimsEnabledOnLoad = false;\n        window.__showScaleAll = true; // «Показывать масштаб в конвертере» включено по умолчанию\n        const mouse = new THREE.Vector2();\n        const viewportEl = document.getElementById('viewport-container');\n        const overlayEl = document.getElementById('annotations-overlay');\n        const snapTooltipEl = document.getElementById('snap-tooltip');\n\n        // =========================================================================\n        // ИНИЦИАЛИЗАЦИЯ СЦЕНЫ THREE.JS И ОРИЕНТАЦИОННОГО ГИЗМО\n        // =========================================================================\n        function initScene() {\n            scene = new THREE.Scene();\n            scene.background = new THREE.Color(0x090d16);\n\n            const width = Math.max(1, viewportEl.clientWidth);\n            const height = Math.max(1, viewportEl.clientHeight);\n            const aspect = width / height;\n\n            persCamera = new THREE.PerspectiveCamera(45, aspect, 0.1, 200000);\n            persCamera.up.set(0, 0, 1);\n\n            orthCamera = new THREE.OrthographicCamera(-100 * aspect, 100 * aspect, 100, -100, -200000, 200000);\n            orthCamera.up.set(0, 0, 1);\n\n            activeCamera = persCamera;\n\n            renderer = new THREE.WebGLRenderer({\n                canvas: document.getElementById('three-canvas'),\n                antialias: true,\n                preserveDrawingBuffer: true,\n                powerPreference: 'high-performance'\n            });\n            renderer.setSize(width, height);\n            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));\n            renderer.localClippingEnabled = true;\n\n            scene.add(new THREE.HemisphereLight(0xdbeafe, 0xfef3c7, 0.65));\n\n            const dLight1 = new THREE.DirectionalLight(0xffffff, 0.75);\n            dLight1.position.set(200, -180, 260);\n            scene.add(dLight1);\n\n            const dLight2 = new THREE.DirectionalLight(0x93c5fd, 0.45);\n            dLight2.position.set(-220, 200, 140);\n            scene.add(dLight2);\n\n            const dLight3 = new THREE.DirectionalLight(0xffffff, 0.25);\n            dLight3.position.set(0, 0, -250);\n            scene.add(dLight3);\n\n            controls = new OrbitControls(activeCamera, renderer.domElement);\n            controls.enableDamping = true;\n            controls.dampingFactor = 0.08;\n            controls.screenSpacePanning = true;\n\n            gridHelper = new THREE.GridHelper(300, 30, 0x334155, 0x1e293b);\n            gridHelper.rotation.x = Math.PI / 2;\n            scene.add(gridHelper);\n\n            raycaster = new THREE.Raycaster();\n\n            hoverMarker = new THREE.Mesh(\n                new THREE.SphereGeometry(1.2, 16, 16),\n                new THREE.MeshBasicMaterial({ color: 0x10b981, depthTest: false })\n            );\n            hoverMarker.visible = false;\n            hoverMarker.renderOrder = 999;\n            scene.add(hoverMarker);\n\n            initGizmo();\n            bindUIEvents();\n            setupViewportInteractions();\n            setupDragAndDrop();\n            window.addEventListener('resize', onWindowResize);\n\n            // открываемся с пустого экрана — модель открывают кнопкой «Открыть файл» или перетаскиванием\n            updateStatusBanner('Откройте модель: «Открыть файл» или перетащите HTML / STL / OBJ / GLB сюда', 'bg-sky-400');\n\n            animate();\n        }\n\n        function initGizmo() {\n            const gizmoCanvas = document.getElementById('gizmo-canvas');\n            gizmoRenderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, canvas: gizmoCanvas });\n            gizmoRenderer.setSize(104, 104);\n            gizmoRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));\n\n            gizmoScene = new THREE.Scene();\n            gizmoCamera = new THREE.PerspectiveCamera(45, 1, 1, 500);\n            gizmoCamera.up.set(0, 0, 1);\n\n            const origin = new THREE.Vector3(0, 0, 0);\n            gizmoScene.add(new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), origin, 55, 0xef4444, 16, 9));\n            gizmoScene.add(new THREE.ArrowHelper(new THREE.Vector3(0, 1, 0), origin, 55, 0x22c55e, 16, 9));\n            gizmoScene.add(new THREE.ArrowHelper(new THREE.Vector3(0, 0, 1), origin, 55, 0x3b82f6, 16, 9));\n            gizmoScene.add(new THREE.Mesh(\n                new THREE.BoxGeometry(22, 22, 22),\n                new THREE.MeshLambertMaterial({ color: 0x64748b })\n            ));\n            gizmoScene.add(new THREE.HemisphereLight(0xffffff, 0x334155, 1.3));\n        }\n\n        // =========================================================================\n        // ТЕСТОВАЯ МОДЕЛЬ «КОРОБКА С ДВУМЯ КАРМАНАМИ» (Z-UP)\n        // =========================================================================\n        function loadSamplePocketBoxModel(silent = false) {\n            try {\n                hideDiagnostic();\n                const shape = new THREE.Shape();\n                shape.moveTo(0, 0);\n                shape.lineTo(120, 0);\n                shape.lineTo(120, 70);\n                shape.lineTo(0, 70);\n                shape.closePath();\n\n                const pocket1 = new THREE.Path();\n                pocket1.moveTo(12, 12);\n                pocket1.lineTo(54, 12);\n                pocket1.lineTo(54, 58);\n                pocket1.lineTo(12, 58);\n                pocket1.closePath();\n                shape.holes.push(pocket1);\n\n                const pocket2 = new THREE.Path();\n                pocket2.moveTo(66, 12);\n                pocket2.lineTo(108, 12);\n                pocket2.lineTo(108, 58);\n                pocket2.lineTo(66, 58);\n                pocket2.closePath();\n                shape.holes.push(pocket2);\n\n                const wallsGeo = new THREE.ExtrudeGeometry(shape, { depth: 24, bevelEnabled: false });\n                wallsGeo.translate(0, 0, 6);\n\n                const baseGeo = new THREE.BoxGeometry(120, 70, 6);\n                baseGeo.translate(60, 35, 3);\n\n                const merged = mergeBufferGeometries([baseGeo.toNonIndexed(), wallsGeo.toNonIndexed()]);\n                loadSingleGeometryModel(merged, 'Коробка с двумя карманами (пример).html', '#adb5bd');\n                if (!silent) {\n                    showToast('Загружен пример: «Коробка с двумя карманами»');\n                }\n            } catch (err) {\n                showDiagnostic('Ошибка создания примерной модели: ' + err.message);\n            }\n        }\n\n        // =========================================================================\n        // ЗАГРУЗКА И ПАРСИНГ ФАЙЛОВ (.HTML из FreeCAD 1.1, .STL, .OBJ, .GLB)\n        // =========================================================================\n        document.getElementById('file-input').addEventListener('change', (e) => {\n            if (e.target.files && e.target.files[0]) {\n                handleUploadedFile(e.target.files[0]);\n                e.target.value = '';\n            }\n        });\n\n        function handleUploadedFile(file) {\n            hideDiagnostic();\n            const name = file.name;\n            const ext = (name.split('.').pop() || '').toLowerCase();\n            const reader = new FileReader();\n\n            reader.onerror = () => {\n                showDiagnostic(`Не удалось прочитать файл \"${name}\" с диска (FileReader error).`);\n            };\n\n            showToast(`Открытие файла «${name}»...`);\n\n            if (ext === 'html' || ext === 'htm') {\n                reader.onload = (ev) => parseFreeCADHtml(ev.target.result, name);\n                reader.readAsText(file);\n            } else if (ext === 'stl') {\n                reader.onload = (ev) => {\n                    try {\n                        const loader = new STLLoader();\n                        const geo = loader.parse(ev.target.result);\n                        loadSingleGeometryModel(geo, name, '#adb5bd');\n                        showToast(`STL модель «${name}» загружена`);\n                    } catch (err) {\n                        showDiagnostic(`Ошибка разбора STL \"${name}\": ${err.message}`);\n                    }\n                };\n                reader.readAsArrayBuffer(file);\n            } else if (ext === 'obj') {\n                reader.onload = (ev) => {\n                    try {\n                        const loader = new OBJLoader();\n                        const obj = loader.parse(ev.target.result);\n                        const geo = extractMergedGeometryFromObject3D(obj);\n                        if (!geo) {\n                            showDiagnostic(`В файле OBJ \"${name}\" не найдено полигонов (Mesh).`);\n                            return;\n                        }\n                        loadSingleGeometryModel(geo, name, '#adb5bd');\n                        showToast(`OBJ модель «${name}» загружена`);\n                    } catch (err) {\n                        showDiagnostic(`Ошибка разбора OBJ \"${name}\": ${err.message}`);\n                    }\n                };\n                reader.readAsText(file);\n            } else if (ext === 'glb' || ext === 'gltf') {\n                reader.onload = (ev) => {\n                    try {\n                        const loader = new GLTFLoader();\n                        loader.parse(ev.target.result, '', (gltf) => {\n                            const geo = extractMergedGeometryFromObject3D(gltf.scene);\n                            if (!geo) {\n                                showDiagnostic(`В файле GLTF/GLB \"${name}\" не найдено мешей.`);\n                                return;\n                            }\n                            loadSingleGeometryModel(geo, name, '#adb5bd');\n                            showToast(`GLTF/GLB модель «${name}» загружена`);\n                        }, (err) => {\n                            showDiagnostic(`Ошибка парсера GLTF/GLB \"${name}\": ${err && err.message ? err.message : err}`);\n                        });\n                    } catch (err) {\n                        showDiagnostic(`Ошибка чтения GLB/GLTF \"${name}\": ${err.message}`);\n                    }\n                };\n                reader.readAsArrayBuffer(file);\n            } else {\n                showDiagnostic(`Неподдерживаемый формат файла \"${name}\". Используйте .HTML, .STL, .OBJ или .GLB.`);\n            }\n        }\n\n        // Надёжное извлечение объекта данных `const/let/var data = {...}` с учётом строк и скобок\n        function extractDataObjectFromHtml(htmlText) {\n            if (typeof htmlText !== 'string' || htmlText.length === 0) {\n                return { data: null, reason: 'HTML-файл пуст или не является текстом.' };\n            }\n\n            // Ищем объявление data = { ... } в любом месте текста (включая \u003cscript> теги)\n            const assignRegex = /\\b(?:const|let|var)?\\s*data\\s*=\\s*\\{/g;\n            let match;\n            let foundAnyDataAssign = false;\n\n            while ((match = assignRegex.exec(htmlText)) !== null) {\n                foundAnyDataAssign = true;\n                const braceStart = htmlText.indexOf('{', match.index);\n                if (braceStart === -1) continue;\n\n                let depth = 0;\n                let inString = false;\n                let quoteChar = '';\n                let escaped = false;\n                let endIdx = -1;\n\n                for (let i = braceStart; i \u003c htmlText.length; i++) {\n                    const ch = htmlText[i];\n                    if (inString) {\n                        if (escaped) {\n                            escaped = false;\n                        } else if (ch === '\\\\') {\n                            escaped = true;\n                        } else if (ch === quoteChar) {\n                            inString = false;\n                        }\n                        continue;\n                    }\n\n                    if (ch === '\"' || ch === \"'\") {\n                        inString = true;\n                        quoteChar = ch;\n                    } else if (ch === '{') {\n                        depth++;\n                    } else if (ch === '}') {\n                        depth--;\n                        if (depth === 0) {\n                            endIdx = i + 1;\n                            break;\n                        }\n                    }\n                }\n\n                if (endIdx !== -1) {\n                    const rawObjStr = htmlText.slice(braceStart, endIdx);\n                    // 1. Пробуем строгий JSON.parse\n                    try {\n                        const parsed = JSON.parse(rawObjStr);\n                        if (parsed && Array.isArray(parsed.objects)) {\n                            return { data: parsed, reason: '' };\n                        }\n                    } catch (_) {\n                        // 2. Если внутри есть экранированные последовательности или JS-литерал, пробуем безопасный Function\n                        try {\n                            const fn = new Function('\"use strict\"; return (' + rawObjStr + ');');\n                            const evaluated = fn();\n                            if (evaluated && Array.isArray(evaluated.objects)) {\n                                return { data: evaluated, reason: '' };\n                            }\n                        } catch (evalErr) {\n                            return {\n                                data: null,\n                                reason: `Найден блок \"data = {...}\", но не удалось распарсить его содержимое: ${evalErr.message}`\n                            };\n                        }\n                    }\n                }\n            }\n\n            if (!foundAnyDataAssign) {\n                return {\n                    data: null,\n                    reason: 'В HTML-файле не найден блок \"data = {...}\" (экспорт WebGL из FreeCAD 1.1).'\n                };\n            }\n            return {\n                data: null,\n                reason: 'Блок \"data\" найден, но не содержит массива \"objects\".'\n            };\n        }\n\n        // Декодер FreeCAD base90 (compressed: true) и прямых массивов (compressed: false)\n        function decodeFreeCADData(rawData) {\n            const data = {\n                camera: rawData.camera || {},\n                compressed: Boolean(rawData.compressed),\n                base: rawData.base || 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890!#$%&()*+-:;/=>?@[]^_,.{|}~`',\n                baseFloat: rawData.baseFloat || ',.-0123456789',\n                objects: []\n            };\n\n            const base = data.base;\n            const baseFloat = data.baseFloat;\n\n            function baseDecode(input) {\n                if (!input || typeof input !== 'string' || input.length \u003c 2) return [];\n                const baseCt = base.length;\n                const output = [];\n                const len = parseInt(input[0], 10);\n                if (!Number.isFinite(len) || len \u003c= 0) return [];\n                for (let i = 1; i \u003c input.length; i += len) {\n                    const chunk = input.substring(i, i + len).trim();\n                    if (!chunk) continue;\n                    let val = 0;\n                    for (let s = 0; s \u003c chunk.length; s++) {\n                        const ind = base.indexOf(chunk[s]);\n                        if (ind >= 0) {\n                            val += ind * Math.pow(baseCt, s);\n                        }\n                    }\n                    output.push(val);\n                }\n                return output;\n            }\n\n            function floatDecode(input) {\n                if (!input || typeof input !== 'string') return '';\n                const baseCt = base.length;\n                const baseFloatCt = baseFloat.length;\n                let numString = '';\n                for (let i = 0; i \u003c input.length; i += 4) {\n                    const b90chunk = input.substring(i, i + 4).trim();\n                    if (!b90chunk) continue;\n                    let quotient = 0;\n                    for (let s = 0; s \u003c b90chunk.length; s++) {\n                        const ind = base.indexOf(b90chunk[s]);\n                        if (ind >= 0) {\n                            quotient += ind * Math.pow(baseCt, s);\n                        }\n                    }\n                    let buffer = '';\n                    for (let s = 0; s \u003c 7; s++) {\n                        buffer = baseFloat[quotient % baseFloatCt] + buffer;\n                        quotient = Math.floor(quotient / baseFloatCt);\n                    }\n                    numString += buffer;\n                }\n                let trailingCommas = 0;\n                for (let s = 1; s \u003c 7; s++) {\n                    if (numString[numString.length - s] === baseFloat[0]) {\n                        trailingCommas++;\n                    }\n                }\n                if (trailingCommas > 0 && trailingCommas \u003c numString.length) {\n                    numString = numString.substring(0, numString.length - trailingCommas);\n                }\n                return numString;\n            }\n\n            for (const rawObj of rawData.objects) {\n                const obj = {\n                    name: rawObj.name || 'Body',\n                    color: rawObj.color || '#adb5bd',\n                    opacity: typeof rawObj.opacity === 'number' ? rawObj.opacity : 1.0,\n                    faceColors: Array.isArray(rawObj.faceColors) ? rawObj.faceColors : [],\n                    verts: [],\n                    facets: [],\n                    wires: [],\n                    facesToFacets: []\n                };\n\n                try {\n                    if (data.compressed) {\n                        const decodedFloatsStr = floatDecode(rawObj.floats || '');\n                        const floatsArr = decodedFloatsStr\n                            ? JSON.parse('[' + decodedFloatsStr.replace(/,+$/, '') + ']')\n                            : [];\n                        obj.verts = baseDecode(rawObj.verts || '').map(idx => floatsArr[idx]).filter(n => typeof n === 'number' && Number.isFinite(n));\n                        obj.facets = baseDecode(rawObj.facets || '').filter(n => typeof n === 'number' && Number.isFinite(n));\n                        obj.wires = (Array.isArray(rawObj.wires) ? rawObj.wires : [])\n                            .map(w => baseDecode(w).map(idx => floatsArr[idx]).filter(n => typeof n === 'number' && Number.isFinite(n)));\n                        obj.facesToFacets = (Array.isArray(rawObj.facesToFacets) ? rawObj.facesToFacets : [])\n                            .map(f => baseDecode(f));\n                    } else {\n                        obj.verts = (Array.isArray(rawObj.verts) ? rawObj.verts : []).map(Number).filter(Number.isFinite);\n                        obj.facets = (Array.isArray(rawObj.facets) ? rawObj.facets : []).map(Number).filter(Number.isFinite);\n                        obj.wires = (Array.isArray(rawObj.wires) ? rawObj.wires : [])\n                            .map(w => (Array.isArray(w) ? w : []).map(Number).filter(Number.isFinite));\n                        obj.facesToFacets = (Array.isArray(rawObj.facesToFacets) ? rawObj.facesToFacets : [])\n                            .map(f => (Array.isArray(f) ? f : []).map(Number).filter(Number.isFinite));\n                    }\n                } catch (decErr) {\n                    console.warn(`Ошибка декодирования объекта \"${obj.name}\":`, decErr);\n                }\n\n                data.objects.push(obj);\n            }\n\n            return data;\n        }\n\n        function parseFreeCADHtml(htmlText, fileName) {\n            try {\n                // 1. Проверяем, не является ли файл сохранённым проектом редактора\n                const parser = new DOMParser();\n                const doc = parser.parseFromString(htmlText, 'text/html');\n                const savedTag = doc.getElementById('__CAD_ANNOTATIONS_DATA__') || doc.getElementById('cad-dimensioner-project');\n                if (savedTag && savedTag.textContent && savedTag.textContent.trim()) {\n                    const project = JSON.parse(savedTag.textContent.trim());\n                    restoreSavedEditorProject(project, fileName);\n                    return;\n                }\n\n                // 2. Извлекаем объект `data` из FreeCAD 1.1 WebGL HTML\n                const extracted = extractDataObjectFromHtml(htmlText);\n                if (!extracted.data) {\n                    showDiagnostic(`Файл \"${fileName}\": ${extracted.reason}`);\n                    return;\n                }\n\n                const decoded = decodeFreeCADData(extracted.data);\n                const stats = loadDecodedFreeCADModel(decoded, fileName);\n\n                if (stats.totalTriangles === 0 && stats.totalWires === 0) {\n                    showDiagnostic(\n                        `Файл \"${fileName}\" прочитан, но декодировано 0 треугольников и 0 рёбер (объектов в data: ${decoded.objects.length}). Проверьте, что тело в FreeCAD было видимо при экспорте.`\n                    );\n                    return;\n                }\n\n                showToast(\n                    `Загружено «${fileName}»: ${stats.objectsCount} тел, ${stats.totalTriangles} гран., ${stats.totalWires} рёбер`\n                );\n            } catch (err) {\n                showDiagnostic(`Критическая ошибка при открытии HTML \"${fileName}\": ${err.message}`);\n            }\n        }\n\n        function loadDecodedFreeCADModel(fcData, fileName) {\n            resetSceneForNewModel(fileName);\n\n            const partsToSerialize = [];\n            const wiresToSerialize = [];\n            const edgeSplit = new EdgeSplitModifier();\n            let totalTriangles = 0;\n            let totalWires = 0;\n\n            for (const obj of fcData.objects) {\n                const verts = obj.verts || [];\n                const facets = obj.facets || [];\n                if (verts.length \u003c 9 || facets.length \u003c 3) continue;\n\n                const objColor = obj.color || '#adb5bd';\n                const objOpacity = typeof obj.opacity === 'number' ? obj.opacity : 1.0;\n\n                const pushTri = (arr, fIdx) => {\n                    for (let b = 0; b \u003c 3; b++) {\n                        const vIdx = facets[3 * fIdx + b];\n                        const basePos = 3 * vIdx;\n                        if (basePos >= 0 && basePos + 2 \u003c verts.length) {\n                            arr.push(verts[basePos], verts[basePos + 1], verts[basePos + 2]);\n                        } else {\n                            arr.push(0, 0, 0);\n                        }\n                    }\n                };\n\n                if (Array.isArray(obj.facesToFacets) && obj.facesToFacets.length > 0) {\n                    for (let f = 0; f \u003c obj.facesToFacets.length; f++) {\n                        const faceColor = (obj.faceColors && obj.faceColors.length > f && obj.faceColors[f])\n                            ? obj.faceColors[f]\n                            : objColor;\n                        const facetList = obj.facesToFacets[f] || [];\n                        const coords = [];\n                        for (let a = 0; a \u003c facetList.length; a++) {\n                            const fIdx = facetList[a];\n                            if (fIdx >= 0 && 3 * fIdx + 2 \u003c facets.length) {\n                                pushTri(coords, fIdx);\n                            }\n                        }\n                        if (coords.length >= 9) {\n                            const posArr = new Float32Array(coords);\n                            addPartMeshToGroup(posArr, faceColor, objOpacity, edgeSplit);\n                            partsToSerialize.push({ positions: Array.from(posArr), color: faceColor, opacity: objOpacity });\n                            totalTriangles += posArr.length / 9;\n                        }\n                    }\n                } else {\n                    const coords = [];\n                    const triCount = Math.floor(facets.length / 3);\n                    for (let fIdx = 0; fIdx \u003c triCount; fIdx++) {\n                        pushTri(coords, fIdx);\n                    }\n                    if (coords.length >= 9) {\n                        const posArr = new Float32Array(coords);\n                        addPartMeshToGroup(posArr, objColor, objOpacity, edgeSplit);\n                        partsToSerialize.push({ positions: Array.from(posArr), color: objColor, opacity: objOpacity });\n                        totalTriangles += posArr.length / 9;\n                    }\n                }\n\n                if (Array.isArray(obj.wires)) {\n                    for (const w of obj.wires) {\n                        if (Array.isArray(w) && w.length >= 6) {\n                            wiresToSerialize.push(Array.from(w));\n                            addWirePolylineToScene(w);\n                            totalWires++;\n                        }\n                    }\n                }\n            }\n\n            collectUniqueVerticesFromModel();\n            serializedModelData = { parts: partsToSerialize, wires: wiresToSerialize };\n            finalizeModelSetup();\n\n            return {\n                objectsCount: fcData.objects.length,\n                totalTriangles,\n                totalWires\n            };\n        }\n\n        function addPartMeshToGroup(positionsArray, color, opacity, edgeSplit) {\n            const baseGeo = new THREE.BufferGeometry();\n            baseGeo.setAttribute('position', new THREE.BufferAttribute(positionsArray, 3));\n\n            let geo = baseGeo;\n            try {\n                if (positionsArray.length \u003c= 600000) {\n                    geo = edgeSplit.modify(baseGeo, 20 * Math.PI / 180);\n                }\n            } catch (_) {\n                geo = baseGeo;\n            }\n\n            try {\n                geo.computeVertexNormals();\n                geo.computeBoundingSphere();\n            } catch (_) {\n                baseGeo.computeVertexNormals();\n                geo = baseGeo;\n            }\n\n            let safeColor;\n            try {\n                safeColor = new THREE.Color(color);\n            } catch (_) {\n                safeColor = new THREE.Color('#adb5bd');\n            }\n\n            const mat = new THREE.MeshStandardMaterial({\n                color: safeColor,\n                metalness: 0.22,\n                roughness: 0.48,\n                side: THREE.DoubleSide,\n                transparent: opacity \u003c 1.0,\n                opacity: opacity,\n                polygonOffset: true,\n                polygonOffsetFactor: 1,\n                polygonOffsetUnits: 1\n            });\n\n            const mesh = new THREE.Mesh(geo, mat);\n            mesh.userData.baseOpacity = opacity;\n            modelGroup.add(mesh);\n            modelMeshes.push(mesh);\n        }\n\n        function addWirePolylineToScene(flatCoords) {\n            const points = [];\n
