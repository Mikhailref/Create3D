  // самопроверка: каждый видимый ползунок в крайние положения, затем случайные шаги разными ползунками\n  const snap=JSON.stringify(st),keys=plist().filter(p=>p.kind==='dq'&&!UI.off.has(p.key)).map(p=>p.key);\n  const okNow=()=>{if(!geoOk(g,st))return false;const v=geoVals(g,st);if(!Object.values(v).every(isFinite))return false;geoApply(canonC.U,G,st,W);for(let i=0;i\u003cW.length;i++)if(!isFinite(W[i]))return false;return true};\n  const lim={};\n  keys.forEach(k=>{const s=st.dm[+k.slice(1)];[s.mn,s.mx].forEach((v,e)=>{st=JSON.parse(snap);geoSet(g,st,k,v);rep.checked++;if(!okNow())rep.bad.push(dimName(+k.slice(1)));(lim[k]=lim[k]||[])[e]=geoVals(g,st)[k]})});\n  st=JSON.parse(snap);let seed=1;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;\n  for(let t=0;t\u003c40&&keys.length;t++){const k=keys[Math.floor(rnd()*keys.length)],s=st.dm[+k.slice(1)];geoSet(g,st,k,s.mn+(s.mx-s.mn)*rnd());rep.checked++;if(!okNow()){rep.bad.push(dimName(+k.slice(1)));break}}\n  st=JSON.parse(snap);\n  // пределы габаритов — до того, куда ползунок реально доходит\n  info.filter(x=>x.over&&lim[x.key]).forEach(x=>{const s=st.dm[x.j],[a,b]=lim[x.key];let ch=0;if(a>s.mn+.05&&a\u003c=s.v0){s.mn=fl(a);ch=1}if(b\u003cs.mx-.05&&b>=s.v0){s.mx=ce(b);ch=1}rep.tightened+=ch});\n  rep.bad=[...new Set(rep.bad)];\n  delete st.cb;TR.done=false;rebuild();\n  return Object.assign({ok:true},rep);\n}\nfunction asStatus(){\n    if(!canonC)return {seq:ASSIST.seq,model:false,dims:0,params:[]};\n    const lk=st.lk||{};\n    return {seq:ASSIST.seq,model:true,name:fileName,dims:(st.dm||[]).length,params:plist().map(p=>{\n      const o={key:p.key,kind:p.kind,lab:labText(p,'ru'),vis:!UI.off.has(p.key)};\n      if(p.kind==='dq'){const s=st.dm[p.i];Object.assign(o,{lk:!!lk[p.i],g:s.g||0,gn:s.gn||'',mn:s.mn,mx:s.mx,v0:s.v0,ax:s.d.findIndex(x=>x!==0)})}\n      return o})};\n}\n// ошибки конвертера запоминаются — ассистент покажет их, если файл не открылся\naddEventListener('error',e=>{if(window.ASSIST)ASSIST.errors.push(String(e.message||e.error||'ошибка'))});\naddEventListener('unhandledrejection',e=>{if(window.ASSIST)ASSIST.errors.push(String((e.reason&&e.reason.message)||e.reason||'ошибка'))});\nwindow.ASSIST={seq:0,errors:[],\n  loadFile:f=>{try{load(f)}catch(e){ASSIST.errors.push(String(e&&e.message||e))}},\n  // состояние читается всегда, даже если внутри что-то сломано\n  status:()=>{try{return asStatus()}catch(e){return {seq:ASSIST.seq,model:false,dims:0,params:[],error:String(e&&e.message||e)}}},\n  model:()=>canonC&&!viewer?buildModel():null,\n  automate:()=>asAutomate(),\n  save:()=>$('bd').click(),\n  // отпечаток состояния: изменилось ли что-то в конвертере с последней загрузки или сохранения\n  sig:()=>canonC?JSON.stringify([st,[...UI.off].sort(),UI.lab,['nr','ne','nh','tr','te','th','dr','de','dh','col'].map(id=>$(id)?$(id).value:'')]):'',\n  // размеры на модели: ключ, место подписи, текст, центр подписи и концы размерной линии на экране\n  dims:()=>Object.keys(DIM.lab).filter(k=>DIM.show.has(k)).map(k=>{const L=DIM.lab[k],r=L.el.getBoundingClientRect(),A=scr(L.a),B=scr(L.b);\n    return {key:k,t:L.t,text:L.el.textContent,x:r.left+r.width/2,y:r.top+r.height/2,ax:A[0],ay:A[1],bx:B[0],by:B[1],lines:DIM.grp?DIM.grp.children.length:0}})\n};\n// ---------- автоперевод названий (RU → EN, HE) с окном проверки ----------\nconst TRD={'диаметр':['Diameter','קוטר'],'внешний диаметр':['Outer diameter','קוטר חיצוני'],'наружный диаметр':['Outer diameter','קוטר חיצוני'],'внутренний диаметр':['Inner diameter','קוטר פנימי'],'длина':['Length','אורך'],'ширина':['Width','רוחב'],'высота':['Height','גובה'],'глубина':['Depth','עומק'],'толщина':['Thickness','עובי'],'толщина стенки':['Wall thickness','עובי דופן'],'отверстие':['Hole','חור'],'резьба':['Thread','הברגה'],'радиус':['Radius','רדיוס'],'угол':['Angle','זווית'],'размер':['Dimension','מידה'],'масштаб':['Scale','קנה מידה'],'крышка':['Lid','מכסה'],'корпус':['Body','גוף'],'коробка':['Box','קופסה'],'карман':['Pocket','כיס'],'паз':['Slot','חריץ'],'шаг':['Pitch','פסיעה'],'дно':['Bottom','תחתית'],'стенка':['Wall','דופן'],'зазор':['Clearance','מרווח'],'модель':['Model','דגם'],'круглая':['Round','עגולה'],'круглый':['Round','עגול'],'внутренний':['Inner','פנימי'],'внешний':['Outer','חיצוני'],'наружный':['Outer','חיצוני'],'крышки':['of the lid','של המכסה'],'корпуса':['of the body','של הגוף'],'ширина паза':['Slot width','רוחב חריץ'],'глубина кармана':['Pocket depth','עומק כיס'],'высота крышки':['Lid height','גובה מכסה'],'высота корпуса':['Body height','גובה גוף']};\nconst hasCyr=t=>/[А-Яа-яЁё]/.test(t||'');\nfunction dictTr(t,lang){\n  const i=lang==='en'?0:1,k=t.trim().toLowerCase();\n  if(TRD[k])return TRD[k][i];\n  const r=t.trim().split(/\\s+/).map(x=>{const d=TRD[x.toLowerCase()];return d?d[i]:x}).join(' ');\n  return lang==='en'&&r?r[0].toUpperCase()+r.slice(1):r;\n}\nasync function netTr(t,lang){\n  try{\n    const c=new AbortController(),to=setTimeout(()=>c.abort(),7000);\n    const rs=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(t)+'&langpair=ru|'+lang,{signal:c.signal});clearTimeout(to);\n    const j=await rs.json(),x=j&&j.responseData&&j.responseData.translatedText;\n    if(x&&!/MYMEMORY|INVALID|QUERY LENGTH/i.test(x)&&!hasCyr(x))return x;\n  }catch(e){}\n  return '';\n}\nasync function trText(t,lang){\n  if(!t||!hasCyr(t))return t||'';\n  const k=t.trim().toLowerCase();if(TRD[k])return TRD[k][lang==='en'?0:1];\n  return (await netTr(t,lang))||dictTr(t,lang);\n}\nasync function openTr(){\n  const rows=[];\n  plist().filter(p=>!UI.off.has(p.key)&&!(p.kind==='cm'&&st.cm[p.i].m.length\u003c2)).forEach(p=>rows.push({k:'p',key:p.key,p,title:'',v:{ru:labText(p,'ru'),en:labText(p,'en'),he:labText(p,'he')}}));\n  [['name','nr','ne','nh','Название модели'],['desc','dr','de','dh','Описание']].forEach(([t,a,b,c,ti])=>{\n    const v={ru:$(a).value.trim(),en:$(b).value.trim(),he:$(c).value.trim()};\n    if(v.ru)rows.push({k:'f',ids:[a,b,c],title:ti,name:t==='name',v});\n  });\n  const cs=getComputedStyle(document.body),bg=/rgba?\\(0, 0, 0, 0\\)|transparent/.test(cs.backgroundColor)?'#16181d':cs.backgroundColor;\n  const ov=document.createElement('div');\n  ov.style.cssText='position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center';\n  const box=document.createElement('div');\n  box.style.cssText='background:'+bg+';color:'+cs.color+';border:1px solid #888;border-radius:14px;width:min(980px,96vw);max-height:88vh;overflow:auto;padding:16px;font-size:13px';\n  box.innerHTML='\u003cb style=\"font-size:15px\">Проверка перевода названий\u003c/b>\u003cdiv id=\"trSt\" style=\"margin:6px 0 10px;opacity:.8\">Перевожу…\u003c/div>\u003ctable style=\"width:100%;border-collapse:collapse\">\u003cthead>\u003ctr>\u003cth style=\"text-align:left\">RU\u003c/th>\u003cth style=\"text-align:left\">EN\u003c/th>\u003cth style=\"text-align:right\">HE\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003c/tbody>\u003c/table>\u003cdiv style=\"display:flex;gap:8px;justify-content:flex-end;margin-top:12px\">\u003cbutton id=\"trCancel\" type=\"button\">Отмена\u003c/button>\u003cbutton id=\"trOk\" type=\"button\" style=\"font-weight:700\">ОК — применить\u003c/button>\u003c/div>';\n  const tb=box.querySelector('tbody');\n  rows.forEach(r=>{\n    const tr=document.createElement('tr');r.inp=[];\n    ['ru','en','he'].forEach(l=>{\n      const td=document.createElement('td'),i=document.createElement('input');\n      i.type='text';i.value=r.v[l];i.style.cssText='width:100%;box-sizing:border-box;margin:2px 0;padding:5px 7px';\n      if(l==='he'){i.dir='rtl'}\n      td.style.padding='0 4px';td.appendChild(i);tr.appendChild(td);r.inp.push(i);\n    });\n    tb.appendChild(tr);\n  });\n  ov.appendChild(box);document.body.appendChild(ov);\n  const close=()=>ov.remove();\n  box.querySelector('#trCancel').onclick=close;\n  box.querySelector('#trOk').onclick=()=>{\n    rows.forEach(r=>{\n      if(r.k==='p')['ru','en','he'].forEach((l,i)=>{const v=r.inp[i].value.trim();if(v&&v!==r.p.lab[l])UI.lab[l][r.key]=v;else delete UI.lab[l][r.key]});\n      else r.ids.forEach((id,i)=>{$(id).value=r.inp[i].value.trim()});\n    });\n    TR.done=true;close();buildUI();syncUI();\n    $('msg').textContent='Переводы применены. Нажмите «Скачать готовый HTML» ещё раз, чтобы сохранить файл.';\n  };\n  let n=0;const st2=box.querySelector('#trSt');\n  for(const r of rows){\n    const src=r.name?r.v.ru.replace(/[_]+/g,' '):r.v.ru;\n    for(const [i,l] of [[1,'en'],[2,'he']]){\n      if(r.v[l]&&r.v[l]!==r.v.ru)continue;\n      if(!hasCyr(src))continue;\n      st2.textContent='Перевожу… '+(++n);\n      r.inp[i].value=await trText(src,l);\n    }\n  }\n  st2.textContent='Проверьте и при необходимости исправьте переводы, затем нажмите ОК.';\n}\n$('bd').onclick=()=>{\n  if(!canonC||viewer){$('msg').textContent='Сначала загрузите модель';return}\n  if(!TR.done){openTr();return}\n  doSave();\n};\n\n\n// ---------- сворачиваемая карточка, изменение размера панели, подсказки ----------\n(function(){\n  let z=1;const pn=$('panel'),set=v=>{z=Math.max(.8,Math.min(1.6,Math.round(v*10)/10));pn.style.setProperty('--fz',z)};\n  $('fzm').onclick=()=>{set(z-.1);fitAll()};$('fzp').onclick=()=>{set(z+.1);fitAll()};\n})();\n$('dataHead').onclick=()=>{const c=$('convBox'),x=c.classList.toggle('collapsed');$('dataHead').setAttribute('aria-expanded',x?'false':'true')};\n(function(){\n  const root=document.documentElement,pn=$('panel'),rz=$('rz'),rm=$('rzm');\n  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));\n  function bind(h,move,reset){\n    h.addEventListener('pointerdown',e=>{h.setPointerCapture(e.pointerId);h.classList.add('drag');e.preventDefault()});\n    h.addEventListener('pointermove',e=>{if(h.classList.contains('drag'))move(e)});\n    const end=()=>h.classList.remove('drag');\n    h.addEventListener('pointerup',end);h.addEventListener('pointercancel',end);\n    h.addEventListener('dblclick',reset);\n  }\n  bind(rz,e=>root.style.setProperty('--pw',clamp(pn.getBoundingClientRect().right-e.clientX,240,Math.min(800,innerWidth-80))+'px'),()=>root.style.removeProperty('--pw'));\n  bind(rm,e=>root.style.setProperty('--ph',clamp(pn.getBoundingClientRect().bottom-e.clientY,120,innerHeight-110)+'px'),()=>root.style.removeProperty('--ph'));\n  const tip=$('tip');let tt=0;\n  function hide(){tip.style.display='none';clearTimeout(tt)}\n  document.addEventListener('pointerover',e=>{\n    const t=e.target.closest&&e.target.closest('[data-tip]');if(!t){return}\n    tip.textContent=t.dataset.tip;tip.style.display='block';\n    const r=t.getBoundingClientRect(),w=tip.offsetWidth,h=tip.offsetHeight;\n    tip.style.left=clamp(r.left,8,innerWidth-w-8)+'px';\n    tip.style.top=(r.bottom+h+10>innerHeight?r.top-h-6:r.bottom+6)+'px';\n    clearTimeout(tt);if(e.pointerType!=='mouse')tt=setTimeout(hide,2800);\n  });\n  document.addEventListener('pointerout',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(t&&e.pointerType==='mouse')hide()});\n})();\nfunction size(){r.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}\naddEventListener('resize',size);size();\n// режим просмотра: файл уже содержит модель\ntry{const t=$('embed').textContent.trim();if(t){\n  const e=JSON.parse(t);\n  if(!e.geo)throw new Error('Файл создан старой версией конвертера');\n  viewer=true;document.body.classList.add('viewer');\n  document.querySelectorAll('#dimOv').forEach(x=>x.remove()); // старые модели (v27–v30) могли сохранить подписи размеров\n  const c=decodeModel(e);\n  fileName=e.src||'';viewerName=e.name&&(e.name.ru||e.name.en||e.name.he)||fileName;\n  $('bz').classList.toggle('on',e.z);$('bs').classList.toggle('on',e.s);\n  mat.color.set(e.color);$('col').value=e.color;\n  setup(c,e.geo,[...geoOff(e)],e.ui&&e.ui.lab);\n}}catch(err){console.error(err)}\n(function loop(){requestAnimationFrame(loop);ctl.update();clip();r.render(sc,cam);dimPlace()})();\n\u003c/script>\u003c/body>\u003c/html>\n"</script>
<script>
// Внутри — ваши программы: шаг 1 — редактор размеров, шаг 2 — конвертер.
// Ассистент открывает файлы, переносит файл размеров в конвертер (сохраняя его в буфер), запускает автоматику,
// хранит отмену и пронумерованные версии обоих шагов.
const $=id=>document.getElementById(id);
const F={1:$('fMes'),2:$('fConv')};
const API=n=>{try{return F[n].contentWindow.ASSIST||null}catch(e){return null}};
const undo={1:[],2:[]};
const BUF=[],CNT={mes:0,conv:0},KIND={mes:'Размеры',conv:'Ползунки'};
let step=1,lastSent=null,convSig=null;
const COMPLEX=15; // больше стольких размеров — деталь сложная, ассистент спрашивает, сколько основных поставить
F[1].srcdoc=JSON.parse($('app-mes').textContent);
F[2].srcdoc=JSON.parse($('app-conv').textContent);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function until(f,ms=60000){const t=Date.now();while(Date.now()-t<ms){try{if(f())return true}catch(e){}await sleep(120)}return false}
const st=n=>{const a=API(n);try{return a?a.status():null}catch(e){return null}};
const esc=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
// сообщение всплывает поверх окна программы; обычное само скрывается, ошибка — остаётся до закрытия ✕
let sayT=0;
function say(html){
  $('aMsgT').innerHTML=html;$('aMsg').hidden=false;clearTimeout(sayT);
  if(html.indexOf('class="bad"')<0)sayT=setTimeout(()=>{$('aMsg').hidden=true},12000);
}
$('aMsgX').onclick=()=>{clearTimeout(sayT);$('aMsg').hidden=true};
function busy(on){document.body.classList.toggle('busy',on);update()}
function setStep(n){step=n;document.body.dataset.step=n;$('aStep1').classList.toggle('on',n===1);$('aStep2').classList.toggle('on',n===2);update()}
function update(){
  const b=document.body.classList.contains('busy'),s1=st(1),s2=st(2),cur=step===1?s1:s2;
  $('aAuto').disabled=b||!(cur&&cur.model);
  $('aUndo').disabled=b||!undo[step].length;
  $('aSave').disabled=$('aKeep').disabled=b||!(cur&&cur.model);
  $('aStep1').disabled=b;$('aStep2').disabled=b||!((s1&&s1.model)||(s2&&s2.model));
}
setInterval(update,700);

// ---------- вопрос ассистента (окно с кнопками, при необходимости — поле для числа) ----------
function ask(text,buttons,num){
  return new Promise(res=>{
    $('aAskText').innerHTML=text;
    const n=$('aAskN');n.hidden=!num;if(num){n.value=num.def;n.max=num.max}
    const acts=$('aAskActs');acts.innerHTML='';
    buttons.forEach(([id,label,cls,val])=>{const b=document.createElement('button');b.type='button';b.id=id;b.textContent=label;if(cls)b.className=cls;
      b.onclick=()=>{$('aAsk').hidden=true;res({v:val,n:Math.round(+n.value)})};acts.appendChild(b)});
    $('aAsk').hidden=false;if(num)setTimeout(()=>{n.focus();n.select()},30);
  });
}
$('aAskN').addEventListener('keydown',e=>{if(e.key==='Enter'){const b=$('aAskOk');if(b)b.click()}});

// ---------- загрузка в программы ----------
async function loadInto(n,file){
  if(n===1){await Promise.race([API(1).loadFile(file),sleep(60000)]);return {ok:true}}
  return convLoad(file);
}
// загрузить файл в конвертер; если не вышло — перезапустить конвертер и попробовать ещё раз
async function convLoad(file){
  const once=async()=>{
    const a=API(2),s=st(2),s0=s?s.seq:0,e0=a.errors.length;
    a.loadFile(file);
    await until(()=>{const x=st(2);return (x&&x.seq>s0&&x.model)||API(2).errors.length>e0},30000);
    const x=st(2);
    if(x&&x.seq>s0&&x.model)return {ok:true};
    return {ok:false,err:API(2).errors.slice(e0).join('; ')||(x&&x.error)||'конвертер не ответил за 30 секунд'};
  };
  let r=await once();
  if(!r.ok){
    const old=API(2);
    F[2].srcdoc=JSON.parse($('app-conv').textContent);
    await until(()=>{const a=API(2);return a&&a!==old&&st(2)},30000);
    const r2=await once();
    r=r2.ok?{ok:true,restarted:true}:{ok:false,err:r2.err||r.err,restarted:true};
  }
  if(r.ok)convSig=API(2).sig();
  return r;
}
const convFail=(r,what)=>'<span class="bad">Конвертер не смог открыть '+what+': '+esc(r.err)+'.</span>\nЕсли повторится — скачайте файл из буфера ⬇ и пришлите его вместе с этим текстом.';
const asFile=p=>new File([p.html],p.name,{type:'text/html'});

// ---------- буфер версий ----------
function keep(kind,p,dims){
  const last=[...BUF].reverse().find(e=>e.kind===kind);
  if(last&&last.html===p.html)return last; // та же версия уже есть — не повторяем
  CNT[kind]++;
  const d=new Date(),tm=[d.getHours(),d.getMinutes(),d.getSeconds()].map(x=>String(x).padStart(2,'0')).join(':');
  const e={kind,n:CNT[kind],label:KIND[kind]+' №'+CNT[kind],name:p.name,html:p.html,dims,time:tm};
  BUF.push(e);renderBuf();return e;
}
function renderBuf(){
  $('aBufBtn').textContent='📚 Буфер ('+BUF.length+')';
  const box=$('aBuf');
  box.innerHTML='<h3>Сохранённые версии</h3>'+(BUF.length?'':'<div class="empty">Пока пусто. Версии появляются при переходе между шагами и по кнопке «💾 В буфер».</div>');
  BUF.forEach((e,i)=>{
    const r=document.createElement('div');r.className='bi';r.dataset.entry=e.label;
    r.innerHTML='<span class="tg '+e.kind+'">'+esc(e.label)+'</span><span class="nm"><b>'+e.time+'</b> · '+e.dims+' разм. · '+esc(e.name)+'</span>'+
      '<button type="button" data-open title="Открыть эту версию в '+(e.kind==='mes'?'редакторе размеров':'конвертере')+'">Открыть</button><button type="button" data-dl title="Скачать файл этой версии">⬇</button><button type="button" data-del title="Удалить эту версию из буфера">🗑</button>';
    r.querySelector('[data-open]').onclick=()=>openBuf(i);
    r.querySelector('[data-dl]').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([e.html],{type:'text/html;charset=utf-8'}));a.download=e.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)};
    r.querySelector('[data-del]').onclick=()=>delBuf(e);
    box.appendChild(r);
  });
  if(BUF.length)box.insertAdjacentHTML('beforeend','<div class="hint">Буфер живёт, пока открыт ассистент. Нужную версию скачайте ⬇.</div>');
}
// удалить версию из буфера (номера остальных не меняются, новые продолжают нумерацию)
async function delBuf(e){
  const r=await ask('<b>Удалить «'+esc(e.label)+'» из буфера?</b>\n'+e.time+' · '+e.dims+' разм. · '+esc(e.name)+'\nЕсли файл нужен, сначала скачайте его ⬇.',[['aAskCancel','Отмена','',0],['aAskDel','🗑 Удалить','pri',1]]);
  if(!r.v)return;
  const i=BUF.indexOf(e);if(i>=0)BUF.splice(i,1);
  renderBuf();$('aBuf').hidden=false;
}
$('aBufBtn').onclick=()=>{$('aBuf').hidden=!$('aBuf').hidden};
async function openBuf(i){
  const e=BUF[i];$('aBuf').hidden=true;
  if(e.kind==='conv'&&step===2&&!(await leaveConv()))return;
  busy(true);
  try{
    if(e.kind==='mes'){await loadInto(1,asFile(e));undo[1]=[];setStep(1)}
    else{const r=await loadInto(2,asFile(e));if(!r.ok){say(convFail(r,'версию «'+esc(e.label)+'»'));return}undo[2]=[];setStep(2)}
    say('<b>Открыта версия «'+esc(e.label)+'»</b> ('+e.time+', '+e.dims+' разм.).');
  }finally{busy(false)}
}
$('aKeep').onclick=()=>{
  if(step===1){const p=API(1).project();if(p)keep('mes',p,st(1).dims)}
  else{const p=API(2).model();if(p){keep('conv',p,st(2).dims);convSig=API(2).sig()}}
  const last=BUF.filter(e=>e.kind===(step===1?'mes':'conv')).pop();
  if(last)say('<b>В буфере:</b> «'+esc(last.label)+'».');
};

// ---------- переходы между шагами ----------
// к ползункам: текущий файл размеров сохраняется в буфер и переносится в конвертер (если он менялся с прошлого переноса)
async function goTo2(){
  const s1=st(1),s2=st(2);
  if(!(s1&&s1.model)){if(s2&&s2.model)setStep(2);return}
  const p=API(1).project();if(!p)return;
  if(p.html===lastSent&&s2&&s2.model){setStep(2);return}
  busy(true);
  try{
    const ke=keep('mes',p,s1.dims);
    const r=await loadInto(2,asFile(p));
    if(!r.ok){say(convFail(r,'файл размеров')+' Файл размеров сохранён в буфере как «'+esc(ke.label)+'»; шаг 1 остаётся открытым.');return}
    lastSent=p.html;undo[2]=[];setStep(2);
    const s2n=st(2);
    say('<b>Шаг 2 — ползунки.</b>'+(r.restarted?' Конвертер был перезапущен после сбоя и открыл файл.':'')+' Файл размеров перенесён в конвертер ('+(s2n?s2n.dims:'?')+' разм.) и сохранён в буфер как «'+esc(ke.label)+'».\nНажмите «🪄 Автоматизировать» — ассистент объединит одинаковые элементы в группы, поставит замки на стенки, задаст пределы и проверит ползунки. Или настройте вручную.');
  }finally{busy(false)}
}
// из конвертера: если в нём есть несохранённые изменения — спросить, сохранить ли его файл в буфер
async function leaveConv(){
  const s2=st(2);
  if(!(s2&&s2.model)||API(2).sig()===convSig)return true;
  const r=await ask('<b>В конвертере есть изменения.</b>\nСохранить файл конвертера в буфер, прежде чем уйти?',[['aAskCancel','Отмена','',0],['aAskNo','Не сохранять','',1],['aAskSave','💾 Сохранить в буфер','pri',2]]);
  if(!r.v)return false;
  if(r.v===2){busy(true);try{keep('conv',API(2).model(),s2.dims);convSig=API(2).sig()}finally{busy(false)}}
  else convSig=API(2).sig(); // «Не сохранять»: больше не спрашиваем про эти же изменения
  return true;
}
async function goTo1(){
  if(step===1)return;const n=BUF.length;
  if(!(await leaveConv()))return;
  setStep(1);
  say('<b>Шаг 1 — размеры.</b>'+(BUF.length>n?' Файл конвертера сохранён в буфер как «'+esc(BUF[BUF.length-1].label)+'».':'')+'\nПравьте размеры; при переходе к ползункам изменённый файл перенесётся в конвертер сам.');
}
$('aStep2').onclick=()=>{if(step!==2)goTo2()};
$('aStep1').onclick=goTo1;

// ---------- открыть файл ----------
const DIM_HINT='Проверьте размеры и названия справа в редакторе: любой можно удалить, добавить или переименовать вручную. Когда всё верно — вкладка «2 · Ползунки».';
async function openFile(f){
  busy(true);
  try{
    let kind='raw';
    if(/\.html?$/i.test(f.name)){
      const t=await f.text();
      // готовая модель конвертера (в её коде тоже есть слово-метка проекта, поэтому проверяем её первой)
      if(/<script id="embed" type="application\/json">\s*\{/.test(t))kind='model';
      else if(/<script id="__CAD_ANNOTATIONS_DATA__"/.test(t))kind='project';
    }
    if(kind==='model'){
      busy(false);if(step===2&&!(await leaveConv()))return;busy(true);
      const r=await loadInto(2,f);if(!r.ok){say(convFail(r,'«'+esc(f.name)+'»'));return}
      undo[2]=[];setStep(2);
      say('<b>Открыта готовая модель «'+esc(f.name)+'» — шаг 2 (ползунки).</b>\nМожно настроить ползунки вручную или нажать «🪄 Автоматизировать», затем «⬇ Скачать».');
    }else{
      await loadInto(1,f);undo[1]=[];lastSent=null;setStep(1);
      const s=st(1);
      if(!s||!s.model)say('<span class="bad">Не удалось открыть «'+esc(f.name)+'». Подходят экспорт FreeCAD (HTML), OBJ, STL, GLB.</span>');
      else if(s.dims)say('<b>Открыт файл с размерами «'+esc(f.name)+'» — шаг 1 ('+s.dims+' разм.).</b>\nНедостающие размеры можно доставить «🪄 Автоматизировать». '+DIM_HINT);
      else say('<b>Модель «'+esc(f.name)+'» открыта. Шаг 1: нужно проставить размеры.</b>\nНажмите «🪄 Автоматизировать» — ассистент поставит габариты и размер каждой стенки, кармана и ступени и назовёт их. Или ставьте размеры вручную инструментами редактора.');
    }
  }catch(e){say('<span class="bad">Ошибка: '+esc(e.message||e)+'</span>')}
  finally{busy(false)}
}
$('aFile').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)openFile(f)};

// ---------- автоматизация ----------
const AX=['X','Y','Z'];
function report1(r){
  const miss=r.missing||[],full=miss.every(x=>!x),part=r.limit&&r.added<r.total;
  return '<b>Шаг 1 — размеры.</b> '+(part?'Поставлено основных размеров: '+r.added+' из '+r.total+', названо: '+r.named+'. ':'Добавлено размеров: '+r.added+', названо: '+r.named+'. ')+
    (full?'<span class="good">Каркас определён полностью по X, Y, Z.</span>':'<span class="bad">Не хватает размеров: '+miss.map((x,k)=>AX[k]+' '+x).join(', ')+' — их можно поставить вручную или ещё раз «🪄 Автоматизировать».</span>')+'\n'+DIM_HINT;
}
function report2(r){
  return '<b>Шаг 2 — ползунки.</b> Групп синхронизации: '+r.groups+'; под замком 🔒: '+r.locked+'; скрыто габаритов: '+r.hidden+'; пределы заданы: '+r.limits+
    (r.tightened?', уточнено по реальному ходу: '+r.tightened:'')+'.\nСамопроверка: Проверено положений: '+r.checked+' — '+
    (r.bad.length?'<span class="bad">сбои: '+esc(r.bad.join(', '))+'</span>':'<span class="good">сбоев нет</span>')+
    '.\nЛюбой ползунок можно поправить вручную (замки, группы, пределы, видимость). Готово — «⬇ Скачать».';
}
$('aAuto').onclick=async()=>{
  let opts=null;
  if(step===1){
    const n=API(1).plan().count;
    if(n>COMPLEX){
      const r=await ask('<b>Деталь сложная: ассистент может поставить '+n+' размеров.</b>\nСколько основных размеров сделать? Сначала ставятся габариты, затем самые большие карманы и ступени, затем стенки.',
        [['aAskCancel','Отмена','',0],['aAskAll','Все '+n,'',2],['aAskOk','Поставить','pri',1]],{def:Math.min(12,n),max:n});
      if(!r.v)return;
      if(r.v===1){if(!(r.n>0)){say('<span class="bad">Введите число размеров больше нуля.</span>');return}opts={limit:Math.min(r.n,n)}}
    }
  }
  busy(true);await sleep(30);
  try{
    const a=API(step),before=step===1?a.project():a.model(),r=a.automate(opts);
    if(!r.ok){say('<span class="bad">'+esc(r.msg)+'</span>');return}
    if(before)undo[step].push(before);
    if(opts)r.limit=opts.limit;
    say(step===1?report1(r):report2(r));
  }catch(e){say('<span class="bad">Ошибка автоматизации: '+esc(e.message||e)+'</span>')}
  finally{busy(false)}
};
$('aUndo').onclick=async()=>{
  const s=undo[step].pop();if(!s)return;
  busy(true);
  try{const r=await loadInto(step,asFile(s));if(!r.ok){say(convFail(r,'прежнее состояние'));return}say('<b>Отменено.</b> Вернулось состояние до последней автоматизации на шаге '+step+'.')}
  finally{busy(false)}
};
$('aSave').onclick=()=>{const a=API(step);if(a)a.save()};
renderBuf();
</script>
</body>
</html>
